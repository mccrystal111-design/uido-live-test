<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UiDo — Hole 1 — Camera Rules Clean v3</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dfe4d8}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px}
#screen{position:relative;width:min(calc(100vw - 40px),calc((100vh - 40px)*9/16));height:min(calc(100vh - 40px),calc((100vw - 40px)*16/9));background:#f4f1e6;border:2px solid #3f4b3b;overflow:hidden}
.grid{position:absolute;inset:0;background-image:linear-gradient(to right,#16231b22 1px,transparent 1px),linear-gradient(to bottom,#16231b22 1px,transparent 1px);background-size:10% 10%;z-index:1}
.course{position:absolute;inset:0;z-index:2;pointer-events:none}
svg{width:100%;height:100%;display:block}
.fairway{fill:#9cad83;stroke:#5f7254;stroke-width:.35}
.green{fill:#b9caa0;stroke:#4d6543;stroke-width:.45}
.bunker{fill:#d8c9a0;stroke:#8c7950;stroke-width:.4}
.playline{fill:none;stroke:#3f4b3b;stroke-width:.45;stroke-dasharray:1.2 1}
.teeMarker{fill:#82956f;stroke:#526348;stroke-width:.4}
.greenMarker{fill:none;stroke:#3f4b3b;stroke-width:.45}

#infoPanel{position:absolute;z-index:10;right:0;top:0;width:40%;height:100%;padding:5% 5% 4%;background:#f4f1e6ee;border-left:1px solid #3f4b3b55;backdrop-filter:blur(2px);overflow:hidden}
.panelTitle{font:600 14px/1.1 Arial,sans-serif;letter-spacing:.14em;color:#3f4b3b}
.panelRule{height:1px;background:#3f4b3b33;margin:12px 0 16px}
.infoSection{margin-bottom:18px}
.sectionTitle{font:600 9px/1 Arial,sans-serif;letter-spacing:.16em;color:#65705e;margin-bottom:9px}
.greenRadial{position:relative;width:100%;aspect-ratio:1;max-height:175px;cursor:pointer}
.greenRadial svg{width:100%;height:100%}
.radialGreen{fill:#b9caa066;stroke:#4d6543;stroke-width:1}
.radialInner{fill:#d7e1c966;stroke:#78906c;stroke-width:.8}
.fmbCircle{fill:#b9caa0;stroke:#4d6543;stroke-width:.8}
.radialHint{position:absolute;left:0;right:0;bottom:8px;text-align:center;font:600 7px/1 Arial,sans-serif;letter-spacing:.12em;color:#596452}
.fmbRow{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:4px}
.fmbValue{text-align:center}
.fmbValue span{display:block;font:600 7px/1 Arial,sans-serif;color:#75806f;margin-bottom:4px}
.fmbValue strong{font:600 16px/1 Arial,sans-serif;color:#3f4b3b}
.widthRow,.bunkerRow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid #3f4b3b22;font:500 9px/1 Arial,sans-serif;color:#596452}
.widthRow strong,.bunkerRow strong{font:600 12px/1 Arial,sans-serif;color:#3f4b3b}
.bunkerLabel{pointer-events:none}
.bunkerLabel rect{fill:#3f4b3bdd;stroke:#d8c9a0;stroke-width:.35}
.bunkerLabel text{fill:#f4f1e6;font:600 2.1px Arial,sans-serif;letter-spacing:.02em}
.widthMarker{stroke:#5f7254;stroke-width:.28;stroke-dasharray:.7 .9;opacity:.8}
.widthText{fill:#3f4b3b;font:600 2.3px Arial,sans-serif}
.greenOverlay{position:absolute;z-index:30;inset:0;background:#f4f1e6f7;display:none;align-items:center;justify-content:center;padding:10%}
.greenOverlay.open{display:flex}
.greenOverlay svg{width:75%;height:75%;border:1px solid #4d654355}
.fullGreenPath{fill:#b9caa0;stroke:#4d6543;stroke-width:.8}
.overlayClose{position:absolute;top:4%;left:0;right:0;text-align:center;font:600 8px/1 Arial,sans-serif;letter-spacing:.14em;color:#596452}
</style>
</head>
<body>
<div id="stage"><div id="screen">
<div class="grid"></div>
<div class="course">
<svg id="courseSvg" viewBox="0 0 100 177.7777777778" preserveAspectRatio="none">
<path id="fairway" class="fairway"></path>
<path id="green" class="green"></path>
<g id="bunkers"></g>
<path id="playline" class="playline"></path>
<circle id="teeMarker" class="teeMarker" r="1.5"></circle>
<circle id="greenMarker" class="greenMarker" r="1.4"></circle>
</svg>
</div>
</div>
<div id="infoPanel">
  <div class="panelTitle">HOLE 1</div>
  <div class="panelRule"></div>
  <section class="infoSection greenInfo">
    <div class="sectionTitle">GREEN</div>
    <div id="greenRadial" class="greenRadial" role="button" tabindex="0" aria-label="Open full green view">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="36" class="radialGreen"></circle>
        <circle cx="50" cy="50" r="25" class="radialInner"></circle>
        <circle cx="50" cy="22" r="7" class="fmbCircle"></circle>
        <circle cx="50" cy="50" r="7" class="fmbCircle"></circle>
        <circle cx="50" cy="78" r="7" class="fmbCircle"></circle>
      </svg>
      <div class="radialHint">TAP FOR GREEN</div>
    </div>
    <div class="fmbRow" id="fmbRow"></div>
  </section>
  <section class="infoSection">
    <div class="sectionTitle">FAIRWAY WIDTH</div>
    <div class="widthRows" id="widthRows"></div>
  </section>
  <section class="infoSection">
    <div class="sectionTitle">BUNKERS</div>
    <div class="bunkerRows" id="bunkerRows"></div>
  </section>
</div>
<div id="greenOverlay" class="greenOverlay" aria-hidden="true">
  <div class="overlayClose">TAP GREEN TO RETURN</div>
  <svg id="fullGreenSvg" viewBox="0 0 100 100" preserveAspectRatio="none">
    <path id="fullGreenPath" class="fullGreenPath"></path>
  </svg>
</div>
</div></div>
<script>
const hole={
tee:[-0.8194224,52.2763578],
greenMiddle:[-0.8150508742,52.2777593548],
line:[[-0.8194224,52.2763578],[-0.8174382,52.276667],[-0.8163783,52.2770214],[-0.8150842,52.2777189]],
fairway:[[-0.8181366,52.2765546],[-0.818056,52.2764824],[-0.8179675,52.2764597],[-0.8178578,52.2764619],[-0.817449,52.2765323],[-0.8173393,52.2765712],[-0.8170597,52.2766405],[-0.8168686,52.2766416],[-0.8167624,52.2766687],[-0.8166545,52.2767445],[-0.8165607,52.2767856],[-0.8164863,52.2768874],[-0.8163005,52.2769015],[-0.8161749,52.2769762],[-0.8158599,52.2771667],[-0.815483,52.2773367],[-0.8153591,52.2774233],[-0.8152919,52.2775392],[-0.8152537,52.2776185],[-0.8151976,52.2776369],[-0.8151167,52.2776226],[-0.8150219,52.2776419],[-0.8149691,52.2776836],[-0.8149631,52.2776986],[-0.8149451,52.2777439],[-0.8149557,52.2777667],[-0.8149378,52.2777934],[-0.8149138,52.2778031],[-0.814889,52.2778392],[-0.8148901,52.2778616],[-0.8149119,52.2778785],[-0.8149438,52.2778897],[-0.814989,52.2778889],[-0.8150336,52.2778815],[-0.8150737,52.2778636],[-0.8150979,52.2778217],[-0.8151235,52.2777906],[-0.8152047,52.2777549],[-0.815236,52.2777264],[-0.8152559,52.2776935],[-0.8153391,52.2776706],[-0.815492,52.2776361],[-0.8157092,52.2775459],[-0.8159292,52.2774113],[-0.8161652,52.277298],[-0.8164602,52.2771307],[-0.8166587,52.2769977],[-0.816766,52.2769534],[-0.8168921,52.2769239],[-0.817053,52.2769124],[-0.81723,52.2769124],[-0.8173802,52.2768927],[-0.8175251,52.2768467],[-0.8176538,52.2767844],[-0.8177558,52.2767269],[-0.8178979,52.2766892],[-0.8179972,52.2766794],[-0.8180937,52.2766498],[-0.8181366,52.2766121]],
green:[[-0.8152132,52.2776921],[-0.8151979,52.2776675],[-0.8151674,52.2776495],[-0.8151217,52.2776348],[-0.8150759,52.2776335],[-0.8150324,52.2776488],[-0.8149997,52.2776728],[-0.8149801,52.2776981],[-0.8149757,52.2777221],[-0.8149615,52.2777421],[-0.8149681,52.2777681],[-0.8149474,52.2778028],[-0.8149202,52.2778148],[-0.8149049,52.2778394],[-0.8149234,52.2778714],[-0.8149463,52.2778801],[-0.8149866,52.2778787],[-0.8150204,52.2778721],[-0.8150487,52.2778561],[-0.815077,52.2778074],[-0.8150988,52.2777801],[-0.8151914,52.2777381],[-0.8152088,52.2777221]],
bunkers:[
[[-0.8164635,52.2768491],[-0.8165136,52.2768213],[-0.8165159,52.2767746],[-0.8165513,52.2767539],[-0.8165605,52.2767425],[-0.8165652,52.2767275],[-0.8166561,52.2767157],[-0.816673,52.2766954],[-0.816653,52.276662],[-0.8165852,52.2766544],[-0.8165752,52.2766756],[-0.816512,52.2766808],[-0.8164804,52.2766874],[-0.8164581,52.2767223],[-0.8164103,52.2767619],[-0.8163972,52.2767737],[-0.8164073,52.2767911],[-0.816435,52.2767958]],
[[-0.8169604,52.2769965],[-0.8169434,52.2769536],[-0.8168795,52.2769805],[-0.8167686,52.2769654],[-0.8167439,52.2769828],[-0.8167393,52.2769988],[-0.8167386,52.2770215],[-0.816784,52.2770384],[-0.8168579,52.2770356],[-0.8168918,52.277013],[-0.8169319,52.2770177]],
[[-0.8152489,52.2776165],[-0.8152589,52.277592],[-0.8152381,52.2775637],[-0.815205,52.277551],[-0.8151834,52.2775326],[-0.8151765,52.2775156],[-0.8151272,52.2775081],[-0.8151025,52.2775166],[-0.815094,52.2775284],[-0.8150971,52.2775694],[-0.8150963,52.2775896],[-0.8151156,52.2776047],[-0.815151,52.2775991],[-0.815188,52.2776217],[-0.8152096,52.2776264]],
[[-0.8152797,52.2777871],[-0.8153059,52.2777748],[-0.8153112,52.2777546],[-0.8152897,52.2777362],[-0.8152542,52.2777348],[-0.8152358,52.2777452],[-0.8152234,52.2777565],[-0.8152204,52.2777701],[-0.8152304,52.277781]]
]};

const EARTH_RADIUS=6371000;
const referenceLatitude=hole.tee[1]*Math.PI/180;

function toLocalMetres(point){
  return [
    (point[0]-hole.tee[0])*Math.cos(referenceLatitude)*Math.PI/180*EARTH_RADIUS,
    (point[1]-hole.tee[1])*Math.PI/180*EARTH_RADIUS
  ];
}

/*
 CAMERA / VIEWPORT RULES — CLEAN v3

 The physical viewport is portrait 9:16.

 IMPORTANT:
 The SVG coordinate system is NOT treated as a 100x100 square.
 It is 100 units wide by 177.777... units high, so one SVG unit
 represents the same physical amount in X and Y.

 Percentage positions are converted independently:
   X% -> X percentage of 100-unit width.
   Y% -> Y percentage of 177.777...-unit height.

 Opening test:
   tee   = X25%, Y90%
   green = X25%, Y10%

 Course geometry remains fixed.
 Tee is the rotation point.
 Rotate the complete geometry around the tee.
 Apply one uniform scale only.
 No X/Y stretching.
*/

const VIEW_WIDTH=100;
const VIEW_HEIGHT=100*16/9;

const teeAnchor=[
  VIEW_WIDTH*0.25,
  VIEW_HEIGHT*0.90
];

const greenAnchor=[
  VIEW_WIDTH*0.25,
  VIEW_HEIGHT*0.10
];

// Mathematical camera space: +X right, +Y up.
// The physical distance between the anchors is therefore the actual
// 80% of the viewport height, not an arbitrary 80 units.
const targetVector=[
  0,
  teeAnchor[1]-greenAnchor[1]
];

const teeLocal=toLocalMetres(hole.tee);
const greenLocal=toLocalMetres(hole.greenMiddle);

const courseVector=[
  greenLocal[0]-teeLocal[0],
  greenLocal[1]-teeLocal[1]
];

const rotation=
  Math.atan2(targetVector[1],targetVector[0])-
  Math.atan2(courseVector[1],courseVector[0]);

const scale=
  Math.hypot(targetVector[0],targetVector[1])/
  Math.hypot(courseVector[0],courseVector[1]);

function project(point){
  const local=toLocalMetres(point);
  const x=local[0]-teeLocal[0];
  const y=local[1]-teeLocal[1];

  const c=Math.cos(rotation);
  const s=Math.sin(rotation);

  // Rotate in physical, aspect-correct camera space.
  const cameraX=x*c-y*s;
  const cameraY=x*s+y*c;

  // Convert mathematical +Y-up to SVG +Y-down once.
  return [
    teeAnchor[0]+cameraX*scale,
    teeAnchor[1]-cameraY*scale
  ];
}

// Hard assertions: percentage anchors must resolve exactly.
const pTee=project(hole.tee);
const pGreen=project(hole.greenMiddle);
const EPS=1e-7;

if(Math.abs(pTee[0]-teeAnchor[0])>EPS || Math.abs(pTee[1]-teeAnchor[1])>EPS){
  throw new Error("Tee percentage anchor transform failed");
}
if(Math.abs(pGreen[0]-greenAnchor[0])>EPS || Math.abs(pGreen[1]-greenAnchor[1])>EPS){
  throw new Error("Green percentage anchor transform failed");
}

function closedPath(points){
  return points.map((point,index)=>{
    const [x,y]=project(point);
    return (index?"L":"M")+x.toFixed(3)+" "+y.toFixed(3);
  }).join(" ")+" Z";
}

function openPath(points){
  return points.map((point,index)=>{
    const [x,y]=project(point);
    return (index?"L":"M")+x.toFixed(3)+" "+y.toFixed(3);
  }).join(" ");
}

document.getElementById("fairway").setAttribute("d",closedPath(hole.fairway));
document.getElementById("green").setAttribute("d",closedPath(hole.green));
document.getElementById("playline").setAttribute("d",openPath(hole.line));

const bunkerLayer=document.getElementById("bunkers");
hole.bunkers.forEach(bunker=>{
  const element=document.createElementNS("http://www.w3.org/2000/svg","path");
  element.setAttribute("class","bunker");
  element.setAttribute("d",closedPath(bunker));
  bunkerLayer.appendChild(element);
});

document.getElementById("teeMarker").setAttribute("cx",teeAnchor[0]);
document.getElementById("teeMarker").setAttribute("cy",teeAnchor[1]);
document.getElementById("greenMarker").setAttribute("cx",greenAnchor[0]);
document.getElementById("greenMarker").setAttribute("cy",greenAnchor[1]);
</script>

<script>
(function(){
  const ns="http://www.w3.org/2000/svg";
  const panel=document.getElementById("infoPanel");
  const fmbRow=document.getElementById("fmbRow");
  const widthRows=document.getElementById("widthRows");
  const bunkerRows=document.getElementById("bunkerRows");
  const greenOverlay=document.getElementById("greenOverlay");
  const fullGreenSvg=document.getElementById("fullGreenSvg");
  const fullGreenPath=document.getElementById("fullGreenPath");

  function metres(a,b){
    const A=toLocalMetres(a), B=toLocalMetres(b);
    return Math.hypot(A[0]-B[0],A[1]-B[1]);
  }
  function yards(m){ return Math.round(m*1.0936133); }
  function distanceFromTee(point){ return yards(metres(hole.tee,point)); }

  // Phase 1 reference is the opening/selected tee position.
  const greenPoints=[
    ["front", [52.2776675,-0.8151979]],
    ["middle",[52.2777593548,-0.8150508742]],
    ["back",  [52.2778714,-0.8149234]]
  ];
  greenPoints.forEach(([name,ll])=>{
    const d=distanceFromTee([ll[1],ll[0]]);
    const el=document.createElement("div");
    el.className="fmbValue";
    el.innerHTML="<span>"+name[0].toUpperCase()+"</span><strong>"+d+"</strong>";
    fmbRow.appendChild(el);
  });

  // Geometry-based bunker front/carry from the opening tee reference.
  hole.bunkers.forEach((poly,index)=>{
    let near=Infinity,far=-Infinity;
    poly.forEach(p=>{ const d=distanceFromTee(p); near=Math.min(near,d); far=Math.max(far,d); });
    const row=document.createElement("div");
    row.className="bunkerRow";
    row.innerHTML="<span>Bunker "+(index+1)+"</span><strong>"+near+" / "+far+"</strong>";
    bunkerRows.appendChild(row);

    const center=poly.reduce((a,p)=>{
      const q=project(p); return [a[0]+q[0]/poly.length,a[1]+q[1]/poly.length];
    },[0,0]);
    const label=document.createElementNS(ns,"g");
    label.setAttribute("class","bunkerLabel");
    label.setAttribute("transform","translate("+center[0].toFixed(2)+" "+center[1].toFixed(2)+")");
    label.innerHTML='<rect x="-7.5" y="-2.8" width="15" height="5.6" rx="2.2"></rect><text x="0" y="0.8" text-anchor="middle">'+near+" / "+far+'</text>';
    document.getElementById("courseSvg").appendChild(label);
  });

  // Phase 1 fixed reference widths. Only show a marker where the
  // perpendicular reference intersects the fairway polygon.
  const refYards=[220,260];
  const lineLocal=hole.line.map(toLocalMetres);
  const refPoints=[];
  refYards.forEach(ref=>{
    const target=ref;
    let best=null;
    for(let i=0;i<lineLocal.length-1;i++){
      const a=lineLocal[i],b=lineLocal[i+1];
      const seg=Math.hypot(b[0]-a[0],b[1]-a[1]);
      if(!seg) continue;
      // nearest point on line to the tee at requested distance
      const da=Math.hypot(a[0],a[1]), db=Math.hypot(b[0],b[1]);
      if((da<=target && db>=target)||(db<=target && da>=target)){
        const t=(target-da)/(db-da||1);
        best=[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
        break;
      }
    }
    if(!best) return;
    const ux=best[0]/Math.hypot(best[0],best[1]), uy=best[1]/Math.hypot(best[0],best[1]);
    const px=-uy,py=ux;
    const intersections=[];
    const poly=hole.fairway.map(toLocalMetres);
    for(let i=0;i<poly.length;i++){
      const a=poly[i],b=poly[(i+1)%poly.length];
      const ex=b[0]-a[0],ey=b[1]-a[1];
      const den=ex*py-ey*px;
      if(Math.abs(den)<1e-9) continue;
      const t=((best[0]-a[0])*py-(best[1]-a[1])*px)/den;
      const u=((best[0]-a[0])*ey-(best[1]-a[1])*ex)/den;
      if(t>=0&&t<=1&&u>=-1e-9&&u<=1+1e-9) intersections.push([a[0]+ex*t,a[1]+ey*t]);
    }
    if(intersections.length>=2){
      let min=Infinity,max=-Infinity;
      intersections.forEach(p=>{const s=p[0]*px+p[1]*py;min=Math.min(min,s);max=Math.max(max,s);});
      const width=yards(max-min);
      const row=document.createElement("div");
      row.className="widthRow";
      row.innerHTML="<span>"+ref+"</span><strong>"+width+"</strong>";
      widthRows.appendChild(row);
      refPoints.push({ref,best,px,py,min,max});
    }
  });

  // Draw subtle fairway-width dotted markers in the hole view.
  refPoints.forEach(item=>{
    const p1=[item.best[0]+item.px*item.min,item.best[1]+item.py*item.min];
    const p2=[item.best[0]+item.px*item.max,item.best[1]+item.py*item.max];
    const A=[hole.tee[0]+p1[0]/(111320*Math.cos(hole.tee[1]*Math.PI/180)),hole.tee[1]+p1[1]/111320];
    const B=[hole.tee[0]+p2[0]/(111320*Math.cos(hole.tee[1]*Math.PI/180)),hole.tee[1]+p2[1]/111320];
    const a=project(A),b=project(B);
    const line=document.createElementNS(ns,"line");
    line.setAttribute("class","widthMarker");
    line.setAttribute("x1",a[0]);line.setAttribute("y1",a[1]);
    line.setAttribute("x2",b[0]);line.setAttribute("y2",b[1]);
    document.getElementById("courseSvg").appendChild(line);
    const tx=(a[0]+b[0])/2,ty=(a[1]+b[1])/2;
    const t=document.createElementNS(ns,"text");
    t.setAttribute("class","widthText");t.setAttribute("x",tx);t.setAttribute("y",ty-1);
    t.setAttribute("text-anchor","middle");t.textContent=item.ref;
    document.getElementById("courseSvg").appendChild(t);
  });

  // Full-green presentation placeholder: geometry only for now, no LiDAR.
  const greenPath=closedPath(hole.green);
  fullGreenPath.setAttribute("d",greenPath);
  document.getElementById("greenRadial").addEventListener("click",openGreen);
  document.getElementById("greenRadial").addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" ")openGreen();});
  greenOverlay.addEventListener("click",closeGreen);
  function openGreen(){ greenOverlay.classList.add("open"); greenOverlay.setAttribute("aria-hidden","false"); }
  function closeGreen(){ greenOverlay.classList.remove("open"); greenOverlay.setAttribute("aria-hidden","true"); }
})();
</script>
</body>
</html>
