<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UiDo Feature Settings</title>
<style>
:root{color-scheme:light;--ink:#202820;--muted:#697267;--paper:#f4f1e6;--panel:#fffdf7;--green:#3f4b3b;--line:#d8dbd2}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px system-ui,-apple-system,sans-serif;padding:24px 16px 48px}.wrap{max-width:680px;margin:auto}h1{font-size:1.6rem;margin:0 0 8px}.intro{color:var(--muted);line-height:1.5;margin:0 0 24px}.group{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:8px 18px;margin:14px 0}.item{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:15px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.item strong{display:block}.item small{display:block;color:var(--muted);margin-top:3px}.switch{width:52px;height:30px;flex:0 0 auto;accent-color:var(--green)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}button{border:1px solid var(--green);background:var(--green);color:white;padding:12px 16px;border-radius:12px;font:inherit}button.secondary{background:transparent;color:var(--green)}#status{color:var(--muted);min-height:1.5em;margin-top:14px}
</style></head><body><main class="wrap"><h1>Feature settings</h1><p class="intro">Turn individual capabilities on or off without deleting their logic. These settings are stored on this device and affect the field-test interface where a feature is wired to the feature registry.</p><div id="settings"></div><div class="actions"><button id="reset" class="secondary" type="button">Restore defaults</button><button id="back" type="button">Back to round</button></div><p id="status" role="status"></p></main>
<script src="logic/features.js"></script><script>
(function(){
'use strict';
var groups=[
 {title:'On-course inputs',items:[['gps','GPS and location','Position fixes and GPS status'],['wind','Wind selection','Wind direction input'],['lie','Lie selection','Record the ball lie'],['club','Club selection','Record the selected club']]},
 {title:'Shot analysis',items:[['shotCapture','Shot capture','Capture shot position and shot event'],['strike','Strike','Record contact quality'],['trajectory','Trajectory','Record ball-flight selection']]},
 {title:'Round management',items:[['scoring','Scoring','Enter hole score, putts and penalties'],['scorecard','Scorecard','Open the in-round scorecard'],['export','JSON export','Download round data']]}
];
var host=document.getElementById('settings');
function render(){host.innerHTML='';var values=window.UiDoFeatures.all();groups.forEach(function(g){var section=document.createElement('section');section.className='group';var heading=document.createElement('h2');heading.textContent=g.title;heading.style.fontSize='1rem';section.appendChild(heading);g.items.forEach(function(item){var row=document.createElement('label');row.className='item';var text=document.createElement('span');text.innerHTML='<strong>'+item[1]+'</strong><small>'+item[2]+'</small>';var input=document.createElement('input');input.type='checkbox';input.className='switch';input.checked=!!values[item[0]];input.setAttribute('aria-label',item[1]);input.addEventListener('change',function(){window.UiDoFeatures.setEnabled(item[0],input.checked);document.getElementById('status').textContent=item[1]+' '+(input.checked?'enabled':'disabled')+' on this device.'});row.appendChild(text);row.appendChild(input);section.appendChild(row)});host.appendChild(section)})}
document.getElementById('reset').addEventListener('click',function(){window.UiDoFeatures.reset();render();document.getElementById('status').textContent='Default feature settings restored.'});
document.getElementById('back').addEventListener('click',function(){location.href='shot-flow-field-test.html'});
render();
})();
</script></body></html>
