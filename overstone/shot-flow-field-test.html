<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#183b27"><title>UiDo — Field Test Shot Flow</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600&display=swap');
:root{--yellow:#ffd600;--green:#183b27;--deep:#102019;--ivory:#f4f1e6}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--green);color:#fff;font-family:Oxanium,sans-serif}button{font:inherit;touch-action:manipulation;cursor:pointer}
#tileFrame{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--green)}
body.embedded{background:transparent;overflow:hidden}body.embedded #tileFrame{inset:0;width:100%;height:100%;border-radius:inherit;overflow:hidden;background:var(--green)}body.embedded .topbar{display:none}body.embedded .bottomAction{display:none!important}body.embedded #customScreen{inset:0;width:100%;height:100%;padding:8px;background:transparent;z-index:5}body.embedded .customTile{width:100%;height:100%;aspect-ratio:auto;border-radius:18px;padding:7%;background:rgba(18,31,27,.96)}body.embedded #decision,body.embedded #done{padding:8px;border-radius:18px}body.embedded .dialog{padding:18px 14px}body.embedded .dialog h1{font-size:25px}body.embedded .dialog p{font-size:12px}body.embedded .dialogActions button{min-height:42px;font-size:14px}

.topbar{position:absolute;top:max(8px,env(safe-area-inset-top));left:10px;right:10px;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:8px;pointer-events:none}
.pill{pointer-events:auto;border:1px solid rgba(255,255,255,.24);border-radius:12px;background:rgba(12,23,17,.84);color:#fff;padding:8px 10px;font-size:12px;line-height:1.15;backdrop-filter:blur(8px)}
#flowStatus{font-size:10px;color:rgba(255,255,255,.72);margin-top:3px}
#gpsButton{border-color:rgba(255,214,0,.7);white-space:nowrap}
.bottomAction{position:absolute;bottom:max(12px,env(safe-area-inset-bottom));left:18px;right:18px;z-index:20;display:flex;justify-content:center;pointer-events:none}
.action{pointer-events:auto;min-width:180px;max-width:360px;width:100%;min-height:48px;padding:12px 18px;border:1px solid rgba(255,214,0,.9);border-radius:14px;background:rgba(16,32,25,.94);color:#fff;font-weight:600;font-size:16px;box-shadow:0 4px 20px #0003}
.action.secondary{border-color:rgba(255,255,255,.28);background:rgba(255,255,255,.1)}
#customScreen{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:22px;background:linear-gradient(rgba(18,28,24,.56),rgba(18,28,24,.56)),url('../assets/home-exact.jpg') center/cover no-repeat;z-index:2}
.customTile{position:relative;width:min(88vw,520px);aspect-ratio:1;border:1px solid rgba(255,255,255,.24);border-radius:28px;background:rgba(18,31,27,.78);backdrop-filter:blur(10px);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:9%}
.customKicker{font-size:clamp(12px,3vw,17px);letter-spacing:.12em;color:rgba(255,255,255,.6);margin-bottom:20px}
.customTitle{font-size:clamp(30px,8vw,48px);font-weight:600;letter-spacing:.04em;text-align:center}
.customSub{font-size:13px;color:rgba(255,255,255,.68);text-align:center;margin-top:12px;line-height:1.5}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%;max-width:360px;margin-top:18px}
.option{min-height:46px;border:1px solid rgba(255,255,255,.24);border-radius:12px;background:rgba(255,255,255,.08);color:#fff;font-size:14px}
.option.selected{border-color:var(--yellow);background:rgba(255,214,0,.18);box-shadow:inset 0 0 0 1px rgba(255,214,0,.12)}
.tick{width:58px;height:58px;border-radius:50%;border:1.5px solid rgba(255,214,0,.9);background:rgba(18,31,27,.96);color:#fff;font-size:27px;margin-top:20px}
#decision,#done{position:absolute;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:22px;background:rgba(6,13,10,.92);backdrop-filter:blur(8px)}
.dialog{width:min(100%,390px);border:1px solid rgba(255,255,255,.22);border-radius:22px;background:rgba(24,39,31,.98);padding:25px 20px;text-align:center}
.dialog h1{font-size:clamp(25px,7vw,38px);margin:0 0 8px;font-weight:600}.dialog p{font:14px/1.5 Arial,sans-serif;color:rgba(255,255,255,.72);margin:0 0 20px}
.dialogActions{display:flex;flex-direction:column;gap:10px}
.dialogActions button{min-height:48px;border:1px solid rgba(255,255,255,.25);border-radius:13px;background:rgba(255,255,255,.08);color:#fff;font-size:16px}
.dialogActions .primary{border-color:var(--yellow);background:rgba(255,214,0,.14)}
@media(max-width:420px){.customTile{width:91vw;border-radius:24px}.pill{padding:7px 8px}.options{gap:6px}.option{font-size:13px}}
</style></head><body>
<script>if(new URLSearchParams(location.search).get('embedded')==='1')document.body.classList.add('embedded');</script>
<iframe id="tileFrame" title="UiDo tile"></iframe>
<div id="customScreen"><section class="customTile"><div class="customKicker" id="customKicker">SHOT DATA</div><div class="customTitle" id="customTitle">STRIKE</div><div class="customSub" id="customSub">Select the strike you made.</div><div class="options" id="customOptions"></div><button class="tick" id="customConfirm" aria-label="Confirm selection">✓</button></section></div>
<header class="topbar"><div class="pill"><div id="holeTitle">OVERSTONE · HOLE 1</div><div id="flowStatus">WIND · STARTING ROUND</div></div><button class="pill" id="gpsButton">Refresh GPS</button></header>
<div class="bottomAction" id="bottomAction" style="display:none"><button class="action" id="continueButton">Continue →</button></div>
<div id="decision"><section class="dialog"><h1>Hole <span id="decisionHole">1</span> complete</h1><p id="scoreSummary">Score saved.</p><div class="dialogActions"><button class="primary" id="nextHoleButton">Next Hole →</button><button id="endRoundButton">End Round & Export JSON</button></div></section></div>
<div id="done"><section class="dialog"><h1>Round exported</h1><p id="doneSummary">Your round JSON has been downloaded. The recorded data remains saved in this browser until you start a new round.</p><div class="dialogActions"><button class="primary" id="downloadAgain">Download JSON again</button><button id="newRoundButton">Start New Round</button></div></section></div>
<script>
(function(){
'use strict';
var STORAGE_KEY='uido-field-test-round-v1';
var frame=document.getElementById('tileFrame'),custom=document.getElementById('customScreen'),bottom=document.getElementById('bottomAction');
var steps=['WIND','LIE','CLUB','HIT SHOT','STRIKE','TRAJECTORY','START','SHAPE','SCORE + PUTTS'];
var tilePaths={WIND:'../wind-tile.html',LIE:'../lie-tile.html',CLUB:'../club-tile.html',START:'../start-tile.html',SHAPE:'../shape-tile-v2.html','SCORE + PUTTS':'../putts-score-tile.html'};
var strikeOptions=['Solid','Thin','Fat','Toe','Heel','Sky / pop-up','Shank','Unknown'];
var trajectoryOptions=['Low','Mid','High','Punch','Flop'];
var state=loadState(),fix=null,watchId=null,transitionLocked=false,customSelected='',lastExportText='';
if(document.body.classList.contains('embedded')){var initialHole=Number(new URLSearchParams(location.search).get('hole'));if(initialHole>=1&&initialHole<=18){state.current_hole=initialHole;state.current_step=0;}}
function loadState(){try{var s=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(s&&s.round_id&&!s.ended_at_utc)return s}catch(e){}return freshState()}
function freshState(){return{schema:'uido.field-test-round.v1',round_id:'uido-'+new Date().toISOString().replace(/[:.]/g,'-'),course_id:'overstone-park',course_name:'Overstone Park Golf Club',started_at_utc:new Date().toISOString(),ended_at_utc:null,current_hole:1,current_step:0,latest_gps:null,holes:{},events:[]}}
function persist(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(e){setStatus('LOCAL SAVE FAILED · '+e.message)}}
function holeData(n){if(!state.holes[n])state.holes[n]={hole_number:n,shot:{},score:null,putts:null,penalties:null,events:[]};return state.holes[n]}
function currentShotNumber(){return 1}
function stamp(){return new Date().toISOString()}
function setStatus(text){document.getElementById('flowStatus').textContent=text}
function refreshHeader(){document.getElementById('holeTitle').textContent='OVERSTONE · HOLE '+state.current_hole;setStatus(steps[state.current_step]+' · STEP '+(state.current_step+1)+' OF '+steps.length)}
function gpsLabel(){var g=state.latest_gps;if(!g)return'GPS not captured';return'GPS ±'+(g.accuracy_m==null?'?':Math.round(g.accuracy_m))+' m'}
function captureGPS(){return new Promise(function(resolve){if(!navigator.geolocation){setStatus('GPS UNAVAILABLE · CONTINUE WITHOUT GPS');resolve(null);return}setStatus('GPS · LOCATING…');navigator.geolocation.getCurrentPosition(function(p){var c=p.coords;fix={latitude:c.latitude,longitude:c.longitude,accuracy_m:Number.isFinite(c.accuracy)?c.accuracy:null,altitude_m:Number.isFinite(c.altitude)?c.altitude:null,heading_deg:Number.isFinite(c.heading)?c.heading:null,speed_mps:Number.isFinite(c.speed)?c.speed:null,position_timestamp_utc:new Date(p.timestamp||Date.now()).toISOString(),source:'phone_geolocation'};state.latest_gps=fix;persist();setStatus(gpsLabel());if(watchId===null&&navigator.geolocation.watchPosition){watchId=navigator.geolocation.watchPosition(function(q){var c2=q.coords;fix={latitude:c2.latitude,longitude:c2.longitude,accuracy_m:Number.isFinite(c2.accuracy)?c2.accuracy:null,altitude_m:Number.isFinite(c2.altitude)?c2.altitude:null,heading_deg:Number.isFinite(c2.heading)?c2.heading:null,speed_mps:Number.isFinite(c2.speed)?c2.speed:null,position_timestamp_utc:new Date(q.timestamp||Date.now()).toISOString(),source:'phone_geolocation'};state.latest_gps=fix;persist();setStatus(gpsLabel())},function(){},{enableHighAccuracy:true,maximumAge:1000,timeout:15000})}resolve(fix)},function(err){setStatus('GPS NOT AVAILABLE · '+(err.message||'CONTINUE WITHOUT GPS'));resolve(null)},{enableHighAccuracy:true,maximumAge:0,timeout:12000})})}
function addEvent(type,tile,value,extra){var now=stamp(),h=holeData(state.current_hole),e={schema:'uido.field-test-event.v1',event_id:'event-'+Date.now()+'-'+Math.random().toString(16).slice(2),round_id:state.round_id,course_id:state.course_id,hole_number:state.current_hole,shot_number:currentShotNumber(),event_type:type,tile_id:tile,tile_label:tile,timestamp_utc:now,position:state.latest_gps?Object.assign({},state.latest_gps):null,gps_status:!state.latest_gps?'no_fix':state.latest_gps.accuracy_m==null?'accuracy_unknown':state.latest_gps.accuracy_m<=10?'good':state.latest_gps.accuracy_m<=25?'usable':'low_accuracy',selected_value:value===undefined?null:value};if(extra)e.details=extra;state.events.push(e);h.events.push(e.event_id);if(type==='tile_selected'){h.shot[tile]=value}else if(type==='shot_captured'){h.shot.started_at_utc=now;h.shot.gps_at_hit=state.latest_gps?Object.assign({},state.latest_gps):null;h.shot.pre_shot_snapshot=Object.assign({},h.shot)}persist()}
function addSelection(tile,value,extra){addEvent('tile_selected',tile,value,extra);var h=holeData(state.current_hole);h.shot[tile]=value;persist()}
function showStep(){transitionLocked=false;refreshHeader();persist();var step=steps[state.current_step];document.getElementById('decision').style.display='none';document.getElementById('done').style.display='none';bottom.style.display='none';custom.style.display=['HIT SHOT','STRIKE','TRAJECTORY'].indexOf(step)>=0?'flex':'none';frame.style.display=custom.style.display==='flex'?'none':'block';if(step==='HIT SHOT'){renderHitShot();return}if(step==='STRIKE'){renderCustom('STRIKE','STRIKE','Select the contact you made.',strikeOptions);return}if(step==='TRAJECTORY'){renderCustom('TRAJECTORY','TRAJECTORY','Select the ball flight.',trajectoryOptions);return}frame.onload=function(){bindTile(step)};var path=tilePaths[step];if(!path){setStatus('SCREEN NOT AVAILABLE · '+step);return}var url=new URL(path,window.location.href).href;if(step!=='SCORE + PUTTS')url+='?embedded=1';if(step==='SCORE + PUTTS')url+='?hole='+state.current_hole+'&flow=1';frame.src=url}
function renderHitShot(){document.getElementById('customKicker').textContent='SHOT '+currentShotNumber();document.getElementById('customTitle').textContent='HIT SHOT…';document.getElementById('customSub').textContent='Capturing this shot position. Next: Strike.';document.getElementById('customOptions').innerHTML='';document.getElementById('customConfirm').style.display='none';setStatus('HIT SHOT · 5 SECOND CAPTURE');var started=Date.now();captureGPS().then(function(){ });setTimeout(function(){if(steps[state.current_step]!=='HIT SHOT')return;addEvent('shot_captured','HIT_SHOT','HIT SHOT',{capture_duration_seconds:Math.round((Date.now()-started)/1000),shot_snapshot:Object.assign({},holeData(state.current_hole).shot)});state.current_step++;showStep()},5000)}
function renderCustom(kicker,title,sub,options){document.getElementById('customKicker').textContent=kicker;document.getElementById('customTitle').textContent=title;document.getElementById('customSub').textContent=sub;document.getElementById('customConfirm').style.display='none';customSelected='';var box=document.getElementById('customOptions');box.innerHTML='';options.forEach(function(value){var b=document.createElement('button');b.type='button';b.className='option';b.textContent=value;b.addEventListener('click',function(){if(transitionLocked)return;transitionLocked=true;customSelected=value;box.querySelectorAll('.option').forEach(function(x){x.classList.toggle('selected',x===b)});var activeStep=steps[state.current_step],tile=activeStep==='STRIKE'?'STRIKE':'TRAJECTORY';addSelection(tile,value);state.current_step++;setTimeout(showStep,120)});box.appendChild(b)})}
document.getElementById('customConfirm').addEventListener('click',function(){if(!customSelected)return;var step=steps[state.current_step],tile=step==='STRIKE'?'STRIKE':'TRAJECTORY';addSelection(tile,customSelected);state.current_step++;showStep()});
function getDoc(){try{return frame.contentDocument||frame.contentWindow.document}catch(e){return null}}
function selectedTileValue(step,doc){if(step==='WIND'){var arrow=doc.querySelector('.arrow[data-selected="1"]')||doc.querySelector('.arrow[style*="255, 214, 0"]');var section=arrow?arrow.getAttribute('data-section'):'unknown';return{direction:section,strength:(doc.getElementById('strength')||{}).textContent||null}}if(step==='LIE')return(doc.getElementById('lieLabel')||{}).textContent||'unknown';if(step==='CLUB'){var c=doc.querySelector('.club-row.selected .club');return c?c.textContent.trim():'unknown'}if(step==='START'){var a=doc.querySelector('.option.active .label');return a?a.textContent.trim():'unknown'}if(step==='SHAPE'){var m=doc.getElementById('resultMain');return m&&m.textContent.trim()?m.textContent.trim():(doc.querySelector('.shape.active')||{}).textContent||'unknown'}if(step==='SCORE + PUTTS'){function v(id){var x=doc.querySelector('#'+id+' .row.sel');return x?x.textContent.trim():null}return{putts:v('r0'),score:v('r1'),penalties:v('r2')}}return null}
function bindTile(step){var doc=getDoc();if(!doc)return;var win=frame.contentWindow;try{doc.querySelectorAll('button').forEach(function(b){b.addEventListener('click',function(){},true)})}catch(e){}
if(step==='WIND'){doc.querySelectorAll('.arrow').forEach(function(a){a.addEventListener('click',function(){if(transitionLocked)return;transitionLocked=true;doc.querySelectorAll('.arrow').forEach(function(x){x.removeAttribute('data-selected')});a.setAttribute('data-selected','1');setTimeout(function(){if(steps[state.current_step]!=='WIND')return;var v=selectedTileValue('WIND',doc);addSelection('WIND',v,{direction_label:v.direction,strength:v.strength});state.current_step++;showStep()},3200)},true)});return}
if(step==='LIE'||step==='CLUB'||step==='START'||step==='SHAPE'||step==='SCORE + PUTTS'){var result=doc.getElementById('result');if(!result)return;var mo=new win.MutationObserver(function(){if(!result.classList.contains('show')||transitionLocked)return;transitionLocked=true;setTimeout(function(){if(steps[state.current_step]!==step)return;var value=selectedTileValue(step,doc);if(step==='SCORE + PUTTS'){var h=holeData(state.current_hole);h.score=value.score===null?null:Number(value.score);h.putts=value.putts===null?null:Number(value.putts);h.penalties=value.penalties===null?null:Number(value.penalties);addEvent('hole_score_recorded','SCORE_PUTTS',value.score,{putts:value.putts,penalties:value.penalties});document.getElementById('decisionHole').textContent=state.current_hole;document.getElementById('scoreSummary').textContent='Score '+value.score+' · '+value.putts+' putts · '+value.penalties+' penalties';document.getElementById('nextHoleButton').style.display=state.current_hole<18?'block':'none';document.getElementById('decision').style.display='flex';persist();return}addSelection(step,value);state.current_step++;showStep()},step==='SCORE + PUTTS'?250:700)});mo.observe(result,{attributes:true,attributeFilter:['class']});}
}
document.getElementById('continueButton').addEventListener('click',function(){});
document.getElementById('gpsButton').addEventListener('click',function(){captureGPS()});
document.getElementById('nextHoleButton').addEventListener('click',function(){if(state.current_hole>=18)return;state.current_hole++;state.current_step=0;state.latest_gps=state.latest_gps||null;persist();try{window.parent.postMessage({type:'uido:hole-change',hole:state.current_hole},'*')}catch(e){}showStep()});
window.addEventListener('message',function(e){var d=e.data;if(!d||d.type!=='uido:set-hole')return;var n=Math.max(1,Math.min(18,Number(d.hole)||1));if(n===state.current_hole)return;state.current_hole=n;state.current_step=0;persist();showStep()});
function exportRound(){state.ended_at_utc=stamp();var payload={schema:'uido.field-test-round.v1',round_id:state.round_id,course_id:state.course_id,course_name:state.course_name,started_at_utc:state.started_at_utc,ended_at_utc:state.ended_at_utc,hole_count:18,completed_holes:Object.keys(state.holes).map(Number).sort(function(a,b){return a-b}),holes:state.holes,event_count:state.events.length,events:state.events};lastExportText=JSON.stringify(payload,null,2);persist();downloadJSON(lastExportText,'uido-overstone-field-test-'+state.round_id+'.json');document.getElementById('done').style.display='flex';document.getElementById('decision').style.display='none';}
function downloadJSON(textValue,name){var blob=new Blob([textValue],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name.replace(/[^a-zA-Z0-9._-]/g,'-');document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},1500)}
document.getElementById('endRoundButton').addEventListener('click',exportRound);
document.getElementById('downloadAgain').addEventListener('click',function(){if(lastExportText)downloadJSON(lastExportText,'uido-overstone-field-test-'+state.round_id+'.json');else exportRound()});
document.getElementById('newRoundButton').addEventListener('click',function(){state=freshState();fix=null;lastExportText='';persist();state.current_hole=1;state.current_step=0;showStep()});
window.addEventListener('beforeunload',persist);
if(state.latest_gps)fix=state.latest_gps;
showStep();
})();
</script></body></html>
