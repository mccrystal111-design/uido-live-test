<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>UiDo · Overstone Hole 1</title>
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#f3f0e7;color:#16231b;font-family:Arial,sans-serif}
#map{position:absolute;inset:0;background:#dfe4d8}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.panel{position:absolute;z-index:2;background:rgba(247,245,238,.96);border:1px solid rgba(22,35,27,.16);border-radius:12px;padding:10px;box-shadow:0 3px 15px rgba(0,0,0,.12)}
.title{top:12px;left:12px}.status{top:76px;left:12px;font-size:12px}.info{left:12px;right:12px;bottom:12px;font-size:12px}.info strong{font-size:14px}
.buttons{top:12px;right:12px;display:flex;gap:6px}.buttons button{border:0;border-radius:10px;padding:9px 11px;background:#f7f5ee;color:#16231b;font-weight:600}.buttons .active{background:#1c4a31;color:white}
.error{color:#9b2c2c}
</style>
</head>
<body>
<div id="map"><canvas id="course"></canvas></div>
<div class="panel title"><strong>UiDo · Overstone</strong><br><small>Hole 1 · fixed test position</small></div>
<div id="status" class="panel status">Starting Hole 1…</div>
<div class="panel buttons"><button id="gps">Use GPS</button><button id="test" class="active">Test Hole 1</button></div>
<div class="panel info"><strong id="main">Hole 1</strong><br><span id="detail">Loading course geometry…</span></div>
<script>
window.addEventListener('error',function(e){var s=document.getElementById('status');if(s){s.className='panel status error';s.textContent='Page error · '+(e.message||'startup failure')}}); 
</script>
<script src="hole1-layer.js"></script>
<script>
(function(){
'use strict';
var D=window.UIDO_OVERSTONE_H1, canvas=document.getElementById('course'), ctx=canvas.getContext('2d');
if(!D) throw new Error('Hole 1 data did not load');
var features=D.features||[], tee=[52.2763578,-0.8194224], current=tee.slice(), gpsWatch=null, testMode=true;
function resize(){var r=window.devicePixelRatio||1,w=innerWidth,h=innerHeight;canvas.width=w*r;canvas.height=h*r;canvas.style.width=w+'px';canvas.style.height=h+'px';ctx.setTransform(r,0,0,r,0,0);draw()}
function bounds(){var xs=[],ys=[];features.forEach(function(f){(f.geometry.coordinates[0]||[]).forEach(function(p){xs.push(p[0]);ys.push(p[1])})});D.line_of_play.forEach(function(p){xs.push(p[0]);ys.push(p[1])});return{minX:Math.min.apply(null,xs),maxX:Math.max.apply(null,xs),minY:Math.min.apply(null,ys),maxY:Math.max.apply(null,ys)}}
var B=bounds();
function project(lat,lon){var pad=35,w=innerWidth,h=innerHeight,x=pad+(lon-B.minX)/(B.maxX-B.minX)*(w-pad*2),y=h-pad-(lat-B.minY)/(B.maxY-B.minY)*(h-pad*2);return[x,y]}
function drawPoly(coords,fill,stroke){if(!coords||!coords.length)return;ctx.beginPath();coords.forEach(function(p,i){var q=project(p[1],p[0]);if(i)ctx.lineTo(q[0],q[1]);else ctx.moveTo(q[0],q[1])});ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}
function draw(){ctx.clearRect(0,0,innerWidth,innerHeight);ctx.fillStyle='#dfe4d8';ctx.fillRect(0,0,innerWidth,innerHeight);
features.forEach(function(f){var g=f.golf,c=f.geometry.coordinates;if(g==='fairway')drawPoly(c[0],'#c7d5bc','#8ea58a');else if(g==='green')drawPoly(c[0],'#9fbd9a','#71856e');else if(g==='bunker')drawPoly(c[0],'#d8bd78','#967b43');else if(g==='tee')drawPoly(c[0],'#b5c9ae','#65786a')});
ctx.beginPath();D.line_of_play.forEach(function(p,i){var q=project(p[1],p[0]);if(i)ctx.lineTo(q[0],q[1]);else ctx.moveTo(q[0],q[1])});ctx.setLineDash([7,7]);ctx.strokeStyle='#596354';ctx.lineWidth=2;ctx.stroke();ctx.setLineDash([]);
var gm=project(D.green_fmb.middle[0],D.green_fmb.middle[1]);ctx.beginPath();ctx.arc(gm[0],gm[1],5,0,Math.PI*2);ctx.fillStyle='#ffd600';ctx.fill();ctx.strokeStyle='#1c4a31';ctx.lineWidth=2;ctx.stroke();
features.filter(function(f){return f.golf==='bunker'}).forEach(function(f){var p=f.geometry.coordinates[0][0],q=project(p[1],p[0]);ctx.fillStyle='#16231b';ctx.font='600 11px Arial';ctx.fillText(f.side==='left'?'L':'R',q[0]-4,q[1]-5)});
var pl=project(current[0],current[1]);ctx.beginPath();ctx.arc(pl[0],pl[1],8,0,Math.PI*2);ctx.fillStyle='#1c4a31';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();
}
function yd(a,b){var R=6371000,p=Math.PI/180,d1=(b[0]-a[0])*p,d2=(b[1]-a[1])*p,x=Math.sin(d1/2)**2+Math.cos(a[0]*p)*Math.cos(b[0]*p)*Math.sin(d2/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))*1.0936133}
function update(pos){current=pos.slice();document.getElementById('main').textContent='Hole 1 · '+Math.round(yd(pos,D.green_fmb.middle))+' yd to middle';document.getElementById('detail').textContent='F/M/B '+Math.round(yd(pos,D.green_fmb.front))+' / '+Math.round(yd(pos,D.green_fmb.middle))+' / '+Math.round(yd(pos,D.green_fmb.back))+' yd · direction fixed down Hole 1';draw()}
function reset(){testMode=true;document.getElementById('test').classList.add('active');document.getElementById('gps').classList.remove('active');if(gpsWatch&&navigator.geolocation)navigator.geolocation.clearWatch(gpsWatch);gpsWatch=null;update(tee);document.getElementById('status').textContent='Hole 1 test · player fixed at tee'}
canvas.addEventListener('click',function(e){if(!testMode)return;var r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;var lon=B.minX+(x-35)/(innerWidth-70)*(B.maxX-B.minX),lat=B.minY+(innerHeight-35-y)/(innerHeight-70)*(B.maxY-B.minY);update([lat,lon])});
document.getElementById('test').onclick=reset;
document.getElementById('gps').onclick=function(){if(!navigator.geolocation){document.getElementById('status').textContent='GPS unavailable';return}testMode=false;this.classList.add('active');document.getElementById('test').classList.remove('active');gpsWatch=navigator.geolocation.watchPosition(function(p){update([p.coords.latitude,p.coords.longitude]);document.getElementById('status').textContent='Live GPS · '+Math.round(p.coords.accuracy)+'m accuracy'},function(e){document.getElementById('status').textContent='GPS error · '+e.message},{enableHighAccuracy:true,maximumAge:1000,timeout:10000})};
addEventListener('resize',resize);resize();reset();
})();
</script>
</body></html>
