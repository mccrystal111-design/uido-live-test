<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>UiDo · Overstone GPS Playground</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
@font-face{font-family:'Space Grotesk';src:url('../assets/fonts/SpaceGrotesk-Regular.woff2') format('woff2');font-weight:400}
@font-face{font-family:'Space Grotesk';src:url('../assets/fonts/SpaceGrotesk-Medium.woff2') format('woff2');font-weight:500}
@font-face{font-family:'Space Grotesk';src:url('../assets/fonts/SpaceGrotesk-SemiBold.woff2') format('woff2');font-weight:600}
@import url('https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600&display=swap');
:root{--yellow:#ffd600;--ink:#16231b;--ivory:#f3f0e7}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ivory);color:var(--ink);font-family:'Space Grotesk',Arial,sans-serif}
.app{position:relative;width:100vw;height:100dvh;overflow:hidden}.map{position:absolute;inset:0;background:#f3f0e7}
.top{position:absolute;top:14px;left:14px;z-index:900;pointer-events:none}
.title{background:rgba(247,245,238,.94);border:1px solid rgba(22,35,27,.16);border-radius:14px;padding:9px 12px;box-shadow:0 4px 18px rgba(0,0,0,.08)}
.brand{font:600 22px/1 Oxanium,sans-serif}.sub{margin-top:5px;font-size:11px;color:#526057}
.controls{position:absolute;top:14px;right:14px;z-index:910;display:flex;gap:7px}.control{border:1px solid rgba(22,35,27,.18);background:rgba(247,245,238,.94);color:var(--ink);border-radius:12px;padding:9px 11px;font:600 11px 'Space Grotesk';box-shadow:0 4px 18px rgba(0,0,0,.08)}.control.active{background:#1c4a31;color:#fff;border-color:#1c4a31}
.bottom{position:absolute;left:14px;right:14px;bottom:14px;z-index:900;display:flex;gap:8px;align-items:end}.info{flex:1;min-height:62px;border:1px solid rgba(22,35,27,.16);border-radius:15px;background:rgba(247,245,238,.94);padding:9px 12px;box-shadow:0 4px 18px rgba(0,0,0,.08)}.info-main{font-size:13px;font-weight:600}.info-sub{font-size:10px;color:#5c675f;margin-top:4px}.back{width:76px;height:62px;border:1px solid rgba(22,35,27,.16);border-radius:15px;background:rgba(247,245,238,.94);font:600 12px 'Space Grotesk';color:var(--ink)}
.gps-status{position:absolute;left:14px;top:79px;z-index:900;padding:6px 9px;border-radius:10px;background:rgba(247,245,238,.9);font-size:10px;box-shadow:0 3px 12px rgba(0,0,0,.06)}.legend{position:absolute;left:14px;top:112px;z-index:900;font-size:9px;background:rgba(247,245,238,.86);padding:6px 8px;border-radius:9px;color:#526057}
.bunker-label{background:#16231b;color:#fff;border:1px solid rgba(255,214,0,.8);border-radius:8px;padding:3px 6px;font:600 12px/1 'Space Grotesk';white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.player-dot{width:18px;height:18px;border-radius:50%;background:#1c4a31;border:3px solid #fff;box-shadow:0 0 0 3px rgba(28,74,49,.28)}
.leaflet-control-zoom{display:none}.leaflet-container{background:#f3f0e7}
</style>
</head>
<body>
<main class="app">
<div id="map" class="map"></div>
<div class="top"><div class="title"><div class="brand">UiDo · Overstone Playground</div><div class="sub">Hole 1 · GPS measurement layer · wireframe</div></div></div>
<div class="controls"><button id="gpsBtn" class="control">Use GPS</button><button id="simBtn" class="control">Tap to test</button></div>
<div id="gpsStatus" class="gps-status">GPS not started</div>
<div class="legend">Tap a bunker for front/back detail · tap the map in test mode to move the ball</div>
<div class="bottom"><div class="info"><div id="infoMain" class="info-main">Select a feature</div><div id="infoSub" class="info-sub">Live distances are calculated from the player position to GPS-locked feature points.</div></div><button class="back" onclick="location.href='../index.html'">Live<br>Test</button></div>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="hole1-layer.js"></script>
<script>
const D=window.UIDO_OVERSTONE_H1;
const map=L.map('map',{zoomControl:false,attributionControl:false,minZoom:15,maxZoom:21,zoomSnap:.25});
function style(f){const g=f.properties.golf;return g==='fairway'?{color:'#8ea58a',weight:1.2,fillColor:'#dfe9d9',fillOpacity:.95}:g==='green'?{color:'#71856e',weight:1.3,fillColor:'#b8cfb1',fillOpacity:.95}:g==='bunker'?{color:'#967b43',weight:1.2,fillColor:'#d8bd78',fillOpacity:.92}:g==='tee'?{color:'#65786a',weight:1,fillColor:'#bfcfba',fillOpacity:.9}:{color:'#b7b9ae',weight:1,fillColor:'#e8e7df',fillOpacity:.35}}
const geo=L.geoJSON({type:'FeatureCollection',features:D.features.filter(f=>f.golf!=='pin')},{style}).addTo(map);
L.polyline(D.line_of_play.map(([lon,lat])=>[lat,lon]),{color:'#7b806e',weight:1.5,dashArray:'7 7',opacity:.72}).addTo(map);
L.circleMarker(D.green_fmb.middle,{radius:4,color:'#1c4a31',weight:2,fillColor:'#ffd600',fillOpacity:1}).addTo(map);
map.fitBounds(geo.getBounds().pad(.22));
const bunkerMarkers=new Map();
function yd(a,b){const R=6371000,p=Math.PI/180,d1=(b[0]-a[0])*p,d2=(b[1]-a[1])*p,x=Math.sin(d1/2)**2+Math.cos(a[0]*p)*Math.cos(b[0]*p)*Math.sin(d2/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))*1.0936133}
D.bunkers.forEach(b=>{const m=L.marker(b.front_gps,{icon:L.divIcon({className:'',html:'<span class="bunker-label">—</span>',iconSize:[34,22],iconAnchor:[17,11]})}).addTo(map);m.on('click',()=>selectBunker(b));bunkerMarkers.set(b.id,m)});
let player=null,accuracy=null,current=null,watch=null,sim=false;
function setPlayer(pos,acc=0){current=pos;if(!player){player=L.marker(pos,{icon:L.divIcon({className:'',html:'<span class="player-dot"></span>',iconSize:[18,18],iconAnchor:[9,9]})}).addTo(map);accuracy=L.circle(pos,{radius:acc||0,color:'#1c4a31',weight:1,fillOpacity:.06}).addTo(map)}else{player.setLatLng(pos);accuracy.setLatLng(pos).setRadius(acc||0)}updateLabels();updateFmb();document.getElementById('gpsStatus').textContent='Player GPS · '+(acc?Math.round(acc)+'m accuracy':'test position')}
function updateLabels(){if(!current)return;D.bunkers.forEach(b=>bunkerMarkers.get(b.id).getElement().querySelector('.bunker-label').textContent=Math.round(yd(current,b.front_gps))+' yd')}
function updateFmb(){if(!current)return;document.getElementById('infoMain').textContent='Player position locked';document.getElementById('infoSub').textContent='FMB · '+Math.round(yd(current,D.green_fmb.front))+' / '+Math.round(yd(current,D.green_fmb.middle))+' / '+Math.round(yd(current,D.green_fmb.back))+' yd'}
function selectBunker(b){const liveFront=current?Math.round(yd(current,b.front_gps)):'—',liveBack=current?Math.round(yd(current,b.back_gps)):'—';document.getElementById('infoMain').textContent='Bunker · '+b.side+' · live '+liveFront+' yd';document.getElementById('infoSub').textContent='Front '+b.front_yards_from_tee+' yd · back '+b.back_yards_from_tee+' yd from tee · live back '+liveBack+' yd'}
function startGPS(){if(!navigator.geolocation){document.getElementById('gpsStatus').textContent='GPS unavailable';return}if(watch)navigator.geolocation.clearWatch(watch);watch=navigator.geolocation.watchPosition(p=>setPlayer([p.coords.latitude,p.coords.longitude],p.coords.accuracy),e=>document.getElementById('gpsStatus').textContent='GPS error · '+e.message,{enableHighAccuracy:true,maximumAge:1000,timeout:10000});document.getElementById('gpsBtn').classList.add('active');document.getElementById('simBtn').classList.remove('active');sim=false}
document.getElementById('gpsBtn').onclick=startGPS;
document.getElementById('simBtn').onclick=()=>{sim=!sim;document.getElementById('simBtn').classList.toggle('active',sim);if(sim&&watch){navigator.geolocation.clearWatch(watch);watch=null}document.getElementById('gpsStatus').textContent=sim?'Test mode · tap map to move player':'GPS not started'};
map.on('click',e=>{if(sim)setPlayer([e.latlng.lat,e.latlng.lng],0)});
</script>
</body></html>
