<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>UiDo · Overstone Course</title>
<style>
:root{--rail-width:188px}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#f3f0e7;color:#16231b;font-family:Arial,sans-serif}
#map{position:absolute;inset:0;right:var(--rail-width);background:#dfe4d8;transition:right .2s ease}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.panel{z-index:4;background:rgba(247,245,238,.96);border:1px solid rgba(22,35,27,.16);border-radius:12px;padding:12px;box-shadow:0 3px 15px rgba(0,0,0,.12);box-sizing:border-box}
#infoRail{position:fixed;z-index:6;top:12px;right:12px;bottom:12px;width:164px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
#infoRail .panel{position:relative;inset:auto;left:auto;right:auto;top:auto;bottom:auto;width:100%;pointer-events:auto;padding:10px;border-radius:10px}
.title{font-size:11px}.title small{font-size:9px}.status{font-size:10px}.yardage{font-size:10px;line-height:1.45}.yardage strong{font-size:11px}.yardage .b{display:inline-block;margin:0 7px 4px 0}.info{font-size:10px}.info strong{font-size:12px}
.buttons{position:fixed;z-index:7;top:12px;left:12px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100vw - var(--rail-width) - 24px)}.buttons button{border:0;border-radius:10px;padding:9px 11px;background:#f7f5ee;color:#16231b;font-weight:600}.buttons .active{background:#1c4a31;color:white}
#railToggle{margin-top:auto;align-self:flex-end;border:0;border-radius:10px;padding:8px 11px;background:#f7f5ee;color:#16231b;font-weight:600;box-shadow:0 3px 15px rgba(0,0,0,.12);pointer-events:auto}
body.rail-collapsed #map{right:0}
body.rail-collapsed #infoRail{display:none}
.error{color:#9b2c2c}
@media(max-width:700px){
  :root{--rail-width:174px}
  #infoRail{width:150px;top:10px;right:10px;bottom:10px;gap:6px}
  .buttons{max-width:calc(100vw - var(--rail-width) - 20px);gap:4px}
  .buttons button{padding:8px 9px}
}
</style>
</head>
<body>
<div id="map"><canvas id="course"></canvas></div>
<div class="panel buttons">
  <button id="courseBtn">Course</button><button id="holeBtn" class="active">Hole 1</button>
  <button id="zoomOut">−</button><button id="zoomIn">+</button><button id="gps">Use GPS</button><button id="test" class="active">Test</button>
</div>
<aside id="infoRail">
  <div class="panel title"><strong>UiDo · Overstone</strong><br><small>Full course context · Hole 1 detail</small></div>
  <div id="status" class="panel status">Loading course…</div>
  <div id="yardage" class="panel yardage"><strong>Live yardages</strong><br><span id="greenYardage">F/M/B — / — / — yd</span><br><span id="bunkerYardage">Bunkers —</span></div>
  <div class="panel info"><strong id="main">Hole 1</strong><br><span id="detail">Loading measurement layer…</span></div>
  <button id="railToggle" type="button">Hide info</button>
</aside>
<script>
window.addEventListener('error',function(e){
  var s=document.getElementById('status');
  if(s){s.className='panel status error';s.textContent='Page error · '+(e.message||'startup failure')}
});
</script>
<script src="course-layer.js"></script>
<script src="hole1-layer.js"></script>
<script>
(function(){
'use strict';
var C=window.UIDO_OVERSTONE_COURSE,D=window.UIDO_OVERSTONE_H1;
if(!C)throw new Error('Full course layer did not load');
if(!D)throw new Error('Hole 1 detail layer did not load');

var canvas=document.getElementById('course'),ctx=canvas.getContext('2d'),map=document.getElementById('map');
function viewSize(){
  return {w:map.clientWidth,h:map.clientHeight};
}
function resizeCanvas(){
  var dpr=window.devicePixelRatio||1,v=viewSize(),w=v.w,h=v.h;
  canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
  canvas.style.width=w+'px';canvas.style.height=h+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
resizeCanvas();
var features=D.features||[],tee=[52.2763578,-0.8194224],current=tee.slice(),gpsWatch=null,testMode=true,detailMode=true,miniVisible=true,zoom=1,cameraE=0,cameraN=0,dragging=false,moved=false,lastX=0,lastY=0,pointers={},pinchStart=null;

function allCourseBounds(){
  var xs=[],ys=[];
  C.holes.forEach(function(h){h.geometry.coordinates.forEach(function(p){xs.push(p[0]);ys.push(p[1])})});
  return {minX:Math.min.apply(null,xs),maxX:Math.max.apply(null,xs),minY:Math.min.apply(null,ys),maxY:Math.max.apply(null,ys)};
}
function holeBounds(){
  var xs=[],ys=[];
  features.forEach(function(f){
    if(f.geometry.type==='Polygon'){
      (f.geometry.coordinates[0]||[]).forEach(function(p){xs.push(p[0]);ys.push(p[1])});
    }
  });
  D.line_of_play.forEach(function(p){xs.push(p[0]);ys.push(p[1])});
  return {minX:Math.min.apply(null,xs),maxX:Math.max.apply(null,xs),minY:Math.min.apply(null,ys),maxY:Math.max.apply(null,ys)};
}
var CB=allCourseBounds(),HB=holeBounds();
var baseLat=(HB.minY+HB.maxY)/2,baseLon=(HB.minX+HB.maxX)/2;
var latM=111320,lonM=111320*Math.cos(baseLat*Math.PI/180);
var holeStart=D.line_of_play[0],holeEnd=D.line_of_play[D.line_of_play.length-1];
var east=(holeEnd[0]-holeStart[0])*lonM,north=(holeEnd[1]-holeStart[1])*latM;
var holeAngle=Math.atan2(east,north);
var holeBearingDeg=(holeAngle*180/Math.PI+360)%360;

function toLocal(lat,lon){
  return {e:(lon-baseLon)*lonM,n:(lat-baseLat)*latM};
}
function fromLocal(e,n){
  return [baseLat+n/latM,baseLon+e/lonM];
}
function rotatedLocal(lat,lon){
  var p=toLocal(lat,lon),cb=Math.cos(holeAngle),sb=Math.sin(holeAngle);
  return {x:p.e*cb-p.n*sb,y:p.e*sb+p.n*cb};
}
function rotatedHoleBounds(){
  var xs=[],ys=[];
  features.forEach(function(f){
    if(f.geometry.type!=='Polygon')return;
    (f.geometry.coordinates[0]||[]).forEach(function(p){
      var q=rotatedLocal(p[1],p[0]);xs.push(q.x);ys.push(q.y);
    });
  });
  D.line_of_play.forEach(function(p){var q=rotatedLocal(p[1],p[0]);xs.push(q.x);ys.push(q.y)});
  return {minX:Math.min.apply(null,xs),maxX:Math.max.apply(null,xs),minY:Math.min.apply(null,ys),maxY:Math.max.apply(null,ys)};
}
var RHB=rotatedHoleBounds();
var cameraX=0,cameraY=0;
var bunkerData=D.bunkers||[];
function bunkerLabel(b){
  return Math.round(yd(current,b.front_gps))+'/'+Math.round(yd(current,b.back_gps))+' yd';
}
function updateYardageUI(){
  var f=Math.round(yd(current,D.green_fmb.front)),m=Math.round(yd(current,D.green_fmb.middle)),b=Math.round(yd(current,D.green_fmb.back));
  document.getElementById('greenYardage').textContent='F/M/B '+f+' / '+m+' / '+b+' yd';
  document.getElementById('bunkerYardage').innerHTML=bunkerData.map(function(x){
    return '<span class="b">'+bunkerLabel(x)+'</span>';
  }).join('');
}

function fitCamera(){
  cameraX=(RHB.minX+RHB.maxX)/2;
  cameraY=(RHB.minY+RHB.maxY)/2;
  zoom=0.65;
}
function metersPerPixel(w,h,pad){
  var spanX=RHB.maxX-RHB.minX,spanY=RHB.maxY-RHB.minY;
  return Math.max(spanX/(w-pad*2),spanY/(h-pad*2))*1.08/zoom;
}
function project(lat,lon,b,w,h,pad){
  if(detailMode && b===HB){
    var q=rotatedLocal(lat,lon),mpp=metersPerPixel(w,h,pad);
    return [w/2+(q.x-cameraX)/mpp,h/2-(q.y-cameraY)/mpp];
  }
  var x=pad+(lon-b.minX)/(b.maxX-b.minX)*(w-pad*2);
  var y=h-pad-(lat-b.minY)/(b.maxY-b.minY)*(h-pad*2);
  return [x,y];
}
function drawLine(c,coords,b,w,h,pad,color,width,dash){
  if(!coords||!coords.length)return;
  c.beginPath();
  coords.forEach(function(p,i){var q=project(p[1],p[0],b,w,h,pad);if(i)c.lineTo(q[0],q[1]);else c.moveTo(q[0],q[1])});
  c.setLineDash(dash||[]);
  c.strokeStyle=color;c.lineWidth=width;c.stroke();c.setLineDash([]);
}
function drawPoly(c,coords,b,w,h,pad,fill,stroke){
  if(!coords||!coords.length)return;
  c.beginPath();
  coords.forEach(function(p,i){var q=project(p[1],p[0],b,w,h,pad);if(i)c.lineTo(q[0],q[1]);else c.moveTo(q[0],q[1])});
  c.closePath();c.fillStyle=fill;c.fill();c.strokeStyle=stroke;c.lineWidth=1;c.stroke();
}
function drawFullCourse(c,w,h,small){
  c.clearRect(0,0,w,h);c.fillStyle='#dfe4d8';c.fillRect(0,0,w,h);
  var pad=small?10:38;
  C.holes.forEach(function(hole){
    drawLine(c,hole.geometry.coordinates,CB,w,h,pad,hole.ref==='1'?'#1c4a31':'#7f8d7b',hole.ref==='1'?3:1.5);
    var mid=hole.geometry.coordinates[Math.floor(hole.geometry.coordinates.length/2)];
    var q=project(mid[1],mid[0],CB,w,h,pad);
    c.fillStyle=hole.ref==='1'?'#1c4a31':'#566253';
    c.font=small?'600 8px Arial':'600 11px Arial';
    c.fillText(hole.ref,q[0]+4,q[1]-4);
  });
  if(!small){
    c.fillStyle='rgba(247,245,238,.82)';c.fillRect(10,h-34,170,24);
    c.fillStyle='#16231b';c.font='600 11px Arial';c.fillText('18-hole course context',18,h-18);
  }
}
function drawHoleDetail(){
  var v=viewSize(),w=v.w,h=v.h,pad=36;
  ctx.clearRect(0,0,w,h);ctx.fillStyle='#dfe4d8';ctx.fillRect(0,0,w,h);
  // Full course remains the underlying spatial context, but uses the same
  // rotated metric camera as Hole 1 so the course never gets stretched/squashed.
  C.holes.forEach(function(hole){
    drawLine(ctx,hole.geometry.coordinates,HB,w,h,pad,'rgba(89,99,84,.16)',1);
  });
  features.forEach(function(f){
    var g=f.golf,c=f.geometry.coordinates;
    if(g==='fairway')drawPoly(ctx,c[0],HB,w,h,pad,'#c7d5bc','#8ea58a');
    else if(g==='rough')drawPoly(ctx,c[0],HB,w,h,pad,'#b9c7ae','#9aa993');
    else if(g==='green')drawPoly(ctx,c[0],HB,w,h,pad,'#9fbd9a','#71856e');
    else if(g==='bunker')drawPoly(ctx,c[0],HB,w,h,pad,'#d8bd78','#967b43');
    else if(g==='tee')drawPoly(ctx,c[0],HB,w,h,pad,'#b5c9ae','#65786a');
  });
  drawLine(ctx,D.line_of_play,HB,w,h,pad,'#596354',2,[7,7]);
  var gm=project(D.green_fmb.middle[0],D.green_fmb.middle[1],HB,w,h,pad);
  ctx.beginPath();ctx.arc(gm[0],gm[1],6,0,Math.PI*2);ctx.fillStyle='#ffd600';ctx.fill();ctx.strokeStyle='#1c4a31';ctx.lineWidth=2;ctx.stroke();
  bunkerData.forEach(function(b){
    var q=project(b.anchor_gps[0],b.anchor_gps[1],HB,w,h,pad);
    var label=Math.round(yd(current,b.front_gps))+'/'+Math.round(yd(current,b.back_gps));
    ctx.font='600 10px Arial';
    var tw=ctx.measureText(label).width+12;
    ctx.fillStyle='rgba(247,245,238,.94)';
    ctx.beginPath();ctx.roundRect(q[0]-tw/2,q[1]-24,tw,18,8);ctx.fill();
    ctx.fillStyle='#16231b';ctx.fillText(label,q[0]-tw/2+6,q[1]-11);
  });
  var pl=project(current[0],current[1],HB,w,h,pad);
  ctx.beginPath();ctx.arc(pl[0],pl[1],9,0,Math.PI*2);ctx.fillStyle='#1c4a31';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();
}
function draw(){
  var v=viewSize();
  if(detailMode)drawHoleDetail();else drawFullCourse(ctx,v.w,v.h,false);
}
function yd(a,b){
  var R=6371000,p=Math.PI/180,d1=(b[0]-a[0])*p,d2=(b[1]-a[1])*p;
  var x=Math.sin(d1/2)**2+Math.cos(a[0]*p)*Math.cos(b[0]*p)*Math.sin(d2/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))*1.0936133;
}
function update(pos){
  current=pos.slice();
  updateYardageUI();
  document.getElementById('main').textContent='Hole 1 · '+Math.round(yd(pos,D.green_fmb.middle))+' yd to middle';
  document.getElementById('detail').textContent='Live GPS position · Hole 1 heading '+Math.round(holeBearingDeg)+'°';
  draw();
}
function setMode(detail){
  detailMode=detail;
  if(detail){fitCamera();}
  document.getElementById('holeBtn').classList.toggle('active',detail);
  document.getElementById('courseBtn').classList.toggle('active',!detail);
  document.getElementById('status').textContent=detail?'Hole 1 detail · direction of play aligned up':'Full Overstone course · Hole 1 highlighted';
  draw();
}
function reset(){
  testMode=true;
  document.getElementById('test').classList.add('active');
  document.getElementById('gps').classList.remove('active');
  if(gpsWatch&&navigator.geolocation)navigator.geolocation.clearWatch(gpsWatch);
  gpsWatch=null;update(tee);
  document.getElementById('status').textContent=detailMode?'Hole 1 test · player fixed at tee':'Full course · test player at Hole 1 tee';
}
canvas.addEventListener('click',function(e){
  if(moved){moved=false;return;}
  if(!testMode||!detailMode)return;
  var r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,pad=36;
  var v=viewSize(),mpp=metersPerPixel(v.w,v.h,pad);
  var v=viewSize();
  var rx=cameraX+(x-v.w/2)*mpp;
  var ry=cameraY+(v.h/2-y)*mpp;
  var cb=Math.cos(holeAngle),sb=Math.sin(holeAngle);
  var e=rx*cb+ry*sb;
  var n=-rx*sb+ry*cb;
  var pos=fromLocal(e,n);
  update(pos);
});
document.getElementById('zoomIn').onclick=function(){if(!detailMode)return;zoom=Math.min(8,zoom*1.5);draw()};
document.getElementById('zoomOut').onclick=function(){if(!detailMode)return;zoom=Math.max(0.35,zoom/1.5);draw()};
canvas.addEventListener('wheel',function(e){
  if(!detailMode)return;
  e.preventDefault();
  zoom=e.deltaY<0?Math.min(8,zoom*1.15):Math.max(0.35,zoom/1.15);
  draw();
},{passive:false});
canvas.addEventListener('pointerdown',function(e){
  if(!detailMode)return;
  pointers[e.pointerId]={x:e.clientX,y:e.clientY};
  canvas.setPointerCapture(e.pointerId);
  moved=false;
  if(Object.keys(pointers).length===1){
    dragging=true;lastX=e.clientX;lastY=e.clientY;
  }else if(Object.keys(pointers).length===2){
    var ids=Object.keys(pointers),a=pointers[ids[0]],b=pointers[ids[1]];
    pinchStart=Math.hypot(a.x-b.x,a.y-b.y);
  }
});
canvas.addEventListener('pointermove',function(e){
  if(!detailMode||!pointers[e.pointerId])return;
  pointers[e.pointerId]={x:e.clientX,y:e.clientY};
  var ids=Object.keys(pointers);
  if(ids.length===2){
    var a=pointers[ids[0]],b=pointers[ids[1]],d=Math.hypot(a.x-b.x,a.y-b.y);
    if(pinchStart){zoom=Math.max(0.35,Math.min(8,zoom*(d/pinchStart)));pinchStart=d;draw();}
    moved=true;dragging=false;return;
  }
  if(!dragging)return;
  var dx=e.clientX-lastX,dy=e.clientY-lastY,mpp=metersPerPixel(viewSize().w,viewSize().h,36);
  cameraX-=dx*mpp;
  cameraY+=dy*mpp;
  moved=true;lastX=e.clientX;lastY=e.clientY;draw();
});
function endPointer(e){
  delete pointers[e.pointerId];
  dragging=false;
  if(Object.keys(pointers).length<2)pinchStart=null;
}
canvas.addEventListener('pointerup',endPointer);
canvas.addEventListener('pointercancel',endPointer);
document.getElementById('holeBtn').onclick=function(){setMode(true)};
document.getElementById('courseBtn').onclick=function(){setMode(false)};
document.getElementById('test').onclick=reset;
document.getElementById('gps').onclick=function(){
  if(!navigator.geolocation){document.getElementById('status').textContent='GPS unavailable on this device';return}
  testMode=false;this.classList.add('active');document.getElementById('test').classList.remove('active');
  if(gpsWatch)navigator.geolocation.clearWatch(gpsWatch);
  document.getElementById('status').textContent='Finding live GPS…';
  var options={enableHighAccuracy:true,maximumAge:0,timeout:15000};
  navigator.geolocation.getCurrentPosition(function(p){
    current=[p.coords.latitude,p.coords.longitude];
    var q=rotatedLocal(current[0],current[1]);
    cameraX=q.x;cameraY=q.y-80;
    update(current);
    document.getElementById('status').textContent='Live GPS · '+Math.round(p.coords.accuracy)+'m accuracy';
    gpsWatch=navigator.geolocation.watchPosition(function(p2){
      current=[p2.coords.latitude,p2.coords.longitude];
      update(current);
      document.getElementById('status').textContent='Live GPS · '+Math.round(p2.coords.accuracy)+'m accuracy';
    },function(e){document.getElementById('status').textContent='GPS watch error · '+e.message},
    {enableHighAccuracy:true,maximumAge:1000,timeout:15000});
  },function(e){
    document.getElementById('status').textContent='GPS error · '+e.message;
  },options);
};
document.getElementById('railToggle').onclick=function(){
  var collapsed=document.body.classList.toggle('rail-collapsed');
  this.textContent=collapsed?'Show info':'Hide info';
  requestAnimationFrame(function(){resizeCanvas();draw()});
};
addEventListener('resize',function(){resizeCanvas();draw()});
setMode(true);reset();
})();
</script>
</body>
</html>
