<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>UiDo · Overstone Course</title>
<style>
:root{
  --ui-ink:#16231b;
  --ui-green:#1c4a31;
  --ui-muted:#596052;
  --ui-paper:rgba(247,245,238,.96);
  --ui-line:rgba(22,35,27,.13);
  --ui-shadow:0 4px 16px rgba(0,0,0,.10);
  --rail-width:138px;
  --ui-gap:6px;
}
*{box-sizing:border-box}
html,body{
  width:100%;height:100%;margin:0;overflow:hidden;
  background:#dfe4d8;color:var(--ui-ink);
  font-family:Arial,sans-serif;
}
body{overscroll-behavior:none}
#map{
  position:fixed;inset:0;
  background:#dfe4d8;
}
canvas{
  position:absolute;inset:0;width:100%;height:100%;
  touch-action:none;
}
#infoRail{
  position:fixed;z-index:10;
  top:10px;right:10px;
  width:var(--rail-width);
  max-height:calc(100vh - 92px);
  display:flex;flex-direction:column;
  gap:var(--ui-gap);
  pointer-events:none;
  overflow:visible;
}
#infoRail .panel{
  width:100%;
  pointer-events:auto;
}
.panel{
  background:var(--ui-paper);
  border:1px solid var(--ui-line);
  border-radius:11px;
  padding:9px;
  box-shadow:var(--ui-shadow);
  backdrop-filter:blur(5px);
}
.dev-header{
  position:relative;
  z-index:20;
  display:grid;
  grid-template-columns:minmax(0,1fr) 48px;
  gap:6px;
  align-items:start;
}
.brand{
  font-size:10px;font-weight:700;
  letter-spacing:.05em;text-transform:uppercase;
  color:#3f4b3b;
}
#holeHeaderMeta{
  font-size:11px;font-weight:700;
  margin-top:5px;white-space:nowrap;
}
.hole-picker{position:relative;min-width:0}
.hole-picker-button{
  width:100%;display:flex;align-items:center;
  justify-content:center;gap:7px;
  padding:7px 5px;
  background:#f7f5ee;color:var(--ui-ink);
  border:1px solid var(--ui-line);border-radius:8px;
  font-size:10px;font-weight:700;
}
.hole-picker-button .chevron{font-size:13px;line-height:1}
.hole-menu{
  display:none;position:absolute;z-index:30;
  top:100%;right:0;left:auto;margin-top:5px;
  width:175px;
  padding:8px;grid-template-columns:repeat(3,1fr);gap:6px;
  background:#f7f5ee;border:1px solid var(--ui-line);
  border-radius:11px;box-shadow:0 8px 24px rgba(0,0,0,.18);
}
.hole-menu.open{display:grid}
.hole-option{
  min-height:36px;
  padding:8px 4px;border:0;border-radius:7px;
  background:#e8ece3;color:var(--ui-ink);
  font-size:11px;font-weight:700;
}
.hole-option.active{background:var(--ui-green);color:#f7f5ee}
.info-box{min-height:0}
.rail-title{
  margin-bottom:5px;
  font-size:8px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;
  color:var(--ui-muted);
}
.metric-row{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.metric{
  padding:5px 3px;border-radius:7px;
  background:rgba(247,245,238,.82);
  border:1px solid rgba(22,35,27,.08);
  text-align:center;
}
.metric label{display:block;font-size:8px;font-weight:700;color:var(--ui-muted)}
.metric strong{display:block;font-size:11px;margin-top:2px}
.bunker-section-title{
  margin-top:8px;
  padding-top:8px;
  border-top:1px solid rgba(22,35,27,.12);
  font-size:8px;font-weight:700;
  letter-spacing:.05em;text-transform:uppercase;
  color:var(--ui-muted);
}
.bunker-section-title:first-of-type{margin-top:6px;padding-top:6px}
.bunker-row{
  display:flex;align-items:center;justify-content:space-between;
  gap:6px;padding:4px 0;
  border-top:1px solid rgba(22,35,27,.08);
}
.bunker-row:first-child{border-top:0;padding-top:0}
.bunker-side{font-size:9px;font-weight:700}
.bunker-yardage{font-size:9px;color:#3f4b3b;white-space:nowrap}
.status{font-size:9px;line-height:1.3}
.muted{font-size:8px;color:var(--ui-muted)}
.error{color:#9b2c2c}
.buttons{
  position:fixed;z-index:7;
  left:10px;right:10px;bottom:10px;
  display:flex;align-items:center;justify-content:flex-start;
  gap:5px;width:auto;pointer-events:auto;
}
.buttons button,.buttons select{
  flex:0 0 auto;
  border:1px solid var(--ui-line);border-radius:9px;
  padding:8px 9px;
  background:var(--ui-paper);color:var(--ui-ink);
  font-weight:600;font-size:10px;
  box-shadow:var(--ui-shadow);
  backdrop-filter:blur(5px);
}
.buttons .active{background:var(--ui-green);color:#fff;border-color:var(--ui-green)}
#courseBtn{min-width:56px}
#zoomOut,#zoomIn{width:34px;padding-left:0;padding-right:0;font-size:14px}
#fit{min-width:38px}
#zoomShot{min-width:78px}
#gps{min-width:62px}
#railToggle{
  position:fixed;z-index:8;
  right:10px;bottom:74px;
  border:1px solid var(--ui-line);border-radius:9px;
  padding:8px 10px;
  background:var(--ui-paper);color:var(--ui-ink);
  font-weight:600;font-size:10px;
  box-shadow:var(--ui-shadow);
  pointer-events:auto;backdrop-filter:blur(5px);
}
#bunkerPopup{
  position:fixed;z-index:9;display:none;
  min-width:132px;padding:9px 10px;
  background:rgba(247,245,238,.97);
  border:1px solid var(--ui-line);border-radius:10px;
  box-shadow:0 5px 18px rgba(0,0,0,.16);
  pointer-events:none;
}
.popup-title{
  font-size:9px;font-weight:700;color:var(--ui-muted);
  text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;
}
.popup-yardage{font-size:12px;font-weight:700;line-height:1.5}
body.info-hidden #infoRail{display:none}
body.info-hidden #railToggle{right:10px}
@media(max-width:700px){
  :root{--rail-width:138px}
  #infoRail{top:8px;right:8px;width:138px;gap:5px}
  .panel{padding:8px;border-radius:10px}
  .buttons{left:8px;right:8px;bottom:8px;gap:4px}
  .buttons button{padding:8px 7px;font-size:9px}
  #courseBtn{min-width:50px}
  #zoomOut,#zoomIn{width:32px}
  #fit{min-width:34px}
  #zoomShot{min-width:72px}
  #gps{min-width:58px}
  #railToggle{right:8px;bottom:70px}
}
</style>
</head>
<body>

  <section class="panel dev-header">

<div id="bunkerPopup" aria-live="polite"></div>
<button id="railToggle" type="button">Hide info</button>

<nav class="buttons" aria-label="Map controls">

  </select>
  <button id="zoomOut" type="button" aria-label="Zoom out">−</button>
  <button id="zoomIn" type="button" aria-label="Zoom in">+</button>
  <button id="fit" type="button">Fit</button>
  <button id="zoomShot" type="button">Zoom to Shot</button>
  <button id="gps" type="button">GPS</button>
</nav>

  var side=bunkerVisualSide(b).charAt(0).toUpperCase()+bunkerVisualSide(b).slice(1);
  bunkerPopup.innerHTML='<div class="popup-title">'+side+' bunker</div><div class="popup-yardage">Back '+back+' yd<br>Front '+front+' yd</div>';
  bunkerPopup.style.left=Math.max(8,Math.min(window.innerWidth-150,x+12))+'px';
  bunkerPopup.style.top=Math.max(8,Math.min(window.innerHeight-95,y-70))+'px';
  bunkerPopup.style.display='block';
}
function hideBunkerPopup(){if(bunkerPopup)bunkerPopup.style.display='none'}
function updateRail(){
  var holeHeaderMeta=document.getElementById('holeHeaderMeta');
  var greenInfo=document.getElementById('greenInfo');
  var par=(HOLE_META.pars[String(holeNumber)]||{}).par||D.par||'—';
  if(holeHeaderMeta){
    holeHeaderMeta.textContent='Hole '+holeNumber+' · Par '+par;
  }
  if(greenInfo){
    var pts=[
      {label:'F',gps:D.green_fmb&&D.green_fmb.front},
      {label:'M',gps:D.green_fmb&&D.green_fmb.middle},
      {label:'B',gps:D.green_fmb&&D.green_fmb.back}
    ];
    var greenHtml='<div class="rail-title">Green · F / M / B</div><div class="metric-row">'+pts.map(function(p){
      return '<div class="metric"><label>'+p.label+'</label><strong>'+((p.gps&&current)?Math.round(yd(current,p.gps)):'—')+'</strong></div>';
    }).join('')+'</div>';

    // UI grouping only: bunkers within 60 yd of green centre are treated as
    // green-side; the remaining mapped bunkers are fairway bunkers.
    var greenSide=[],fairway=[];
    (bunkerData||[]).forEach(function(b){
      var ring=bunkerGeometry(b)||[],centre=[0,0];
      if(ring.length){
        ring.forEach(function(p){centre[0]+=p[1];centre[1]+=p[0];});
        centre[0]/=ring.length; centre[1]/=ring.length;
      }
      var d=ring.length?yd(D.green_fmb.middle,centre):9999;
      (d<=60?greenSide:fairway).push(b);
    });
    function bunkerRows(list){
      return list.map(function(b){
        var edges=bunkerEdgesFromPlayer(b);
        var side=(b.side||'bunker').charAt(0).toUpperCase()+(b.side||'bunker').slice(1);
        return '<div class="bunker-row"><span class="bunker-side">'+side+'</span><span class="bunker-yardage">F '+Math.round(yd(current,edges.front))+' · B '+Math.round(yd(current,edges.back))+' yd</span></div>';
      }).join('');
    }
    greenHtml+='<div class="bunker-section-title">Green Side Bunkers</div>';
    greenHtml+=bunkerRows(greenSide)||'<div class="muted">None mapped</div>';
    if(fairway.length){
      greenHtml+='<div class="bunker-section-title">Fairway Bunkers</div>';
      greenHtml+=bunkerRows(fairway);
    }
    greenInfo.innerHTML=greenHtml;
  }
}
function updateYardageUI(){updateRail()}

function fitCamera(){
  var v=viewSize(),pad=28;
  cameraX=(RHB.minX+RHB.maxX)/2;
  cameraY=(RHB.minY+RHB.maxY)/2;
  var spanX=RHB.maxX-RHB.minX,spanY=RHB.maxY-RHB.minY;
  var fitScale=Math.max(spanX/(v.w-pad*2),spanY/(v.h-pad*2))*1.02;
  var baseScale=Math.max(spanX/(window.innerWidth-pad*2),spanY/(window.innerHeight-pad*2))*1.08;
  zoom=Math.max(0.35,Math.min(8,baseScale/fitScale));
}
function metersPerPixel(w,h,pad){
  var spanX=RHB.maxX-RHB.minX,spanY=RHB.maxY-RHB.minY;
  return Math.max(spanX/(w-pad*2),spanY/(h-pad*2))*1.08/zoom;
}
function showShotAnnotations(){
  var v=viewSize(),pad=28;
  var mpp=metersPerPixel(v.w,v.h,pad);
  var visibleYards=(v.h-pad*2)*mpp*1.0936133;
  return visibleYards<=350;
}
function project(lat,lon,b,w,h,pad){
  if(detailMode && b===HB){
    var q=rotatedLocal(lat,lon),mpp=metersPerPixel(w,h,pad);
    var v=viewSize(); return [v.cx+(q.x-cameraX)/mpp,v.cy-(q.y-cameraY)/mpp];
  }
  var x=pad+(lon-b.minX)/(b.maxX-b.minX)*(w-pad*2);
  var y=h-pad-(lat-b.minY)/(b.maxY-b.minY)*(h-pad*2);
  return [x,y];
}
function drawLine(c,coords,b,w,h,pad,color,width,dash){
  if(!coords||!coords.length)return;
  c.beginPath();
  coords.forEach(function(p,i){var q=project(p[1],p[0],b,w,h,pad);if(i)c.lineTo(q[0],q[1]);else c.moveTo(q[0],q[1])});
  c.setLineDash(dash||[]);
  c.strokeStyle=color;c.lineWidth=width;c.stroke();c.setLineDash([]);
}
function drawPoly(c,coords,b,w,h,pad,fill,stroke){
  if(!coords||!coords.length)return;
  c.beginPath();
  coords.forEach(function(p,i){var q=project(p[1],p[0],b,w,h,pad);if(i)c.lineTo(q[0],q[1]);else c.moveTo(q[0],q[1])});
  c.closePath();c.fillStyle=fill;c.fill();c.strokeStyle=stroke;c.lineWidth=1;c.stroke();
}
function drawFullCourse(c,w,h,small){
  c.clearRect(0,0,w,h);c.fillStyle='#dfe4d8';c.fillRect(0,0,w,h);
  var pad=small?10:38;
  C.holes.forEach(function(hole){
    drawLine(c,hole.geometry.coordinates,CB,w,h,pad,hole.ref===String(holeNumber)?'#1c4a31':'#7f8d7b',hole.ref===String(holeNumber)?3:1.5);
    var mid=hole.geometry.coordinates[Math.floor(hole.geometry.coordinates.length/2)];
    var q=project(mid[1],mid[0],CB,w,h,pad);
    c.fillStyle=hole.ref===String(holeNumber)?'#1c4a31':'#566253';
    c.font=small?'600 8px Arial':'600 11px Arial';
    c.fillText(hole.ref,q[0]+4,q[1]-4);
  });
  if(!small){
    c.fillStyle='rgba(247,245,238,.82)';c.fillRect(10,h-34,170,24);
    c.fillStyle='#16231b';c.font='600 11px Arial';c.fillText('18-hole course context',18,h-18);
  }
}
function drawHoleDetail(){
  var v=viewSize(),w=v.w,h=v.h,pad=28;
  ctx.clearRect(0,0,innerWidth,innerHeight);ctx.fillStyle='#dfe4d8';ctx.fillRect(0,0,innerWidth,innerHeight);
  ctx.save();
  ctx.beginPath();ctx.rect(0,0,innerWidth,innerHeight);ctx.clip();
  // Other holes remain visible as quiet spatial context. Only fairways and
  // bunkers are shown; live yardages/markers remain exclusive to the selected hole.
  Object.keys(window.UIDO_OVERSTONE_SOURCE_HOLES).forEach(function(key){
    if(String(key)===String(holeNumber))return;
    var other=window.UIDO_OVERSTONE_SOURCE_HOLES[key];
    (other.features||[]).forEach(function(f){
      if(f.geometry.type!=='Polygon')return;
      var g=f.golf,c=f.geometry.coordinates[0];
      if(g==='fairway')drawPoly(ctx,c,HB,w,h,pad,'rgba(199,213,188,.34)','rgba(142,165,138,.34)');
      else if(g==='bunker')drawPoly(ctx,c,HB,w,h,pad,'rgba(216,189,120,.55)','rgba(150,123,67,.40)');
    });
  });
  // Keep the selected hole visually stronger than the surrounding course.
  // Draw fairway/rough first so the green is not hidden by the fairway polygon.
  features.forEach(function(f){
    var g=f.golf,geom=f.geometry,c=geom.coordinates;
    if(geom.type==='Polygon'){
      if(g==='fairway')drawPoly(ctx,c[0],HB,w,h,pad,'#c7d5bc','#8ea58a');
      else if(g==='rough')drawPoly(ctx,c[0],HB,w,h,pad,'#b9c7ae','#9aa993');
      else if(g==='bunker')drawPoly(ctx,c[0],HB,w,h,pad,'#d8bd78','#967b43');
      else if(g==='tee')drawPoly(ctx,c[0],HB,w,h,pad,'#b5c9ae','#65786a');
      else if(g==='water_hazard')drawPoly(ctx,c[0],HB,w,h,pad,'#b9c9d0','#718892');
    }else if(geom.type==='LineString'&&g==='cartpath'){
      drawLine(ctx,c,HB,w,h,pad,'#8d9488',2,[4,4]);
    }
  });
  // Green is a distinct course feature and must sit above the fairway.
  features.forEach(function(f){
    if(f.golf==='green'&&f.geometry.type==='Polygon')drawPoly(ctx,f.geometry.coordinates[0],HB,w,h,pad,'#9fbd9a','#557052');
  });
  // Direction-of-travel line intentionally hidden in the decision view.

  // Map annotations appear only once the viewport is at shot scale.
  // The side rail remains populated at every zoom level.
  var showAnnotations=showShotAnnotations();
  if(showAnnotations){
  // Show live F/M/B yardages at their actual points on the green.
  var greenPoints=[
    {key:'front',label:'F',gps:D.green_fmb.front},
    {key:'middle',label:'M',gps:D.green_fmb.middle},
    {key:'back',label:'B',gps:D.green_fmb.back}
  ];
  ctx.font='600 9px Arial';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  greenPoints.forEach(function(gp){
    var q=project(gp.gps[0],gp.gps[1],HB,w,h,pad);
    ctx.beginPath();
    ctx.arc(q[0],q[1],10,0,Math.PI*2);
    ctx.fillStyle='rgba(247,245,238,.92)';
    ctx.fill();
    ctx.strokeStyle='#557052';
    ctx.lineWidth=1;
    ctx.stroke();
    ctx.fillStyle='#16231b';
    ctx.fillText(Math.round(yd(current,gp.gps)),q[0],q[1]);
  });
  }
  // Bunker geometry stays fixed to the source polygon. Front/back are derived
  // live from the player's GPS, while the display combines both yardages into
  // one compact sand-coloured label on the non-fairway side.
  if(showAnnotations){
  bunkerData.forEach(function(b){
      var edges=bunkerEdgesFromPlayer(b);
      var frontQ=rotatedLocal(edges.front[0],edges.front[1]);
      var backQ=rotatedLocal(edges.back[0],edges.back[1]);
      var mpp=metersPerPixel(w,h,pad);
      var frontScreen=[w/2+(frontQ.x-cameraX)/mpp,h/2-(frontQ.y-cameraY)/mpp];
      var backScreen=[w/2+(backQ.x-cameraX)/mpp,h/2-(backQ.y-cameraY)/mpp];

      // Anchor the label to the fixed centre of the bunker. Its orientation is
      // always perpendicular to the current direction of play (90 degrees),
      // so player position changes the yardages but never the label position.
      var ring=bunkerGeometry(b)||[];
      var centre=[0,0];
      if(ring.length){
        ring.forEach(function(p){centre[0]+=p[1];centre[1]+=p[0];});
        centre[0]/=ring.length;
        centre[1]/=ring.length;
      }else{
        centre=[
          (edges.front[0]+edges.back[0])/2,
          (edges.front[1]+edges.back[1])/2
        ];
      }
      var centreQ=rotatedLocal(centre[0],centre[1]);
      // Use the geometric middle of the bunker as the median line. From
      // that centreline, find where the polygon's actual boundary crosses it.
      // The label then sits just outside that boundary. This keeps the two
      // yardages aligned to the bunker centre rather than averaging arbitrary
      // edge vertices, and it remains attached as the bunker scales with zoom.
      // The source model's left/right designation is the semantic side of
      // the bunker relative to the hole. Use that for label placement, while
      // the actual polygon supplies the edge position.
      var visualSide=(b.side==='left'||b.side==='right')?b.side:(centreQ.x<0?'left':'right');
      var centreX=centreQ.x,centreY=centreQ.y;
      // Area-weighted polygon centroid in shot-space. For ordinary bunker
      // polygons this is the true geometric middle, not simply the mean of
      // the vertices.
      if(ring.length>=3){
        var area2=0,cx6=0,cy6=0;
        ring.forEach(function(p,i){
          var q1=rotatedLocal(p[1],p[0]);
          var p2=ring[(i+1)%ring.length];
          var q2=rotatedLocal(p2[1],p2[0]);
          var cross=q1.x*q2.y-q2.x*q1.y;
          area2+=cross;
          cx6+=(q1.x+q2.x)*cross;
          cy6+=(q1.y+q2.y)*cross;
        });
        if(Math.abs(area2)>1e-6){
          centreX=cx6/(3*area2);
          centreY=cy6/(3*area2);
        }
      }
      var intersections=[];
      var eps=0.001;
      ring.forEach(function(p,i){
        var a=rotatedLocal(p[1],p[0]);
        var b=rotatedLocal(ring[(i+1)%ring.length][1],ring[(i+1)%ring.length][0]);
        var dy=b.y-a.y;
        if(Math.abs(dy)<eps)return;
        var t=(centreY-a.y)/dy;
        if(t>=0&&t<=1){
          intersections.push(a.x+(b.x-a.x)*t);
        }
      });
      var edgeX=centreX;
      if(intersections.length){
        edgeX=visualSide==='left'?Math.min.apply(null,intersections):Math.max.apply(null,intersections);
      }
      // Fallback for a geometry whose centreline happens not to cross an edge
      // cleanly (e.g. a degenerate source polygon).
      if(!isFinite(edgeX))edgeX=centreX;
      // Keep the whole label outside the bunker. Text is aligned away from
      // the bunker edge, rather than centred on the anchor point, so the
      // breathing room remains visible at every zoom level.
      var sideGap=Math.max(8,Math.min(16,8+(zoom-1)*8));
      var labelX=w/2+(edgeX-cameraX)/mpp+(visualSide==='left'?-sideGap:sideGap);
      var labelY=v.cy-(centreY-cameraY)/mpp;

      ctx.save();
      ctx.translate(labelX,labelY);
      ctx.rotate(0);
      ctx.font='600 10px Arial';
      ctx.textAlign=visualSide==='left'?'right':'left';
      ctx.textBaseline='middle';
      ctx.fillStyle='#d8bd78';
      ctx.fillText(Math.round(yd(current,edges.back))+'',0,-6);
      ctx.fillText(Math.round(yd(current,edges.front))+'',0,6);
      ctx.restore();
      ctx.textAlign='left';
      ctx.textBaseline='alphabetic';
    });
  }
  var playerPosition=gpsFollow?renderCurrent:current;
  var pl=project(playerPosition[0],playerPosition[1],HB,w,h,pad);
  var playerAngle;
  if(gpsFollow&&gpsHeading!=null){
    var hr=gpsHeading*Math.PI/180, north=Math.cos(hr), east=Math.sin(hr);
    var rq=rotatedLocal(baseLat+north/latM,baseLon+east/lonM);
    playerAngle=Math.atan2(rq.x,rq.y);
  }else{
    var travelQ=rotatedLocal(playerPosition[0],playerPosition[1]);
    playerAngle=Math.atan2(travelQ.x,travelQ.y);
  }
  ctx.save();
  ctx.translate(pl[0],pl[1]);
  ctx.rotate(playerAngle);
  ctx.beginPath();
  ctx.moveTo(0,-11);
  ctx.lineTo(7,8);
  ctx.lineTo(0,4);
  ctx.lineTo(-7,8);
  ctx.closePath();
  ctx.fillStyle='#1c4a31';
  ctx.fill();
  ctx.strokeStyle='#fff';
  ctx.lineWidth=2.5;
  ctx.stroke();
  ctx.restore();
  ctx.restore();
}
function draw(){
  var v=viewSize();
  if(detailMode)drawHoleDetail();else drawFullCourse(ctx,v.w,v.h,false);
}
function yd(a,b){
  var R=6371000,p=Math.PI/180,d1=(b[0]-a[0])*p,d2=(b[1]-a[1])*p;
  var x=Math.sin(d1/2)**2+Math.cos(a[0]*p)*Math.cos(b[0]*p)*Math.sin(d2/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))*1.0936133;
}
function zoomToShot(){
  if(!detailMode)return;
  var v=viewSize(),pad=28;
  var start=rotatedLocal(current[0],current[1]);
  // Frame roughly 350 yd of travel from the player's current position.
  var shotSpan=350*0.9144;
  var green=D.green_fmb&&D.green_fmb.middle;
  var target=start.y+shotSpan*0.5;
  if(green){
    var g=rotatedLocal(green[0],green[1]);
    // If the green is inside the 350 yd window, bias the view so it remains
    // visible toward the far end of the shot view.
    if(g.y>start.y)target=(start.y+Math.min(g.y,start.y+shotSpan))*0.5;
  }
  var desiredMpp=shotSpan/(v.h-pad*2);
  var baseMpp=Math.max((RHB.maxX-RHB.minX)/(v.w-pad*2),(RHB.maxY-RHB.minY)/(v.h-pad*2))*1.08;
  zoom=Math.max(0.35,Math.min(8,baseMpp/desiredMpp));
  var q=rotatedLocal(current[0],current[1]);
  cameraX=q.x;
  cameraY=target;
  draw();
}
function cameraForPlayer(pos){
  if(!detailMode)return {x:cameraX,y:cameraY};
  var v=viewSize(),pad=36,mpp=metersPerPixel(v.w,v.h,pad),q=rotatedLocal(pos[0],pos[1]);
  var targetX=v.cx,targetY=v.h*0.68;
  var desiredX=q.x+(targetX-v.cx)*mpp;
  var desiredY=q.y+(v.cy-targetY)*mpp;
  // Keep the camera from drifting so far that the hole leaves the viewport.
  var halfW=v.w*mpp/2,halfH=v.h*mpp/2;
  var holeCenterX=(RHB.minX+RHB.maxX)/2,holeCenterY=(RHB.minY+RHB.maxY)/2;
  var minCamX=RHB.maxX-halfW,maxCamX=RHB.minX+halfW;
  var minCamY=RHB.maxY-halfH,maxCamY=RHB.minY+halfH;
  if(minCamX<=maxCamX)desiredX=Math.max(minCamX,Math.min(maxCamX,desiredX));else desiredX=holeCenterX;
  if(minCamY<=maxCamY)desiredY=Math.max(minCamY,Math.min(maxCamY,desiredY));else desiredY=holeCenterY;
  return {x:desiredX,y:desiredY};
}
function keepPlayerVisible(pos){
  var desired=cameraForPlayer(pos||current);
  cameraX=desired.x;
  cameraY=desired.y;
}
function requestGpsAnimation(){
  if(!gpsFollow||!detailMode||cameraAnimFrame)return;
  cameraAnimFrame=requestAnimationFrame(function animateGps(){
    cameraAnimFrame=null;
    var p=renderCurrent,t=current;
    var latStep=(t[0]-p[0])*0.12;
    var lonStep=(t[1]-p[1])*0.12;
    renderCurrent=[p[0]+latStep,p[1]+lonStep];
    var desired=cameraForPlayer(renderCurrent);
    cameraX+=(desired.x-cameraX)*0.10;
    cameraY+=(desired.y-cameraY)*0.10;
    draw();
    var moving=Math.abs(t[0]-renderCurrent[0])>0.00000001||Math.abs(t[1]-renderCurrent[1])>0.00000001;
    var cameraMoving=Math.abs(desired.x-cameraX)>0.01||Math.abs(desired.y-cameraY)>0.01;
    if(moving||cameraMoving)requestGpsAnimation();
  });
}
function update(pos){
  current=pos.slice();
  window._travelAngle=travelAngleAt(pos[0],pos[1]);
  if(detailMode){
    if(gpsFollow)requestGpsAnimation();
    else{
      renderCurrent=current.slice();
      keepPlayerVisible(current);
    }
  }
  updateYardageUI();
  draw();
}
function setMode(detail){
  hideBunkerPopup();
  detailMode=detail;
  if(detail){fitCamera();}
  document.getElementById('courseBtn').classList.toggle('active',!detail);
  document.getElementById('status').textContent=detail?'Hole '+holeNumber+' · shot view':'Full Overstone course · Hole '+holeNumber+' highlighted';
  draw();
}
function reset(){
  testMode=true;
  
  if(gpsWatch&&navigator.geolocation)navigator.geolocation.clearWatch(gpsWatch);
  gpsWatch=null;update(tee);
  document.getElementById('status').textContent=detailMode?'Hole '+holeNumber+' · player fixed at tee':'Full course · player fixed at Hole '+holeNumber+' tee';
}
canvas.addEventListener('click',function(e){
  if(moved){moved=false;return;}
  if(!detailMode)return;
  var r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  var hit=bunkerAtScreen(x,y);
  if(hit){showBunkerPopup(hit,e.clientX,e.clientY);return;}
  hideBunkerPopup();
  if(!testMode)return;
  var pad=36,v=viewSize(),mpp=metersPerPixel(v.w,v.h,pad);
  var rx=cameraX+(x-v.cx)*mpp,ry=cameraY+(v.cy-y)*mpp;
  var tapAngle=window._travelAngle||holeAngle,cb=Math.cos(tapAngle),sb=Math.sin(tapAngle);
  var east=rx*cb+ry*sb,north=-rx*sb+ry*cb;
  update(fromLocal(east,north));
});
document.getElementById('zoomIn').onclick=function(){if(!detailMode)return;zoom=Math.min(8,zoom*1.5);draw()};
document.getElementById('zoomShot').onclick=function(){zoomToShot()};
document.getElementById('fit').onclick=function(){if(!detailMode)return;fitCamera();draw()};
document.getElementById('zoomOut').onclick=function(){if(!detailMode)return;zoom=Math.max(0.35,zoom/1.5);draw()};
canvas.addEventListener('wheel',function(e){
  if(!detailMode)return;
  e.preventDefault();
  zoom=e.deltaY<0?Math.min(8,zoom*1.15):Math.max(0.35,zoom/1.15);
  draw();
},{passive:false});
canvas.addEventListener('pointerdown',function(e){
  if(!detailMode)return;
  pointers[e.pointerId]={x:e.clientX,y:e.clientY};
  canvas.setPointerCapture(e.pointerId);
  moved=false;
  if(Object.keys(pointers).length===1){
    dragging=true;lastX=e.clientX;lastY=e.clientY;
  }else if(Object.keys(pointers).length===2){
    var ids=Object.keys(pointers),a=pointers[ids[0]],b=pointers[ids[1]];
    pinchStart=Math.hypot(a.x-b.x,a.y-b.y);
  }
});
canvas.addEventListener('pointermove',function(e){
  if(!detailMode||!pointers[e.pointerId])return;
  pointers[e.pointerId]={x:e.clientX,y:e.clientY};
  var ids=Object.keys(pointers);
  if(ids.length===2){
    var a=pointers[ids[0]],b=pointers[ids[1]],d=Math.hypot(a.x-b.x,a.y-b.y);
    if(pinchStart){zoom=Math.max(0.35,Math.min(8,zoom*(d/pinchStart)));pinchStart=d;draw();}
    moved=true;dragging=false;return;
  }
  if(!dragging)return;
  var dx=e.clientX-lastX,dy=e.clientY-lastY,mpp=metersPerPixel(viewSize().w,viewSize().h,36);
  cameraX-=dx*mpp;
  cameraY+=dy*mpp;
  moved=true;lastX=e.clientX;lastY=e.clientY;draw();
});
function endPointer(e){
  delete pointers[e.pointerId];
  dragging=false;
  if(Object.keys(pointers).length<2)pinchStart=null;
}
canvas.addEventListener('pointerup',endPointer);
canvas.addEventListener('pointercancel',endPointer);
document.getElementById('holeSelect').onchange=function(){setMode(true);selectHole(this.value)};
document.getElementById('courseBtn').onclick=function(){setMode(false)};
document.getElementById('gps').onclick=function(){
  var btn=this;
  if(btn.classList.contains('active')){
    if(gpsWatch&&navigator.geolocation)navigator.geolocation.clearWatch(gpsWatch);
    gpsWatch=null;
    gpsFollow=false;
    gpsHeading=null;
    gpsSpeed=null;
    if(cameraAnimFrame){cancelAnimationFrame(cameraAnimFrame);cameraAnimFrame=null;}
    renderCurrent=current.slice();
    testMode=true;
    btn.classList.remove('active');
    btn.textContent='GPS';
    current=tee.slice();
    update(current);
    document.getElementById('status').textContent='GPS off · tap map to set position';
    return;
  }
  if(!navigator.geolocation){
    document.getElementById('status').textContent='GPS unavailable on this device';
    return;
  }
  testMode=false;
  btn.classList.add('active');
  btn.textContent='GPS On';
  if(gpsWatch)navigator.geolocation.clearWatch(gpsWatch);
  document.getElementById('status').textContent='Finding live GPS…';
  var options={enableHighAccuracy:true,maximumAge:0,timeout:15000};
  navigator.geolocation.getCurrentPosition(function(p){
    gpsFollow=true;
    current=[p.coords.latitude,p.coords.longitude];
    renderCurrent=current.slice();
    gpsHeading=(p.coords.heading!=null&&p.coords.speed!=null&&p.coords.speed>0.5)?p.coords.heading:null;
    gpsSpeed=p.coords.speed;
    var firstCamera=cameraForPlayer(renderCurrent);
    cameraX=firstCamera.x;
    cameraY=firstCamera.y;
    update(current);
    document.getElementById('status').textContent='Live GPS · '+Math.round(p.coords.accuracy)+'m accuracy';
    gpsWatch=navigator.geolocation.watchPosition(function(p2){
      current=[p2.coords.latitude,p2.coords.longitude];
      gpsHeading=(p2.coords.heading!=null&&p2.coords.speed!=null&&p2.coords.speed>0.5)?p2.coords.heading:gpsHeading;
      gpsSpeed=p2.coords.speed;
      update(current);
      document.getElementById('status').textContent='Live GPS · '+Math.round(p2.coords.accuracy)+'m accuracy';
    },function(e){
      document.getElementById('status').textContent='GPS watch error · '+e.message;
    },{enableHighAccuracy:true,maximumAge:1000,timeout:15000});
  },function(e){
    btn.classList.remove('active');
    testMode=true;
    btn.textContent='GPS';
    document.getElementById('status').textContent='GPS error · '+e.message;
  },options);
};
document.getElementById('railToggle').onclick=function(){
  var hidden=document.body.classList.toggle('info-hidden');
  this.textContent=hidden?'Show info':'Hide info';
  requestAnimationFrame(function(){
    resizeCanvas();
    if(!hidden){
      fitCamera();
    }
    draw();
  });
};
addEventListener('resize',function(){resizeCanvas();draw()});
setMode(true);reset();
})();
</script>
