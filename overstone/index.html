<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>UiDo · Overstone Hole 1</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body,#map{width:100%;height:100%;margin:0;background:#f3f0e7}body{overflow:hidden;font-family:Arial,sans-serif;color:#16231b}.panel{position:absolute;z-index:1000;background:rgba(247,245,238,.96);border:1px solid rgba(22,35,27,.16);border-radius:12px;padding:10px;box-shadow:0 3px 15px rgba(0,0,0,.12)}.title{top:12px;left:12px}.status{top:76px;left:12px;font-size:12px}.info{left:12px;right:12px;bottom:12px;font-size:12px}.info strong{font-size:14px}.buttons{top:12px;right:12px;display:flex;gap:6px}.buttons button{border:0;border-radius:10px;padding:9px 11px;background:#f7f5ee;color:#16231b;font-weight:600}.buttons .active{background:#1c4a31;color:white}.player{width:16px;height:16px;border-radius:50%;background:#1c4a31;border:3px solid white;box-shadow:0 0 0 2px rgba(28,74,49,.3)}.bunker{background:#16231b;color:white;border:1px solid #ffd600;border-radius:7px;padding:3px 5px;font-size:11px;font-weight:600;white-space:nowrap}.error{color:#9b2c2c}</style>
</head>
<body>
<div id="map"></div>
<div class="panel title"><strong>UiDo · Overstone</strong><br><small>Hole 1 · fixed test position</small></div>
<div id="status" class="panel status">Starting Hole 1…</div>
<div class="panel buttons"><button id="gps">Use GPS</button><button id="test" class="active">Test Hole 1</button></div>
<div class="panel info"><strong id="main">Hole 1</strong><br><span id="detail">Loading course geometry…</span></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="hole1-layer.js"></script>
<script>
(function(){
const D=window.UIDO_OVERSTONE_H1;
if(!window.L||!D)throw new Error(!window.L?'Leaflet did not load':'Hole 1 data did not load');
const map=L.map('map',{zoomControl:false,attributionControl:false});
const geo=L.geoJSON({type:'FeatureCollection',features:D.features.filter(f=>f.golf!=='pin')},{
style:function(f){const g=f.properties.golf;return g==='fairway'?{color:'#8ea58a',weight:1.2,fillColor:'#dfe9d9',fillOpacity:.95}:g==='green'?{color:'#71856e',weight:1.3,fillColor:'#b8cfb1',fillOpacity:.95}:g==='bunker'?{color:'#967b43',weight:1.2,fillColor:'#d8bd78',fillOpacity:.92}:{color:'#65786a',weight:1,fillColor:'#bfcfba',fillOpacity:.9}}
}).addTo(map);
L.polyline(D.line_of_play.map(function(p){return[p[1],p[0]]}),{color:'#7b806e',weight:2,dashArray:'7 7'}).addTo(map);
map.fitBounds(geo.getBounds().pad(.2));
function yd(a,b){const R=6371000,p=Math.PI/180,d1=(b[0]-a[0])*p,d2=(b[1]-a[1])*p,x=Math.sin(d1/2)**2+Math.cos(a[0]*p)*Math.cos(b[0]*p)*Math.sin(d2/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))*1.0936133}
const tee=[52.2763578,-0.8194224];
let player=null,current=tee;
function setPlayer(pos){current=pos;if(!player)player=L.marker(pos,{icon:L.divIcon({className:'',html:'<span class="player"></span>',iconSize:[22,22],iconAnchor:[11,11]})}).addTo(map);else player.setLatLng(pos);document.getElementById('main').textContent='Hole 1 · '+Math.round(yd(pos,D.green_fmb.middle))+' yd to middle';document.getElementById('detail').textContent='F/M/B '+Math.round(yd(pos,D.green_fmb.front))+' / '+Math.round(yd(pos,D.green_fmb.middle))+' / '+Math.round(yd(pos,D.green_fmb.back))+' yd · direction fixed down Hole 1'}
D.bunkers.forEach(function(b){const m=L.marker(b.front_gps,{icon:L.divIcon({className:'',html:'<span class="bunker">'+b.side+' — '+b.front_yards_from_tee+' yd</span>',iconSize:[80,24],iconAnchor:[40,12]})}).addTo(map);m.on('click',function(){document.getElementById('detail').textContent='Bunker '+b.side+' · front '+Math.round(yd(current,b.front_gps))+' yd · back '+Math.round(yd(current,b.back_gps))+' yd'})});
setPlayer(tee);map.setView(tee,18.5);document.getElementById('status').textContent='Hole 1 test · player fixed at tee';
map.on('click',function(e){if(document.getElementById('test').classList.contains('active'))setPlayer([e.latlng.lat,e.latlng.lng])});
document.getElementById('test').onclick=function(){this.classList.add('active');document.getElementById('gps').classList.remove('active');setPlayer(tee);map.setView(tee,18.5)};
document.getElementById('gps').onclick=function(){if(!navigator.geolocation)return;this.classList.add('active');document.getElementById('test').classList.remove('active');navigator.geolocation.watchPosition(function(p){setPlayer([p.coords.latitude,p.coords.longitude]);document.getElementById('status').textContent='Live GPS · '+Math.round(p.coords.accuracy)+'m accuracy'},function(e){document.getElementById('status').textContent='GPS error · '+e.message})};
})();
</script>
<script>window.addEventListener('error',function(e){var s=document.getElementById('status');if(s){s.classList.add('error');s.textContent='Page error · '+e.message}});</script>
</body></html>
