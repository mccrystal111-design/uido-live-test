const refLat=hole.tee[1]*Math.PI/180;
const earthRadius=6371000;
function metric(p){
 const lat=p[1]*Math.PI/180;
 const x=(p[0]-hole.tee[0])*Math.cos(refLat)*earthRadius*Math.PI/180;
 const y=(p[1]-hole.tee[1])*earthRadius*Math.PI/180;
 return [x,y];
}
const st=metric(hole.tee),sg=metric(hole.greenMiddle);
const teeAnchor=[25,85],greenAnchor=[25,15];
const sv=[sg[0]-st[0],sg[1]-st[1]],tv=[greenAnchor[0]-teeAnchor[0],greenAnchor[1]-teeAnchor[1]];
const scale=Math.hypot(tv[0],tv[1])/Math.hypot(sv[0],sv[1]);
const angle=Math.atan2(tv[1],tv[0])-Math.atan2(sv[1],sv[0]);
const c=Math.cos(angle),s=Math.sin(angle);
function P(p){
 const q=metric(p),x=q[0]-st[0],y=q[1]-st[1];
 return [teeAnchor[0]+scale*(x*c-y*s),teeAnchor[1]+scale*(x*s+y*c)];
}
function closed(ps){return ps.map((p,i)=>{const q=P(p);return(i?'L':'M')+q[0].toFixed(2)+' '+q[1].toFixed(2)}).join(' ')+' Z'}
