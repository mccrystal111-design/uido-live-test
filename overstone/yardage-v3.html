<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=360,initial-scale=1,viewport-fit=cover">
<title>UiDo — Yardage v3</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oxanium:wght@400&display=swap');
:root{--ivory:#f4f1e6;--ink:#101110;--sage:#3f4b3b;--yellow:#e9c928}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:var(--ivory)}
body{display:grid;place-items:center;overflow:hidden;color:var(--ink);font-family:Oxanium,system-ui,sans-serif}
#yardage{position:relative;width:360px;height:780px;flex:0 0 360px;overflow:hidden;background:var(--ivory)}
.ring{position:absolute;width:309.6px;height:309.6px;background:var(--ivory);border:1px solid var(--ink);border-radius:20px}
.ring .inner{position:absolute;width:297.216px;height:297.216px;left:5.39px;top:5.65px;border:1px solid rgba(63,75,59,.72);border-radius:50%;pointer-events:none}
.top-ring{left:25px;top:44px}.bottom-ring{left:25.2px;top:425.94px}
.text{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;justify-content:center;text-align:center;font-weight:400;line-height:normal;white-space:nowrap}
.meta{left:180.31px;top:80.54px;width:200.621px;height:25.078px;font-size:12px;color:var(--sage)}
.yardage{left:180px;width:94.738px;height:41.796px;font-size:42px;color:var(--ink)}
.yardage.back{top:146.9px}.yardage.middle{top:208.68px;height:47.369px;font-size:45px;color:var(--yellow)}.yardage.front{top:264.9px}
.bunker-label{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;justify-content:center;width:52px;height:28px;text-align:center;color:var(--sage);font-size:12px;font-weight:400;line-height:normal}
.bunker-values{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;justify-content:center;width:61.301px;height:33.437px;text-align:center;color:var(--sage);font-size:18px;font-weight:400;line-height:normal}
.bunker-label p,.bunker-values p{margin:0}
.gsb-left-label{left:96.5px;top:115px}.gsb-right-label{left:264px;top:115px;font-size:11px}
.gsb-left-values{left:96.65px;top:153.72px}.gsb-right-values{left:263.65px;top:153.72px}
.fwb-left-label{left:96.5px;top:236px}.fwb-right-label{left:263.65px;top:235.93px}
.fwb-left-values{left:96.65px;top:278.72px}.fwb-right-values{left:263.65px;top:278.72px}
.separator{position:absolute;background:var(--sage)}.vertical{width:1px;height:120px;top:140px}.left-separator{left:128px}.right-separator{left:231px}
.horizontal{width:67px;height:1px;left:146px}.front-middle{top:174px}.middle-back{top:233px}
.page-dots{position:absolute;left:166px;top:318px;width:32px;height:8px;display:flex;gap:4px}
.page-dot{width:8px;height:8px;border-radius:50%;background:#d4d0c4}.page-dot.active{background:var(--ink)}
.wind-control{position:absolute;left:146.56px;top:564.02px;width:66.874px;height:33.437px;border:1px solid rgba(63,75,59,.72);border-radius:50%}
.wind-label{left:180px;top:580.74px;width:66.874px;height:33.437px;font-size:13px;color:var(--sage)}
.ball-label{left:180px;top:692.12px;width:50.155px;height:33.437px;font-size:11px;color:var(--yellow);background:none;border:0;padding:0;font-family:inherit}
#courseData{position:fixed;left:-12000px;top:0;width:390px;height:844px;opacity:0;pointer-events:none;border:0}
@media(max-width:360px),(max-height:780px){body{display:block}#yardage{transform-origin:top left;transform:scale(min(100vw / 360, 100dvh / 780))}}
</style>
</head>
<body>
<iframe id="courseData" src="index.html" title="UiDo course data" aria-hidden="true" tabindex="-1"></iframe>
<main id="yardage" aria-label="UiDo live yardage">
  <section class="ring top-ring" aria-label="Live yardages and bunker distances">
    <div class="inner"></div>
    <div class="text meta" id="holeMeta">HOLE 1 · PAR 4 (4)</div>
    <div class="text yardage back" id="yardageBack">382</div>
    <div class="text yardage middle" id="yardageMiddle">367</div>
    <div class="text yardage front" id="yardageFront">352</div>
    <div class="bunker-label gsb-left-label"><p>GSB LEFT</p></div>
    <div class="bunker-values gsb-left-values" id="gsLeft"><p>355</p><p>344</p></div>
    <div class="bunker-label gsb-right-label"><p>GSB RIGHT</p></div>
    <div class="bunker-values gsb-right-values" id="gsRight"><p>355</p><p>344</p></div>
    <div class="bunker-label fwb-left-label"><p>FWB LEFT</p></div>
    <div class="bunker-values fwb-left-values" id="fwLeft"><p>215</p><p>198</p></div>
    <div class="bunker-label fwb-right-label"><p>FWB RIGHT</p></div>
    <div class="bunker-values fwb-right-values" id="fwRight"><p>231</p><p>209</p></div>
    <div class="separator vertical left-separator"></div><div class="separator vertical right-separator"></div>
    <div class="separator horizontal front-middle"></div><div class="separator horizontal middle-back"></div>
    <div class="page-dots" id="pageDots"><span class="page-dot active"></span><span class="page-dot"></span><span class="page-dot"></span></div>
  </section>
  <section class="ring bottom-ring" aria-label="Wind and ball controls">
    <div class="inner"></div><div class="wind-control" aria-hidden="true"></div>
    <div class="text wind-label">WIND</div>
    <button class="text ball-label" id="ballButton" type="button" aria-label="Ball icon">BALL<br>ICON</button>
  </section>
</main>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id), frame=$('courseData'), rad=Math.PI/180;
let position=null,watchId=null,activeHole=1,page=0,pages=[];
function metres(a,b){if(!a||!b)return NaN;const R=6371008.8,p1=a[0]*rad,p2=b[0]*rad,dp=(b[0]-a[0])*rad,dl=(b[1]-a[1])*rad,h=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.min(1,Math.sqrt(h)))}
function yards(m){return Number.isFinite(m)&&m>=0?String(Math.round(m*1.093613298)):'—'}
function source(){try{return frame.contentWindow.UIDO_OVERSTONE_SOURCE_HOLES[String(activeHole)]||null}catch(e){return null}}
function coursePosition(d){const p=d&&d.line_of_play&&d.line_of_play[0];return p?[p[1],p[0]]:null}
function playerPosition(d){const tee=coursePosition(d);return position&&tee&&metres(position,tee)<2500?position:tee}
function setPair(id,a,b){const el=$(id);el.children[0].textContent=a;el.children[1].textContent=b}
function classifyBunker(b,green){return metres(b.anchor_gps||b.front_gps,green)<=60*0.9144?'greenside':'fairway'}
function rebuildPages(d,pos){
 const green=d&&d.green_fmb&&d.green_fmb.middle;if(!d||!green||!pos){pages=[];return}
 const all=(d.bunkers||[]).filter(b=>b.front_gps&&b.back_gps).map(b=>({...b,zone:classifyBunker(b,green)}));
 const sortByDistance=(a,b)=>metres(pos,a.front_gps)-metres(pos,b.front_gps);
 const groups=[
  all.filter(b=>b.zone==='greenside'&&b.side==='left').sort(sortByDistance),
  all.filter(b=>b.zone==='greenside'&&b.side==='right').sort(sortByDistance),
  all.filter(b=>b.zone==='fairway'&&b.side==='left').sort(sortByDistance),
  all.filter(b=>b.zone==='fairway'&&b.side==='right').sort(sortByDistance)
 ];
 const count=Math.max(...groups.map(g=>g.length),1);
 pages=Array.from({length:Math.min(count,3)},(_,i)=>({gsL:groups[0][i]||null,gsR:groups[1][i]||null,fwL:groups[2][i]||null,fwR:groups[3][i]||null}));
 page=Math.max(0,Math.min(page,pages.length-1));
 $('pageDots').innerHTML=Array.from({length:3},(_,i)=>'<span class="page-dot'+(i===page?' active':'')+'"></span>').join('');
}
function render(){
 if(new URLSearchParams(location.search).get('visual')==='1')return;
 const d=source(),pos=playerPosition(d);if(!d||!pos)return;
 $('holeMeta').textContent='HOLE '+activeHole+' · PAR '+d.par+' ('+(d.nettPar??d.par)+')';
 $('yardageFront').textContent=yards(metres(pos,d.green_fmb.front));
 $('yardageMiddle').textContent=yards(metres(pos,d.green_fmb.middle));
 $('yardageBack').textContent=yards(metres(pos,d.green_fmb.back));
 rebuildPages(d,pos);const p=pages[page]||{};
 setPair('gsLeft',p.gsL?yards(metres(pos,p.gsL.front_gps)):'—',p.gsL?yards(metres(pos,p.gsL.back_gps)):'—');
 setPair('gsRight',p.gsR?yards(metres(pos,p.gsR.front_gps)):'—',p.gsR?yards(metres(pos,p.gsR.back_gps)):'—');
 setPair('fwLeft',p.fwL?yards(metres(pos,p.fwL.front_gps)):'—',p.fwL?yards(metres(pos,p.fwL.back_gps)):'—');
 setPair('fwRight',p.fwR?yards(metres(pos,p.fwR.front_gps)):'—',p.fwR?yards(metres(pos,p.fwR.back_gps)):'—');
}
function changePage(delta){if(pages.length<2)return;page=(page+delta+pages.length)%pages.length;render()}
let sx=0,sy=0;
$('yardage').addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
$('yardage').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy))changePage(dx<0?1:-1)},{passive:true});
$('ballButton').addEventListener('click',()=>{});
function startGPS(){if(!navigator.geolocation||watchId!==null)return;watchId=navigator.geolocation.watchPosition(p=>{position=[p.coords.latitude,p.coords.longitude];render()},()=>{},{enableHighAccuracy:true,maximumAge:3000,timeout:12000});watchId=watchId===undefined?null:watchId}
frame.addEventListener('load',()=>{try{const h=frame.contentDocument.getElementById('holeHeaderMeta');if(h)new MutationObserver(()=>{const m=h.textContent.match(/Hole\s+(\d+)/i);if(m&&Number(m[1])!==activeHole){activeHole=Number(m[1]);page=0;render()}}).observe(h,{childList:true,subtree:true,characterData:true})}catch(e){}render();startGPS()});
setInterval(render,2000);
})();
</script>
</body>
</html>
