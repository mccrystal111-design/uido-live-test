<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=360,initial-scale=1,viewport-fit=cover">
<title>UiDo — Live Yardage V2</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oxanium:wght@400&display=swap');

:root{
  --ivory:#f4f1e6;
  --ink:#101110;
  --sage:#3f4b3b;
  --yellow:#e9c928;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:var(--ivory);
  color:var(--ink);
  font-family:Oxanium,system-ui,sans-serif;
}
body{
  min-height:100dvh;
  display:grid;
  place-items:center;
  overflow:hidden;
}
.screen{
  position:relative;
  width:360px;
  height:780px;
  flex:0 0 360px;
  background:var(--ivory);
  overflow:hidden;
}
.ring{
  position:absolute;
  background:var(--ivory);
  border:1px solid var(--ink);
  border-radius:20px;
}
.ring::after{
  content:"";
  position:absolute;
  left:6.39px;
  top:6.65px;
  width:297.216px;
  height:297.216px;
  border:1.5px solid rgba(63,75,59,.42);
  border-radius:50%;
  pointer-events:none;
}
.top-ring{
  left:25px;
  top:44px;
  width:309.6px;
  height:309.6px;
}
.bottom-ring{
  left:25.2px;
  top:425.94px;
  width:309.6px;
  height:309.6px;
}
.text{
  position:absolute;
  transform:translate(-50%,-50%);
  text-align:center;
  font-weight:400;
  line-height:normal;
  white-space:nowrap;
}
.meta{
  left:180.31px;
  top:80.54px;
  width:200.621px;
  height:25.078px;
  font-size:12px;
  color:var(--sage);
}
.yardage{
  left:180px;
  width:94.738px;
  height:auto;
  font-size:42px;
  color:var(--ink);
}
.yardage.back{top:146.9px}
.yardage.middle{
  top:208.68px;
  font-size:45px;
  color:var(--yellow);
}
.yardage.front{top:264.9px}

.bunker-label{
  color:var(--sage);
  height:28px;
  font-size:12px;
}
.bunker-values{
  color:var(--sage);
  height:33.437px;
  font-size:18px;
  line-height:normal;
}
.bunker{
  position:absolute;
  width:61.301px;
  height:33.437px;
  text-align:center;
}
.bunker.left{left:66px}
.bunker.right{left:233px}
.bunker.gs,.bunker.fw{top:14px}
.bunker.gs .bunker-label{position:absolute;left:0;top:87px;width:100%;height:28px}
.bunker.gs .bunker-values{position:absolute;left:0;top:129.003px;width:100%;height:33.437px}
.bunker.fw .bunker-label{position:absolute;left:0;top:208px;width:100%;height:28px}
.bunker.fw .bunker-values{position:absolute;left:0;top:250.003px;width:100%;height:33.437px}
.bunker.right .bunker-label{font-size:11px}
.bunker-values span{display:block}

.separator{
  position:absolute;
  background:var(--sage);
}
.separator.vertical{
  width:1px;
  height:120px;
  top:140px;
}
.separator.left{left:128px}
.separator.right{left:231px}
.separator.horizontal{
  height:1px;
  left:146px;
  width:67px;
}
.separator.front-middle{top:174px}
.separator.middle-back{top:233px}

.page-dots{
  position:absolute;
  left:166px;
  top:318px;
  width:32px;
  height:8px;
  display:flex;
  gap:4px;
}
.page-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:rgba(63,75,59,.22);
}
.page-dot.active{background:var(--sage)}

.wind-ring{
  position:absolute;
  left:146.56px;
  top:564.02px;
  width:66.874px;
  height:33.437px;
  border:1px solid rgba(63,75,59,.42);
  border-radius:50%;
}
.wind{
  left:180px;
  top:580.74px;
  width:66.874px;
  height:33.437px;
  font-size:13px;
  color:var(--sage);
}
.ball{
  left:180px;
  top:692.12px;
  width:50.155px;
  height:33.437px;
  font-size:11px;
  color:var(--yellow);
  border:0;
  background:transparent;
  padding:0;
  font-family:inherit;
  cursor:pointer;
}
.status{
  display:none;
  position:fixed;
  left:8px;
  bottom:8px;
  z-index:20;
  padding:4px 6px;
  background:rgba(244,241,230,.92);
  color:var(--sage);
  font:10px Arial,sans-serif;
  pointer-events:none;
}
.course-data{
  position:fixed;
  left:-12000px;
  top:0;
  width:390px;
  height:844px;
  opacity:0;
  pointer-events:none;
  border:0;
}
@media (max-width:360px),(max-height:780px){
  body{display:block}
  .screen{
    transform-origin:top left;
    transform:scale(min(100vw / 360, 100dvh / 780));
  }
}
</style>
</head>
<body>
<iframe id="courseData" class="course-data" src="index.html" title="UiDo course data" aria-hidden="true" tabindex="-1"></iframe>

<main class="screen" id="screen" aria-label="UiDo live yardage">
  <section class="ring top-ring" aria-label="Live yardages and bunker distances">
    <div class="text meta" id="holeMeta">HOLE 1 · PAR 4 (4)</div>

    <div class="text yardage back" id="yardageBack">—</div>
    <div class="text yardage middle" id="yardageMiddle">—</div>
    <div class="text yardage front" id="yardageFront">—</div>

    <div class="bunker left gs">
      <div class="bunker-label">GSB LEFT</div>
      <div class="bunker-values" id="gsLeft"><span>—</span><span>—</span></div>
    </div>
    <div class="bunker right gs">
      <div class="bunker-label">GSB RIGHT</div>
      <div class="bunker-values" id="gsRight"><span>—</span><span>—</span></div>
    </div>
    <div class="bunker left fw">
      <div class="bunker-label">FWB LEFT</div>
      <div class="bunker-values" id="fwLeft"><span>—</span><span>—</span></div>
    </div>
    <div class="bunker right fw">
      <div class="bunker-label">FWB RIGHT</div>
      <div class="bunker-values" id="fwRight"><span>—</span><span>—</span></div>
    </div>

    <div class="separator vertical left"></div>
    <div class="separator vertical right"></div>
    <div class="separator horizontal front-middle"></div>
    <div class="separator horizontal middle-back"></div>

    <div class="page-dots" id="pageDots" aria-label="Bunker pages"></div>
  </section>

  <section class="ring bottom-ring" aria-label="Wind and ball controls">
    <div class="wind-ring" aria-hidden="true"></div>
    <div class="text wind">WIND</div>
    <button class="text ball" id="ballButton" type="button" aria-label="Ball icon">BALL ICON</button>
  </section>
</main>

<div class="status" id="status" aria-hidden="true"></div>

<script>
(function(){
  'use strict';

  const $ = id => document.getElementById(id);
  const frame = $('courseData');
  const rad = Math.PI / 180;

  let position = null;
  let watchId = null;
  let activeHole = 1;
  let page = 0;
  let pages = [];

  function metres(a,b){
    if(!a || !b) return NaN;
    const R = 6371008.8;
    const p1 = a[0] * rad;
    const p2 = b[0] * rad;
    const dp = (b[0]-a[0]) * rad;
    const dl = (b[1]-a[1]) * rad;
    const h = Math.sin(dp/2)**2 + Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
    return 2 * R * Math.asin(Math.min(1,Math.sqrt(h)));
  }

  function yards(m){
    return Number.isFinite(m) && m >= 0 ? String(Math.round(m * 1.093613298)) : '—';
  }

  function source(){
    try{
      return frame.contentWindow.UIDO_OVERSTONE_SOURCE_HOLES[String(activeHole)] || null;
    }catch(e){
      return null;
    }
  }

  function coursePosition(d){
    const p = d && d.line_of_play && d.line_of_play[0];
    return p ? [p[1],p[0]] : null;
  }

  function playerPosition(d){
    const tee = coursePosition(d);
    if(position && tee && metres(position,tee) < 2500) return position;
    return tee;
  }

  function setPair(id,a,b){
    const el = $(id);
    el.children[0].textContent = a || '—';
    el.children[1].textContent = b || '—';
  }

  function classifyBunker(b,green){
    return metres(b.anchor_gps || b.front_gps,green) <= 60*0.9144 ? 'greenside' : 'fairway';
  }

  function rebuildPages(d,pos){
    const green = d && d.green_fmb && d.green_fmb.middle;
    if(!d || !green || !pos){
      pages = [];
      renderDots();
      return;
    }

    const all = (d.bunkers || [])
      .filter(b => b.front_gps && b.back_gps)
      .map(b => ({...b,zone:classifyBunker(b,green)}));

    const sortByDistance = (a,b) => metres(pos,a.front_gps)-metres(pos,b.front_gps);
    const gsL = all.filter(b => b.zone==='greenside' && b.side==='left').sort(sortByDistance);
    const gsR = all.filter(b => b.zone==='greenside' && b.side==='right').sort(sortByDistance);
    const fwL = all.filter(b => b.zone==='fairway' && b.side==='left').sort(sortByDistance);
    const fwR = all.filter(b => b.zone==='fairway' && b.side==='right').sort(sortByDistance);

    const count = Math.max(gsL.length,gsR.length,fwL.length,fwR.length,1);
    pages = Array.from({length:count},(_,i)=>({
      gsL:gsL[i] || null,
      gsR:gsR[i] || null,
      fwL:fwL[i] || null,
      fwR:fwR[i] || null
    }));

    page = Math.min(page,pages.length-1);
    renderDots();
  }

  function renderDots(){
    $('pageDots').innerHTML = pages.map((_,i) =>
      '<span class="page-dot'+(i===page?' active':'')+'"></span>'
    ).join('');
  }

  function render(){
    const d = source();
    const pos = playerPosition(d);
    if(!d || !pos) return;

    $('holeMeta').textContent =
      'HOLE '+activeHole+' · PAR '+d.par+' ('+(d.nettPar ?? d.par)+')';

    $('yardageFront').textContent = yards(metres(pos,d.green_fmb.front));
    $('yardageMiddle').textContent = yards(metres(pos,d.green_fmb.middle));
    $('yardageBack').textContent = yards(metres(pos,d.green_fmb.back));

    rebuildPages(d,pos);

    const p = pages[page] || {};
    setPair('gsLeft',p.gsL ? yards(metres(pos,p.gsL.front_gps)) : '—',p.gsL ? yards(metres(pos,p.gsL.back_gps)) : '—');
    setPair('gsRight',p.gsR ? yards(metres(pos,p.gsR.front_gps)) : '—',p.gsR ? yards(metres(pos,p.gsR.back_gps)) : '—');
    setPair('fwLeft',p.fwL ? yards(metres(pos,p.fwL.front_gps)) : '—',p.fwL ? yards(metres(pos,p.fwL.back_gps)) : '—');
    setPair('fwRight',p.fwR ? yards(metres(pos,p.fwR.front_gps)) : '—',p.fwR ? yards(metres(pos,p.fwR.back_gps)) : '—');

    $('status').textContent = position ? 'GPS live' : 'Course position preview';
  }

  function changePage(delta){
    if(pages.length < 2) return;
    page = (page + delta + pages.length) % pages.length;
    render();
  }

  let startX = 0;
  let startY = 0;

  $('screen').addEventListener('touchstart',e=>{
    const t = e.touches[0];
    startX = t.clientX;
    startY = t.clientY;
  },{passive:true});

  $('screen').addEventListener('touchend',e=>{
    const t = e.changedTouches[0];
    const dx = t.clientX-startX;
    const dy = t.clientY-startY;
    if(Math.abs(dx)>40 && Math.abs(dx)>Math.abs(dy)) changePage(dx<0 ? 1 : -1);
  },{passive:true});

  $('ballButton').addEventListener('click',()=>{
    $('status').textContent = 'Ball control ready';
  });

  function startGPS(){
    if(!navigator.geolocation || watchId !== null) return;
    watchId = navigator.geolocation.watchPosition(
      p=>{
        position=[p.coords.latitude,p.coords.longitude];
        render();
      },
      ()=>{
        $('status').textContent='GPS unavailable';
        render();
      },
      {enableHighAccuracy:true,maximumAge:3000,timeout:12000}
    );
  }

  frame.addEventListener('load',()=>{
    try{
      const doc = frame.contentDocument;
      const header = doc.getElementById('holeHeaderMeta');
      if(header){
        new MutationObserver(()=>{
          const m = header.textContent.match(/Hole\s+(\d+)/i);
          if(m && Number(m[1]) !== activeHole){
            activeHole = Number(m[1]);
            page = 0;
            render();
          }
        }).observe(header,{childList:true,subtree:true,characterData:true});
      }
    }catch(e){}

    render();
    startGPS();
  });

  setInterval(render,2000);
})();
</script>
</body>
</html>
