<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UiDo Storyboard Interpretation Test</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:Arial;background:#dfe4d8;color:#16231b}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px}#screen{position:relative;width:min(100vw - 40px,calc((100vh - 40px)*9/16));height:min(100vh - 40px,calc((100vw - 40px)*16/9));background:#e9eadf;border:2px solid #3f4b3b;overflow:hidden}
.grid{position:absolute;inset:0;background-image:linear-gradient(to right,#16231b28 1px,transparent 1px),linear-gradient(to bottom,#16231b28 1px,transparent 1px);background-size:10% 10%}.mid{position:absolute;background:#16231b66}.v{left:50%;top:0;bottom:0;width:1px}.h{top:50%;left:0;right:0;height:1px}
.item{position:absolute;transform:translate(-50%,-50%);text-align:center}.dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:2px solid #16231b;background:#f7f5ee;font-weight:700}.player .dot{border-color:#3f4b3b}.green .dot{background:#9aa98f}.tee .dot{background:#e8d6a2}.bunker .dot{background:#c9b78c}.label{position:absolute;transform:translate(-50%,-50%);padding:4px 7px;border:1px solid #3f4b3b;border-radius:6px;background:#f7f5eee8;font-size:10px;white-space:nowrap}
#info{position:fixed;left:10px;top:10px;width:260px;z-index:20;background:#f7f5eef5;border:1px solid #16231b2b;border-radius:10px;padding:10px;font-size:11px}textarea{width:100%;height:190px;font:10px monospace}button{font:inherit;padding:6px 8px;border:1px solid #16231b2b;border-radius:7px;background:#fff;margin-top:6px}
#rail{position:absolute;right:10px;top:10px;width:138px;display:flex;flex-direction:column;gap:6px}.box{height:58px;background:#f7f5eef5;border:1px solid #16231b2b;border-radius:10px}.tall{height:82px}.small{height:42px}
</style></head><body>
<div id="info"><b>UiDo · Interpretation Test</b><p>Paste the numeric specification produced by the Selector. This page renders it independently.</p><textarea id="json">{"objects":[{"name":"Tee","type":"tee","x":82,"y":88},{"name":"Player / GPS","type":"player","x":82,"y":88},{"name":"Green middle","type":"green-middle","x":54,"y":18}]}</textarea><button id="render">Render specification</button></div>
<div id="stage"><div id="screen"><div class="grid"></div><div class="mid v"></div><div class="mid h"></div><div id="rail"><div class="box tall"></div><div class="box"></div><div class="box"></div><div class="box small"></div></div></div></div>
<script>
const s=document.querySelector('#screen');function render(){s.querySelectorAll('.item,.label').forEach(e=>e.remove());let d;try{d=JSON.parse(document.querySelector('#json').value)}catch(e){alert('Invalid JSON');return}for(const o of d.objects||[]){let e=document.createElement('div');e.className=o.type&&o.type.startsWith('bunker')?'item bunker':o.type&&o.type.startsWith('bunker-label')?'label':'item '+(o.type||'');e.style.left=o.x+'%';e.style.top=o.y+'%';e.innerHTML=e.className.includes('label')?(o.name||'BUNKER LABEL'):'<div class="dot">'+(o.type==='green-middle'?'G':o.type==='tee'?'T':o.type==='player'?'●':'B')+'</div><small>'+o.name+'</small>';s.appendChild(e)}}document.querySelector('#render').onclick=render;render();
</script></body></html>
