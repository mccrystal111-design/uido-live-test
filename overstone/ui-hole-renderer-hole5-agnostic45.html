<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UiDo — Hole 5 — AGNOSTIC45 Base</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dfe4d8}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px}
#screen{position:relative;width:min(calc(100vw - 40px),calc((100vh - 40px)*9/16));height:min(calc(100vh - 40px),calc((100vw - 40px)*16/9));background:#f4f1e6;overflow:hidden}
.grid{position:absolute;inset:0;background-image:linear-gradient(to right,#16231b22 1px,transparent 1px),linear-gradient(to bottom,#16231b22 1px,transparent 1px);background-size:10% 10%;z-index:1}
.course{position:absolute;inset:0;z-index:2;pointer-events:none}
.fadeLayer{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:3;pointer-events:none}
svg{width:100%;height:100%;display:block}
.fairway{fill:#9cad83;stroke:#5f7254;stroke-width:.35}
.green{fill:#b9caa0;stroke:#4d6543;stroke-width:.45}
.bunker{fill:#d8c9a0;stroke:#8c7950;stroke-width:.4}
.rough{fill:#b9c7ae;stroke:#8d9e85;stroke-width:.22}
.water{fill:#d9dce0;stroke:#4d5258;stroke-width:.35}
.path{fill:none;stroke:#a7a28f;stroke-width:.45;stroke-linecap:round;stroke-linejoin:round}
.playline{fill:none;stroke:#3f4b3b;stroke-width:.45;stroke-dasharray:1.2 1}
.teeMarker{fill:#82956f;stroke:#526348;stroke-width:.4}
.greenMarker{fill:none;stroke:#3f4b3b;stroke-width:.45}
.teeBox{fill:#c8c6a8;stroke:#7d8069;stroke-width:.35}
.pin{fill:#3f4b3b;stroke:#f4f1e6;stroke-width:.25}
</style>
</head>
<body>
<div id="stage"><div id="screen">
<div class="grid"></div>
<div class="course">
<svg id="courseSvg" viewBox="0 0 100 177.7777777778" preserveAspectRatio="none" style="overflow:visible">
<defs>
<clipPath id="holeViewClip" clipPathUnits="userSpaceOnUse"><rect x="0" y="0" width="100" height="177.7777777778"></rect></clipPath>
</defs>
<path id="fairway" class="fairway"></path>
<path id="green" class="green"></path>
<g id="bunkers"></g>
<g id="tees"></g>
<g id="renderedGeometry"></g>

</svg>
</div>
</div></div>
<script src="course-source-model.js"></script>
<script src="hole-view-builder.js"></script>
<script src="agnostic45-fade.js?v=restore-fade-base"></script>
<script>
const sources=window.UIDO_OVERSTONE_SOURCE_HOLES;
const selectedSource=sources["5"];
if(!selectedSource) throw new Error("Authoritative Hole 5 source model not found");

function buildRuntimeCanonical(){
  const featuresById=new Map();
  const holes=[];
  Object.keys(sources).sort((a,b)=>Number(a)-Number(b)).forEach(key=>{
    const s=sources[key];
    holes.push({
      hole_number:Number(s.hole),
      par:s.par,
      routing:{
        role:"hole_route",
        hole_number:Number(s.hole),
        geometry:{type:"LineString",coordinates:s.line_of_play},
        destination:{
          lon:s.green_fmb.middle[1],
          lat:s.green_fmb.middle[0]
        }
      },
      truth:"CONFIRMED"
    });
    (s.features||[]).forEach(feature=>{
      if(!feature.geometry || feature.id==null) return;
      if(!featuresById.has(String(feature.id))){
        featuresById.set(String(feature.id),{
          id:String(feature.id),
          type:String(feature.golf||"UNKNOWN").toUpperCase(),
          geometry:feature.geometry,
          provenance:feature.source||"source",
          source_refs:[String(feature.id)]
        });
      }
    });
  });
  return {
    schema:"uido.course.canonical.v2.runtime-adapter",
    course:{id:"overstone-park",name:"Overstone Park Golf Club"},
    geometry:{scope:"course",features:Array.from(featuresById.values())},
    holes
  };
}

const canonical=buildRuntimeCanonical();
const ns="http://www.w3.org/2000/svg";
const VIEW_WIDTH=100;
const VIEW_HEIGHT=100*16/9;
const teeAnchor=[VIEW_WIDTH*.25,VIEW_HEIGHT*.90];
const greenAnchor=[VIEW_WIDTH*.25,VIEW_HEIGHT*.10];

const teeLL=selectedSource.line_of_play[0];
const greenMiddleLL=[
  selectedSource.green_fmb.middle[1],
  selectedSource.green_fmb.middle[0]
];
const referenceLatitude=teeLL[1]*Math.PI/180;
const EARTH_RADIUS=6371000;

function toLocalMetres(point){
  return [
    (point[0]-teeLL[0])*Math.cos(referenceLatitude)*Math.PI/180*EARTH_RADIUS,
    (point[1]-teeLL[1])*Math.PI/180*EARTH_RADIUS
  ];
}

const teeLocal=toLocalMetres(teeLL);
const greenLocal=toLocalMetres(greenMiddleLL);
const targetVector=[0,teeAnchor[1]-greenAnchor[1]];
const courseVector=[greenLocal[0]-teeLocal[0],greenLocal[1]-teeLocal[1]];
const rotation=
  Math.atan2(targetVector[1],targetVector[0])-
  Math.atan2(courseVector[1],courseVector[0]);
const scale=
  Math.hypot(targetVector[0],targetVector[1])/
  Math.hypot(courseVector[0],courseVector[1]);

// The physical Hole View is exactly the renderer's usable 60-unit window.
// Derive its metres from the proven camera scale rather than inventing a
// separate spatial extent.
const hole5Route=canonical.holes.find(h=>h.hole_number===5).routing;
const hole5Direction=window.UiDoHoleViewBuilder.directionFromRoute(hole5Route);

// Hole-specific input stops here: direction of travel.
// The next layer turns that direction into the physical viewing window,
// then resolves every shared course feature physically inside it.
const viewingWindow=window.UiDoHoleViewBuilder.buildViewingWindow(hole5Direction,{
  back_m:(VIEW_HEIGHT-teeAnchor[1])/scale,
  forward_m:teeAnchor[1]/scale,
  width_m:60/scale
});
const fadeMarginM=45*0.9144;
const captureWindow=window.UiDoHoleViewBuilder.buildViewingWindow(hole5Direction,{
  back_m:(VIEW_HEIGHT-teeAnchor[1])/scale + fadeMarginM,
  forward_m:teeAnchor[1]/scale + fadeMarginM,
  width_m:60/scale + fadeMarginM*2
});
const visibleFeatures=window.UiDoHoleViewBuilder.selectCourseGeometry(
  canonical.geometry.features,
  hole5Direction,
  captureWindow
);
const holeView={
  features:visibleFeatures,
  direction_of_travel:hole5Direction,
  viewing_window:viewingWindow,
  capture_window:captureWindow
};

console.info("UiDo Hole 5 geometry inspection", {
  direction_of_travel: hole5Direction,
  visible_feature_count: visibleFeatures.length,
  visible_feature_ids: visibleFeatures.map(feature => feature.id)
});

function project(point){
  const local=toLocalMetres(point);
  const x=local[0]-teeLocal[0];
  const y=local[1]-teeLocal[1];
  const c=Math.cos(rotation),s=Math.sin(rotation);
  const cameraX=x*c-y*s;
  const cameraY=x*s+y*c;
  return [
    teeAnchor[0]+cameraX*scale,
    teeAnchor[1]-cameraY*scale
  ];
}

function pathFromGeometry(geometry){
  if(!geometry) return null;
  if(geometry.type==="Polygon"){
    return geometry.coordinates[0].map((p,i)=>{
      const q=project(p);
      return (i?"L":"M")+q[0].toFixed(3)+" "+q[1].toFixed(3);
    }).join(" ")+" Z";
  }
  if(geometry.type==="LineString"){
    return geometry.coordinates.map((p,i)=>{
      const q=project(p);
      return (i?"L":"M")+q[0].toFixed(3)+" "+q[1].toFixed(3);
    }).join(" ");
  }
  return null;
}

function addFeature(feature){
  const d=pathFromGeometry(feature.geometry);
  if(!d) return;
  const type=String(feature.type||"").toUpperCase();
  let cls=null;
  if(type==="ROUGH") cls="rough";
  else if(type==="FAIRWAY") cls="fairway";
  else if(type==="GREEN") cls="green";
  else if(type==="BUNKER") cls="bunker";
  else if(type==="TEE") cls="teeBox";
  else if(type==="WATER" || type==="WATER_HAZARD") cls="water";
  else if(type==="PATH" || type==="CARTPATH") cls="path";
  if(!cls) return;
  const element=document.createElementNS(ns,"path");
  element.setAttribute("class",cls);
  element.setAttribute("d",d);
  if(type==="PATH" || type==="CARTPATH") element.setAttribute("fill","none");
  document.getElementById("renderedGeometry").appendChild(element);
}
const renderOrder={ROUGH:0,WATER:1,WATER_HAZARD:1,FAIRWAY:2,PATH:3,CARTPATH:3,TEE:4,BUNKER:5,GREEN:6};
holeView.features.slice().sort((a,b)=>
  (renderOrder[String(a.type||"").toUpperCase()]??99)-
  (renderOrder[String(b.type||"").toUpperCase()]??99)
).forEach(addFeature);

UiDoAgnostic45Fade.attach(document.getElementById("screen"), pathFromGeometry(hole5Route.geometry), scale, {width:VIEW_WIDTH,height:VIEW_HEIGHT,corridorYards:40,fadeYards:20});

const svg=document.getElementById("courseSvg");

const routeElement=document.createElementNS(ns,"path");
routeElement.setAttribute("class","playline");
routeElement.setAttribute("d",pathFromGeometry(hole5Route.geometry));
routeElement.setAttribute("clip-path","url(#holeViewClip)");
svg.appendChild(routeElement);

// AGNOSTIC45 presentation layer.
// The fade receives only the already-projected route and renderer scale.
// It contains no hole number, course identity, or feature ownership logic.

const pTee=project(teeLL);
const pGreen=project(greenMiddleLL);
const EPS=1e-7;
if(Math.hypot(pTee[0]-teeAnchor[0],pTee[1]-teeAnchor[1])>EPS) {
  throw new Error("Tee percentage anchor transform failed");
}
if(Math.hypot(pGreen[0]-greenAnchor[0],pGreen[1]-greenAnchor[1])>EPS) {
  throw new Error("Green percentage anchor transform failed");
}

document.title="UiDo — Hole 5 — AGNOSTIC45 Canonical Hole View";
</script>
</body>
</html>
