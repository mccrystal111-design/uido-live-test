<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>UiDo · Hole 1</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>@font-face{font-family:'Space Grotesk';src:url('assets/fonts/SpaceGrotesk-Regular.woff2') format('woff2');font-weight:400}@font-face{font-family:'Space Grotesk';src:url('assets/fonts/SpaceGrotesk-Medium.woff2') format('woff2');font-weight:500}@font-face{font-family:'Space Grotesk';src:url('assets/fonts/SpaceGrotesk-SemiBold.woff2') format('woff2');font-weight:600}@import url('https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600&display=swap');:root{--yellow:#ffd600}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101815;color:#fff;font-family:'Space Grotesk',Arial,sans-serif}.app{position:relative;width:100vw;height:100dvh;overflow:hidden}.map{position:absolute;inset:0}.veil{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(10,18,14,.68),rgba(10,18,14,.05) 34%,rgba(10,18,14,.28) 100%);pointer-events:none;z-index:500}.top{position:absolute;top:20px;left:18px;right:18px;z-index:700;display:flex;align-items:flex-start}.brand{display:flex;align-items:center;color:#fff;font:600 38px/1 Oxanium,sans-serif;letter-spacing:.015em;text-shadow:0 1px 8px rgba(0,0,0,.24)}.brand .aim-icon{height:28px;width:auto;margin:0 1px;transform:translateY(-2px)}.hole{margin-top:6px;font:500 14px/1.15 'Space Grotesk',sans-serif;color:rgba(255,255,255,.82);letter-spacing:.01em}.bottom{position:absolute;left:16px;right:16px;bottom:18px;z-index:700;display:flex;gap:10px}.btn{flex:1;height:58px;border:1px solid rgba(255,255,255,.28);border-radius:15px;background:rgba(12,20,17,.72);color:#fff;font:600 18px 'Space Grotesk',sans-serif}.btn.primary{background:rgba(255,255,255,.60);color:#fff}.fmb{position:absolute;left:16px;right:16px;bottom:91px;z-index:700;display:flex;gap:7px}.yard{flex:1;text-align:center;padding:9px 4px;border-radius:12px;background:rgba(12,20,17,.68);backdrop-filter:blur(8px);font-size:10px;color:rgba(255,255,255,.7)}.yard b{display:block;color:#fff;font-size:15px;margin-top:2px}.gps{position:absolute;top:88px;left:18px;z-index:700;padding:8px 10px;border-radius:10px;background:rgba(12,20,17,.7);font-size:10px}.leaflet-control-attribution{font-size:8px}</style></head><body><main class="app"><div id="map" class="map"></div><div class="veil"></div><div class="top"><div><div class="brand"><span>U</span><img class="aim-icon" src="assets/smartaim-i-tight.png" alt=""><span>Do</span></div><div class="hole">Overstone Park · Hole 1 · Par 4</div></div></div><div id="gps" class="gps">Acquiring GPS…</div><div class="fmb"><div class="yard">FRONT<b id="front">—</b></div><div class="yard">MIDDLE<b id="mid">374 yd</b></div><div class="yard">BACK<b id="back">—</b></div></div><div class="bottom"><button class="btn" onclick="history.back()">Back</button><button class="btn primary" onclick="checkWind()">Check Wind</button></div></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const C={lat:52.27789,lon:-0.81722},G={front:[52.2776675,-0.8151979],middle:[52.2777593548,-0.8150508742],back:[52.2778714,-0.8149234]};let map,marker,ring;function yd(a,b){const R=6371000,p=Math.PI/180,d1=(b[0]-a[0])*p,d2=(b[1]-a[1])*p,x=Math.sin(d1/2)**2+Math.cos(a[0]*p)*Math.cos(b[0]*p)*Math.sin(d2/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))*1.0936133}function init(){map=L.map('map',{zoomControl:false}).setView([C.lat,C.lon],18);L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:20,attribution:'Tiles © Esri'}).addTo(map);Object.entries(G).forEach(([k,p])=>L.circleMarker(p,{radius:k==='middle'?7:5,color:'#fff',weight:2,fillColor:'#075b3d',fillOpacity:.95}).addTo(map));L.circleMarker([52.27775,-0.81499],{radius:6,color:'#fff',weight:2,fillColor:'#d33',fillOpacity:1}).addTo(map);if(navigator.geolocation)navigator.geolocation.watchPosition(gps,()=>{document.getElementById('gps').textContent='GPS unavailable'},{enableHighAccuracy:true,maximumAge:0});else document.getElementById('gps').textContent='GPS unavailable'}function gps(x){const a=x.coords.accuracy;document.getElementById('gps').textContent='GPS · '+Math.round(a)+'m';const pos=[x.coords.latitude,x.coords.longitude];if(!marker){marker=L.marker(pos).addTo(map);ring=L.circle(pos,{radius:a,color:'#1877f2',weight:1,fillOpacity:.08}).addTo(map);map.setView(pos,18)}else{marker.setLatLng(pos);ring.setLatLng(pos).setRadius(a)}const p=[x.coords.latitude,x.coords.longitude];document.getElementById('front').textContent=Math.round(yd(p,G.front))+' yd';document.getElementById('mid').textContent=Math.round(yd(p,G.middle))+' yd';document.getElementById('back').textContent=Math.round(yd(p,G.back))+' yd'}function checkWind(){window.location.href='index.html#wind'}init();</script></body></html>
