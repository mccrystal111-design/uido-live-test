<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#F4F1E6">
  <title>UiDo — Lie</title>
  <link rel="stylesheet" href="lie-tile.css">
  <script src="lie-tile.js" defer></script>
</head>
<body>
  <main class="lie-app" data-lie-tile>
    <section class="lie-stage" aria-label="Choose your lie">
      <div class="lie-circle" data-lie-surface>
        <img class="lie-photo" data-lie-photo src="assets/teebox.png" alt="">
        <div class="photo-shade" aria-hidden="true"></div>
        <h1 class="lie-label" data-lie-label>TEE BOX</h1>
        <p class="swipe-hint">SWIPE TO CHANGE LIE</p>
        <button class="confirm" type="button" data-action="confirm" aria-label="Confirm lie">
          <img src="assets/uido-check-white.svg" alt="">
        </button>
      </div>
    </section>
    <output class="lie-status" data-status aria-live="polite">Tee box selected</output>
    <section class="result" data-result hidden aria-live="polite">
      <div class="result-main">LIE CONFIRMED</div>
      <p class="result-sub" data-result-sub>Lie confirmed.</p>
      <button class="result-close" type="button" data-action="close-result">Continue</button>
    </section>
  </main>
</body>
</html>
