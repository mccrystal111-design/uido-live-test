<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>UiDo — Lie Tile</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600&display=swap');
:root{--yellow:#ffd600;--green:#2d8b57;--red:#6b2830}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#183b27}
body{font-family:Oxanium,sans-serif;color:#fff}
.stage{width:100vw;height:100dvh;display:grid;place-items:center;padding:22px;background:linear-gradient(rgba(18,28,24,.56),rgba(18,28,24,.56)),url('assets/home-exact.jpg') center/cover no-repeat}
.tile{position:relative;width:min(88vw,520px);aspect-ratio:1;border:1px solid rgba(255,255,255,.24);border-radius:28px;background:rgba(18,31,27,.62);backdrop-filter:blur(10px) saturate(110%);-webkit-backdrop-filter:blur(10px) saturate(110%);overflow:hidden}
.help{position:absolute;right:5.5%;top:5.5%;width:10%;aspect-ratio:1;border:1.5px solid rgba(255,214,0,.78);border-radius:50%;background:rgba(18,31,27,.38);color:#fff;cursor:pointer;z-index:8;display:grid;place-items:center;padding:0}
.help img{width:62%;height:62%;display:block;object-fit:contain}
.lie-circle{position:absolute;left:50%;top:50%;width:96%;height:96%;transform:translate(-50%,-50%);border-radius:50%;overflow:hidden;z-index:1;background:#34463d;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.lie-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 55%;display:block}
.photo-shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(8,15,12,.04) 0%,rgba(8,15,12,.01) 48%,rgba(8,15,12,.10) 68%,rgba(8,15,12,.20) 100%)}
.lie-label{position:absolute;left:50%;top:20%;transform:translate(-50%,-50%);font-size:clamp(25px,6.5vw,42px);font-weight:600;letter-spacing:.04em;text-shadow:0 2px 10px rgba(0,0,0,.55);white-space:nowrap;z-index:3}
.answer-row{position:absolute;left:0;right:0;bottom:0;height:27%;display:grid;grid-template-columns:1fr 1fr;z-index:4}
.answer{border:0;color:#fff;font:600 clamp(22px,5.8vw,36px) Oxanium;cursor:pointer;touch-action:manipulation;display:grid;place-items:center;padding:0}
.answer.yes{background:#2d8b57}
.answer.no{background:#6b2830}
.answer:active{filter:brightness(1.18)}
.countdown{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(8,16,13,.72);backdrop-filter:blur(3px);z-index:12}
.countdown.show{display:flex}
.count-number{font:600 110px/1 Oxanium;color:#fff;text-shadow:0 0 28px rgba(255,214,0,.32)}
.next-advice{margin-top:20px;text-align:center}
.next-label{font:500 14px/1 Oxanium;color:rgba(255,255,255,.58);letter-spacing:.12em;margin-bottom:7px}
.next-value{font:500 clamp(18px,4.8vw,28px)/1.1 Oxanium;color:#fff}
.next-value strong{color:var(--yellow);font-weight:600}
.correction{position:absolute;inset:0;background:rgba(8,16,13,.94);z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;padding:8%}
.correction.show{display:flex}
.correction-title{font-size:clamp(18px,4.5vw,26px);color:rgba(255,255,255,.65);margin-bottom:7%}
.correction-circle{position:relative;width:58%;aspect-ratio:1;border-radius:50%;overflow:hidden;border:1px solid rgba(255,255,255,.18);margin-bottom:6%}
.correction-circle img{width:100%;height:100%;object-fit:cover;display:block}
.correction-label{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:clamp(19px,5vw,30px);font-weight:600;white-space:nowrap;text-shadow:0 2px 10px rgba(0,0,0,.7)}
.correction-controls{width:100%;display:grid;grid-template-columns:58px 1fr 58px;gap:10px;align-items:center}
.cycle{width:58px;height:58px;border-radius:50%;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);color:#fff;font:500 28px Oxanium;cursor:pointer}
.confirm{width:100%;height:58px;border:0;border-radius:18px;background:var(--green);color:#fff;font:600 20px Oxanium;cursor:pointer}
.modal{position:absolute;inset:0;background:rgba(8,16,13,.72);backdrop-filter:blur(4px);display:none;place-items:center;padding:9%;z-index:15}
.modal.show{display:grid}
.modal-card{width:100%;max-width:360px;border:1px solid rgba(255,255,255,.24);border-radius:20px;background:rgba(25,39,34,.94);padding:24px;color:#fff;text-align:center}
.modal-card h2{margin:0 0 12px;font-size:24px;font-weight:500}
.modal-card p{margin:0 0 20px;font:400 15px/1.45 Arial,sans-serif;color:rgba(255,255,255,.8)}
.close{border:1px solid rgba(255,255,255,.24);border-radius:15px;background:rgba(255,255,255,.1);color:#fff;padding:12px 22px;font:500 16px Oxanium;cursor:pointer}
.result{position:absolute;inset:0;background:rgba(8,16,13,.94);z-index:11;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12%}
.result.show{display:flex}
.result-main{font-size:clamp(28px,7vw,46px);font-weight:600;margin-bottom:12px}
.result-sub{font-size:15px;color:rgba(255,255,255,.62);line-height:1.45}
@media(max-width:420px){.tile{width:91vw;border-radius:24px}}
</style>
</head>
<body>
<main class="stage">
<section class="tile" aria-label="UiDo Lie Tile">
<button class="help" id="help"><img src="assets/uido-question-mark-white.svg?v=1" alt="Help"></button>
<div class="lie-circle">
<img class="lie-photo" id="liePhoto" src="assets/Fairway.png" alt="">
<div class="photo-shade"></div>
<div class="lie-label" id="lieLabel">FAIRWAY</div>
<div class="answer-row">
<button class="answer yes" id="yes">YES</button>
<button class="answer no" id="no">NO</button>
</div>
</div>
<div class="countdown" id="countdown"><div class="count-number" id="countNumber">3</div><div class="next-advice"><div class="next-label">NEXT</div><div class="next-value"><strong>LIE</strong> · CONFIRM</div></div></div>
<div class="correction" id="correction">
<div class="correction-title">WHAT IS THE LIE?</div>
<div class="correction-circle"><img id="correctionPhoto" src="assets/Fairway.png" alt=""><div class="correction-label" id="correctionLabel">FAIRWAY</div></div>
<div class="correction-controls"><button class="cycle" id="prev" aria-label="Previous lie">‹</button><button class="confirm" id="confirm">CONFIRM LIE</button><button class="cycle" id="next" aria-label="Next lie">›</button></div>
</div>
<div class="result" id="result"><div class="result-main" id="resultMain">START LINE</div><div class="result-sub" id="resultSub">Lie confirmed. UiDo prediction and player confirmation recorded.</div></div>
<div class="modal" id="modal"><div class="modal-card"><h2>Lie</h2><p>UiDo predicts the lie from the available course and location data. Tap YES to confirm it. Tap NO if the prediction is wrong, then select the correct lie.</p><button class="close" id="close">Got it</button></div></div>
</section>
</main>
<script>
const lies=[
 {label:'FAIRWAY',file:'assets/Fairway.png'},
 {label:'SEMI ROUGH',file:'assets/Semi-rough.png'},
 {label:'DEEP ROUGH',file:'assets/Deep Rough.png'},
 {label:'BUNKER',file:'assets/Bunker.png'},
 {label:'BARE / OTHER',file:'assets/Bare-Lie.png'},
 {label:'OBSTRUCTED',file:'assets/Obstructed.png'}
];
let selected=0;
let prediction='FAIRWAY';
let confirmed=null;
const photo=document.getElementById('liePhoto');
const label=document.getElementById('lieLabel');
const correction=document.getElementById('correction');
const correctionPhoto=document.getElementById('correctionPhoto');
const correctionLabel=document.getElementById('correctionLabel');
const countdown=document.getElementById('countdown');
const countNumber=document.getElementById('countNumber');
const result=document.getElementById('result');
const resultMain=document.getElementById('resultMain');
const resultSub=document.getElementById('resultSub');
const modal=document.getElementById('modal');
function renderLie(){const lie=lies[selected];photo.src=lie.file;label.textContent=lie.label;correctionPhoto.src=lie.file;correctionLabel.textContent=lie.label}
function showCountdown(){let n=3;countNumber.textContent=n;countdown.classList.add('show');const t=setInterval(()=>{n--;if(n>0){countNumber.textContent=n}else{clearInterval(t);countdown.classList.remove('show')}},1000)}
function finish(value){confirmed=value;resultMain.textContent='START LINE';resultSub.textContent=value===prediction?'Lie confirmed. UiDo prediction accepted.':'Lie corrected to '+value+'. UiDo prediction was '+prediction+'.';result.classList.add('show')}
document.getElementById('yes').onclick=()=>finish(prediction);
document.getElementById('no').onclick=()=>{selected=0;renderLie();correction.classList.add('show')};
document.getElementById('prev').onclick=()=>{selected=(selected-1+lies.length)%lies.length;renderLie()};
document.getElementById('next').onclick=()=>{selected=(selected+1)%lies.length;renderLie()};
document.getElementById('confirm').onclick=()=>finish(lies[selected].label);
document.getElementById('help').onclick=e=>{e.stopPropagation();modal.classList.add('show')};
document.getElementById('close').onclick=()=>modal.classList.remove('show');
renderLie();
showCountdown();
</script>
</body>
</html>
