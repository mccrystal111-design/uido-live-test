<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>UiDo — Yardage Tile</title><style>@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap');:root{--forest:#173F2A;--deep:#10251B;--ivory:#F5F1E8;--sage:#AAB8A5;--bronze:#A88A5A}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--deep)}body{font-family:Montserrat,Arial,sans-serif;color:var(--forest)}.stage{width:100vw;height:100dvh;display:grid;place-items:center;padding:22px;background:var(--deep)}.tile{position:relative;width:min(88vw,520px);aspect-ratio:1;border:1px solid rgba(245,241,232,.24);border-radius:28px;background:var(--ivory);overflow:hidden}.circle{position:absolute;left:50%;top:50%;width:96%;height:96%;transform:translate(-50%,-50%);border-radius:50%;overflow:hidden;background:var(--ivory);box-shadow:inset 0 0 0 1px rgba(23,63,42,.16)}.circle:after{content:"";position:absolute;inset:2.5%;border:1px solid rgba(23,63,42,.28);border-radius:50%;pointer-events:none}.yardage-icon{position:absolute;left:50%;top:3.2%;transform:translateX(-50%);width:13%;max-width:58px;aspect-ratio:1;z-index:5;display:grid;place-items:center}.yardage-icon img{width:100%;height:100%;object-fit:contain}.smartaim{position:absolute;left:15.5%;top:50%;transform:translateY(-50%);width:8.5%;max-width:44px;aspect-ratio:1;z-index:7;display:grid;place-items:center}.smartaim img{width:100%;height:100%;object-fit:contain}.golfball{position:absolute;right:10.5%;top:50%;transform:translateY(-50%);width:17%;max-width:88px;aspect-ratio:1;z-index:7;display:grid;place-items:center}.golfball svg{width:100%;height:100%;display:block}.help{position:absolute;right:5.5%;top:5.5%;width:10%;aspect-ratio:1;border:1.5px solid rgba(23,63,42,.55);border-radius:50%;background:var(--ivory);cursor:pointer;z-index:8;display:grid;place-items:center;padding:0;touch-action:none}.help img{width:68%;height:68%;object-fit:contain;filter:brightness(0) saturate(100%) invert(21%) sepia(18%) saturate(1042%) hue-rotate(95deg) brightness(89%) contrast(91%)}.hole{position:absolute;left:12%;right:12%;top:15.5%;text-align:center;font-size:clamp(14px,3.6vw,20px);letter-spacing:.03em;color:var(--forest);z-index:4}.yardages{position:absolute;left:12%;right:12%;top:27%;bottom:12%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:4px}.yardage{width:100%;line-height:1}.yardage .label{font-size:clamp(12px,3vw,16px);letter-spacing:.12em;color:rgba(23,63,42,.58);margin-bottom:2px}.yardage .number{font-size:clamp(48px,12.5vw,72px);font-weight:600;letter-spacing:.01em;color:var(--forest)}.modal{position:absolute;inset:0;background:rgba(245,241,232,.94);backdrop-filter:blur(4px);display:none;place-items:center;padding:9%;z-index:15}.modal.show{display:grid}.modal-card{width:100%;max-width:360px;border:1px solid rgba(23,63,42,.28);border-radius:20px;background:var(--ivory);padding:24px;text-align:center}.modal-card h2{margin:0 0 12px;font-size:24px;font-weight:600;color:var(--forest)}.modal-card p{margin:0 0 20px;font:500 15px/1.45 Montserrat,Arial,sans-serif;color:rgba(23,63,42,.72)}.close{border:1px solid rgba(23,63,42,.24);border-radius:15px;background:var(--forest);color:var(--ivory);padding:12px 22px;font:600 16px Montserrat,Arial,sans-serif;cursor:pointer}@media(max-width:420px){.tile{width:91vw;border-radius:24px}.yardage-icon{top:3.2%;width:14%;max-width:52px}.smartaim{left:15.5%;width:8.5%;max-width:40px}.golfball{right:9.5%;width:17%;max-width:80px}.hole{top:16.5%;font-size:14px}.yardages{top:28%;bottom:11%;gap:2px}.yardage .number{font-size:clamp(46px,13.5vw,66px)}} </style></head><body><main class="stage"><section class="tile" aria-label="UiDo Yardage Tile"><div class="circle"><div class="smartaim"><img src="assets/smartaim-i-tight.png" alt="UiDo Smart Aim"></div><div class="golfball" aria-label="UiDo Golf Ball"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img"><circle cx="512" cy="512" r="300" fill="#F5F1E8" stroke="#173F2A" stroke-width="16"/><g fill="#173F2A"><ellipse cx="300" cy="355" rx="25" ry="16" transform="rotate(-28 300 355)"/><ellipse cx="350" cy="325" rx="23" ry="15" transform="rotate(-18 350 325)"/><ellipse cx="405" cy="305" rx="21" ry="14"/><ellipse cx="465" cy="292" rx="19" ry="13"/><ellipse cx="525" cy="288" rx="18" ry="12"/><ellipse cx="580" cy="294" rx="17" ry="11"/><ellipse cx="635" cy="310" rx="15" ry="10"/><ellipse cx="275" cy="410" rx="28" ry="18" transform="rotate(-30 275 410)"/><ellipse cx="330" cy="390" rx="26" ry="17"/><ellipse cx="390" cy="372" rx="23" ry="16"/><ellipse cx="450" cy="360" rx="21" ry="14"/><ellipse cx="510" cy="355" rx="19" ry="13"/><ellipse cx="568" cy="360" rx="17" ry="12"/><ellipse cx="625" cy="372" rx="15" ry="10"/><ellipse cx="255" cy="470" rx="30" ry="20"/><ellipse cx="315" cy="455" rx="28" ry="19"/><ellipse cx="380" cy="445" rx="25" ry="17"/><ellipse cx="445" cy="440" rx="22" ry="15"/><ellipse cx="505" cy="438" rx="20" ry="13"/><ellipse cx="565" cy="445" rx="18" ry="12"/><ellipse cx="625" cy="458" rx="15" ry="10"/><ellipse cx="250" cy="535" rx="31" ry="21"/><ellipse cx="310" cy="525" rx="29" ry="19"/><ellipse cx="375" cy="520" rx="25" ry="17"/><ellipse cx="440" cy="518" rx="22" ry="15"/><ellipse cx="500" cy="520" rx="19" ry="13"/><ellipse cx="560" cy="528" rx="17" ry="11"/><ellipse cx="620" cy="542" rx="14" ry="9"/><ellipse cx="265" cy="600" rx="29" ry="20"/><ellipse cx="325" cy="595" rx="27" ry="18"/><ellipse cx="390" cy="596" rx="24" ry="16"/><ellipse cx="450" cy="600" rx="21" ry="14"/><ellipse cx="510" cy="607" rx="18" ry="12"/><ellipse cx="568" cy="618" rx="15" ry="10"/><ellipse cx="625" cy="632" rx="12" ry="8"/><ellipse cx="300" cy="660" rx="25" ry="17"/><ellipse cx="355" cy="665" rx="23" ry="15"/><ellipse cx="415" cy="670" rx="20" ry="13"/><ellipse cx="475" cy="678" rx="17" ry="11"/><ellipse cx="535" cy="687" rx="14" ry="9"/><ellipse cx="590" cy="695" rx="11" ry="7"/><g opacity=".72"><ellipse cx="650" cy="400" rx="11" ry="7"/><ellipse cx="675" cy="475" rx="10" ry="6"/><ellipse cx="680" cy="550" rx="9" ry="6"/><ellipse cx="665" cy="620" rx="8" ry="5"/></g><g opacity=".48"><ellipse cx="710" cy="430" rx="8" ry="5"/><ellipse cx="720" cy="500" rx="7" ry="5"/><ellipse cx="720" cy="570" rx="6" ry="4"/><ellipse cx="700" cy="640" rx="6" ry="4"/></g><g opacity=".28"><ellipse cx="755" cy="470" rx="5" ry="3"/><ellipse cx="760" cy="530" rx="5" ry="3"/><ellipse cx="750" cy="590" rx="4" ry="3"/><ellipse cx="720" cy="675" rx="4" ry="3"/></g><g opacity=".14"><circle cx="790" cy="505" r="3"/><circle cx="792" cy="555" r="3"/><circle cx="780" cy="610" r="3"/><circle cx="750" cy="665" r="3"/></g></g></svg></div><div class="yardage-icon"><img src="assets/uido-yardage.svg" alt="Yardage"></div><div class="hole" id="holeDetail">Hole 1 - Par 4 (4)</div><div class="yardages"><div class="yardage"><div class="label">BACK</div><div class="number" id="back">412</div></div><div class="yardage"><div class="label">MIDDLE</div><div class="number" id="middle">394</div></div><div class="yardage"><div class="label">FRONT</div><div class="number" id="front">376</div></div></div></div><button class="help" id="help" aria-label="Yardage information"><img src="assets/uido-question-mark-white.svg" alt="Help"></button><div class="modal" id="modal"><div class="modal-card"><h2>Yardage</h2><p>UiDo uses GPS and course data to show the back, middle and front yardages for the hole you are playing.</p><button class="close" id="close">Got it</button></div></div></section></main><script>const holes=[{par:4,back:412,middle:394,front:376},{par:3,back:171,middle:157,front:143},{par:5,back:505,middle:486,front:467},{par:3,back:154,middle:141,front:128},{par:4,back:390,middle:374,front:358},{par:4,back:365,middle:349,front:333},{par:4,back:431,middle:414,front:397},{par:4,back:362,middle:347,front:332},{par:5,back:495,middle:477,front:459},{par:4,back:389,middle:373,front:357},{par:5,back:512,middle:494,front:476},{par:4,back:407,middle:391,front:375},{par:3,back:178,middle:164,front:150},{par:4,back:386,middle:370,front:354},{par:4,back:421,middle:404,front:387},{par:4,back:398,middle:382,front:366},{par:3,back:184,middle:169,front:154},{par:5,back:516,middle:497,front:478}];let hole=1;const handicap=4;const si=[10,14,4,8,18,12,2,6,16,7,1,13,15,9,3,17,5,11];function shots(h){return si[h-1]<=handicap?1:0}function render(){const d=holes[hole-1],netPar=d.par-shots(hole);document.getElementById('holeDetail').textContent=`Hole ${hole} - Par ${d.par} (${netPar})`;document.getElementById('back').textContent=d.back;document.getElementById('middle').textContent=d.middle;document.getElementById('front').textContent=d.front}const help=document.getElementById('help'),modal=document.getElementById('modal');help.onclick=()=>modal.classList.add('show');document.getElementById('close').onclick=()=>modal.classList.remove('show');let pressTimer=null;help.addEventListener('pointerdown',()=>{clearTimeout(pressTimer);pressTimer=setTimeout(()=>modal.classList.add('show'),650)});['pointerup','pointerleave','pointercancel'].forEach(e=>help.addEventListener(e,()=>clearTimeout(pressTimer)));render();</script></body></html>
