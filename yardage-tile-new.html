<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>UiDo — Yardage Tile — New Aesthetic</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap');
:root{--forest:#173F2A;--deep:#10251B;--ivory:#F5F1E8;--stone:#E5DED0;--sage:#AAB8A5;--bronze:#A88A5A;--ink:#173F2A;--muted:#66746B;--panel:#EFE9DD;--line:rgba(23,63,42,.18)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Montserrat,Arial,sans-serif;background:var(--ivory);color:var(--ink)}
.stage{width:100vw;height:100dvh;display:grid;place-items:center;padding:20px;background:var(--ivory)}
.tile{position:relative;width:min(92vw,520px);aspect-ratio:1;border:1px solid var(--line);border-radius:28px;background:var(--ivory);box-shadow:0 16px 45px rgba(16,37,27,.10);overflow:hidden}
.tile:before{content:"";position:absolute;inset:14px;border:1px solid rgba(168,138,90,.48);border-radius:22px;pointer-events:none}
.top{position:absolute;left:0;right:0;top:22px;display:flex;flex-direction:column;align-items:center;z-index:3}
.icon-button{width:64px;height:64px;border-radius:50%;border:1px solid rgba(168,138,90,.72);background:var(--ivory);display:grid;place-items:center;cursor:pointer;padding:9px;transition:transform .12s,background .12s}
.icon-button:hover{background:var(--stone)}.icon-button:active{transform:scale(.95)}.icon-button img{width:100%;height:100%;object-fit:contain}
.title{margin-top:7px;font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--forest)}
.hole{margin-top:6px;font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--muted)}
.content{position:absolute;left:34px;right:34px;top:138px;bottom:32px;display:flex;flex-direction:column;align-items:center;text-align:center}
.hero-label{font-size:10px;font-weight:700;letter-spacing:.22em;color:var(--muted);text-transform:uppercase;margin-top:2px}.hero{display:flex;align-items:baseline;gap:7px;margin-top:4px;color:var(--forest)}.hero-number{font-size:clamp(76px,19vw,104px);line-height:.92;font-weight:600;letter-spacing:-.045em}.hero-unit{font-size:14px;font-weight:700;letter-spacing:.14em}.pin{margin-top:7px;font-size:11px;font-weight:600;letter-spacing:.10em;color:var(--bronze);text-transform:uppercase}
.divider{width:100%;height:1px;background:var(--line);margin:20px 0 16px}.distances{width:100%;display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end}.distance{min-width:0}.distance+.distance{border-left:1px solid var(--line)}.distance-label{font-size:9px;font-weight:700;letter-spacing:.16em;color:var(--muted);margin-bottom:5px}.distance-value{font-size:26px;font-weight:600;line-height:1;color:var(--forest)}.distance.middle .distance-value{font-size:32px}.distance.middle .distance-label{color:var(--bronze)}
.support{display:flex;gap:8px;margin-top:auto;font-size:9px;font-weight:600;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}.support span{padding:6px 9px;border:1px solid var(--line);border-radius:999px;background:rgba(229,222,208,.42)}
.nav{position:absolute;inset:0;display:none;z-index:20;background:rgba(245,241,232,.97);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}.nav.show{display:block}.nav-head{position:absolute;top:28px;left:0;right:0;text-align:center}.nav-title{font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase}.nav-sub{margin-top:6px;font-size:9px;letter-spacing:.10em;color:var(--muted)}.nav-close{position:absolute;right:25px;top:24px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--forest);font-size:22px;cursor:pointer}.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:112px;height:112px;border-radius:50%;border:1px solid rgba(168,138,90,.75);background:var(--ivory);display:grid;place-items:center}.hub img{width:58px;height:58px}.hub-label{position:absolute;top:calc(50% + 68px);left:50%;transform:translateX(-50%);font-size:10px;font-weight:700;letter-spacing:.18em;color:var(--forest);white-space:nowrap}.nav-item{position:absolute;width:72px;height:72px;border-radius:50%;border:1px solid var(--line);background:rgba(229,222,208,.38);color:var(--muted);font:600 9px Montserrat,Arial,sans-serif;letter-spacing:.10em;text-transform:uppercase;cursor:pointer}.nav-item.active{border-color:var(--bronze);background:var(--forest);color:var(--ivory)}.nav-item[data-slot="gps"]{left:50%;top:23%;transform:translateX(-50%)}.nav-item[data-slot="wind"]{left:19%;top:39%}.nav-item[data-slot="lie"]{left:25%;bottom:19%}.nav-item[data-slot="start"]{right:25%;bottom:19%}.nav-item[data-slot="shape"]{right:19%;top:39%}.nav-item[data-slot="strike"]{left:50%;bottom:9%;transform:translateX(-50%)}
.nav-item span{display:block}.slot-mark{width:25px;height:25px;margin:0 auto 4px;border:1px solid currentColor;border-radius:50%;opacity:.42}.active .slot-mark{opacity:.9}
.dark{--ivory:#10251B;--forest:#F5F1E8;--deep:#10251B;--stone:#173F2A;--sage:#AAB8A5;--bronze:#A88A5A;--ink:#F5F1E8;--muted:#AAB8A5;--panel:#173F2A;--line:rgba(245,241,232,.18)}
@media (prefers-color-scheme:dark){:root{--ivory:#10251B;--forest:#F5F1E8;--deep:#10251B;--stone:#173F2A;--sage:#AAB8A5;--bronze:#A88A5A;--ink:#F5F1E8;--muted:#AAB8A5;--panel:#173F2A;--line:rgba(245,241,232,.18)}.tile{background:var(--deep);box-shadow:0 16px 45px rgba(0,0,0,.25)}.icon-button{background:var(--deep)}.icon-button:hover{background:var(--forest)}.nav{background:rgba(16,37,27,.97)}}
@media(max-width:420px){.stage{padding:12px}.tile{width:94vw;border-radius:24px}.tile:before{inset:12px;border-radius:19px}.content{left:28px;right:28px;top:136px;bottom:27px}.hero-number{font-size:clamp(70px,20vw,92px)}.distance-value{font-size:23px}.distance.middle .distance-value{font-size:29px}}
</style>
</head>
<body>
<main class="stage">
<section class="tile" aria-label="UiDo Yardage Tile">
  <div class="top">
    <button class="icon-button" id="navOpen" aria-label="Open navigation"><img src="assets/uido-yardage.svg" alt="Yardage navigation"></button>
    <div class="title">Yardage</div>
    <div class="hole">HOLE 1 · PAR 4</div>
  </div>
  <div class="content">
    <div class="hero-label">MIDDLE</div>
    <div class="hero"><div class="hero-number">394</div><div class="hero-unit">YDS</div></div>
    <div class="pin">PIN · MIDDLE</div>
    <div class="divider"></div>
    <div class="distances">
      <div class="distance"><div class="distance-label">FRONT</div><div class="distance-value">376</div></div>
      <div class="distance middle"><div class="distance-label">MIDDLE</div><div class="distance-value">394</div></div>
      <div class="distance"><div class="distance-label">BACK</div><div class="distance-value">412</div></div>
    </div>
    <div class="support"><span>GPS</span><span>GREEN + PIN</span></div>
  </div>
</section>

<section class="nav" id="nav" aria-label="UiDo navigation">
  <div class="nav-head"><div class="nav-title">Navigation</div><div class="nav-sub">Choose a shot context</div></div>
  <button class="nav-close" id="navClose" aria-label="Close navigation">×</button>
  <div class="hub"><img src="assets/uido-yardage.svg" alt="Yardage"></div>
  <div class="hub-label">YARDAGE</div>
  <button class="nav-item" data-slot="gps"><span class="slot-mark"></span><span>GPS</span></button>
  <button class="nav-item active" data-slot="yardage"><span class="slot-mark"></span><span>Yardage</span></button>
  <button class="nav-item" data-slot="wind"><span class="slot-mark"></span><span>Wind</span></button>
  <button class="nav-item" data-slot="lie"><span class="slot-mark"></span><span>Lie</span></button>
  <button class="nav-item" data-slot="start"><span class="slot-mark"></span><span>Start</span></button>
  <button class="nav-item" data-slot="shape"><span class="slot-mark"></span><span>Shape</span></button>
  <button class="nav-item" data-slot="strike"><span class="slot-mark"></span><span>Strike</span></button>
</section>
</main>
<script>
const nav=document.getElementById('nav');
document.getElementById('navOpen').onclick=()=>nav.classList.add('show');
document.getElementById('navClose').onclick=()=>nav.classList.remove('show');
nav.addEventListener('click',e=>{if(e.target===nav)nav.classList.remove('show')});
</script>
</body>
</html>
