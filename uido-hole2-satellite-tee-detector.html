<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UiDo Hole 2 — Satellite Tee Detection Prototype</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body,#map{height:100%;margin:0}#map{background:#bbb}
.panel{position:absolute;z-index:9999;top:12px;left:12px;width:340px;max-height:calc(100% - 24px);overflow:auto;background:rgba(255,255,255,.96);padding:14px;border-radius:10px;font:13px/1.4 Arial;box-shadow:0 2px 14px #0004}
h3{margin:0 0 7px;font-size:16px}.small{font-size:12px;color:#555}.candidate{padding:8px 0;border-top:1px solid #ddd}.pill{display:inline-block;padding:2px 6px;border-radius:10px;background:#eee;font-weight:bold}
#run{border:0;border-radius:6px;padding:8px 11px;background:#173f2a;color:#fff;cursor:pointer;margin-top:8px}
</style></head><body>
<div id="map"></div>
<div class="panel"><h3>UiDo — Hole 2 Tee Detection</h3>
<div><b>Input:</b> known green F/M/B + Yellow API 154 yd + satellite</div>
<div class="small">Field-test tee GPS is NOT used by the extraction engine.</div>
<button id="run">Run satellite scan</button>
<div id="status" class="small" style="margin-top:8px">Ready.</div>
<div id="results"></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const F=[52.2762446,-0.8166103],M=[52.2761187565,-0.8166885565],B=[52.2759866,-0.8167443];
const YARDS=154,MIN=134,MAX=174;
const map=L.map('map').setView(M,18);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Esri World Imagery'}).addTo(map);
function bearing(a,b){const p=Math.PI/180,y1=a[0]*p,y2=b[0]*p,dl=(b[1]-a[1])*p;return (Math.atan2(Math.sin(dl)*Math.cos(y2),Math.cos(y1)*Math.sin(y2)-Math.sin(y1)*Math.cos(y2)*Math.cos(dl))*180/Math.PI+360)%360}
function dest(p,deg,yd){const R=6371000,d=yd*.9144,a=deg*Math.PI/180,lat=p[0]*Math.PI/180,lon=p[1]*Math.PI/180;const la=Math.asin(Math.sin(lat)*Math.cos(d/R)+Math.cos(lat)*Math.sin(d/R)*Math.cos(a));const lo=lon+Math.atan2(Math.sin(a)*Math.sin(d/R)*Math.cos(lat),Math.cos(d/R)-Math.sin(lat)*Math.sin(la));return [la*180/Math.PI,lo*180/Math.PI]}
const approach=bearing(M,F);
const pts=[dest(M,approach-48,MAX),dest(M,approach+48,MAX),dest(M,approach+48,MIN),dest(M,approach-48,MIN)];
L.polygon(pts,{color:'#fff',weight:2,fillColor:'#fff',fillOpacity:.07}).addTo(map);
L.polyline([M,dest(M,approach,200)],{color:'#fff',weight:2,dashArray:'7 7'}).addTo(map);
[[F,'F'],[M,'M'],[B,'B']].forEach(x=>L.circleMarker(x[0],{radius:5,color:'#fff',fillColor:'#173f2a',fillOpacity:1,weight:2}).bindTooltip(x[1],{permanent:true,direction:'center'}).addTo(map));

function tileXY(lat,lon,z){const n=2**z,x=(lon+180)/360*n,y=(1-Math.asinh(Math.tan(lat*Math.PI/180))/Math.PI)/2*n;return [x,y]}
function loadTile(x,y,z){return new Promise((res,rej)=>{const im=new Image();im.crossOrigin='anonymous';im.onload=()=>res(im);im.onerror=rej;im.src='https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/'+z+'/'+y+'/'+x})}
function sampleTile(im,px,py){const c=document.createElement('canvas');c.width=256;c.height=256;const g=c.getContext('2d',{willReadFrequently:true});g.drawImage(im,0,0);const d=g.getImageData(Math.max(0,px-8),Math.max(0,py-8),Math.min(17,256-Math.max(0,px-8)),Math.min(17,256-Math.max(0,py-8))).data;let sg=0,s=0,n=0,v=0,vals=[];for(let i=0;i<d.length;i+=4){const r=d[i],gr=d[i+1],b=d[i+2];if(r<245||gr<245||b<245){const green=gr-(r+b)/2;sg+=green;s+=Math.max(r,gr,b)-Math.min(r,gr,b);vals.push(green);n++}}if(!n)return null;const mean=sg/n;for(const q of vals)v+=(q-mean)**2;v/=n;return {green:mean,sat:s/n,texture:Math.sqrt(v)}}
async function scan(){
 document.getElementById('status').textContent='Loading satellite tiles and sampling candidate areas…';
 const z=19, seen=new Set(), out=[];
 // Candidate grid: 8m spacing across the broad M→F side envelope.
 for(let deg=-48;deg<=48;deg+=12){
  for(let yd=MIN;yd<=MAX;yd+=8){
   const p=dest(M,approach+deg,yd),[tx,ty]=tileXY(p[0],p[1],z),x=Math.floor(tx),y=Math.floor(ty),key=x+','+y;
   if(!seen.has(key)){seen.add(key);try{
    const im=await loadTile(x,y,z);const s=sampleTile(im,(tx-x)*256,(ty-y)*256);
    if(s)out.push({p,deg,yd,s});
   }catch(e){}
   }
  }
 }
 // Heuristic only: favour greener/smoother samples, then add geometric compactness later.
 out.sort((a,b)=>(b.s.green+b.s.sat*.35-b.s.texture*.15)-(a.s.green+a.s.sat*.35-a.s.texture*.15));
 const top=out.slice(0,6);
 top.forEach((c,i)=>{L.circleMarker(c.p,{radius:i===0?9:6,color:i===0?'#fff':'#8fd0ff',weight:2,fillColor:i===0?'#e7b45a':'#4f9bd1',fillOpacity:.9}).bindTooltip('Candidate '+(i+1),{permanent:true}).addTo(map)});
 document.getElementById('status').textContent='Scan complete. Candidates are heuristic image-analysis results, not verified tees.';
 document.getElementById('results').innerHTML=top.map((c,i)=>'<div class="candidate"><b>Candidate '+(i+1)+'</b> <span class="pill">'+(i===0?'TOP':'ALTERNATIVE')+'</span><br>Distance '+c.yd.toFixed(0)+' yd • bearing '+((approach+c.deg+360)%360).toFixed(1)+'°<br>Image signals: green '+c.s.green.toFixed(1)+' • saturation '+c.s.sat.toFixed(1)+' • texture '+c.s.texture.toFixed(1)+'</div>').join('');
}
document.getElementById('run').onclick=scan;
</script></body></html>
