<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>UiDo — Wind Tile</title><style>@import url('https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600&display=swap');:root{--yellow:#ffd600}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#183b27}body{font-family:Oxanium,sans-serif;color:#fff}.stage{width:100vw;height:100dvh;display:grid;place-items:center;padding:22px;background:var(--uido-green)}.tile{position:relative;width:min(88vw,520px);aspect-ratio:1;border:1px solid rgba(255,255,255,.24);border-radius:28px;background:rgba(18,31,27,.62);backdrop-filter:blur(10px) saturate(110%);-webkit-backdrop-filter:blur(10px) saturate(110%);overflow:hidden}.wind-map{position:absolute;left:50%;top:50%;width:96%;height:96%;transform:translate(-50%,-50%);z-index:1;pointer-events:none;opacity:.45}.arrow{position:absolute;width:clamp(25px,6.5vw,34px);height:clamp(31px,8vw,42px);background:url('assets/wind-arrow.svg?v=11') center/contain no-repeat;filter:drop-shadow(0 1px 2px rgba(0,0,0,.22));opacity:.95;z-index:3;cursor:pointer;pointer-events:auto;touch-action:manipulation}.a-n{left:50%;top:13.5%;transform:translate(-50%,-50%) rotate(0deg)}.a-ne{left:74.5%;top:25.5%;transform:translate(-50%,-50%) rotate(45deg)}.a-e{left:86.5%;top:50%;transform:translate(-50%,-50%) rotate(90deg)}.a-se{left:74.5%;top:74.5%;transform:translate(-50%,-50%) rotate(135deg)}.a-s{left:50%;top:86.5%;transform:translate(-50%,-50%) rotate(180deg)}.a-sw{left:25.5%;top:74.5%;transform:translate(-50%,-50%) rotate(225deg)}.a-w{left:13.5%;top:50%;transform:translate(-50%,-50%) rotate(270deg)}.a-nw{left:25.5%;top:25.5%;transform:translate(-50%,-50%) rotate(315deg)}.center{position:absolute;left:50%;top:50%;width:36%;aspect-ratio:1;transform:translate(-50%,-50%);border:1.5px solid rgba(255,214,0,.92);border-radius:50%;background:rgba(15,30,26,.9);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 0 20px rgba(255,214,0,.11),inset 0 0 20px rgba(255,214,0,.04);z-index:4;padding:3%}.wind-icon{color:var(--yellow);font-family:Arial,sans-serif;font-size:clamp(28px,7vw,48px);line-height:.8;margin-bottom:7%}.strength{font-size:clamp(40px,10vw,62px);font-weight:600;line-height:1.05}.club{font-size:clamp(15px,3.6vw,23px);font-weight:500;color:rgba(255,255,255,.68);line-height:1;margin-top:4%}.help{position:absolute;right:5.5%;top:5.5%;width:10%;aspect-ratio:1;border:1.5px solid rgba(255,214,0,.78);border-radius:50%;background:rgba(18,31,27,.38);color:#fff;font:500 clamp(17px,4.2vw,25px)/1 Oxanium;cursor:pointer;z-index:5;display:grid;place-items:center;padding:0}.help img{width:62%;height:62%;display:block;object-fit:contain}.modal{position:absolute;inset:0;background:rgba(8,16,13,.72);backdrop-filter:blur(4px);display:none;place-items:center;padding:9%;z-index:10}.modal.show{display:grid}.modal-card{width:100%;max-width:360px;border:1px solid rgba(255,255,255,.24);border-radius:20px;background:rgba(25,39,34,.94);padding:24px;color:#fff;text-align:center}.modal-card h2{margin:0 0 12px;font-size:24px;font-weight:500}.modal-card p{margin:0 0 20px;font:400 15px/1.45 Arial,sans-serif;color:rgba(255,255,255,.8)}.close{border:1px solid rgba(255,255,255,.24);border-radius:15px;background:rgba(255,255,255,.1);color:#fff;padding:12px 22px;font:500 16px Oxanium;cursor:pointer}@media(max-width:420px){.tile{width:91vw;border-radius:24px}.center{width:36%}}.embedded-wind,.embedded-wind body{background:transparent!important}.embedded-wind body{overflow:hidden!important}.embedded-wind .stage{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;padding:0!important;margin:0!important;background:transparent!important;place-items:center!important;display:grid!important;overflow:hidden!important}.embedded-wind .tile{position:relative!important;width:min(100%,calc(100vw - 8px))!important;height:min(100%,calc(100vw - 8px))!important;max-width:none!important;max-height:none!important;aspect-ratio:1!important;border:0!important;border-radius:24px!important;background:transparent!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;overflow:hidden!important}.embedded-wind .wind-map{opacity:1}.embedded-wind .help{display:none}

/* UiDo unified field-test skin */
:root{--uido-green:#183b27;--uido-panel:#14291f;--uido-panel-2:#1b3428;--uido-border:rgba(244,241,230,.24);--uido-ivory:#f4f1e6;--uido-yellow:#ffd600}
html,body{background:var(--uido-green);color:var(--uido-ivory)}
.stage{background:var(--uido-green)!important;padding:16px!important}
.tile{border:1px solid var(--uido-border)!important;border-radius:24px!important;background:var(--uido-panel)!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;box-shadow:none!important}
.help{border:1px solid rgba(255,214,0,.75)!important;background:var(--uido-panel-2)!important}
/* Keep radial controls and rollers intact; standardise their surrounding surface only. */
button,.btn,.option-button,.choice,.action{font-family:inherit}
</style></head><body><script>if(new URLSearchParams(location.search).get('embedded')==='1')document.documentElement.classList.add('embedded-wind');</script><main class="stage"><section class="tile" aria-label="UiDo Wind Tile"><button class="help" id="help"><img src="assets/uido-question-mark-white.svg?v=1" alt="Help"></button><img class="wind-map" src="assets/uido-wind-ring.svg?v=4" alt=""><span class="arrow a-n" data-section="Top" aria-label="Top"></span><span class="arrow a-ne" data-section="Top-right" aria-label="Top-right"></span><span class="arrow a-e" data-section="Right" aria-label="Right"></span><span class="arrow a-se" data-section="Bottom-right" aria-label="Bottom-right"></span><span class="arrow a-s" data-section="Bottom" aria-label="Bottom"></span><span class="arrow a-sw" data-section="Bottom-left" aria-label="Bottom-left"></span><span class="arrow a-w" data-section="Left" aria-label="Left"></span><span class="arrow a-nw" data-section="Top-left" aria-label="Top-left"></span><button class="center" id="strengthButton"><div class="wind-icon">≋</div><div class="strength" id="strength">1/2</div><div class="club">CLUB</div></button><div class="modal" id="modal"><div class="modal-card"><h2>Wind</h2><p>Select the direction the wind is travelling <strong>towards</strong> you. The arrows point into the centre. Tap the centre control to cycle the wind strength.</p><button class="close" id="close">Got it</button></div></div></section></main><script>const strengths=['1/2','1','2','3'];const lockedArrowAngles={'Top':0,'Top-right':315,'Right':90,'Bottom-right':135,'Bottom':180,'Bottom-left':225,'Left':270,'Top-left':45};let i=0;const strength=document.getElementById('strength'),modal=document.getElementById('modal');document.querySelectorAll('.arrow').forEach(a=>{const angle=lockedArrowAngles[a.dataset.section];a.style.setProperty('--locked-angle',angle+'deg')});document.getElementById('strengthButton').onclick=e=>{e.stopPropagation();i=(i+1)%strengths.length;strength.textContent=strengths[i]};function selectDirection(el){document.querySelectorAll('.arrow').forEach(x=>{x.removeAttribute('data-selected');x.style.filter='drop-shadow(0 1px 2px rgba(0,0,0,.22))'});el.setAttribute('data-selected','1');el.style.filter='drop-shadow(0 0 7px rgba(255,214,0,.8)')}document.querySelectorAll('.arrow').forEach(a=>a.addEventListener('click',e=>{e.stopPropagation();selectDirection(a)}));document.getElementById('help').onclick=e=>{e.stopPropagation();modal.classList.add('show')};document.getElementById('close').onclick=()=>modal.classList.remove('show');</script></body></html>
