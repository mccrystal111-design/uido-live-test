<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>UiDo — Wind Tile</title><style>@import url('https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600&display=swap');:root{--yellow:#ffd600}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#183b27}body{font-family:Oxanium,sans-serif;color:#fff}.stage{width:100vw;height:100dvh;display:grid;place-items:center;padding:22px;background:linear-gradient(rgba(18,28,24,.56),rgba(18,28,24,.56)),url('assets/home-exact.jpg') center/cover no-repeat}.tile{position:relative;width:min(88vw,520px);aspect-ratio:1;border:1px solid rgba(255,255,255,.24);border-radius:28px;background:rgba(18,31,27,.62);backdrop-filter:blur(10px) saturate(110%);-webkit-backdrop-filter:blur(10px) saturate(110%);overflow:hidden}.wind-map{position:absolute;left:50%;top:50%;width:96%;height:96%;transform:translate(-50%,-50%);z-index:1;pointer-events:none}.arrow{position:absolute;width:clamp(25px,6.5vw,34px);height:clamp(31px,8vw,42px);background:url('assets/wind-arrow.svg?v=11') center/contain no-repeat;filter:drop-shadow(0 1px 2px rgba(0,0,0,.22));opacity:.95;z-index:3;cursor:pointer;pointer-events:auto;touch-action:manipulation}.a-n{left:50%;top:11%;transform:translate(-50%,-50%) rotate(0deg)}.a-ne{left:76.5%;top:23.5%;transform:translate(-50%,-50%) rotate(45deg)}.a-e{left:89%;top:50%;transform:translate(-50%,-50%) rotate(90deg)}.a-se{left:76.5%;top:76.5%;transform:translate(-50%,-50%) rotate(135deg)}.a-s{left:50%;top:89%;transform:translate(-50%,-50%) rotate(180deg)}.a-sw{left:23.5%;top:76.5%;transform:translate(-50%,-50%) rotate(225deg)}.a-w{left:11%;top:50%;transform:translate(-50%,-50%) rotate(270deg)}.a-nw{left:23.5%;top:23.5%;transform:translate(-50%,-50%) rotate(315deg)}.center{position:absolute;left:50%;top:50%;width:36%;aspect-ratio:1;transform:translate(-50%,-50%);border:1.5px solid rgba(255,214,0,.92);border-radius:50%;background:rgba(15,30,26,.9);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 0 20px rgba(255,214,0,.11),inset 0 0 20px rgba(255,214,0,.04);z-index:4;padding:3%}.wind-icon{color:var(--yellow);font-family:Arial,sans-serif;font-size:clamp(28px,7vw,48px);line-height:.8;margin-bottom:7%}.strength{font-size:clamp(40px,10vw,62px);font-weight:600;line-height:1.05}.club{font-size:clamp(15px,3.6vw,23px);font-weight:500;color:rgba(255,255,255,.68);line-height:1;margin-top:4%}.help{position:absolute;right:5.5%;top:5.5%;width:10%;aspect-ratio:1;border:1.5px solid rgba(255,214,0,.78);border-radius:50%;background:rgba(18,31,27,.38);color:#fff;font:500 clamp(17px,4.2vw,25px)/1 Oxanium;cursor:pointer;z-index:5;display:grid;place-items:center;padding:0}.help img{width:62%;height:62%;display:block;object-fit:contain}.modal{position:absolute;inset:0;background:rgba(8,16,13,.72);backdrop-filter:blur(4px);display:none;place-items:center;padding:9%;z-index:10}.modal.show{display:grid}.modal-card{width:100%;max-width:360px;border:1px solid rgba(255,255,255,.24);border-radius:20px;background:rgba(25,39,34,.94);padding:24px;color:#fff;text-align:center}.modal-card h2{margin:0 0 12px;font-size:24px;font-weight:500}.modal-card p{margin:0 0 20px;font:400 15px/1.45 Arial,sans-serif;color:rgba(255,255,255,.8)}.close{border:1px solid rgba(255,255,255,.24);border-radius:15px;background:rgba(255,255,255,.1);color:#fff;padding:12px 22px;font:500 16px Oxanium;cursor:pointer}.countdown{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(8,16,13,.72);backdrop-filter:blur(3px);z-index:9}.countdown.show{display:flex}.count-number{font:600 110px/1 Oxanium;color:#fff;text-shadow:0 0 28px rgba(255,214,0,.32)}.next-advice{margin-top:20px;text-align:center}.next-label{font:500 14px/1 Oxanium;color:rgba(255,255,255,.58);letter-spacing:.12em;margin-bottom:7px}.next-value{font:500 clamp(18px,4.8vw,28px)/1.1 Oxanium;color:#fff}.next-value strong{color:var(--yellow);font-weight:600}@media(max-width:420px){.tile{width:91vw;border-radius:24px}.center{width:36%}}</style></head><body><main class="stage"><section class="tile" aria-label="UiDo Wind Tile"><button class="help" id="help"><img src="assets/uido-question-mark-white.svg?v=1" alt="Help"></button><img class="wind-map" src="assets/uido-wind-ring.svg?v=3" alt=""><span class="arrow a-n" data-section="Top" aria-label="Top"></span><span class="arrow a-ne" data-section="Top-right" aria-label="Top-right"></span><span class="arrow a-e" data-section="Right" aria-label="Right"></span><span class="arrow a-se" data-section="Bottom-right" aria-label="Bottom-right"></span><span class="arrow a-s" data-section="Bottom" aria-label="Bottom"></span><span class="arrow a-sw" data-section="Bottom-left" aria-label="Bottom-left"></span><span class="arrow a-w" data-section="Left" aria-label="Left"></span><span class="arrow a-nw" data-section="Top-left" aria-label="Top-left"></span><button class="center" id="strengthButton"><div class="wind-icon">≋</div><div class="strength" id="strength">1/2</div><div class="club">CLUB</div></button><div class="countdown" id="countdown"><div class="count-number" id="countNumber">3</div><div class="next-advice"><div class="next-label">NEXT</div><div class="next-value" id="nextValue"><strong>1/2 CLUB</strong> · INTO</div></div></div><div class="modal" id="modal"><div class="modal-card"><h2>Wind</h2><p>Select the direction the wind is travelling <strong>towards</strong> you. The arrows point into the centre. Tap the centre control to cycle the wind strength.</p><button class="close" id="close">Got it</button></div></div></section></main><script>const strengths=['1/2','1','2','3'];const sectionAdvice={'Top':'Into','Top-right':'Into Off Right','Right':'Off Right','Bottom-right':'Helping Off Right','Bottom':'Helping','Bottom-left':'Helping Off Left','Left':'Off Left','Top-left':'Into Off Left'};let i=0;const strength=document.getElementById('strength'),countdown=document.getElementById('countdown'),countNumber=document.getElementById('countNumber'),nextValue=document.getElementById('nextValue'),modal=document.getElementById('modal');function updateNext(section='Top'){nextValue.innerHTML='<strong>'+strengths[i]+' CLUB</strong> · '+sectionAdvice[section]}document.getElementById('strengthButton').onclick=e=>{e.stopPropagation();i=(i+1)%strengths.length;strength.textContent=strengths[i]};function selectDirection(el){document.querySelectorAll('.arrow').forEach(x=>x.style.filter='drop-shadow(0 1px 2px rgba(0,0,0,.22))');el.style.filter='drop-shadow(0 0 7px rgba(255,214,0,.8))';updateNext(el.dataset.section);let n=3;countNumber.textContent=n;countdown.classList.add('show');const t=setInterval(()=>{n--;if(n>0)countNumber.textContent=n;else{clearInterval(t);countdown.classList.remove('show');el.style.filter='drop-shadow(0 1px 2px rgba(0,0,0,.22))'}},1000)}document.querySelectorAll('.arrow').forEach(a=>a.addEventListener('click',e=>{e.stopPropagation();selectDirection(a)}));document.getElementById('help').onclick=e=>{e.stopPropagation();modal.classList.add('show')};document.getElementById('close').onclick=()=>modal.classList.remove('show');updateNext();</script></body></html>
