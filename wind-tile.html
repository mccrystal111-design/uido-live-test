<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>UiDo — Wind Tile</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600&display=swap');
:root{--yellow:#ffd600}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#183b27}body{font-family:Oxanium,sans-serif;color:#fff}
.stage{width:100vw;height:100dvh;display:grid;place-items:center;padding:22px;background:linear-gradient(rgba(18,28,24,.56),rgba(18,28,24,.56)),url('assets/home-exact.jpg') center/cover no-repeat}
.tile{position:relative;width:min(88vw,520px);aspect-ratio:1;border:1px solid rgba(255,255,255,.24);border-radius:28px;background:rgba(18,31,27,.62);backdrop-filter:blur(10px) saturate(110%);-webkit-backdrop-filter:blur(10px) saturate(110%);overflow:hidden}
.wind-map{position:absolute;inset:0;width:100%;height:100%;z-index:1}.sector{fill:rgba(255,255,255,.035);stroke:rgba(255,255,255,.20);stroke-width:1.25;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .18s ease,stroke .18s ease}.sector:hover{fill:rgba(255,255,255,.065)}.sector.selected{fill:rgba(255,214,0,.13);stroke:rgba(255,214,0,.55)}
.arrow{position:absolute;width:clamp(25px,6.5vw,34px);height:clamp(31px,8vw,42px);background:url('assets/wind-arrow.svg?v=7') center/contain no-repeat;filter:drop-shadow(0 1px 2px rgba(0,0,0,.22));opacity:.95;z-index:3;pointer-events:none}
/* The supplied SVG is a downward arrow. These rotations point every arrow inward toward the centre. */
.a-n{left:50%;top:10%;transform:translate(-50%,-50%) rotate(0deg)}
.a-ne{left:76%;top:24%;transform:translate(-50%,-50%) rotate(45deg)}
.a-e{left:89%;top:50%;transform:translate(-50%,-50%) rotate(270deg)}
.a-se{left:76%;top:76%;transform:translate(-50%,-50%) rotate(135deg)}
.a-s{left:50%;top:90%;transform:translate(-50%,-50%) rotate(180deg)}
.a-sw{left:24%;top:76%;transform:translate(-50%,-50%) rotate(225deg)}
.a-w{left:11%;top:50%;transform:translate(-50%,-50%) rotate(270deg)}
.a-nw{left:24%;top:24%;transform:translate(-50%,-50%) rotate(315deg)}
.center{position:absolute;left:50%;top:50%;width:36%;aspect-ratio:1;transform:translate(-50%,-50%);border:1.5px solid rgba(255,214,0,.92);border-radius:50%;background:rgba(15,30,26,.9);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 0 20px rgba(255,214,0,.11),inset 0 0 20px rgba(255,214,0,.04);z-index:4;padding:3%}.wind-icon{color:var(--yellow);font-family:Arial,sans-serif;font-size:clamp(28px,7vw,48px);line-height:.8;margin-bottom:3%}.into{font-size:clamp(18px,4.7vw,29px);font-weight:500;line-height:1}.strength{font-size:clamp(40px,10vw,62px);font-weight:600;line-height:1.05;margin-top:3%}.club{font-size:clamp(15px,3.6vw,23px);font-weight:500;color:rgba(255,255,255,.68);line-height:1;margin-top:2%}
.help{position:absolute;right:5.5%;top:5.5%;width:10%;aspect-ratio:1;border:1.5px solid rgba(255,214,0,.78);border-radius:50%;background:rgba(18,31,27,.38);color:#fff;font:500 clamp(17px,4.2vw,25px)/1 Oxanium;cursor:pointer;z-index:5}.modal{position:absolute;inset:0;background:rgba(8,16,13,.72);backdrop-filter:blur(4px);display:none;place-items:center;padding:9%;z-index:10}.modal.show{display:grid}.modal-card{width:100%;max-width:360px;border:1px solid rgba(255,255,255,.24);border-radius:20px;background:rgba(25,39,34,.94);padding:24px;color:#fff;text-align:center}.modal-card h2{margin:0 0 12px;font-size:24px;font-weight:500}.modal-card p{margin:0 0 20px;font:400 15px/1.45 Arial,sans-serif;color:rgba(255,255,255,.8)}.close{border:1px solid rgba(255,255,255,.24);border-radius:15px;background:rgba(255,255,255,.1);color:#fff;padding:12px 22px;font:500 16px Oxanium;cursor:pointer}.countdown{position:absolute;inset:0;display:none;place-items:center;background:rgba(8,16,13,.72);backdrop-filter:blur(3px);z-index:9}.countdown.show{display:grid}.count-number{font:600 110px/1 Oxanium;color:#fff;text-shadow:0 0 28px rgba(255,214,0,.32)}@media(max-width:420px){.tile{width:91vw;border-radius:24px}.center{width:36%}}
</style>
</head>
<body><main class="stage"><section class="tile" aria-label="UiDo Wind Tile">
<button class="help" id="help">?</button>
<svg class="wind-map" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
<path class="sector" data-direction="N" d="M50 50 L30.8 1.8 Q30 0 32 0 H68 Q70 0 69.2 1.8 Z"/><path class="sector" data-direction="NE" d="M50 50 L69.2 1.8 Q70 0 71.8 0 L98.2 28.2 Q100 30 98.2 30.8 Z"/><path class="sector" data-direction="E" d="M50 50 L98.2 30.8 Q100 30 100 32 V68 Q100 70 98.2 69.2 Z"/><path class="sector" data-direction="SE" d="M50 50 L98.2 69.2 Q100 70 98.2 71.8 L71.8 100 Q70 100 69.2 98.2 Z"/><path class="sector" data-direction="S" d="M50 50 L69.2 98.2 Q70 100 68 100 H32 Q30 100 30.8 98.2 Z"/><path class="sector" data-direction="SW" d="M50 50 L30.8 98.2 Q30 100 28.2 100 L1.8 71.8 Q0 70 1.8 69.2 Z"/><path class="sector" data-direction="W" d="M50 50 L1.8 69.2 Q0 70 0 68 V32 Q0 30 1.8 30.8 Z"/><path class="sector" data-direction="NW" d="M50 50 L1.8 30.8 Q0 30 1.8 28.2 L28.2 0 Q30 0 30.8 1.8 Z"/>
</svg>
<span class="arrow a-n"></span><span class="arrow a-ne"></span><span class="arrow a-e"></span><span class="arrow a-se"></span><span class="arrow a-s"></span><span class="arrow a-sw"></span><span class="arrow a-w"></span><span class="arrow a-nw"></span>
<button class="center" id="strengthButton"><div class="wind-icon">≋</div><div class="into">INTO</div><div class="strength" id="strength">1/2</div><div class="club">CLUB</div></button>
<div class="countdown" id="countdown"><div class="count-number" id="countNumber">3</div></div><div class="modal" id="modal"><div class="modal-card"><h2>Wind</h2><p>Select the direction the wind is travelling <strong>towards</strong> you. The arrows point into the centre. Tap the centre control to cycle the wind strength.</p><button class="close" id="close">Got it</button></div></div>
</section></main>
<script>const strengths=['1/2','1','2','3'];let i=0;const strength=document.getElementById('strength'),countdown=document.getElementById('countdown'),countNumber=document.getElementById('countNumber'),modal=document.getElementById('modal');document.getElementById('strengthButton').onclick=e=>{e.stopPropagation();i=(i+1)%strengths.length;strength.textContent=strengths[i]};document.querySelectorAll('.sector').forEach(b=>b.onclick=e=>{e.stopPropagation();document.querySelectorAll('.sector').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');let n=3;countNumber.textContent=n;countdown.classList.add('show');const t=setInterval(()=>{n--;if(n>0)countNumber.textContent=n;else{clearInterval(t);countdown.classList.remove('show')}},1000)});document.getElementById('help').onclick=e=>{e.stopPropagation();modal.classList.add('show')};document.getElementById('close').onclick=()=>modal.classList.remove('show');</script>
</body></html>
