<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>UiDo — Wind Tile v3</title><style>@import url('https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600&display=swap');:root{--yellow:#ffd600}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#183b27}body{font-family:Oxanium,sans-serif;color:#fff}.stage{width:100vw;height:100dvh;display:grid;place-items:center;padding:22px;background:linear-gradient(rgba(18,28,24,.56),rgba(18,28,24,.56)),url('assets/home-exact.jpg') center/cover no-repeat}.tile{position:relative;width:min(88vw,520px);aspect-ratio:1;border:1px solid rgba(255,255,255,.24);border-radius:28px;background:rgba(18,31,27,.62);backdrop-filter:blur(10px) saturate(110%);-webkit-backdrop-filter:blur(10px) saturate(110%);overflow:hidden}.radial{position:absolute;inset:7.5%;border-radius:50%}.sector{position:absolute;left:50%;top:50%;width:30%;height:44%;transform-origin:50% 100%;clip-path:polygon(23% 0,77% 0,100% 100%,0 100%);background:rgba(255,255,255,.035);border:1.5px solid rgba(255,255,255,.16);cursor:pointer;transition:background .18s ease,border-color .18s ease,box-shadow .18s ease}.sector.selected{background:rgba(255,214,0,.13);border-color:rgba(255,214,0,.5);box-shadow:0 0 18px rgba(255,214,0,.1)}.s1{transform:translate(-50%,-100%) rotate(0)}.s2{transform:translate(-50%,-100%) rotate(45deg)}.s3{transform:translate(-50%,-100%) rotate(90deg)}.s4{transform:translate(-50%,-100%) rotate(135deg)}.s5{transform:translate(-50%,-100%) rotate(180deg)}.s6{transform:translate(-50%,-100%) rotate(225deg)}.s7{transform:translate(-50%,-100%) rotate(270deg)}.s8{transform:translate(-50%,-100%) rotate(315deg)}.arrow{position:absolute;left:50%;top:9%;width:27px;height:34px;transform:translateX(-50%);background:url('assets/wind-arrow.svg') center/contain no-repeat;filter:drop-shadow(0 1px 2px rgba(0,0,0,.22));opacity:.95}.center{position:absolute;left:50%;top:50%;width:36%;aspect-ratio:1;transform:translate(-50%,-50%);border:1.5px solid rgba(255,214,0,.92);border-radius:50%;background:rgba(15,30,26,.88);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 0 20px rgba(255,214,0,.11),inset 0 0 20px rgba(255,214,0,.04);z-index:4;padding:3%}.wind-icon{color:var(--yellow);font-family:Arial,sans-serif;font-size:clamp(28px,7vw,48px);line-height:.8;margin-bottom:3%}.into{font-size:clamp(18px,4.7vw,29px);font-weight:500;line-height:1}.strength{font-size:clamp(40px,10vw,62px);font-weight:600;line-height:1.05;margin-top:3%}.club{font-size:clamp(15px,3.6vw,23px);font-weight:500;color:rgba(255,255,255,.68);line-height:1;margin-top:2%}.help{position:absolute;right:5.5%;top:5.5%;width:10%;aspect-ratio:1;border:1.5px solid rgba(255,214,0,.78);border-radius:50%;background:rgba(18,31,27,.38);color:#fff;font:500 clamp(17px,4.2vw,25px)/1 Oxanium;cursor:pointer;z-index:5}.modal{position:absolute;inset:0;background:rgba(8,16,13,.72);backdrop-filter:blur(4px);display:none;place-items:center;padding:9%;z-index:10}.modal.show{display:grid}.modal-card{width:100%;max-width:360px;border:1px solid rgba(255,255,255,.24);border-radius:20px;background:rgba(25,39,34,.94);padding:24px;color:#fff;text-align:center}.modal-card h2{margin:0 0 12px;font-size:24px;font-weight:500}.modal-card p{margin:0 0 20px;font:400 15px/1.45 Arial,sans-serif;color:rgba(255,255,255,.8)}.close{border:1px solid rgba(255,255,255,.24);border-radius:15px;background:rgba(255,255,255,.1);color:#fff;padding:12px 22px;font:500 16px Oxanium;cursor:pointer}.countdown{position:absolute;inset:0;display:none;place-items:center;background:rgba(8,16,13,.72);backdrop-filter:blur(3px);z-index:9}.countdown.show{display:grid}.count-number{font:600 110px/1 Oxanium;color:#fff;text-shadow:0 0 28px rgba(255,214,0,.32)}@media(max-width:420px){.tile{width:91vw;border-radius:24px}.radial{inset:8%}.sector{width:31%;height:45%}.arrow{width:23px;height:29px}}</style></head><body><main class="stage"><section class="tile" aria-label="UiDo Wind Tile"><button class="help" id="help">?</button><div class="radial"><button class="sector s1"><span class="arrow"></span></button><button class="sector s2"><span class="arrow"></span></button><button class="sector s3"><span class="arrow"></span></button><button class="sector s4"><span class="arrow"></span></button><button class="sector s5"><span class="arrow"></span></button><button class="sector s6"><span class="arrow"></span></button><button class="sector s7"><span class="arrow"></span></button><button class="sector s8"><span class="arrow"></span></button></div><button class="center" id="strengthButton"><div class="wind-icon">≋</div><div class="into">INTO</div><div class="strength" id="strength">1/2</div><div class="club">CLUB</div></button><div class="countdown" id="countdown"><div class="count-number" id="countNumber">3</div></div><div class="modal" id="modal"><div class="modal-card"><h2>Wind</h2><p>Select the direction the wind is travelling <strong>towards</strong> you. The arrows point into the centre. Tap the centre control to cycle the wind strength.</p><button class="close" id="close">Got it</button></div></div></section></main><script>const strengths=['0','1/4','1/2','3/4','1','1 1/4'];let i=2;const strength=document.getElementById('strength'),countdown=document.getElementById('countdown'),countNumber=document.getElementById('countNumber'),modal=document.getElementById('modal');document.getElementById('strengthButton').onclick=e=>{e.stopPropagation();i=(i+1)%strengths.length;strength.textContent=strengths[i]};document.querySelectorAll('.sector').forEach(b=>b.onclick=e=>{e.stopPropagation();document.querySelectorAll('.sector').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');let n=3;countNumber.textContent=n;countdown.classList.add('show');const t=setInterval(()=>{n--;if(n>0)countNumber.textContent=n;else{clearInterval(t);countdown.classList.remove('show')}},1000)});document.getElementById('help').onclick=e=>{e.stopPropagation();modal.classList.add('show')};document.getElementById('close').onclick=()=>modal.classList.remove('show');</script></body></html>
