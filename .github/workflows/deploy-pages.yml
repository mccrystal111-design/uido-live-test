name: Deploy UiDo website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare website
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp home-preview.html _site/home-preview.html
          if [ -f wind-tile.html ]; then cp wind-tile.html _site/wind-tile.html; fi
          if [ -f hole.html ]; then cp hole.html _site/hole.html; fi
          if [ -f scorecard.js ]; then cp scorecard.js _site/scorecard.js; fi
          if [ -d assets ]; then cp -R assets _site/assets; fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
