name: Deploy UiDo website

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "home-preview.html"
      - "gps.html"
      - "*.js"
      - "*.css"
      - "*.html"
      - "assets/**"
      - ".github/workflows/deploy-pages.yml"
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare website
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp home-preview.html _site/home-preview.html
          if [ -f wind-tile.html ]; then cp wind-tile.html _site/wind-tile.html; fi
          if [ -f lie-tile.html ]; then cp lie-tile.html _site/lie-tile.html; fi
          if [ -f club-tile.html ]; then cp club-tile.html _site/club-tile.html; fi
          if [ -f start-tile.html ]; then cp start-tile.html _site/start-tile.html; fi
          if [ -f shape-tile.html ]; then cp shape-tile.html _site/shape-tile.html; fi
          if [ -f shape-tile-v2.html ]; then cp shape-tile-v2.html _site/shape-tile-v2.html; fi
          if [ -f putts-score-tile.html ]; then cp putts-score-tile.html _site/putts-score-tile.html; fi
          if [ -f yardage-tile.html ]; then cp yardage-tile.html _site/yardage-tile.html; fi
          if [ -f yardage-tile-new.html ]; then cp yardage-tile-new.html _site/yardage-tile-new.html; fi
          if [ -f hole.html ]; then cp hole.html _site/hole.html; fi
          if [ -f scorecard.js ]; then cp scorecard.js _site/scorecard.js; fi
          if [ -d assets ]; then cp -R assets _site/assets; fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
