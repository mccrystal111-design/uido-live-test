name: UiDo smooth map rotation
on:
  push:
    paths:
      - '.github/workflows/smooth-map-rotation.yml'
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Smooth compass map rotation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('gps.html')
          s=p.read_text()
          old="let windDir='Calm',windStrength='Calm',heading=null;"
          new="let windDir='Calm',windStrength='Calm',heading=null,mapRotation=0,targetMapRotation=0,mapAnim=false;"
          assert old in s
          s=s.replace(old,new,1)
          old="if(map)map.getContainer().style.setProperty('--map-rotation',(-relative)+'deg')}function startCompass()"
          new="if(map){targetMapRotation=-relative;smoothMapRotation()} }function smoothMapRotation(){if(mapAnim)return;mapAnim=true;const step=()=>{let d=((targetMapRotation-mapRotation+540)%360)-180;mapRotation+=d*0.10;if(Math.abs(d)<0.15){mapRotation=targetMapRotation;mapAnim=false}else requestAnimationFrame(step);if(map)map.getContainer().style.setProperty('--map-rotation',mapRotation+'deg')};requestAnimationFrame(step)}function startCompass()"
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'UiDo Bot'
          git config user.email 'uido-bot@users.noreply.github.com'
          git add gps.html
          git commit -m 'Smooth live map rotation' || exit 0
          git push
      - name: Remove one-time workflow
        if: success()
        run: |
          git rm .github/workflows/smooth-map-rotation.yml
          git commit -m 'Remove one-time map smoothing workflow'
          git push
