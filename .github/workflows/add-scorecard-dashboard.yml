name: Add hole scoring scorecard and stats dashboard
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch scorecard and dashboard
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='<!-- UIDO_SCORECARD_V1 -->'
          assert marker not in s, 'scorecard patch already present'
          css='''\n/* UiDo scorecard + stats */\n.scorePanel{margin-top:10px;background:#f1f6f3;border:1px solid #dfe9e4;border-radius:12px;padding:10px}.scorePanelRow{display:flex;gap:8px;align-items:center}.scorePanel input{width:82px;border:1px solid #cad9d2;border-radius:10px;padding:10px;font-size:18px;text-align:center;font-weight:800}.scorePanel .btn{min-height:42px;padding:9px 12px;font-size:13px}.scoreSaved{font-size:11px;color:var(--good);font-weight:800;margin-top:5px}.scoreOverlay{position:fixed;inset:0;background:#0b2d21cc;z-index:100;display:none;padding:14px;overflow:auto}.scoreOverlay.open{display:flex;justify-content:center}.scoreSheet{width:min(430px,100%);margin:auto;background:#f5f7f5;border-radius:18px;box-shadow:0 10px 35px #0005;overflow:hidden}.scoreSheetHead{background:var(--g);color:#fff;padding:15px 16px;display:flex;justify-content:space-between;align-items:center}.scoreSheetHead h2{margin:0;font-size:21px}.scoreSheetHead button{border:1px solid #ffffff66;background:#ffffff12;color:#fff;border-radius:9px;padding:7px 10px;font-weight:800}.scoreSummary{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:10px}.scoreStat{background:#fff;border:1px solid var(--line);border-radius:11px;text-align:center;padding:9px 5px}.scoreStat b{display:block;font-size:20px}.scoreStat span{font-size:10px;color:var(--muted)}.scoreTable{padding:0 10px 10px}.scoreRow{display:grid;grid-template-columns:38px 48px 1fr 48px;gap:4px;align-items:center;padding:7px 5px;border-bottom:1px solid #e5ece8;font-size:12px}.scoreRow.head{font-weight:800;color:var(--muted);font-size:10px}.scoreRow .num{text-align:center}.scoreRow .scoreInput{width:44px;border:1px solid #cad9d2;border-radius:7px;padding:5px;text-align:center;font-weight:800}.scoreRow .delta{text-align:center;font-weight:800}.scoreBtns{display:flex;gap:8px;padding:10px}.scoreBtns .btn{flex:1;min-height:44px;padding:9px;font-size:13px}.dashGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:10px}.dashCard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}.dashCard b{font-size:22px;display:block}.dashCard span{font-size:11px;color:var(--muted)}.dashSection{padding:0 10px 10px}.dashSection h3{font-size:13px;margin:5px 0 7px}.dashBars div{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #e7ede9;font-size:11px}\n'''
          assert '</style>' in s
          s=s.replace('</style>',css+'</style>',1)
          html='''\n<!-- UIDO_SCORECARD_V1 -->\n<div class="scoreOverlay" id="scoreOverlay"><div class="scoreSheet"><div class="scoreSheetHead"><h2 id="scoreTitle">UiDo Scorecard</h2><button id="scoreClose">Close</button></div><div id="scoreBody"></div></div></div>\n'''
          assert '</body>' in s
          s=s.replace('</body>',html+'</body>',1)
          js=r'''\n<script>\n(function(){\n  const SCORE_KEY='uido_hole_scores_v1';\n  let holeScores=JSON.parse(localStorage.getItem(SCORE_KEY)||'{}');\n  const pars=[4,3,5,3,4,4,4,4,5,4,5,4,3,4,4,4,3,5];\n  const $=id=>document.getElementById(id);\n  const saveScores=()=>localStorage.setItem(SCORE_KEY,JSON.stringify(holeScores));\n  function scoreFor(h){const v=Number(holeScores[h]);return Number.isFinite(v)&&v>0?v:null}\n  function scoreLabel(d){return d===-3?'Albatross':d===-2?'Eagle':d===-1?'Birdie':d===0?'Par':d===1?'Bogey':d===2?'Double':d>2?'+'+d:'—'}\n  function scorePanel(){\n    if(document.getElementById('scorePanel'))return;\n    const card=document.querySelector('.screen[data-i="6"] .card')||document.querySelector('.complete')?.closest('.card');\n    if(!card)return;\n    const panel=document.createElement('div');panel.id='scorePanel';panel.className='scorePanel';\n    const h=Number(window.S?.hole||document.getElementById('holeNo')?.textContent||1);\n    const existing=scoreFor(h);\n    panel.innerHTML='<div style="font-size:13px;font-weight:800;margin-bottom:6px">Hole score</div><div class="scorePanelRow"><input id="holeScoreInput" type="number" min="1" max="15" inputmode="numeric" placeholder="Score" value="'+(existing||'')+'"><button class="btn" id="saveHoleScore">Save score</button></div><div id="scoreSaved" class="scoreSaved"></div>';\n    const nav=card.querySelector('.nav');card.insertBefore(panel,nav||null);\n    $('saveHoleScore').onclick=()=>{const v=Number($('holeScoreInput').value);if(!v||v<1||v>15){$('scoreSaved').textContent='Enter a score from 1–15';return}holeScores[h]=v;saveScores();$('scoreSaved').textContent='Saved · '+scoreLabel(v-pars[h-1]);};\n  }\n  function renderScorecard(){\n    const scored=Object.keys(holeScores).map(Number).filter(h=>scoreFor(h));\n    const total=scored.reduce((a,h)=>a+scoreFor(h),0);\n    const par=scored.reduce((a,h)=>a+(pars[h-1]||4),0);\n    const toPar=total-par;\n    $('scoreTitle').textContent='UiDo Scorecard';\n    let rows='<div class="scoreSummary"><div class="scoreStat"><b>'+scored.length+'</b><span>Holes</span></div><div class="scoreStat"><b>'+total+'</b><span>Score</span></div><div class="scoreStat"><b>'+(toPar>0?'+'+toPar:toPar)+'</b><span>To par</span></div></div><div class="scoreTable"><div class="scoreRow head"><div>Hole</div><div class="num">Par</div><div>Score</div><div class="delta">+/-</div></div>';\n    for(let h=1;h<=18;h++){const v=scoreFor(h),d=v?v-pars[h-1]:null;rows+='<div class="scoreRow"><div>'+h+'</div><div class="num">'+pars[h-1]+'</div><div>'+(v||'—')+'</div><div class="delta">'+(d===null?'—':(d>0?'+'+d:d))+'</div></div>'}\n    rows+='</div><div class="scoreBtns"><button class="btn secondary" id="showDashboard">Stats dashboard</button><button class="btn" id="scoreExport">Export scores</button></div>';$('scoreBody').innerHTML=rows;\n    $('showDashboard').onclick=renderDashboard;\n    $('scoreExport').onclick=exportScores;\n  }\n  function renderDashboard(){\n    const scored=Object.keys(holeScores).map(Number).filter(h=>scoreFor(h));\n    const total=scored.reduce((a,h)=>a+scoreFor(h),0);\n    const par=scored.reduce((a,h)=>a+(pars[h-1]||4),0);\n    const shots=Array.isArray(window.S?.shots)?window.S.shots:[];\n    const deltas=shots.map(x=>Number(x.watch_delta_yd??x.watchDelta??x.watch_delta)).filter(Number.isFinite);\n    const avgDelta=deltas.length?(deltas.reduce((a,b)=>a+b,0)/deltas.length):null;\n    const birdies=scored.filter(h=>scoreFor(h)<pars[h-1]).length;\n    const parsMade=scored.filter(h=>scoreFor(h)===pars[h-1]).length;\n    const bogeys=scored.filter(h=>scoreFor(h)===pars[h-1]+1).length;\n    $('scoreTitle').textContent='Stats dashboard';\n    $('scoreBody').innerHTML='<div class="dashGrid"><div class="dashCard"><b>'+scored.length+'</b><span>Holes scored</span></div><div class="dashCard"><b>'+total+'</b><span>Total score</span></div><div class="dashCard"><b>'+(scored.length?(total/scored.length).toFixed(2):'—')+'</b><span>Average / hole</span></div><div class="dashCard"><b>'+(par?((total-par)>0?'+'+(total-par):(total-par)):'—')+'</b><span>To par</span></div><div class="dashCard"><b>'+shots.length+'</b><span>Shot records</span></div><div class="dashCard"><b>'+ (avgDelta===null?'—':(avgDelta>0?'+':'')+avgDelta.toFixed(1)+' yd')+'</b><span>Avg watch delta</span></div></div><div class="dashSection"><h3>Scoring</h3><div class="dashBars"><div><span>Birdie or better</span><b>'+birdies+'</b></div><div><span>Par</span><b>'+parsMade+'</b></div><div><span>Bogey</span><b>'+bogeys+'</b></div></div></div><div class="scoreBtns"><button class="btn secondary" id="backScorecard">Scorecard</button><button class="btn" id="closeDash">Close</button></div>';\n    $('backScorecard').onclick=renderScorecard;$('closeDash').onclick=closeOverlay;\n  }\n  function openScorecard(){renderScorecard();$('scoreOverlay').classList.add('open')}\n  function closeOverlay(){$('scoreOverlay').classList.remove('open')}\n  function exportScores(){\n    let csv='hole,par,score,to_par\\n';for(let h=1;h<=18;h++){const v=scoreFor(h);csv+=h+','+pars[h-1]+','+(v||'')+','+(v?v-pars[h-1]:'')+'\\n'}\n    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='uido_scorecard.csv';a.click();URL.revokeObjectURL(a.href);\n  }\n  function addScorecardButton(){\n    const card=document.querySelector('.screen[data-i="7"] .card');if(!card||document.getElementById('openScorecard'))return;\n    const b=document.createElement('button');b.id='openScorecard';b.className='btn light';b.style.marginTop='8px';b.textContent='Scorecard / Stats';b.onclick=openScorecard;\n    const nav=card.querySelector('.nav');card.insertBefore(b,nav||null);\n  }\n  function watchScreen(){scorePanel();addScorecardButton();}\n  setInterval(watchScreen,300);watchScreen();\n  $('scoreClose').onclick=closeOverlay;\n  const newBtn=$('headNewRound');if(newBtn)newBtn.addEventListener('click',()=>setTimeout(()=>{if(window.S&&Array.isArray(S.shots)&&S.shots.length===0){holeScores={};saveScores()}},100));\n})();\n</script>\n'''
          s=s.replace('</body>',js+'</body>',1)
          p.write_text(s)
          print('scorecard patch written')
          PY
      - name: Validate
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          for x in ['UIDO_SCORECARD_V1','uido_hole_scores_v1','scorePanel','Stats dashboard','openScorecard']:
              assert x in s, x+' missing'
          print('Scorecard validation OK')
          PY
      - name: Commit patch and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/add-scorecard-dashboard.yml
          git commit -m 'Add hole scoring scorecard and stats dashboard'
          git rm .github/workflows/add-scorecard-dashboard.yml
          git commit -m 'Remove one-time scorecard patch workflow'
          git push
