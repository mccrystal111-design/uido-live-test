name: Core Prototype Static QA

on:
  push:
    branches: [main]
    paths:
      - 'hawk.html'
      - '.github/workflows/core-prototype-static-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-qa:
    name: Parse Core prototype JavaScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check inline JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          import tempfile
          from html.parser import HTMLParser
          from pathlib import Path

          class InlineScriptParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.inline_scripts = []
                  self.current = None
                  self.external = False

              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      self.external = any(name.lower() == "src" for name, _ in attrs)
                      self.current = None if self.external else []

              def handle_data(self, data):
                  if self.current is not None:
                      self.current.append(data)

              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.current is not None:
                      source = "".join(self.current)
                      if source.strip():
                          self.inline_scripts.append(source)
                      self.current = None
                      self.external = False

          html = Path("hawk.html").read_text(encoding="utf-8")
          parser = InlineScriptParser()
          parser.feed(html)
          if not parser.inline_scripts:
              raise SystemExit("No inline JavaScript found in hawk.html")

          for index, source in enumerate(parser.inline_scripts, 1):
              path = Path(tempfile.gettempdir()) / f"hawk-inline-{index}.js"
              path.write_text(source, encoding="utf-8")
              subprocess.run(["node", "--check", str(path)], check=True)
              for token in ["\\\\nlet ", "\\\\nconst ", "\\\\nfunction ", "\\\\nasync function "]:
                  if token in source:
                      raise SystemExit(f"Found literal backslash-n before JavaScript declaration: {token!r}")

          print(f"PASS: {len(parser.inline_scripts)} inline JavaScript block(s) parsed successfully.")
          PY
