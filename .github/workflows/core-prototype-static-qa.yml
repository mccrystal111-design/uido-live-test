name: Core Prototype Static QA

on:
  push:
    branches: [main]
    paths:
      - 'hawk.html'
      - '.github/workflows/core-prototype-static-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-qa:
    name: Parse Core prototype JavaScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check inline JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          import subprocess
          import tempfile
          from pathlib import Path

          html = Path("hawk.html").read_text(encoding="utf-8")
          blocks = re.findall(r"<script\\b([^>]*)>(.*?)</script\\s*>", html, flags=re.I | re.S)
          inline = [body for attrs, body in blocks if not re.search(r"\\bsrc\\s*=", attrs, flags=re.I) and body.strip()]
          if not inline:
              raise SystemExit("No inline JavaScript found in hawk.html")
          for index, source in enumerate(inline, 1):
              path = Path(tempfile.gettempdir()) / f"hawk-inline-{index}.js"
              path.write_text(source, encoding="utf-8")
              subprocess.run(["node", "--check", str(path)], check=True)
          if re.search(r"\\\\n(?:let|const|function|async function)\\b", "\\n".join(inline)):
              raise SystemExit("Found a literal backslash-n where a JavaScript line break is expected")
          print(f"PASS: {len(inline)} inline JavaScript block(s) parsed successfully.")
          PY
