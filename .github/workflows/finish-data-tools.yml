name: UiDo finish data tools
on:
  push:
    paths:
      - '.github/workflows/finish-data-tools.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add round storage and export
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          s=s.replace('<button class="gpsIcon" id="gpsIcon">⌖<span class="dot" id="dot"></span></button>', '<div class="headtools"><button class="headbtn" id="headExport">Export</button><button class="headbtn" id="headNewRound">New Round</button><button class="gpsIcon" id="gpsIcon">⌖<span class="dot" id="dot"></span></button></div>')
          s=s.replace('.gpsIcon{width:38px;', '.headtools{display:flex;align-items:center;gap:5px}.headbtn{border:1px solid #ffffff55;background:#ffffff12;color:#fff;border-radius:8px;padding:7px 6px;font-size:9px;font-weight:800}.gpsIcon{width:38px;')
          s=s.replace('.manualHole{margin-top:7px}', '.manualHole{margin-top:7px}.dataTools{display:flex;gap:7px;margin-top:7px}.dataTools .btn{min-height:40px;padding:7px;font-size:11px}')
          s=s.replace('<div class="manualHole"><select id="holeSelect"></select></div><div id="log">', '<div class="manualHole"><select id="holeSelect"></select></div><div class="dataTools"><button class="btn light" id="exportRound">Export Round Data</button><button class="btn secondary" id="newRound">New Round</button></div><div id="log">')
          s=s.replace('<button class="btn" id="newShot">New Shot</button>', '<button class="btn" id="exportAtEnd">Export Round</button><button class="btn secondary" id="newShot">New Shot</button>')

          marker='const S={i:0,hole:1,par:4,course:"Course not recognised",flag:null,windAngle:0,windStrength:"2 clubs",lie:"Fairway",startLine:"Centre",shape:"Straight",strike:"Centre",gps:null,watch:null,watchDelta:null,shots:[]};'
          addition='''\nconst ROUND_KEY="uido_live_round_v1";\nlet ROUND_ID=new Date().toISOString().replace(/[-:TZ.]/g,"").slice(0,14);\nfunction persistRound(){localStorage.setItem(ROUND_KEY,JSON.stringify({roundId:ROUND_ID,shots:S.shots}));}\nfunction csvCell(v){return '"'+String(v??"").replace(/"/g,'""')+'"'}\nfunction exportRound(){const rows=["round_id,timestamp,hole,par,course,flag_yd,wind,lie,start_line,shape,strike,gps_lat,gps_lon,gps_accuracy_m,gps_time,watch_yd,watch_delta_yd"];for(const x of S.shots)rows.push([ROUND_ID,x.timestamp,x.hole,x.par,x.course,x.flag,x.wind,x.lie,x.startLine,x.shape,x.strike,x.gps?.lat,x.gps?.lon,x.gps?.accuracy,x.gps?.time,x.watch,x.watchDelta].map(csvCell).join(","));if(!S.shots.length){alert("No completed shots have been saved yet.");return}const blob=new Blob([rows.join("\\n")],{type:"text/csv;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="UiDo_Round_"+ROUND_ID+".csv";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}\nfunction newRound(){if(S.shots.length&&!confirm("Start a new round? Make sure you have exported this round first."))return;ROUND_ID=new Date().toISOString().replace(/[-:TZ.]/g,"").slice(0,14);S.shots=[];S.hole=1;S.par=4;S.flag=null;S.gps=null;S.watch=null;S.watchDelta=null;localStorage.removeItem(ROUND_KEY);setHole(1);$("liveFlag").textContent="— yd";$("flag").textContent="— yd";$("gpsStatus").innerHTML="<strong>GPS not started</strong><span>Tap Start GPS to begin.</span>";$("dot").style.background="var(--amber)";show(0)}\ntry{const saved=JSON.parse(localStorage.getItem(ROUND_KEY)||"null");if(saved?.shots){ROUND_ID=saved.roundId||ROUND_ID;S.shots=saved.shots||[]}}catch(e){}\n'''
          if marker in s:s=s.replace(marker,marker+addition)
          else: raise SystemExit('S marker missing')

          s=s.replace('function selectChoice(b){const g=b.dataset.g;S[g]=b.dataset.v;document.querySelectorAll(`[data-g="${g}"]`).forEach(x=>x.classList.remove(\'active\'));b.classList.add(\'active\')}', 'function selectChoice(b){const g=b.dataset.g;S[g]=b.dataset.v;document.querySelectorAll(`[data-g="${g}"]`).forEach(x=>x.classList.remove(\'active\'));b.classList.add(\'active\');persistRound()}')
          s=s.replace("$('saveMatch').onclick=()=>{", "$('saveMatch').onclick=()=>{")
          s=s.replace("$('matchBox').style.display='none';$('log').innerHTML=", "$('matchBox').style.display='none';persistRound();$('log').innerHTML=")
          s=s.replace("$('liveFlag').textContent=S.flag+' yd'}};", "$('liveFlag').textContent=S.flag+' yd';persistRound()}};")
          s=s.replace("S.watchDelta=S.watchDelta;timestamp", "S.watchDelta=S.watchDelta;timestamp")
          old="$('newShot').onclick=()=>{S.shots.push({hole:S.hole,par:S.par,course:S.course,flag:S.flag,wind:S.wind,lie:S.lie,startLine:S.startLine,shape:S.shape,strike:S.strike,gps:S.gps,watch:S.watch,watchDelta:S.watchDelta,timestamp:new Date().toISOString()});S.gps=null;"
          new="$('newShot').onclick=()=>{S.shots.push({hole:S.hole,par:S.par,course:S.course,flag:S.flag,wind:S.wind,lie:S.lie,startLine:S.startLine,shape:S.shape,strike:S.strike,gps:S.gps,watch:S.watch,watchDelta:S.watchDelta,timestamp:new Date().toISOString()});persistRound();S.gps=null;"
          s=s.replace(old,new)
          s=s.replace("setHole(1);renderProgress();", "$('headExport').onclick=exportRound;$('exportRound').onclick=exportRound;$('exportAtEnd').onclick=exportRound;$('headNewRound').onclick=newRound;$('newRound').onclick=newRound;setHole(1);renderProgress();")
          p.write_text(s)
          PY
      - name: Validate
        run: |
          grep -q 'function exportRound' index.html
          grep -q 'function newRound' index.html
          grep -q 'ROUND_KEY' index.html
          grep -q 'Export Round Data' index.html
          grep -q 'New Round' index.html
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text()
          js=re.search(r'<script>(.*?)</script>',s,re.S).group(1)
          Path('/tmp/uido.js').write_text(js)
          PY
          node --check /tmp/uido.js
      - name: Commit patch and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/finish-data-tools.yml
          git commit -m 'Add round persistence and CSV export'
          git push
