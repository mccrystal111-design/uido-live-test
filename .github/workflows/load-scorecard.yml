name: Load scorecard script
on:
  workflow_dispatch:
  push:
    paths:
      - 'scorecard.js'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add script tag
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="scorecard.js" defer></script>'
          if tag not in s:
              s=s.replace('</head>',tag+'</head>')
              p.write_text(s)
          PY
          grep -q 'scorecard.js' index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Load scorecard script' || exit 0
          git push
      - name: Remove workflow
        if: success()
        run: |
          rm .github/workflows/load-scorecard.yml
          git add .github/workflows/load-scorecard.yml
          git commit -m 'Remove one-time scorecard loader' || exit 0
          git push