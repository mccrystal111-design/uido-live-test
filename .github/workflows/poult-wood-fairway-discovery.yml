name: UiDo Poult Wood Fairway Discovery

on:
  push:
    paths:
      - ".github/workflows/poult-wood-fairway-discovery.yml"
      - "course-models/POULT_WOOD_SOURCE_MANIFEST.json"
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Acquire complete OSM golf source and fairway relations
        run: |
          set -euo pipefail
          mkdir -p build/poult-wood-fairways

          ALL='[out:json][timeout:180];nwr["golf"](51.2184284,0.2958967,51.2276149,0.3095094);out geom;'
          FAIRWAYS='[out:json][timeout:180];nwr["golf"="fairway"](51.2184284,0.2958967,51.2276149,0.3095094);out geom;'

          curl -fsSL --retry 4 --data-urlencode "data=$ALL"             https://overpass-api.de/api/interpreter             -o build/poult-wood-fairways/osm-all-golf.json
          curl -fsSL --retry 4 --data-urlencode "data=$FAIRWAYS"             https://overpass-api.de/api/interpreter             -o build/poult-wood-fairways/osm-fairways.json

          python3 - <<'PY'
          import json, hashlib, pathlib
          root=pathlib.Path("build/poult-wood-fairways")
          all_data=json.loads((root/"osm-all-golf.json").read_text())
          fair_data=json.loads((root/"osm-fairways.json").read_text())
          all_elements=all_data.get("elements",[])
          fair_elements=fair_data.get("elements",[])

          holes=[
            e for e in all_elements
            if e.get("tags",{}).get("golf")=="hole"
            and str(e.get("tags",{}).get("ref","")).isdigit()
            and 1 <= int(e["tags"]["ref"]) <= 18
          ]
          greens=[e for e in all_elements if e.get("tags",{}).get("golf")=="green"]

          manifest={
            "schema":"uido.poult-wood.fairway-discovery.v0.2",
            "course":"poult-wood",
            "boundary":{"west":0.2958967,"south":51.2184284,"east":0.3095094,"north":51.2276149},
            "complete_golf_element_count":len(all_elements),
            "target_hole_count":len(holes),
            "green_count":len(greens),
            "fairway_element_count":len(fair_elements),
            "fairway_elements":[
              {"type":e.get("type"),"id":e.get("id"),"tags":e.get("tags",{}),
               "geometry_points":len(e.get("geometry",[]))}
              for e in fair_elements
            ],
            "all_source_sha256":hashlib.sha256((root/"osm-all-golf.json").read_bytes()).hexdigest(),
            "fairway_source_sha256":hashlib.sha256((root/"osm-fairways.json").read_bytes()).hexdigest(),
            "status":"source_discovery"
          }
          (root/"manifest.json").write_text(json.dumps(manifest,indent=2)+"\n")
          print(json.dumps(manifest,indent=2))
          PY

      - name: Establish hole direction and search frame
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, math, pathlib
          from statistics import mean

          d=json.load(open("build/poult-wood-fairways/osm-all-golf.json"))
          holes=[
            e for e in d["elements"]
            if e.get("tags",{}).get("golf")=="hole"
            and str(e.get("tags",{}).get("ref","")).isdigit()
            and 1 <= int(e["tags"]["ref"]) <= 18
          ]
          greens=[e for e in d["elements"] if e.get("tags",{}).get("golf")=="green"]

          def points(e):
            g=e.get("geometry",[])
            return [(p["lon"],p["lat"]) for p in g]

          def centroid(e):
            p=points(e)
            return (mean(x for x,y in p),mean(y for x,y in p))

          records=[]
          for h in sorted(holes,key=lambda e:int(e["tags"]["ref"])):
            hp=points(h)
            if len(hp)<2: continue
            start,end=hp[0],hp[-1]
            gx,gy=min(
              (centroid(g) for g in greens),
              key=lambda c:(c[0]-end[0])**2+(c[1]-end[1])**2
            )
            lat=math.radians((start[1]+end[1])/2)
            dx=(gx-start[0])*math.cos(lat)
            dy=gy-start[1]
            bearing=(math.degrees(math.atan2(dx,dy))+360)%360
            records.append({
              "hole":int(h["tags"]["ref"]),
              "route_id":f'{h["type"]}/{h["id"]}',
              "start":start,
              "terminal":end,
              "green_centroid":[gx,gy],
              "playing_bearing_deg":round(bearing,2),
              "method":"OSM hole route + nearest terminal green"
            })

          pathlib.Path("build/poult-wood-fairways/hole-directions.json").write_text(
            json.dumps({"schema":"uido.poult-wood.hole-direction.v0.1","holes":records},indent=2)+"\n"
          )
          print(json.dumps(records,indent=2))
          PY

      - name: Produce missing-fairway finding
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path("build/poult-wood-fairways")
          m=json.loads((root/"manifest.json").read_text())

          report={
            "schema":"uido.poult-wood.fairway-discovery-report.v0.2",
            "course":"poult-wood",
            "confirmed_target_holes":list(range(1,19)),
            "finding":{
              "live_osm_golf_fairway_elements":m["fairway_element_count"],
              "fairway_elements":m["fairway_elements"],
              "interpretation":"If this complete nwr query returns one fairway element, the other target-hole fairways are not currently represented with golf=fairway inside the confirmed boundary. Do not fabricate them from the hole line.",
              "recovery_method":"derive each hole's direction from its OSM route and terminal green, then recover missing fairway boundaries from EA aerial imagery.",
              "openyardage_role":"independent sense check; its map data is based on OSM and its distances are calculated from that geometry."
            }
          }
          (root/"report.json").write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps(report,indent=2))
          PY

      - name: Upload discovery bundle
        uses: actions/upload-artifact@v4
        with:
          name: poult-wood-fairway-discovery
          path: build/poult-wood-fairways/
          retention-days: 14
