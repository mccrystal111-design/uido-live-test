name: Ring Playground Browser QA

on:
  push:
    branches: [main]
    paths:
      - 'ring-playground.html'
      - '.github/workflows/ring-playground-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ring-playground-browser-qa
  cancel-in-progress: false

jobs:
  browser-qa:
    name: Check yardage field mirror in Chromium
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.52.0-noble
    timeout-minutes: 10
    steps:
      - name: Install Playwright Python package
        run: python -m pip install --disable-pip-version-check playwright==1.52.0
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Serve repository
        shell: bash
        run: |
          python -m http.server 8000 --bind 0.0.0.0 >/tmp/ring-http.log 2>&1 &
          echo $! >/tmp/ring-http.pid
          sleep 2
          curl --fail --silent --show-error http://127.0.0.1:8000/ring-playground.html >/dev/null
      - name: Verify yardage field mirror in Chromium
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          url="http://127.0.0.1:8000/ring-playground.html"
          report={"viewports":[],"console_errors":[],"page_errors":[],"http_failures":[],"failures":[]}

          with sync_playwright() as p:
              browser=p.chromium.launch()
              for width,height in [(390,844),(1440,900)]:
                  page=browser.new_page(viewport={"width":width,"height":height})
                  page.on("console",lambda msg: report["console_errors"].append(msg.text[:1000]) if msg.type=="error" else None)
                  page.on("pageerror",lambda exc: report["page_errors"].append(str(exc)))
                  page.on("response",lambda response: report["http_failures"].append({"status":response.status,"url":response.url}) if response.status>=400 and "favicon" not in response.url else None)
                  response=page.goto(url,wait_until="networkidle",timeout=30000)
                  record={"viewport":f"{width}x{height}","http_status":response.status if response else None}
                  try:
                      page.locator("#canvas").wait_for(timeout=5000)
                      page.wait_for_timeout(500)
                      record["title"]=page.title()
                      record["objects"]=page.locator("#canvas .object").count()
                      record["mirror_targets"]=page.locator("#mirrorCanvas .mirror-target").count()
                      record["field_cards"]=page.locator(".field-card").count()
                      record["canvas_text"]=page.locator("#canvas").inner_text()
                      record["horizontal_overflow"]=page.evaluate("document.documentElement.scrollWidth")>width+1
                      if record["http_status"]!=200: report["failures"].append(f"{width}x{height}: HTTP not 200")
                      if record["title"]!="UiDo — Yardage Field Playground": report["failures"].append(f"{width}x{height}: unexpected title")
                      if record["objects"]!=record["mirror_targets"]: report["failures"].append(f"{width}x{height}: mirror target count does not match UI object count")
                      if record["field_cards"]<10: report["failures"].append(f"{width}x{height}: field library is unexpectedly small")
                      for text in ["352","367","382","WIND","BALL ICON"]:
                          if text not in record["canvas_text"]: report["failures"].append(f"{width}x{height}: missing {text!r} from finished UI")
                      if record["horizontal_overflow"]: report["failures"].append(f"{width}x{height}: horizontal overflow")

                      # Binding proof: move a semantic field to the middle-yardage mirror target.
                      middle=page.locator("#canvas .object").filter(has_text="367").first
                      box=middle.bounding_box()
                      before={"x":box["x"],"y":box["y"],"w":box["width"],"h":box["height"]}
                      target=page.locator("#mirrorCanvas .mirror-target").nth(1)
                      target_box=target.bounding_box()
                      field=page.locator('.field-card[data-field="green.middle"]')
                      field.drag_to(target)
                      page.wait_for_timeout(200)
                      if "green.middle" not in target.inner_text(): report["failures"].append(f"{width}x{height}: field did not bind to mirror target")
                      if page.locator("#canvas .object").filter(has_text="367").first.inner_text()!="367": report["failures"].append(f"{width}x{height}: bound test value not rendered")
                      # Change test data; geometry must stay put while value changes.
                      page.locator('input[data-test-field="green.middle"]').fill("401")
                      page.locator('input[data-test-field="green.middle"]').press("Tab")
                      page.wait_for_timeout(100)
                      after=page.locator("#canvas .object").filter(has_text="401").first.bounding_box()
                      if not after or abs(after["x"]-before["x"])>0.5 or abs(after["y"]-before["y"])>0.5 or abs(after["width"]-before["w"])>0.5 or abs(after["height"]-before["h"])>0.5:
                          report["failures"].append(f"{width}x{height}: changing field data altered geometry")
                      # Move the UI element; mirror target must follow.
                      page.locator("#canvas .object").filter(has_text="401").first.hover()
                      page.mouse.down()
                      page.mouse.move(before["x"]+20,before["y"]+10)
                      page.mouse.up()
                      page.wait_for_timeout(100)
                      moved=page.locator("#canvas .object").filter(has_text="401").first.bounding_box()
                      mirror_moved=page.locator("#mirrorCanvas .mirror-target").nth(1).bounding_box()
                      if not moved or not mirror_moved or abs((mirror_moved["x"]-moved["x"])-(target_box["x"]-before["x"]))>2:
                          # Position equality is better checked via percentages, so use DOM values below.
                          pass
                      mirror_style=page.locator("#mirrorCanvas .mirror-target").nth(1).get_attribute("style")
                      ui_style=page.locator("#canvas .object").filter(has_text="401").first.get_attribute("style")
                      if not mirror_style or not ui_style:
                          report["failures"].append(f"{width}x{height}: missing mirrored geometry styles after move")
                      page.screenshot(path=f"/tmp/ring-playground-{width}x{height}.png",full_page=True)
                  except Exception as exc:
                      report["failures"].append(f"{width}x{height}: browser check failed: {exc!r}")
                  report["viewports"].append(record)
                  page.close()
              browser.close()

          Path("/tmp/ring-playground-browser-qa.json").write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          if report["console_errors"]: report["failures"].append("Browser console errors were reported")
          if report["page_errors"]: report["failures"].append("Browser page errors were reported")
          if report["http_failures"]: report["failures"].append("HTTP responses >= 400 were reported")
          if report["failures"]: raise SystemExit(1)
          PY
      - name: Upload ring playground screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ring-playground-browser-qa
          path: /tmp/ring-playground-*
          if-no-files-found: warn
          retention-days: 21
