name: Ring Playground Browser QA

on:
  push:
    branches: [main]
    paths:
      - 'ring-playground.html'
      - '.github/workflows/ring-playground-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ring-playground-browser-qa
  cancel-in-progress: false

jobs:
  browser-qa:
    name: Check yardage field mirror in Chromium
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.52.0-noble
    timeout-minutes: 10
    steps:
      - name: Install Playwright Python package
        run: python -m pip install --disable-pip-version-check playwright==1.52.0
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Serve repository
        shell: bash
        run: |
          python -m http.server 8000 --bind 0.0.0.0 >/tmp/ring-http.log 2>&1 &
          echo $! >/tmp/ring-http.pid
          sleep 2
          curl --fail --silent --show-error http://127.0.0.1:8000/ring-playground.html >/dev/null
      - name: Verify yardage field mirror in Chromium
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          url="http://127.0.0.1:8000/ring-playground.html"
          report={"viewports":[],"console_errors":[],"page_errors":[],"http_failures":[],"failures":[]}

          with sync_playwright() as p:
              browser=p.chromium.launch()
              for width,height in [(390,844),(1440,900)]:
                  page=browser.new_page(viewport={"width":width,"height":height})
                  page.on("console",lambda msg: report["console_errors"].append(msg.text[:1000]) if msg.type=="error" else None)
                  page.on("pageerror",lambda exc: report["page_errors"].append(str(exc)))
                  page.on("response",lambda response: report["http_failures"].append({"status":response.status,"url":response.url}) if response.status>=400 and "favicon" not in response.url else None)
                  response=page.goto(url,wait_until="networkidle",timeout=30000)
                  record={"viewport":f"{width}x{height}","http_status":response.status if response else None}
                  try:
                      page.locator("#canvas").wait_for(timeout=5000)
                      page.wait_for_timeout(500)
                      record["title"]=page.title()
                      record["objects"]=page.locator("#canvas .object").count()
                      record["mirror_targets"]=page.locator("#mirrorCanvas .mirror-target").count()
                      record["field_cards"]=page.locator(".field-card").count()
                      record["canvas_text"]=page.locator("#canvas").inner_text()
                      record["horizontal_overflow"]=page.evaluate("document.documentElement.scrollWidth")>width+1
                      if record["http_status"]!=200: report["failures"].append(f"{width}x{height}: HTTP not 200")
                      if record["title"]!="UiDo — Yardage Field Playground": report["failures"].append(f"{width}x{height}: unexpected title")
                      if record["objects"]!=record["mirror_targets"]: report["failures"].append(f"{width}x{height}: mirror target count does not match UI object count")
                      if record["field_cards"]<10: report["failures"].append(f"{width}x{height}: field library is unexpectedly small")
                      for text in ["352","367","382","WIND","BALL ICON"]:
                          if text not in record["canvas_text"]: report["failures"].append(f"{width}x{height}: missing {text!r} from finished UI")
                      if record["horizontal_overflow"]: report["failures"].append(f"{width}x{height}: horizontal overflow")

                      # Binding proof: move a semantic field to the middle-yardage mirror target.
                      middle=page.locator("#canvas .object").filter(has_text="367").first
                      box=middle.bounding_box()
                      before={"x":box["x"],"y":box["y"],"w":box["width"],"h":box["height"]}
                      before_style=middle.get_attribute("style")
                      target=page.locator("#mirrorCanvas .mirror-target").nth(1)
                      target_box=target.bounding_box()
                      # Exercise the same custom-data drop path used by the UI.
                      target_id=target.get_attribute("data-id")
                      page.evaluate("""([targetId, fieldId]) => {
                        const target = document.querySelector('#mirrorCanvas .mirror-target[data-id="'+targetId+'"]');
                        const dt = new DataTransfer();
                        dt.setData('text/field', fieldId);
                        target.dispatchEvent(new DragEvent('dragover', {bubbles:true, dataTransfer:dt}));
                        target.dispatchEvent(new DragEvent('drop', {bubbles:true, dataTransfer:dt}));
                      }""", [target_id, "green.middle"])
                      page.wait_for_timeout(200)
                      if "green.middle" not in target.inner_text(): report["failures"].append(f"{width}x{height}: field did not bind to mirror target")
                      if page.locator("#canvas .object").filter(has_text="367").first.inner_text()!="367": report["failures"].append(f"{width}x{height}: bound test value not rendered")
                      # Change test data; geometry must stay put while value changes.
                      page.locator('input[data-test-field="green.middle"]').fill("401")
                      page.locator('input[data-test-field="green.middle"]').press("Tab")
                      page.wait_for_timeout(100)
                      after=page.locator("#canvas .object").filter(has_text="401").first.bounding_box()
                      after_style=page.locator("#canvas .object").filter(has_text="401").first.get_attribute("style")
                      def geometry_style(style):
                          import re
                          values=[]
                          for key in ["left","top","width","height"]:
                              match=re.search(rf'{key}:\s*([^;]+)', style or '')
                              values.append(match.group(1).strip() if match else None)
                          return tuple(values)
                      if geometry_style(before_style)!=geometry_style(after_style):
                          report["failures"].append(f"{width}x{height}: changing field data altered geometry")
                      if after is None:
                          report["failures"].append(f"{width}x{height}: bound field value did not render after data change")
                      # Move the UI element; the mirrored target must move to exactly the same layout percentages.
                      ui=page.locator("#canvas .object").filter(has_text="401").first
                      ui.hover()
                      ui_box=ui.bounding_box()
                      ui_style_before=ui.get_attribute("style")
                      if not ui_box:
                          raise AssertionError("Bound middle-yardage object has no bounding box")
                      page.evaluate("""() => {
                        window.__qaPointerEvents={down:0,move:0,up:0,lastDownTarget:null};
                        document.addEventListener('pointerdown',(event)=>{
                          window.__qaPointerEvents.down++;
                          window.__qaPointerEvents.lastDownTarget={
                            tag:event.target.tagName,
                            id:event.target.dataset?.id||null,
                            text:(event.target.textContent||'').trim().slice(0,40),
                            button:event.button
                          };
                        },true);
                        document.addEventListener('pointermove',()=>window.__qaPointerEvents.move++,true);
                        document.addEventListener('pointerup',()=>window.__qaPointerEvents.up++,true);
                      }""")
                      start_x=ui_box["x"]+ui_box["width"]/2
                      start_y=ui_box["y"]+ui_box["height"]/2
                      record["hit_test"]=page.evaluate("""([x,y,id]) => {
                        const hit=document.elementFromPoint(x,y);
                        const expected=document.querySelector('#canvas .object[data-id="'+id+'"]');
                        return {isExpected:hit===expected,hitTag:hit?.tagName,hitId:hit?.dataset?.id||null,hitText:(hit?.textContent||'').trim().slice(0,40),expectedId:expected?.dataset?.id||null};
                      }""",[start_x,start_y,ui.get_attribute("data-id")])
                      page.mouse.move(start_x,start_y)
                      page.mouse.down()
                      page.mouse.move(start_x+24,start_y+18,steps=4)
                      page.mouse.up()
                      page.wait_for_timeout(100)
                      ui_style=ui.get_attribute("style")
                      mirror_style=page.locator("#mirrorCanvas .mirror-target").nth(1).get_attribute("style")
                      record["drag_diagnostics"]={
                          "pointer_events":page.evaluate("window.__qaPointerEvents"),
                          "before":geometry_style(ui_style_before),
                          "after":geometry_style(ui_style),
                          "selected":ui.evaluate("(el)=>el.classList.contains('selected')")
                      }
                      if not record["drag_diagnostics"]["pointer_events"]["down"]:
                          report["failures"].append(f"{width}x{height}: pointerdown did not reach the yardage object; diagnostics={record['drag_diagnostics']}")
                      if geometry_style(ui_style)==geometry_style(ui_style_before):
                          report["failures"].append(f"{width}x{height}: drag did not move the UI element; diagnostics={record['drag_diagnostics']}")
                      if geometry_style(ui_style)!=geometry_style(mirror_style):
                          report["failures"].append(f"{width}x{height}: mirror geometry does not match moved UI geometry")
                      # Validate the downloadable field/layout package and the finished-UI PNG.
                      downloads=[]
                      page.on("download",lambda download: downloads.append(download))
                      page.locator("#capture").click()
                      page.wait_for_function("document.querySelector('#status').textContent.includes('exported')",timeout=15000)
                      page.wait_for_timeout(300)
                      names=[d.suggested_filename for d in downloads]
                      record["downloads"]=names
                      if "uido-yardage-field-layout.json" not in names:
                          report["failures"].append(f"{width}x{height}: semantic field JSON was not downloaded")
                      if "uido-yardage-field-layout.png" not in names:
                          report["failures"].append(f"{width}x{height}: finished UI PNG was not downloaded")
                      for download in downloads:
                          if download.suggested_filename.endswith(".json"):
                              out="/tmp/ring-playground-export.json"
                              download.save_as(out)
                              package=json.loads(Path(out).read_text())
                              record["export_schema"]=package.get("schema")
                              record["export_field_count"]=len(package.get("fields",[]))
                              bound=[item for item in package.get("layout",[]) if item.get("binding")=="green.middle"]
                              if package.get("schema")!="uido-yardage-field-layout-v1":
                                  report["failures"].append(f"{width}x{height}: unexpected export schema")
                              if not any(f.get("field")=="green.middle" for f in package.get("fields",[])):
                                  report["failures"].append(f"{width}x{height}: export missing green.middle semantic binding")
                              if not bound:
                                  report["failures"].append(f"{width}x{height}: layout export missing bound green.middle element")
                              if bound and any(k in bound[0] for k in ["sampleValue","literalValue","value"]):
                                  report["failures"].append(f"{width}x{height}: bound layout stores a literal dynamic value")
                          elif download.suggested_filename.endswith(".png"):
                              out="/tmp/ring-playground-export.png"
                              download.save_as(out)
                              data=Path(out).read_bytes()
                              if not data.startswith(b"\x89PNG\r\n\x1a\n"):
                                  report["failures"].append(f"{width}x{height}: exported screenshot is not a PNG")
                              elif len(data)<1000:
                                  report["failures"].append(f"{width}x{height}: exported screenshot is unexpectedly small")
                      page.screenshot(path=f"/tmp/ring-playground-{width}x{height}.png",full_page=True)
                  except Exception as exc:
                      report["failures"].append(f"{width}x{height}: browser check failed: {exc!r}")
                  report["viewports"].append(record)
                  page.close()
              browser.close()

          Path("/tmp/ring-playground-browser-qa.json").write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          if report["console_errors"]: report["failures"].append("Browser console errors were reported")
          if report["page_errors"]: report["failures"].append("Browser page errors were reported")
          if report["http_failures"]: report["failures"].append("HTTP responses >= 400 were reported")
          if report["failures"]: raise SystemExit(1)
          PY
      - name: Upload ring playground screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ring-playground-browser-qa
          path: /tmp/ring-playground-*
          if-no-files-found: warn
          retention-days: 21
