name: UiDo fix round buttons
on:
  push:
    paths:
      - .github/workflows/fix-round-buttons.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix New Round and final export
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          marker='<!-- UIDO_ROUND_BUTTON_FIX_V1 -->'
          if marker not in s:
              patch=r'''\n<!-- UIDO_ROUND_BUTTON_FIX_V1 -->\n<script>\n(function(){\nfunction clearRound(){\n  try{['uido_live_round_v1','uido_hole_scores_v1','uido_shot_flow_v1'].forEach(k=>localStorage.removeItem(k));}catch(e){}\n  location.reload();\n}\nfunction exportScorecard(){\n  let scores={};\n  try{scores=JSON.parse(localStorage.getItem('uido_hole_scores_v1')||'{}')}catch(e){}\n  const par=[4,3,5,3,4,4,4,4,5,4,5,4,3,4,4,4,3,5];\n  const rows=[['Hole','Par','Score','To Par']];\n  for(let i=1;i<=18;i++){const v=Number(scores[i]??scores[String(i)]??''); if(v>0) rows.push([i,par[i-1],v,v-par[i-1]])}\n  if(rows.length===1){alert('No hole scores recorded yet.');return}\n  const csv=rows.map(r=>r.join(',')).join('\\n');\n  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='uido-scorecard.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);\n}\nfunction bind(){\n  const nr=document.getElementById('headNewRound');\n  if(nr&&!nr.dataset.roundFix){const x=nr.cloneNode(true);nr.replaceWith(x);x.dataset.roundFix='1';x.addEventListener('click',e=>{e.preventDefault();if(confirm('Start a new round? Current round data will be cleared.'))clearRound();});}\n  document.querySelectorAll('button').forEach(b=>{const t=(b.textContent||'').trim().toLowerCase();if(t.includes('export')&&t.includes('scorecard')&&!b.dataset.scoreFix){const x=b.cloneNode(true);b.replaceWith(x);x.dataset.scoreFix='1';x.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();exportScorecard();},true);}});\n}\nif(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bind);else bind();setTimeout(bind,500);\n})();\n</script>\n'''
              s=s.replace('</body>',patch+'\n</body>',1)
              p.write_text(s)
          PY
      - name: Validate
        run: |
          grep -q 'UIDO_ROUND_BUTTON_FIX_V1' index.html
          grep -q 'function clearRound' index.html
          grep -q 'function exportScorecard' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix New Round and final scorecard export' || exit 0
          git push
      - name: Remove workflow
        run: |
          git rm .github/workflows/fix-round-buttons.yml
          git commit -m 'Remove one-time round button fix workflow'
          git push
