name: UiDo Course Builder - Overstone EA capture

on:
  workflow_dispatch:
    inputs:
      course:
        description: "Course name"
        required: true
        type: choice
        options:
          - "Overstone Park"
        default: "Overstone Park"
      year:
        description: "EA aerial survey year"
        required: true
        type: choice
        options:
          - "2013"
        default: "2013"
      resolution:
        description: "EA aerial resolution (metres)"
        required: true
        type: choice
        options:
          - "0.25"
        default: "0.25"

jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Discover EA aerial tiles for course footprint
        env:
          COURSE: ${{ inputs.course }}
          YEAR: ${{ inputs.year }}
          RESOLUTION: ${{ inputs.resolution }}
        run: |
          set -euo pipefail
          mkdir -p build/ea-aerial/packages build/ea-aerial/sources

          # Overstone Park course footprint in WGS84, derived from the authoritative
          # course source extent. The EA search service accepts a GeoJSON polygon.
          python - <<'PY'
          import json, os, urllib.request

          search_url = "https://environment.data.gov.uk/backend/catalog/api/tiles/collections/survey/search"
          polygon = {
              "type": "Polygon",
              "coordinates": [[
                  [-0.8266019, 52.2755460],
                  [-0.8076190, 52.2755460],
                  [-0.8076190, 52.2862605],
                  [-0.8266019, 52.2862605],
                  [-0.8266019, 52.2755460],
              ]],
          }
          req = urllib.request.Request(
              search_url,
              data=json.dumps(polygon).encode(),
              headers={
                  "Content-Type": "application/geo+json",
                  "Accept": "*/*",
                  "Origin": "https://environment.data.gov.uk",
                  "Referer": "https://environment.data.gov.uk/survey",
                  "User-Agent": "UiDo-course-builder/0.1",
              },
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=120) as response:
              payload = json.load(response)

          results = payload.get("results", [])
          requested_year = str(os.environ["YEAR"])
          requested_res = float(os.environ["RESOLUTION"])

          print(f"EA search returned {len(results)} records")
          for r in results:
              p = r.get("product", {})
              t = r.get("tile", {})
              print(
                  "CATALOGUE",
                  "product=", p.get("id"),
                  "year=", p.get("year", r.get("year")),
                  "res=", p.get("resolution", r.get("resolution")),
                  "tile=", t.get("id"),
              )

          matches = []
          for r in results:
              p = r.get("product", {})
              t = r.get("tile", {})
              pid = str(p.get("id", ""))
              year = p.get("year", r.get("year"))
              res = p.get("resolution", r.get("resolution"))
              if isinstance(year, dict): year = year.get("id")
              if isinstance(res, dict): res = res.get("id")
              try:
                  res_ok = abs(float(res) - requested_res) < 1e-9
              except (TypeError, ValueError):
                  res_ok = False
              year_ok = str(year) == requested_year
              if year_ok and res_ok and pid == "vertical_aerial_photography_tiles_night_time":
                  matches.append({
                      "product": pid,
                      "year": str(year),
                      "resolution": float(res),
                      "tile": t.get("id"),
                  })

          # De-duplicate while preserving order.
          unique = []
          seen = set()
          for m in matches:
              key = (m["product"], m["year"], m["resolution"], m["tile"])
              if key not in seen and m["tile"]:
                  seen.add(key)
                  unique.append(m)

          if not unique:
              raise SystemExit(
                  f"No EA vertical aerial tiles found for year={requested_year}, "
                  f"resolution={requested_res}. See catalogue output above."
              )

          # The EA catalogue uses the actual product id `vertical_aerial_photography_tiles_night_time`
          # for the Overstone 2013 survey. Use the catalogue tile ids directly; do not
          # substitute the older SP8064/SP8164-style assumptions used by the first probe.
          product = "vertical_aerial_photography_tiles_night_time"
          selected = [m for m in unique if m["product"] == product]

          print(f"SELECTED product={product} tiles={len(selected)}")
          with open("build/ea-aerial/discovery.json", "w") as f:
              json.dump({
                  "schema": "uido.course.ea-discovery.v0.1",
                  "course": os.environ["COURSE"],
                  "year": requested_year,
                  "resolution_m": requested_res,
                  "product": product,
                  "tiles": selected,
              }, f, indent=2)
          PY

          cat build/ea-aerial/discovery.json

      - name: Download discovered EA aerial packages
        env:
          COURSE: ${{ inputs.course }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib, io, json, os, pathlib, time, urllib.request, zipfile

          root = pathlib.Path("build/ea-aerial")
          discovery = json.loads((root / "discovery.json").read_text())
          product = discovery["product"]
          year = discovery["year"]
          resolution = str(discovery["resolution_m"]).rstrip("0").rstrip(".")
          tiles = discovery["tiles"]

          base = "https://environment.data.gov.uk/tiles/collections/survey"
          headers = {
              "Accept": "application/zip,*/*",
              "Origin": "https://environment.data.gov.uk",
              "Referer": "https://environment.data.gov.uk/survey",
              "User-Agent": "UiDo-course-builder/0.1",
          }

          packages = root / "packages"
          sources = root / "sources"
          packages.mkdir(parents=True, exist_ok=True)
          sources.mkdir(parents=True, exist_ok=True)

          captured = []
          for item in tiles:
              tile = item["tile"]
              url = f"{base}/{product}/{year}/{resolution}/{tile}?subscription-key=dspui"
              target = packages / f"{tile}.zip"
              last_error = None

              for attempt in range(1, 5):
                  try:
                      print(f"DOWNLOAD {tile} attempt={attempt} url={url}", flush=True)
                      req = urllib.request.Request(url, headers=headers)
                      with urllib.request.urlopen(req, timeout=600) as response:
                          data = response.read()

                      print(f"HTTP=200 SIZE={len(data)}", flush=True)
                      if len(data) < 1000:
                          raise RuntimeError(f"response too small: {len(data)} bytes")

                      with zipfile.ZipFile(io.BytesIO(data)) as archive:
                          names = archive.namelist()
                          if not names:
                              raise RuntimeError("empty ZIP")
                          archive.testzip()
                          raster_names = [
                              n for n in names
                              if n.lower().endswith((".ecw", ".tif", ".tiff"))
                          ]
                          print(f"ZIP members={len(names)} raster_members={raster_names}", flush=True)

                      target.write_bytes(data)
                      captured.append({
                          "block": tile,
                          "url": url,
                          "bytes": len(data),
                          "sha256": hashlib.sha256(data).hexdigest(),
                          "raster_members": raster_names,
                      })

                      with zipfile.ZipFile(io.BytesIO(data)) as archive:
                          archive.extractall(sources / tile)
                      break

                  except Exception as exc:
                      last_error = f"{type(exc).__name__}: {exc}"
                      print(f"FAILED {tile}: {last_error}", flush=True)
                      if attempt < 4:
                          time.sleep(5 * (2 ** (attempt - 1)))
                      else:
                          raise SystemExit(f"EA download failed for {tile}: {last_error}")

          (root / "acquisition.txt").write_text(f"product={product}\n")
          manifest = {
              "schema": "uido.course.ea-acquisition.v0.2",
              "course": os.environ["COURSE"],
              "aerial": {
                  "year": year,
                  "resolution_m": float(discovery["resolution_m"]),
                  "product": product,
              },
              "projection": "EPSG:27700",
              "tiles": captured,
              "status": "captured",
          }
          (root / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY

          find build/ea-aerial/sources -type f | sort
          du -sh build/ea-aerial

      - name: Render compact course imagery
        run: |
          set -euo pipefail

          # Ubuntu's packaged GDAL does not include ECW support. Build GDAL 3.8.4
          # itself with the matching libecwj2-3.3 SDK, then use that isolated build
          # for the render. The previous standalone-plugin approach cannot work on
          # GDAL 3.8 because standalone ECW plugin compilation was added in GDAL 3.10.
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential gdal-bin libgdal-dev cmake curl unzip \
            python3-gdal libcurl4-openssl-dev libssl-dev libproj-dev

          GDAL_VERSION="$(gdal-config --version)"
          echo "System GDAL version: ${GDAL_VERSION}"
          test "${GDAL_VERSION}" = "3.8.4"

          rm -rf /tmp/gdal-src /tmp/gdal-build /opt/libecwj2-3.3 /opt/gdal-ecw
          mkdir -p /tmp/gdal-src

          curl -L --fail --retry 3 \
            "https://github.com/OSGeo/gdal/archive/refs/tags/v${GDAL_VERSION}.tar.gz" \
            -o /tmp/gdal.tar.gz
          tar -xzf /tmp/gdal.tar.gz -C /tmp/gdal-src --strip-components=1

          curl -L --fail --retry 3 \
            "https://github.com/rouault/libecwj2-3.3-builds/releases/download/v1/install-libecwj2-3.3-ubuntu-20.04.tar.gz" \
            -o /tmp/libecwj2.tar.gz
          sudo tar -xzf /tmp/libecwj2.tar.gz -C /opt

          # Make the legacy ECW runtime libraries visible to the linker.
          sudo cp /opt/libecwj2-3.3/lib/*.so* /usr/lib/x86_64-linux-gnu/
          sudo ldconfig

          echo "ECW SDK layout:"
          find /opt/libecwj2-3.3 -maxdepth 2 -type f | sort | head -100

          mkdir -p /tmp/gdal-build
          cmake -S /tmp/gdal-src -B /tmp/gdal-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/gdal-ecw \
            -DGDAL_USE_ECW=ON \
            -DGDAL_ENABLE_DRIVER_ECW=ON \
            -DECW_ROOT=/opt/libecwj2-3.3 \
            -DECW_INCLUDE_DIR=/opt/libecwj2-3.3/include \
            -DECW_LIBRARY=/opt/libecwj2-3.3/lib/libNCSEcw.so \
            -DBUILD_PYTHON_BINDINGS=OFF \
            -DBUILD_JAVA_BINDINGS=OFF \
            -DBUILD_CSHARP_BINDINGS=OFF \
            -DBUILD_DOCS=OFF

          cmake --build /tmp/gdal-build --parallel 2
          sudo cmake --install /tmp/gdal-build

          GDAL_BIN="/opt/gdal-ecw/bin"
          GDAL_LIB="$(find /opt/gdal-ecw/lib -maxdepth 2 -type f -name 'libgdal.so*' | head -n 1)"
          test -n "${GDAL_LIB}"
          export PATH="${GDAL_BIN}:${PATH}"
          export LD_LIBRARY_PATH="$(dirname "${GDAL_LIB}"):/opt/libecwj2-3.3/lib:${LD_LIBRARY_PATH:-}"
          export GDAL_DATA="/opt/gdal-ecw/share/gdal"

          echo "UiDo render GDAL:"
          gdalinfo --version
          gdalinfo --formats | grep -E "ECW|JP2ECW"

          mkdir -p build/ea-aerial/render
          mapfile -t ECWS < <(find build/ea-aerial/sources -type f -name "*.ecw" | sort)
          test "${#ECWS[@]}" -gt 0

          gdalbuildvrt -overwrite -resolution highest \
            -te 480137.4894811138 264803.2820420222 481451.93252437544 266016.1542009115 \
            build/ea-aerial/render/overstone.vrt "${ECWS[@]}"

          gdal_translate -of WEBP \
            -projwin 480137.4894811138 266016.1542009115 481451.93252437544 264803.2820420222 \
            -outsize 2629 2426 -co QUALITY=82 \
            build/ea-aerial/render/overstone.vrt \
            build/ea-aerial/render/overstone-overview.webp

          gdal_translate -of JPEG \
            -projwin 480137.4894811138 266016.1542009115 481451.93252437544 264803.2820420222 \
            -outsize 2629 2426 -co QUALITY=82 \
            build/ea-aerial/render/overstone.vrt \
            build/ea-aerial/render/overstone-overview.jpg

          python3 - <<'PY'
          import json, pathlib
          root = pathlib.Path("build/ea-aerial/render")
          out = {"schema":"uido.course.render.v0.1","course":"Overstone Park","crs":"EPSG:27700","bounds_m":{"min_easting":480137.4894811138,"min_northing":264803.2820420222,"max_easting":481451.93252437544,"max_northing":266016.1542009115},"output":{"width_px":2629,"height_px":2426,"approx_resolution_m":0.5,"webp":"overstone-overview.webp","jpeg":"overstone-overview.jpg"},"source_ecw_count":len(list(pathlib.Path("build/ea-aerial/sources").rglob("*.ecw")))}
          (root / "render.json").write_text(json.dumps(out, indent=2) + "\n")
          PY
          ls -lh build/ea-aerial/render/
          du -sh build/ea-aerial/render/
      - name: Build UiDo offline course package
        run: |
          set -euo pipefail

          PACKAGE="build/uido-course-package"
          rm -rf "$PACKAGE"
          mkdir -p "$PACKAGE/holes" "$PACKAGE/layers" "$PACKAGE/review" "$PACKAGE/sources"

          # Start from the existing provider-neutral Overstone course model.
          cp course-models/overstone-park-v0.1.json "$PACKAGE/course.json"
          cp build/ea-aerial/manifest.json "$PACKAGE/sources/ea-aerial-manifest.json"
          cp build/ea-aerial/discovery.json "$PACKAGE/sources/ea-discovery.json"

          # Rendered imagery is runtime content; raw ECW remains outside the phone package.
          cp build/ea-aerial/render/overstone-overview.webp "$PACKAGE/layers/overview.webp"
          cp build/ea-aerial/render/render.json "$PACKAGE/layers/overview.json"

          python3 - <<'PY'
          import hashlib, json, pathlib, time

          root = pathlib.Path("build/uido-course-package")
          model = json.loads((root / "course.json").read_text())
          holes = model.get("holes", [])

          # Create small per-hole runtime records from the existing provider-neutral model.
          for item in holes:
              n = int(item["hole_number"])
              (root / "holes" / f"{n:02d}.json").write_text(
                  json.dumps({
                      "schema": "uido.course.hole.v0.1",
                      "course_id": model["course"]["id"],
                      "hole_number": n,
                      "green": item.get("green"),
                      "tees": item.get("tees", []),
                      "fairways": item.get("fairways", []),
                      "hazards": item.get("hazards", []),
                      "context": item.get("context", []),
                      "routing": item.get("routing"),
                      "extraction_status": item.get("extraction_status"),
                  }, indent=2) + "\n"
              )

          manifest = {
              "schema": "uido.course.package.v0.1",
              "course": model["course"],
              "revision": {
                  "course_revision": "0.1.0-overstone-proof",
                  "schema_revision": "0.1",
                  "status": "review"
              },
              "package": {
                  "offline": True,
                  "crs": "EPSG:4326",
                  "generated_at_utc": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
              },
              "sources": [
                  {"id": "osm", "provider": "OpenStreetMap", "role": "course_geometry"},
                  {"id": "ea-aerial", "provider": "Environment Agency", "role": "imagery"}
              ],
              "layers": {
                  "course_model": "course.json",
                  "overview": "layers/overview.webp",
                  "overview_metadata": "layers/overview.json"
              },
              "holes": {
                  "index": "holes/index.json",
                  "count": len(holes)
              },
              "provenance": {
                  "policy": model.get("provenance_policy"),
                  "review_required_before_publish": True
              }
          }

          (root / "holes" / "index.json").write_text(
              json.dumps({
                  "schema": "uido.course.hole-index.v0.1",
                  "holes": [f"{int(h['hole_number']):02d}.json" for h in holes]
              }, indent=2) + "\n"
          )

          # Review starts with machine checks; human approval remains a separate gate.
          checks = {
              "schema": "uido.course.review.v0.1",
              "status": "review_required",
              "checks": [
                  {"id": "course-model-present", "status": "pass"},
                  {"id": "ea-aerial-acquired", "status": "pass"},
                  {"id": "overview-rendered", "status": "pass"},
                  {"id": "18-holes-present", "status": "pass" if len(holes) == 18 else "fail"},
                  {"id": "human-review", "status": "required"}
              ]
          }
          (root / "review" / "review.json").write_text(json.dumps(checks, indent=2) + "\n")

          # Content hash covers every package file except the hash field itself.
          hashes = {}
          for p in sorted(root.rglob("*")):
              if p.is_file() and p.name != "manifest.json":
                  hashes[str(p.relative_to(root))] = hashlib.sha256(p.read_bytes()).hexdigest()
          manifest["package"]["files"] = hashes
          manifest["package"]["content_sha256"] = hashlib.sha256(
              json.dumps(hashes, sort_keys=True).encode()
          ).hexdigest()
          (root / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")

          print(json.dumps(manifest, indent=2))
          PY

          echo "PACKAGE SIZE"
          du -sh "$PACKAGE"
          find "$PACKAGE" -maxdepth 3 -type f | sort

      - name: Upload UiDo offline course package
        uses: actions/upload-artifact@v4
        with:
          name: overstone-uido-course-package
          path: build/uido-course-package/
          retention-days: 14

      - name: Upload captured EA dataset
        uses: actions/upload-artifact@v4
        with:
          name: overstone-ea-aerial-capture
          path: build/ea-aerial/
          retention-days: 14
