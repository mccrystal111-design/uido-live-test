name: Patch scoring flow
on:
  push:
    paths:
      - '.github/workflows/patch-scoring-flow.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch gps.html
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('gps.html')
          s=p.read_text()
          start=s.index('<section id="complete"')
          end=s.index('</div><div class="overlay" id="overlay">', start)
          replacement='''<section id="complete" class="screen"><div class="card"><div class="complete"><div class="check">✓</div><h2>Shot recorded</h2><p class="sub">Your shot has been saved.</p><div class="scorebox"><div class="scoregrid" style="padding:0;margin-top:8px"><div class="scorecell"><b id="shotClub">—</b><span>Club</span></div><div class="scorecell"><b id="shotStart">Centre</b><span>Start line</span></div><div class="scorecell"><b id="shotShape">Straight</b><span>Shape</span></div><div class="scorecell"><b id="shotStrike">Centre</b><span>Strike</span></div></div></div></div><div class="nav"><button class="btn" onclick="saveShotAndContinue()">Save and continue</button><button class="btn light" onclick="finishHole()">Finish hole</button></div></div></section><section id="score" class="screen"><div class="card"><div class="small">HOLE <span id="scoreHole">1</span> · PAR <span id="scorePar">4</span></div><div class="title">Score</div><p class="sub">Select your score for this hole.</p><div class="scoregrid" id="scoreChoices" style="grid-template-columns:1fr;gap:7px;overflow:auto;max-height:55vh"></div><div class="nav"><button class="btn secondary" onclick="show('complete')">Back</button><button class="btn" onclick="saveScoreContinue()">Save and continue</button><button class="btn light" onclick="saveScoreFinish()">Save and finish round</button></div></div></section>'''
          s=s[:start]+replacement+s[end:]
          s=s.replace('<div class="sheetstats">','<div style="padding:10px 10px 0"><button class="btn light" style="width:100%" onclick="editScorecard()">Edit scorecard</button></div><div class="sheetstats">')
          marker="function saveScore()"
          a=s.index(marker)
          b=s.index('function newShot()',a)
          funcs='''function recordShot(){S.shots.push({timestamp:new Date().toISOString(),hole:S.hole,par:pars[S.hole-1],course:'Overstone Park',flag:S.flag,wind:S.windDir+' · '+S.windStrength,lie:S.lie,startLine:S.startLine,shape:S.shape,strike:S.strike,gps:S.gps,watch:S.watch,watchDelta:S.watchDelta});persist()}\nfunction resetShot(){S.gps=null;S.watch=null;S.watchDelta=null;S.flag=null;S.lie='Fairway';S.startLine='Centre';S.shape='Straight';S.strike='Centre';document.querySelectorAll('[data-g]').forEach(b=>{const g=b.dataset.g,v=b.dataset.v,def={lie:'Fairway',startLine:'Centre',shape:'Straight',strike:'Centre'}[g];b.classList.toggle('active',v===def)});}\nfunction updateShotSummary(){$('shotStart').textContent=S.startLine;$('shotShape').textContent=S.shape;$('shotStrike').textContent=S.strike;$('shotClub').textContent='—'}\nfunction saveShotAndContinue(){recordShot();resetShot();show('wind')}\nfunction finishHole(){recordShot();renderScoreChoices();show('score')}\nfunction renderScoreChoices(){const par=pars[S.hole-1];$('scoreHole').textContent=S.hole;$('scorePar').textContent=par;const vals=[par+2,par+1,par,par-1,par-2,par-3].filter(v=>v>0);const names=['Double Bogey','Bogey','Par','Birdie','Eagle','Albatross'];$('scoreChoices').innerHTML=vals.map((v,i)=>{const d=v-par;let sym=d===2?'▣▣':d===1?'▣':d===0?'':d===-1?'◯':d===-2?'◎':'◎◎';return '<button class="scorecell" style="display:flex;align-items:center;justify-content:space-between;text-align:left;padding:12px 16px;font-size:14px" onclick="selectScore('+v+')"><b style="font-size:22px;min-width:54px">'+v+'</b><span style="flex:1;font-weight:800">'+names[i]+'</span><span style="font-size:20px">'+sym+'</span></button>'}).join('')}\nlet pendingScore=null;function selectScore(v){pendingScore=v;document.querySelectorAll('#scoreChoices .scorecell').forEach(x=>x.style.borderColor='');event.currentTarget.style.borderColor='#075b3d'}\nfunction saveScoreValue(){if(!pendingScore)pendingScore=pars[S.hole-1];scores[S.hole]=pendingScore;localStorage.setItem(SCORES,JSON.stringify(scores));return pendingScore}\nfunction saveScoreContinue(){saveScoreValue();if(S.hole<18){S.hole++;pendingScore=null;resetShot();updateHole();show('hole')}else{openScorecard()}}\nfunction saveScoreFinish(){saveScoreValue();openScorecard()}\nfunction editScorecard(){for(let h=1;h<=18;h++){const v=prompt('Score for Hole '+h+' (leave blank to keep '+(scores[h]||'blank')+')',scores[h]||'');if(v===null)break;if(v===''){delete scores[h]}else{const n=Number(v);if(n>=1&&n<=15)scores[h]=n}}localStorage.setItem(SCORES,JSON.stringify(scores));renderScores()}\n'''
          s=s[:a]+funcs+s[b:]
          # replace old newShot with a lightweight compatibility wrapper
          s=re.sub(r'function newShot\(\)\{.*?\}\nfunction newRound',"function newShot(){resetShot();show('wind')}\nfunction newRound",s,flags=re.S)
          s=s.replace("function saveScore(){const v=Number($('scoreInput').value);if(v<1||v>15)return;$scores=null;scores[S.hole]=v;localStorage.setItem(SCORES,JSON.stringify(scores));$('scoreSaved').textContent='Saved · '+scoreLabel(v-pars[S.hole-1])}","function saveScore(){saveScoreValue();}")
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gps.html
          git commit -m 'Fix shot and score flow' || true
          git push
          rm -f .github/workflows/patch-scoring-flow.yml
          git add .github/workflows/patch-scoring-flow.yml
          git commit -m 'Remove one-time scoring patch workflow' || true
          git push || true
