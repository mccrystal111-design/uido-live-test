name: Fix UiDo Home Screen
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Fix UiDo Home Screen') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply approved home screen corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          home='''<section id="home" class="screen active"><div id="homeMap" class="map"></div><div class="satshade"></div><div class="round-home"><div class="top-actions"><button class="outline">⚙</button><button class="outline">☷</button></div><div class="home-logo">UiDo</div><div class="tag">PLAY SMARTER</div><div class="greenline"></div><div class="home-copy">Better decisions.<br>Lower scores.</div><button class="home-main" onclick="show('course')"><span>▶</span>New Round　›</button><div class="home-nav"><button>▥<br>Past Rounds</button><button>♙<br>Courses</button><button>⚙<br>Settings</button></div></div></section>'''
          s=re.sub(r'<section id="home" class="screen active">.*?</section>', home, s, count=1, flags=re.S)
          overrides='''\n/* 🔒 Screen 1 Home — match approved reference */\n.round-home{padding:0 30px 39px}\n.home-logo{font-size:66px;letter-spacing:-4px;line-height:.82}\n.tag{font-size:12px;letter-spacing:5px;margin-top:10px}\n.greenline{width:40px;height:2px;margin:8px 0 12px}\n.home-copy{font-size:15px;line-height:1.16;margin-bottom:20px}\n.home-main{height:55px;border-radius:13px;font-size:17px;font-weight:650;background:#033a27e8;border-color:#7bc9b0}\n.home-main span{font-size:23px;margin-right:10px}\n.home-nav{gap:10px;margin-top:14px}\n.home-nav button{height:57px;border-radius:13px;font-size:11px;background:#0a3e3050;border-color:#78a99e}\n.top-actions{position:fixed;top:38px;right:30px;gap:8px}\n.top-actions .outline{width:48px;height:48px;padding:0;display:grid;place-items:center;border-radius:10px;background:#075b3d9e;font-size:24px}\n'''
          s=s.replace('</style>',overrides+'</style>',1)
          p.write_text(s)
          PY
          git config user.name 'uido-build'
          git config user.email 'uido-build@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix UiDo Home Screen'
          git push
