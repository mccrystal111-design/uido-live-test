name: Fix UiDo Home Screen
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Fix UiDo Home Screen') && !contains(github.event.head_commit.message, 'approved reference') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply approved home screen corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          home='''<section id="home" class="screen active"><div id="homeMap" class="map"></div><div class="satshade"></div><div class="top home-top"><div class="brand">UiDo</div><div class="course-name">OVERSTONE PARK</div><div class="hole-name">Hole 1 · Par 4</div><div class="top-actions"><button class="outline">⚙</button><button class="outline">☷</button></div></div><div class="round-home"><div class="home-logo">UiDo</div><div class="tag">PLAY SMARTER</div><div class="greenline"></div><div class="home-copy">Better decisions.<br>Lower scores.</div><button class="home-main" onclick="show('course')"><span>▶</span>New Round <b>›</b></button><div class="home-nav"><button>▥<br>Past Rounds</button><button>♙<br>Courses</button><button>⚙<br>Settings</button></div></div></section>'''
          s2=re.sub(r'<section id="home" class="screen active">.*?</section>',home,s,count=1,flags=re.S)
          if s2==s: raise SystemExit('Home section not found')
          s=s2
          overrides='''\n/* 🔒 Screen 1 Home — exact approved reference */\n.home-top{top:22px;left:22px;right:22px}\n.home-top .brand{font-size:40px;letter-spacing:-1.8px}\n.home-top .course-name{font-size:15px;margin-top:25px}\n.home-top .hole-name{font-size:31px;margin-top:4px}\n.home-top .top-actions{top:2px;right:0;gap:8px}\n.home-top .outline{width:66px;height:66px;padding:0;border-radius:16px;font-size:29px;display:grid;place-items:center}\n.round-home{padding:0 24px 30px;background:linear-gradient(transparent 45%,#001b1290 72%,#001b12dd 100%)}\n.home-logo{font-size:92px;letter-spacing:-6px;line-height:.8}\n.tag{font-size:15px;letter-spacing:7px;margin-top:15px}\n.greenline{width:58px;height:2px;margin:14px 0 18px}\n.home-copy{font-size:22px;line-height:1.15;margin-bottom:34px}\n.home-main{height:70px;border-radius:17px;font-size:22px;font-weight:750;background:#087052e6}\n.home-main span{font-size:30px;margin-right:14px}\n.home-main b{font-size:30px;font-weight:400;margin-left:16px}\n.home-nav{gap:12px;margin-top:22px}\n.home-nav button{height:76px;border-radius:16px;font-size:14px}\n'''
          s=s.replace('</style>',overrides+'</style>',1)
          p.write_text(s)
          PY
          git config user.name 'uido-build'
          git config user.email 'uido-build@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix UiDo Home Screen'
          git push
