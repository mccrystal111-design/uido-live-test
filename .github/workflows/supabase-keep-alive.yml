name: Supabase daily keep-alive

on:
  schedule:
    # Daily at 09:00 UTC. GitHub Actions may start scheduled jobs a little late.
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: supabase-daily-keep-alive
  cancel-in-progress: false

jobs:
  ping-supabase:
    name: Read-only Supabase health check
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check Supabase Data API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${SUPABASE_URL}" || -z "${SUPABASE_PUBLISHABLE_KEY}" ]]; then
            echo "::error::Add SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY in repository Actions secrets."
            exit 1
          fi

          # Read-only request to the existing courses table; no user data is changed.
          curl --fail-with-body --silent --show-error \
            --max-time 30 \
            --get "${SUPABASE_URL%/}/rest/v1/courses" \
            --data-urlencode "select=id" \
            --data-urlencode "limit=1" \
            --header "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            --output /dev/null

          echo "Supabase Data API responded successfully."
