name: Fix GPS course recognition gate
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch GPS recognition
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='''const S={i:0,hole:1,par:4,course:"Course not recognised",flag:null,windAngle:0,windStrength:"2 clubs",lie:"Fairway",startLine:"Centre",shape:"Straight",strike:"Centre",gps:null,watch:null,watchDelta:null,shots:[]};'''
          new='''const S={i:0,hole:1,par:4,course:"Course not recognised",courseDetected:false,flag:null,windAngle:0,windStrength:"2 clubs",lie:"Fairway",startLine:"Centre",shape:"Straight",strike:"Centre",gps:null,watch:null,watchDelta:null,shots:[]};'''
          assert old in s, 'S state pattern not found'
          s=s.replace(old,new,1)

          old='''const holes={1:{par:4,pin:[-0.8178,52.2788]},2:{par:3,pin:[-0.8148,52.2800]},3:{par:5,pin:[-0.8120,52.2830]},4:{par:3,pin:[-0.8087,52.2860]},5:{par:4,pin:[-0.8070,52.2840]},6:{par:4,pin:[-0.8080,52.2810]},7:{par:4,pin:[-0.8120,52.2780]},8:{par:4,pin:[-0.8170,52.2760]},9:{par:5,pin:[-0.8200,52.2780]},10:{par:4,pin:[-0.8230,52.2800]},11:{par:5,pin:[-0.8250,52.2830]},12:{par:4,pin:[-0.8210,52.2850]},13:{par:3,pin:[-0.8170,52.2870]},14:{par:4,pin:[-0.8140,52.2850]},15:{par:4,pin:[-0.8120,52.2820]},16:{par:4,pin:[-0.8140,52.2790]},17:{par:3,pin:[-0.8170,52.2770]},18:{par:5,pin:[-0.8195,52.2750]}};'''
          new='''const holes={1:{par:4,pin:[-0.8178,52.2788]},2:{par:3,pin:[-0.8148,52.2800]},3:{par:5,pin:[-0.8120,52.2830]},4:{par:3,pin:[-0.8087,52.2860]},5:{par:4,pin:[-0.8070,52.2840]},6:{par:4,pin:[-0.8080,52.2810]},7:{par:4,pin:[-0.8120,52.2780]},8:{par:4,pin:[-0.8170,52.2760]},9:{par:5,pin:[-0.8200,52.2780]},10:{par:4,pin:[-0.8230,52.2800]},11:{par:5,pin:[-0.8250,52.2830]},12:{par:4,pin:[-0.8210,52.2850]},13:{par:3,pin:[-0.8170,52.2870]},14:{par:4,pin:[-0.8140,52.2850]},15:{par:4,pin:[-0.8120,52.2820]},16:{par:4,pin:[-0.8140,52.2790]},17:{par:3,pin:[-0.8170,52.2770]},18:{par:5,pin:[-0.8195,52.2750]}};
          const COURSE_CENTER={lat:52.27789,lon:-0.81722};
          const COURSE_RADIUS_M=1200;
          function courseDistance(g){return hav(g.lat,g.lon,COURSE_CENTER.lat,COURSE_CENTER.lon)}
          function recogniseCourse(){
            if(!S.gps){S.courseDetected=false;S.course="Course not recognised";return false}
            const d=courseDistance(S.gps);
            S.courseDetected=d<=COURSE_RADIUS_M+Math.max(0,S.gps.accuracy||0);
            S.course=S.courseDetected?"Overstone Park":"Course not recognised";
            const box=$("courseStatus");
            if(box){
              box.innerHTML=S.courseDetected
                ? `<strong class="recognised">Overstone Park recognised</strong><span>GPS is ${Math.round(d)} m from the course centre.</span>`
                : `<strong class="unrecognised">Course not recognised</strong><span>GPS is ${Math.round(d/1000*10)/10} km from Overstone. No course yardage will be shown.</span>`;
            }
            $("courseName").textContent=S.course;
            return S.courseDetected;
          }'''
          assert old in s, 'holes pattern not found'
          s=s.replace(old,new,1)

          old='''function setHole(h){S.hole=h;S.par=holes[h]?.par||4;$("holeNo").textContent=h;$("par").textContent=S.par;$("courseName").textContent=S.course;if(S.gps&&holes[h]){$("flag").textContent=yd(hav(S.gps.lat,S.gps.lon,holes[h].pin[1],holes[h].pin[0]))+' yd';$("liveFlag").textContent=$("flag").textContent}}'''
          new='''function setHole(h){S.hole=h;S.par=holes[h]?.par||4;$("holeNo").textContent=h;$("par").textContent=S.par;$("courseName").textContent=S.course;if(S.gps&&S.courseDetected&&holes[h]){$("flag").textContent=yd(hav(S.gps.lat,S.gps.lon,holes[h].pin[1],holes[h].pin[0]))+' yd';$("liveFlag").textContent=$("flag").textContent}else if(!S.courseDetected){$("flag").textContent="— yd";$("liveFlag").textContent="— yd"}}'''
          assert old in s, 'setHole pattern not found'
          s=s.replace(old,new,1)

          old='''$('startGps').onclick=()=>{if(!navigator.geolocation){$('gpsStatus').innerHTML='<strong>GPS unavailable</strong><span>This browser cannot provide location.</span>';return}navigator.geolocation.getCurrentPosition(pos=>{S.gps={lat:pos.coords.latitude,lon:pos.coords.longitude,accuracy:pos.coords.accuracy,time:new Date().toISOString()};$('gpsStatus').innerHTML=`<strong class="success">GPS fix captured</strong><span>±${Math.round(pos.coords.accuracy)} m · ${S.gps.lat.toFixed(6)}, ${S.gps.lon.toFixed(6)}</span>`;$('gpsQuality').textContent='Fix ±'+Math.round(pos.coords.accuracy)+' m';$('dot').style.background='var(--good)';if(holes[S.hole]){$('flag').textContent=yd(hav(S.gps.lat,S.gps.lon,holes[S.hole].pin[1],holes[S.hole].pin[0]))+' yd';$('liveFlag').textContent=$('flag').textContent}},err=>{$('gpsStatus').innerHTML=`<strong class="warn">GPS error</strong><span>${err.message}</span>`},{enableHighAccuracy:true,timeout:15000,maximumAge:0})};'''
          new='''$('startGps').onclick=()=>{if(!navigator.geolocation){$('gpsStatus').innerHTML='<strong>GPS unavailable</strong><span>This browser cannot provide location.</span>';return}navigator.geolocation.getCurrentPosition(pos=>{S.gps={lat:pos.coords.latitude,lon:pos.coords.longitude,accuracy:pos.coords.accuracy,time:new Date().toISOString()};$('gpsStatus').innerHTML=`<strong class="success">GPS fix captured</strong><span>±${Math.round(pos.coords.accuracy)} m · ${S.gps.lat.toFixed(6)}, ${S.gps.lon.toFixed(6)}</span>`;$('gpsQuality').textContent='Fix ±'+Math.round(pos.coords.accuracy)+' m';$('dot').style.background='var(--good)';recogniseCourse();setHole(S.hole);persistRound()},err=>{$('gpsStatus').innerHTML=`<strong class="warn">GPS error</strong><span>${err.message}</span>`},{enableHighAccuracy:true,timeout:15000,maximumAge:0})};'''
          assert old in s, 'startGps pattern not found'
          s=s.replace(old,new,1)

          old='''function newRound(){if(S.shots.length&&!confirm("Start a new round? Make sure you have exported this round first."))return;ROUND_ID=new Date().toISOString().replace(/[-:TZ.]/g,"").slice(0,14);S.shots=[];S.hole=1;S.par=4;S.flag=null;S.gps=null;S.watch=null;S.watchDelta=null;localStorage.removeItem(ROUND_KEY);setHole(1);$("liveFlag").textContent="— yd";$("flag").textContent="— yd";$("gpsStatus").innerHTML="<strong>GPS not started</strong><span>Tap Start GPS to begin.</span>";$("dot").style.background="var(--amber)";show(0)}'''
          new='''function newRound(){if(S.shots.length&&!confirm("Start a new round? Make sure you have exported this round first."))return;ROUND_ID=new Date().toISOString().replace(/[-:TZ.]/g,"").slice(0,14);S.shots=[];S.hole=1;S.par=4;S.course="Course not recognised";S.courseDetected=false;S.flag=null;S.gps=null;S.watch=null;S.watchDelta=null;localStorage.removeItem(ROUND_KEY);setHole(1);$("courseStatus").innerHTML='<strong class="unrecognised">Course not recognised</strong><span>GPS will recognise Overstone when you are on/near the course.</span>';$('courseName').textContent=S.course;$("liveFlag").textContent="— yd";$("flag").textContent="— yd";$("gpsStatus").innerHTML="<strong>GPS not started</strong><span>Tap Start GPS to begin.</span>";$("dot").style.background="var(--amber)";show(0)}'''
          assert old in s, 'newRound pattern not found'
          s=s.replace(old,new,1)

          p.write_text(s)
          print('GPS recognition patch applied')
          PY
      - name: Validate HTML script
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          for x in ['COURSE_CENTER','COURSE_RADIUS_M','recogniseCourse','No course yardage will be shown']:
              assert x in s, x+' missing'
          print('Validation OK')
          PY
      - name: Commit patch and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/fix-gps-recognition.yml
          git commit -m 'Fix GPS course recognition gate'
          git rm .github/workflows/fix-gps-recognition.yml
          git commit -m 'Remove one-time GPS patch workflow'
          git push
