name: Build UiDo APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Bundle exact source UI into APK assets
        working-directory: android/app
        env:
          UIDO_SHA: ${{ github.sha }}
        run: |
          mkdir -p src/main/assets
          RAW="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${UIDO_SHA}"
          curl -fsSL "$RAW/index.html" -o src/main/assets/index.html
          curl -fsSL "$RAW/scorecard.js" -o src/main/assets/scorecard.js
          curl -fsSL "$RAW/manifest-v3.webmanifest" -o src/main/assets/manifest-v3.webmanifest
          curl -fsSL "$RAW/uido-icon-v3.svg" -o src/main/assets/uido-icon-v3.svg
          printf 'source_commit=%s\n' "$UIDO_SHA" > src/main/assets/build-info.txt
          test -s src/main/assets/index.html
          test -s src/main/assets/scorecard.js
          test -s src/main/assets/manifest-v3.webmanifest
          test -s src/main/assets/uido-icon-v3.svg
      - name: Verify canonical UiDo source before Android build
        working-directory: android/app
        run: |
          set -e
          checks=(
            '<title>UiDo</title>'
            'server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/'
            'PLAY SMARTER'
            'Better decisions. Lower scores.'
            'New Round'
            'Overstone Park'
            'Select tee'
            'Start Round'
            'FRONT'
            'MIDDLE'
            'BACK'
            'Check Wind'
            'Confirm wind'
            'Fairway / Tee'
            'Semi rough'
            'Deep rough'
            'Bunker'
            'Bare / Other'
            'Obstructed'
            'What direction did the ball start on?'
            '>Hook<'
            '>Draw<'
            '>Straight<'
            '>Fade<'
            '>Slice<'
            'SHOT STRIKE'
            '>Heavy<'
            'Shot Recorded'
            'Save & Continue'
            'Finish Hole'
            'Score'
            'Save & Finish Round'
            'ROUND REVIEW'
            'source_commit=${{ github.sha }}'
          )
          for needle in "${checks[@]}"; do
            if ! grep -Fq "$needle" src/main/assets/index.html && [[ "$needle" != source_commit=* ]]; then
              echo "SOURCE CHECK FAILED: $needle"
              exit 1
            fi
          done
          grep -Fxq 'source_commit=${{ github.sha }}' src/main/assets/build-info.txt || { echo "SOURCE CHECK FAILED: build-info commit"; exit 1; }
          grep -R -Fq 'file:///android_asset/index.html' src/main/java || { echo "SOURCE CHECK FAILED: Android asset entry point"; exit 1; }
          forbidden=(
            'Where is the pin?'
            'What did you hit?'
            'SHOT DISTANCE'
            'Actual club'
            'Slight Draw'
            'Slight Fade'
            'Confirm & continue'
          )
          for needle in "${forbidden[@]}"; do
            if grep -Fq "$needle" src/main/assets/index.html; then
              echo "FORBIDDEN UI FOUND: $needle"
              exit 1
            fi
          done
          echo "Canonical UiDo source fingerprints passed."
      - name: Install Gradle 8.13
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.13-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
      - name: Build UiDo debug APK
        working-directory: android
        run: /tmp/gradle-8.13/bin/gradle --no-daemon --stacktrace assembleDebug
      - name: Verify APK contains exact canonical UI
        env:
          UIDO_SHA: ${{ github.sha }}
        run: |
          set -e
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -E 'assets/(index.html|scorecard.js|manifest-v3.webmanifest|uido-icon-v3.svg|build-info.txt)'
          required=(
            '<title>UiDo</title>'
            'server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/'
            'PLAY SMARTER'
            'Check Wind'
            'What direction did the ball start on?'
            'Shot Recorded'
            'Save & Continue'
            'ROUND REVIEW'
          )
          for needle in "${required[@]}"; do
            if ! unzip -p "$APK" assets/index.html | grep -Fq "$needle"; then
              echo "APK CHECK FAILED: $needle"
              exit 1
            fi
          done
          forbidden=(
            'Where is the pin?'
            'What did you hit?'
            'SHOT DISTANCE'
            'Actual club'
            'Slight Draw'
            'Slight Fade'
          )
          for needle in "${forbidden[@]}"; do
            if unzip -p "$APK" assets/index.html | grep -Fq "$needle"; then
              echo "FORBIDDEN UI IN APK: $needle"
              exit 1
            fi
          done
          unzip -p "$APK" assets/build-info.txt | grep -Fxq "source_commit=$UIDO_SHA"
          sha256sum "$APK"
          ls -lh "$APK"
      - name: Upload UiDo verified debug APK
        uses: actions/upload-artifact@v4
        with:
          name: UiDo-verified-${{ github.sha }}-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
