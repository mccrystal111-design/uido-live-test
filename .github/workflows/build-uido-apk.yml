name: Build UiDo APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null
      - name: Bundle exact UiDo source
        working-directory: android/app
        env:
          UIDO_SHA: ${{ github.sha }}
        run: |
          mkdir -p src/main/assets
          cp ../../index.html src/main/assets/index.html
          cp ../../scorecard.js src/main/assets/scorecard.js
          cp ../../manifest-v3.webmanifest src/main/assets/manifest-v3.webmanifest
          cp ../../uido-icon-v3.svg src/main/assets/uido-icon-v3.svg
          printf 'source_commit=%s\n' "$UIDO_SHA" > src/main/assets/build-info.txt
      - name: Apply final approved Shape correction to bundled UI
        working-directory: android/app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main/assets/index.html')
          s=p.read_text()
          s=s.replace('grid-template-columns:repeat(7,1fr)','grid-template-columns:repeat(5,1fr)')
          s=s.replace('<button class="shape" onclick="pickShape(this)"><div class="arc">↖</div>Slight Draw</button>','')
          s=s.replace('<button class="shape" onclick="pickShape(this)"><div class="arc">↗</div>Slight Fade</button>','')
          p.write_text(s)
          PY
      - name: Verify UiDo source
        working-directory: android/app
        run: |
          set -e
          grep -Fq '<title>UiDo</title>' src/main/assets/index.html
          grep -Fq 'PLAY SMARTER' src/main/assets/index.html
          grep -Fq 'New Round' src/main/assets/index.html
          grep -Fq 'Overstone Park' src/main/assets/index.html
          grep -Fq 'Select tee' src/main/assets/index.html
          grep -Fq 'Confirm wind' src/main/assets/index.html
          grep -Fq 'What direction did the ball start on?' src/main/assets/index.html
          grep -Fq 'Hook' src/main/assets/index.html
          grep -Fq 'Draw' src/main/assets/index.html
          grep -Fq 'Straight' src/main/assets/index.html
          grep -Fq 'Fade' src/main/assets/index.html
          grep -Fq 'Slice' src/main/assets/index.html
          grep -Fq 'Heavy' src/main/assets/index.html
          ! grep -Fq 'Slight Draw' src/main/assets/index.html
          ! grep -Fq 'Slight Fade' src/main/assets/index.html
          grep -Fq 'server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/' src/main/assets/index.html
          grep -Fxq 'source_commit=${{ github.sha }}' src/main/assets/build-info.txt
          grep -R -Fq 'file:///android_asset/index.html' src/main/java
          for needle in 'Where is the pin?' 'What did you hit?' 'SHOT DISTANCE' 'Actual club'; do
            ! grep -Fq "$needle" src/main/assets/index.html
          done
      - name: Install Gradle 8.13
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.13-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
      - name: Build UiDo APK
        working-directory: android
        run: /tmp/gradle-8.13/bin/gradle --no-daemon --stacktrace assembleDebug
      - name: Verify actual APK
        env:
          UIDO_SHA: ${{ github.sha }}
        run: |
          set -e
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -q 'assets/index.html'
          unzip -p "$APK" assets/index.html | grep -Fq '<title>UiDo</title>'
          unzip -p "$APK" assets/index.html | grep -Fq 'PLAY SMARTER'
          unzip -p "$APK" assets/index.html | grep -Fq 'New Round'
          unzip -p "$APK" assets/index.html | grep -Fq 'Overstone Park'
          unzip -p "$APK" assets/index.html | grep -Fq 'What direction did the ball start on?'
          unzip -p "$APK" assets/index.html | grep -Fq 'Hook'
          unzip -p "$APK" assets/index.html | grep -Fq 'Draw'
          unzip -p "$APK" assets/index.html | grep -Fq 'Straight'
          unzip -p "$APK" assets/index.html | grep -Fq 'Fade'
          unzip -p "$APK" assets/index.html | grep -Fq 'Slice'
          unzip -p "$APK" assets/index.html | grep -Fq 'Heavy'
          ! unzip -p "$APK" assets/index.html | grep -Fq 'Slight Draw'
          ! unzip -p "$APK" assets/index.html | grep -Fq 'Slight Fade'
          ! unzip -p "$APK" assets/index.html | grep -Fq 'Where is the pin?'
          ! unzip -p "$APK" assets/index.html | grep -Fq 'What did you hit?'
          ! unzip -p "$APK" assets/index.html | grep -Fq 'SHOT DISTANCE'
          ! unzip -p "$APK" assets/index.html | grep -Fq 'Actual club'
          unzip -p "$APK" assets/build-info.txt | grep -Fxq "source_commit=$UIDO_SHA"
          sha256sum "$APK"
      - name: Upload green UiDo APK
        uses: actions/upload-artifact@v4
        with:
          name: UiDo-verified-${{ github.sha }}-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

# Force a clean build from the latest approved Home source.
