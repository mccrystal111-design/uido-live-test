name: UiDo Poult Wood Wireframe QA

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/poult-wood-wireframe.yml"
      - "tools/course-model/render_poult_wood_wireframe.py"
      - "course-models/POULT_WOOD_SOURCE_MANIFEST.json"

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install render dependency
        run: python3 -m pip install --disable-pip-version-check matplotlib

      - name: Acquire complete OSM golf source
        run: |
          set -euo pipefail
          mkdir -p build/poult-wood-wireframe
          QUERY='[out:json][timeout:180];nwr["golf"](51.2184284,0.2958967,51.2276149,0.3095094);out geom;'
          RELS='[out:json][timeout:180];relation["golf"="fairway"](51.2184284,0.2958967,51.2276149,0.3095094);(._;>;);out geom;'
          ENDPOINTS=(
            "https://overpass-api.de/api/interpreter"
            "https://overpass.kumi.systems/api/interpreter"
          )
          fetch() {
            local q="$1" out="$2"
            for ep in "${ENDPOINTS[@]}"; do
              echo "Trying $ep"
              if curl -fsSL --retry 3 --connect-timeout 20 --max-time 240                 -A "UiDo-course-wireframe/1.0 (+https://github.com/mccrystal111-design/uido-live-test)"                 -H "Accept: application/json"                 --data-urlencode "data=$q" "$ep" -o "$out"; then
                return 0
              fi
            done
            return 1
          }
          fetch "$QUERY" build/poult-wood-wireframe/osm-all-golf.json
          fetch "$RELS" build/poult-wood-wireframe/osm-fairway-relations.json

      - name: Render 18-hole source wireframe
        run: |
          set -euo pipefail
          python3 tools/course-model/render_poult_wood_wireframe.py             --all build/poult-wood-wireframe/osm-all-golf.json             --fairways build/poult-wood-wireframe/osm-fairway-relations.json             --out build/poult-wood-wireframe/poult-wood-18-hole-wireframe.png

      - name: Upload wireframe for human review
        uses: actions/upload-artifact@v4
        with:
          name: poult-wood-18-hole-wireframe
          path: build/poult-wood-wireframe/
          retention-days: 14
