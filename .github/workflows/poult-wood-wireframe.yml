name: UiDo Course Wireframe QA

# Downstream wireframe stage. Source data comes only from the canonical Course Packet.
on:
  workflow_call:
    inputs:
      course:
        description: "Registered UiDo course id"
        required: true
        type: string

jobs:
  render:
    name: Render ${{ inputs.course }} wireframe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download canonical course packet
        uses: actions/download-artifact@v4
        with:
          name: uido-course-packet-${{ inputs.course }}
          path: build/${{ inputs.course }}

      - name: Verify packet hand-off
        env:
          COURSE_ID: ${{ inputs.course }}
        run: |
          set -euo pipefail
          ROOT="build/$COURSE_ID"
          test -f "$ROOT/acquisition-manifest.json"
          test -f "$ROOT/osm/manifest.json"
          test -f "$ROOT/osm/golf.json"
          test -f "$ROOT/osm/fairway-relations.json"
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path("build") / os.environ["COURSE_ID"]
          acquisition = json.loads((root / "acquisition-manifest.json").read_text())
          if acquisition.get("course_id") != os.environ["COURSE_ID"]:
              raise SystemExit("Packet course id mismatch")
          osm = json.loads((root / "osm" / "manifest.json").read_text())
          if set(osm.get("target_hole_refs", [])) != {str(i) for i in range(1, 19)}:
              raise SystemExit("Packet target hole refs are not exactly 1..18")
          relation_count = osm.get("fairway_relation_elements", 0)
          golf = json.loads((root / "osm" / "golf.json").read_text())
          standalone_fairways = sum(
              1
              for element in golf.get("elements", [])
              if element.get("type") == "way"
              and element.get("tags", {}).get("golf") == "fairway"
          )
          if relation_count <= 0 and standalone_fairways <= 0:
              raise SystemExit("Packet contains no fairway source data")
          print(f"WIREframe PACKET HAND-OFF: PASS (relations={relation_count}, standalone_fairway_ways={standalone_fairways})")
          PY

      - name: Install render dependency
        run: python3 -m pip install --disable-pip-version-check matplotlib shapely

      - name: Render full-course wireframe from packet
        env:
          COURSE_ID: ${{ inputs.course }}
        run: |
          set -euo pipefail
          ROOT="build/$COURSE_ID"
          python3 tools/course-model/render_course_wireframe.py \
            --all "$ROOT/osm/golf.json" \
            --fairways "$ROOT/osm/fairway-relations.json" \
            --manifest "$ROOT/acquisition-manifest.json" \
            --out "$ROOT/wireframe/${COURSE_ID}-18-hole-wireframe.png"

      - name: Upload wireframe QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: uido-wireframe-${{ inputs.course }}
          path: build/${{ inputs.course }}/wireframe/
          retention-days: 14

      - name: Write wireframe summary
        env:
          COURSE_ID: ${{ inputs.course }}
        run: |
          {
            echo "## UiDo Wireframe"
            echo
            echo "**Course:** $COURSE_ID"
            echo
            echo "PASS — wireframe consumed the canonical Course Packet."
            echo
            echo "No Overpass or EA recapture was performed by this stage."
          } >> "$GITHUB_STEP_SUMMARY"
