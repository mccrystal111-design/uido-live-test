name: Test Overstone EA machine acquisition\n# direct-endpoint-proof-v1

on:
  push:
    paths:
      - "tools/course-model/ea_source_acquisition.py"
      - "tools/course-model/ea_survey_probe.py"
      - "course-models/OVERSTONE_ACQUISITION_MANIFEST.json"
      - ".github/workflows/test-overstone-ea-acquisition.yml"
  pull_request:
    paths:
      - "tools/course-model/ea_source_acquisition.py"
      - "tools/course-model/ea_survey_probe.py"
      - "course-models/OVERSTONE_ACQUISITION_MANIFEST.json"
      - ".github/workflows/test-overstone-ea-acquisition.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test EA catalogue machine access
        run: |
          python -m pip install --quiet requests
          python - <<'PY'
          import json, requests
          bbox=(480137.4894811138,264803.2820420222,481451.93252437544,266016.1542009115)
          base="https://environment.data.gov.uk"
          layers=[
            base+"/KB6uNVj5ZcJr7jUP/ArcGIS/rest/services/Vertical_Aerial_Photography_Catalogues/FeatureServer/0",
            base+"/KB6uNVj5ZcJr7jUP/ArcGIS/rest/services/National_LIDAR_Programme_Catalogues/FeatureServer/0",
          ]
          for layer in layers:
            p={"where":"1=1","geometry":json.dumps({"xmin":bbox[0],"ymin":bbox[1],"xmax":bbox[2],"ymax":bbox[3],"spatialReference":{"wkid":27700}}),
               "geometryType":"esriGeometryEnvelope","inSR":"27700","spatialRel":"esriSpatialRelIntersects",
               "outFields":"*","returnGeometry":"false","f":"json"}
            r=requests.get(layer+"/query",params=p,timeout=60)
            r.raise_for_status()
            j=r.json()
            assert "error" not in j, j
            print(layer, "records:", len(j.get("features",[])))
          print("EA catalogue machine access: PASS")
          PY

      - name: Probe EA direct survey tile endpoint
        run: |
          python -m pip install --quiet requests
          python - <<'PY'
          import requests
          products = [
              "vertical_aerial_photography_tiles_irrgb",
              "vertical_aerial_photography_tiles_rgb",
              "vertical_aerial_photography_tiles_nir",
          ]
          blocks = ["SP8064", "SP8065", "SP8164", "SP8165"]
          for product in products:
              for block in blocks:
                  url = f"https://environment.data.gov.uk/tiles/collections/survey/{product}/2013/0.25/{block}?subscription-key=dspui"
                  r = requests.get(url, timeout=60, allow_redirects=True)
                  print(product, block, r.status_code, r.headers.get("content-type"), len(r.content), r.url)
          PY

      - name: Install browser-probe dependencies
        run: |
          python -m pip install --quiet selenium pyshp

      - name: Probe EA survey downloader headlessly
        run: |
          python tools/course-model/ea_survey_probe.py --out ea-survey-links.json

      - name: Upload acquisition probe result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overstone-ea-survey-probe
          path: ea-survey-links.json
          if-no-files-found: ignore
