name: UiDo Course Builder - Agnostic EA acquisition

# Provider-neutral course acquisition layer.
# Can run standalone or as a reusable stage inside the master course pipeline.
# This deliberately stops before course-specific model generation.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-course-ea.yml'
      - 'tools/course-discovery/**'
      - 'course-models/**'
  workflow_dispatch:
    inputs:
      course:
        description: "Course to acquire"
        required: true
        type: string
        default: overstone-park
  workflow_call:
    inputs:
      course:
        description: "Registered UiDo course id"
        required: true
        type: string
      ref:
        description: "Optional repository ref containing the registered course"
        required: false
        type: string
        default: ""

jobs:
  acquire:
    runs-on: ubuntu-latest
    env:
      COURSE_ID: ${{ inputs.course || 'northampton' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}

      - name: Prepare physical acquisition metadata
        run: |
          set -euo pipefail
          python3 tools/course-discovery/prepare_physical_acquisition.py "$COURSE_ID"

      - name: Resolve selected course from registry
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib
          registry = json.loads(pathlib.Path("course-models/COURSE_REGISTRY.json").read_text())
          course_id = os.environ["COURSE_ID"]
          try:
              course = registry["courses"][course_id]
          except KeyError:
              raise SystemExit(f"Unknown course id: {course_id}")
          physical = pathlib.Path("build") / course_id / "physical-source-manifest.json"
          if physical.is_file():
              source_manifest = physical
              source = json.loads(physical.read_text())
          else:
              source_manifest = pathlib.Path(course["source_manifest"])
              source = json.loads(source_manifest.read_text())
          b = source["target_course"]["boundary"]
          acquisition = course.get("acquisition") or {
              "aerial": {"preferred_year": "2013", "preferred_resolution_m": 0.25},
              "lidar": {"max_resolution_m": 1.0},
          }
          lines = [
              f"COURSE_NAME={course['name']}",
              f"COURSE_HOLES={source['target_course']['holes']}",
              f"COURSE_PAR={source['target_course']['par']}",
              f"WEST={b['west']}",
              f"SOUTH={b['south']}",
              f"EAST={b['east']}",
              f"NORTH={b['north']}",
              f"SOURCE_MANIFEST={source_manifest}",
              f"AERIAL_YEAR={acquisition['aerial']['preferred_year']}",
              f"AERIAL_RES={acquisition['aerial']['preferred_resolution_m']}",
              f"LIDAR_MAX_RES={acquisition['lidar']['max_resolution_m']}",
          ]
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write("\n".join(lines) + "\n")
          print(json.dumps(source, indent=2))
          PY

      - name: Validate source manifest
        run: |
          set -euo pipefail
          test -f "$SOURCE_MANIFEST"
          python3 - <<'PY'
          import json, os, pathlib
          course = json.loads(pathlib.Path(os.environ["SOURCE_MANIFEST"]).read_text())
          print(json.dumps(course, indent=2))
          if course["target_course"]["holes"] != int(os.environ["COURSE_HOLES"]):
              raise SystemExit("Registry/source manifest hole count mismatch")
          if course["target_course"]["par"] != int(os.environ["COURSE_PAR"]):
              raise SystemExit("Registry/source manifest par mismatch")
          PY

      - name: Acquire OSM golf source
        run: |
          set -euo pipefail
          mkdir -p "build/$COURSE_ID/osm"
          QUERY="[out:json][timeout:180];nwr[\"golf\"]($SOUTH,$WEST,$NORTH,$EAST);out geom;"
          RELS="[out:json][timeout:180];relation[\"golf\"=\"fairway\"]($SOUTH,$WEST,$NORTH,$EAST);(._;>;);out geom;"
          ENDPOINTS=(
            "https://overpass.private.coffee/api/interpreter"
            "https://overpass-api.de/api/interpreter"
            "https://overpass.kumi.systems/api/interpreter"
          )
          fetch() {
            local q="$1" out="$2"
            for ep in "${ENDPOINTS[@]}"; do
              echo "Trying $ep"
              if curl -fsSL --retry 3 --connect-timeout 20 --max-time 240                 -A "UiDo-course-builder/1.0 (+https://github.com/mccrystal111-design/uido-live-test)"                 -H "Accept: application/json"                 --data-urlencode "data=$q" "$ep" -o "$out"; then
                printf '%s\n' "$ep" > "$out.endpoint"
                return 0
              fi
            done
            return 1
          }
          printf '%s\n' "$QUERY" > "build/$COURSE_ID/osm/golf.query.txt"
          printf '%s\n' "$RELS" > "build/$COURSE_ID/osm/fairway-relations.query.txt"
          fetch "$QUERY" "build/$COURSE_ID/osm/golf.json"
          fetch "$RELS" "build/$COURSE_ID/osm/fairway-relations.json"

          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path("build") / os.environ["COURSE_ID"] / "osm"
          golf = json.loads((root / "golf.json").read_text())
          fairways = json.loads((root / "fairway-relations.json").read_text())
          elements = golf.get("elements", [])
          expected = {str(i) for i in range(1,19)}
          hole_elements = [
              e for e in elements
              if e.get("tags", {}).get("golf") == "hole"
          ]
          holes = {
              str(e.get("tags", {}).get("ref"))
              for e in hole_elements
              if str(e.get("tags", {}).get("ref", "")).isdigit()
              and 1 <= int(e["tags"]["ref"]) <= 18
          }
          unreferenced = []
          for e in hole_elements:
              tags = e.get("tags", {}) or {}
              ref = str(tags.get("ref", "")).strip()
              if ref.isdigit() and 1 <= int(ref) <= 18:
                  continue
              geometry = e.get("geometry", []) or []
              points = [(float(p["lat"]), float(p["lon"])) for p in geometry if "lat" in p and "lon" in p]
              if points:
                  centre = {
                      "latitude": sum(p[0] for p in points) / len(points),
                      "longitude": sum(p[1] for p in points) / len(points),
                  }
              else:
                  centre = e.get("center")
              unreferenced.append({
                  "type": e.get("type"),
                  "id": e.get("id"),
                  "tags": tags,
                  "centre": centre,
                  "node_count": len(points),
              })
          missing = sorted(expected - holes, key=int)
          extra = sorted(holes - expected, key=int)
          status = "complete" if not missing and not extra else "incomplete"
          manifest = {
              "schema": "uido.course.osm-capture.v0.4",
              "course_id": os.environ["COURSE_ID"],
              "course": os.environ["COURSE_NAME"],
              "bbox": [float(os.environ["SOUTH"]), float(os.environ["WEST"]), float(os.environ["NORTH"]), float(os.environ["EAST"])],
              "status": status,
              "target_hole_refs": sorted(holes, key=int),
              "missing_hole_refs": missing,
              "unexpected_hole_refs": extra,
              "hole_geometry": {
                  "total_golf_hole_elements": len(hole_elements),
                  "unreferenced_candidates": unreferenced
              },
              "elements": len(elements),
              "fairway_relation_elements": len(fairways.get("elements", [])),
              "raw_files": {
                  "golf": "golf.json",
                  "fairway_relations": "fairway-relations.json",
                  "golf_query": "golf.query.txt",
                  "fairway_relations_query": "fairway-relations.query.txt",
                  "golf_endpoint": "golf.json.endpoint",
                  "fairway_relations_endpoint": "fairway-relations.json.endpoint"
              },
              "sha256": {
                  "golf": hashlib.sha256((root / "golf.json").read_bytes()).hexdigest(),
                  "fairway_relations": hashlib.sha256((root / "fairway-relations.json").read_bytes()).hexdigest()
              }
          }
          (root / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          print(json.dumps(manifest, indent=2))
          PY

      - name: Write OSM hole candidate report
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path("build") / os.environ["COURSE_ID"] / "osm"
          payload = json.loads((root / "golf.json").read_text())
          candidates = []
          for element in payload.get("elements", []) or []:
              tags = element.get("tags", {}) or {}
              if tags.get("golf") != "hole":
                  continue
              ref = str(tags.get("ref", "")).strip()
              geometry = element.get("geometry", []) or []
              points = [
                  (float(p["lat"]), float(p["lon"]))
                  for p in geometry
                  if "lat" in p and "lon" in p
              ]
              if points:
                  centre = {
                      "latitude": sum(p[0] for p in points) / len(points),
                      "longitude": sum(p[1] for p in points) / len(points),
                  }
              else:
                  centre = element.get("center")
              valid_ref = ref.isdigit() and 1 <= int(ref) <= 18
              candidates.append({
                  "classification": "numbered" if valid_ref else "unreferenced_candidate",
                  "type": element.get("type"),
                  "id": element.get("id"),
                  "ref": ref or None,
                  "tags": tags,
                  "centre": centre,
                  "node_count": len(points),
              })
          numbered = sorted(
              [x for x in candidates if x["classification"] == "numbered"],
              key=lambda x: int(x["ref"])
          )
          unreferenced = [
              x for x in candidates
              if x["classification"] == "unreferenced_candidate"
          ]
          report = {
              "schema": "uido.course.osm-hole-candidates.v0.1",
              "course_id": os.environ["COURSE_ID"],
              "course": os.environ["COURSE_NAME"],
              "purpose": "Diagnostic evidence only; candidates are not canonical course geometry.",
              "summary": {
                  "total_golf_hole_elements": len(candidates),
                  "numbered_elements": len(numbered),
                  "unreferenced_candidates": len(unreferenced),
                  "numbered_refs": [x["ref"] for x in numbered],
                  "missing_numbered_refs": [
                      str(i) for i in range(1, 19)
                      if str(i) not in {x["ref"] for x in numbered}
                  ],
              },
              "numbered": numbered,
              "unreferenced_candidates": unreferenced,
              "source": "osm/golf.json",
          }
          (root / "hole-candidates.json").write_text(json.dumps(report, indent=2) + "\n")
          print(json.dumps(report, indent=2))
          PY

      - name: Validate unreferenced hole candidate against independent evidence
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet rasterio numpy
          python3 - <<'PY'
          import json, math, os
          from pathlib import Path
          import numpy as np
          import rasterio
          from rasterio.warp import transform

          course = os.environ["COURSE_ID"]
          root = Path("build") / course
          osm = json.loads((root / "osm" / "golf.json").read_text())
          holes = [e for e in osm.get("elements", []) if (e.get("tags") or {}).get("golf") == "hole"]
          candidate = next((e for e in holes if e.get("type") == "way" and e.get("id") == 1227773787), None)
          if candidate is None:
              unref = [e for e in holes if not str((e.get("tags") or {}).get("ref", "")).strip().isdigit()]
              if len(unref) != 1:
                  raise SystemExit(f"Expected one unreferenced candidate, found {len(unref)}")
              candidate = unref[0]

          def pts(e):
              return [(float(p["lat"]), float(p["lon"])) for p in e.get("geometry", []) if "lat" in p and "lon" in p]
          def hav(a,b):
              la1,lo1,la2,lo2=map(math.radians,[a[0],a[1],b[0],b[1]])
              h=math.sin((la2-la1)/2)**2+math.cos(la1)*math.cos(la2)*math.sin((lo2-lo1)/2)**2
              return 6371008.8*2*math.asin(math.sqrt(h))

          geom=pts(candidate)
          centre=(sum(p[0] for p in geom)/len(geom),sum(p[1] for p in geom)/len(geom))
          neighbours={}
          for ref in ("3","5"):
              e=next((x for x in holes if str((x.get("tags") or {}).get("ref",""))==ref),None)
              if e:
                  g=pts(e)
                  c=(sum(p[0] for p in g)/len(g),sum(p[1] for p in g)/len(g))
                  neighbours[ref]={"id":e.get("id"),"centre":{"latitude":c[0],"longitude":c[1]},"distance_from_candidate_centre_m":hav(centre,c)}

          aerial=json.loads((root/"ea-aerial"/"manifest.json").read_text())
          lidar_manifest=json.loads((root/"ea-lidar"/"manifest.json").read_text())
          lidar={"status":lidar_manifest.get("status"),"year":lidar_manifest.get("year"),"resolution_m":lidar_manifest.get("resolution_m"),"coverage":"not_sampled","tiles":[]}
          samples=[]
          for tif in sorted((root/"ea-lidar"/"sources").rglob("*.tif")):
              with rasterio.open(tif) as ds:
                  xs,ys=transform("EPSG:4326",ds.crs,[p[1] for p in geom],[p[0] for p in geom])
                  inside=[ds.bounds.left<=x<=ds.bounds.right and ds.bounds.bottom<=y<=ds.bounds.top for x,y in zip(xs,ys)]
                  if not any(inside):
                      continue
                  vals=[float(v[0]) for v in ds.sample(list(zip(xs,ys)),indexes=1) if np.isfinite(v[0])]
                  if vals:
                      samples.extend(vals)
                      lidar["tiles"].append({"file":str(tif.relative_to(root)),"sample_count":len(vals),"elevation_min_m":min(vals),"elevation_max_m":max(vals),"elevation_range_m":max(vals)-min(vals)})

          if samples:
              lidar.update({"coverage":"covered","candidate_vertex_samples":len(samples),"elevation_min_m":min(samples),"elevation_max_m":max(samples),"elevation_range_m":max(samples)-min(samples)})

          path_length=sum(hav(geom[i],geom[i+1]) for i in range(len(geom)-1))
          report={
              "schema":"uido.course.osm-hole-candidate-validation.v0.1",
              "course_id":course,
              "candidate":{"type":candidate.get("type"),"id":candidate.get("id"),"tags":candidate.get("tags",{}),"centre":{"latitude":centre[0],"longitude":centre[1]},"node_count":len(geom),"path_length_m":path_length},
              "neighbour_context":neighbours,
              "independent_evidence":{
                  "aerial":{"status":aerial.get("status"),"reason":aerial.get("reason")},
                  "lidar":lidar
              },
              "assessment":{
                  "status":"candidate",
                  "canonical":False,
                  "reason":"LiDAR coverage confirms the candidate can be independently inspected, but source evidence alone does not prove its Hole 4 identity. Aerial coverage was recorded as returned by the EA acquisition stage."
              }
          }
          out=root/"osm"/"hole-candidate-validation.json"
          out.write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps(report,indent=2))
          PY

      - name: Preserve raw OSM capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uido-osm-raw-${{ inputs.course || 'northampton' }}
          path: build/${{ inputs.course || 'northampton' }}/osm/
          if-no-files-found: error
          retention-days: 14

      - name: Record OSM evidence gaps
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib
          manifest = json.loads((pathlib.Path("build") / os.environ["COURSE_ID"] / "osm" / "manifest.json").read_text())
          if manifest["status"] == "complete":
              print("PASS: OSM capture contains target hole refs 1..18")
          else:
              print(
                  "OSM evidence gap recorded; continuing to independent evidence sources: "
                  f"missing={manifest['missing_hole_refs']} unexpected={manifest['unexpected_hole_refs']}"
              )
          PY

      - name: Acquire EA aerial source
        run: |
          set -euo pipefail
          mkdir -p "build/$COURSE_ID/ea-aerial/packages" "build/$COURSE_ID/ea-aerial/sources"
          python3 - <<'PY'
          import hashlib, io, json, os, pathlib, time, urllib.request, zipfile
          search_url = "https://environment.data.gov.uk/backend/catalog/api/tiles/collections/survey/search"
          west, south, east, north = map(float, [os.environ["WEST"], os.environ["SOUTH"], os.environ["EAST"], os.environ["NORTH"]])
          polygon = {"type":"Polygon","coordinates":[[[west,south],[east,south],[east,north],[west,north],[west,south]]]}
          req = urllib.request.Request(
              search_url, data=json.dumps(polygon).encode(),
              headers={"Content-Type":"application/geo+json","Accept":"*/*",
                       "Origin":"https://environment.data.gov.uk","Referer":"https://environment.data.gov.uk/survey",
                       "User-Agent":"UiDo-course-builder/1.0"}, method="POST")
          with urllib.request.urlopen(req, timeout=120) as r:
              results = json.load(r).get("results", [])
          preferred_year = os.environ["AERIAL_YEAR"]
          preferred_res = float(os.environ["AERIAL_RES"])
          # The EA catalogue has changed metadata shape over time. Keep the
          # exact known product when present, but tolerate renamed aerial-product ids
          # as long as the catalogue identifies them as aerial photography.
          def scalar(value):
              if isinstance(value, dict):
                  return value.get("id") or value.get("value") or value.get("name")
              return value

          print(f"EA aerial catalogue returned {len(results)} records")
          candidates = []
          product_ids = set()
          for r in results:
              p, t = r.get("product", {}), r.get("tile", {})
              pid = str(scalar(p.get("id")) or "")
              product_ids.add(pid)
              year = scalar(p.get("year", r.get("year")))
              res = scalar(p.get("resolution", r.get("resolution")))
              tile = scalar(t.get("id", t))
              try:
                  res = float(res)
              except (TypeError, ValueError):
                  continue
              if not tile:
                  continue
              low = pid.lower()
              if pid == "vertical_aerial_photography_tiles_night_time" or ("aerial" in low and "photograph" in low):
                  candidates.append({"product":pid, "year":str(year), "resolution_m":res, "tile":str(tile)})

          print("EA aerial product ids:")
          for pid in sorted(product_ids):
              print(f"  {pid}")

          # Only vertical, orthorectified aerial photography is a valid
          # registration source. Oblique photography is deliberately excluded.
          preferred = [
              x for x in candidates
              if x["year"] == preferred_year
              and abs(x["resolution_m"] - preferred_res) < 1e-9
          ]
          if not preferred and candidates:
              best_res = min(x["resolution_m"] for x in candidates)
              same_res = [x for x in candidates if abs(x["resolution_m"] - best_res) < 1e-9]
              # Ignore records with unusable year metadata when choosing the fallback year.
              years = [x["year"] for x in same_res if x["year"] and x["year"].lower() not in {"none", "null"}]
              if years:
                  best_year = max(years)
                  preferred = [
                      x for x in same_res
                      if x["year"] == best_year
                  ]

          root = pathlib.Path("build") / os.environ["COURSE_ID"] / "ea-aerial"
          if not preferred:
              # Some course footprints have no EA vertical imagery even though the
              # catalogue returns other aerial products (notably oblique imagery).
              # Treat that as a legitimate source-availability state, not a build crash.
              manifest = {
                  "schema":"uido.course.ea-aerial-acquisition.v0.1",
                  "course_id":os.environ["COURSE_ID"],
                  "course":os.environ["COURSE_NAME"],
                  "status":"unavailable",
                  "requested":{"year":preferred_year,"resolution_m":preferred_res},
                  "reason":"No EA vertical aerial photography coverage was returned for this footprint",
                  "catalogue_product_ids":sorted(product_ids),
                  "tiles":[]
              }
              (root / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
              print(json.dumps(manifest, indent=2))
              raise SystemExit(0)
          root = pathlib.Path("build") / os.environ["COURSE_ID"] / "ea-aerial"
          captured = []
          unique = []
          seen = set()
          for x in preferred:
              key = (x["product"], x["year"], x["resolution_m"], x["tile"])
              if key not in seen:
                  seen.add(key)
                  unique.append(x)
          base = "https://environment.data.gov.uk/tiles/collections/survey"
          for x in unique:
              product = x.get("product") or "vertical_aerial_photography_tiles_night_time"
              res = str(x["resolution_m"]).rstrip("0").rstrip(".")
              url = f"{base}/{product}/{x['year']}/{res}/{x['tile']}?subscription-key=dspui"
              target = root / "packages" / f"{x['tile']}.zip"
              for attempt in range(1,5):
                  try:
                      req = urllib.request.Request(url, headers={
                          "Accept":"application/zip,*/*",
                          "Origin":"https://environment.data.gov.uk",
                          "Referer":"https://environment.data.gov.uk/survey",
                          "User-Agent":"UiDo-course-builder/1.0"
                      })
                      with urllib.request.urlopen(req, timeout=600) as rr: data = rr.read()
                      if len(data) < 1000: raise RuntimeError(f"response too small: {len(data)}")
                      with zipfile.ZipFile(io.BytesIO(data)) as z:
                          z.testzip(); names = z.namelist()
                          z.extractall(root / "sources" / x["tile"])
                      target.write_bytes(data)
                      captured.append({**x, "url":url, "bytes":len(data), "sha256":hashlib.sha256(data).hexdigest(), "members":names})
                      break
                  except Exception as exc:
                      if attempt == 4: raise SystemExit(f"EA aerial download failed for {x['tile']}: {exc}")
                      time.sleep(5 * 2 ** (attempt-1))
          (root / "manifest.json").write_text(json.dumps({
              "schema":"uido.course.ea-aerial-acquisition.v0.1",
              "course_id":os.environ["COURSE_ID"], "course":os.environ["COURSE_NAME"],
              "status":"captured", "tiles":captured
          }, indent=2) + "\n")
          print(json.dumps(captured, indent=2))
          PY

      - name: Acquire EA National LiDAR
        run: |
          set -euo pipefail
          mkdir -p "build/$COURSE_ID/ea-lidar/packages" "build/$COURSE_ID/ea-lidar/sources"
          python3 - <<'PY'
          import hashlib, io, json, os, pathlib, time, urllib.request, zipfile
          search_url = "https://environment.data.gov.uk/backend/catalog/api/tiles/collections/survey/search"
          west, south, east, north = map(float, [os.environ["WEST"], os.environ["SOUTH"], os.environ["EAST"], os.environ["NORTH"]])
          polygon = {"type":"Polygon","coordinates":[[[west,south],[east,south],[east,north],[west,north],[west,south]]]}
          req = urllib.request.Request(
              search_url, data=json.dumps(polygon).encode(),
              headers={"Content-Type":"application/geo+json","Accept":"*/*",
                       "Origin":"https://environment.data.gov.uk","Referer":"https://environment.data.gov.uk/survey",
                       "User-Agent":"UiDo-course-builder/1.0"}, method="POST")
          with urllib.request.urlopen(req, timeout=120) as r:
              results = json.load(r).get("results", [])
          wanted = {"national_lidar_programme_dtm","national_lidar_programme_dsm"}
          max_res = float(os.environ["LIDAR_MAX_RES"])
          candidates = []
          for r in results:
              p, t = r.get("product", {}), r.get("tile", {})
              pid = str(p.get("id", "")).lower()
              year, res = p.get("year", r.get("year")), p.get("resolution", r.get("resolution"))
              if isinstance(year, dict): year = year.get("id")
              if isinstance(res, dict): res = res.get("id")
              try: res = float(res)
              except (TypeError, ValueError): continue
              tile = str(t.get("id", ""))
              if pid in wanted and tile and res <= max_res:
                  candidates.append({"product":pid,"year":str(year),"resolution_m":res,"tile":tile})
          if not candidates:
              raise SystemExit("No EA National LiDAR DTM/DSM coverage found")
          best_res = min(x["resolution_m"] for x in candidates)
          best_year = max(x["year"] for x in candidates if abs(x["resolution_m"] - best_res) < 1e-9)
          selected = [x for x in candidates if abs(x["resolution_m"] - best_res) < 1e-9 and x["year"] == best_year]
          unique=[]; seen=set()
          for x in selected:
              key=(x["product"],x["year"],x["resolution_m"],x["tile"])
              if key not in seen: seen.add(key); unique.append(x)
          root = pathlib.Path("build") / os.environ["COURSE_ID"] / "ea-lidar"
          bases = [
              ("EA", "https://environment.data.gov.uk/tiles/collections/survey", "dspui"),
              ("Agrimetrics", "https://api.agrimetrics.co.uk/tiles/collections/survey", "public"),
          ]
          captured=[]
          failed=[]
          for x in unique:
              res=str(x["resolution_m"]).rstrip("0").rstrip(".")
              target=root/"packages"/f"{x['product']}-{x['year']}-{x['tile']}.zip"
              last_error=None
              for source_name, base, key in bases:
                  url=f"{base}/{x['product']}/{x['year']}/{res}/{x['tile']}?subscription-key={key}"
                  for attempt in range(1,5):
                      try:
                          req=urllib.request.Request(url,headers={"Accept":"application/zip,*/*","Origin":"https://environment.data.gov.uk","Referer":"https://environment.data.gov.uk/survey","User-Agent":"UiDo-course-builder/1.0"})
                          with urllib.request.urlopen(req,timeout=600) as rr: data=rr.read()
                          if len(data)<1000: raise RuntimeError(f"response too small: {len(data)}")
                          with zipfile.ZipFile(io.BytesIO(data)) as z:
                              z.testzip(); names=[n for n in z.namelist() if n.lower().endswith((".tif",".tiff"))]
                              z.extractall(root/"sources"/x["product"]/x["tile"])
                          target.write_bytes(data)
                          captured.append({**x,"source":source_name,"url":url,"bytes":len(data),"sha256":hashlib.sha256(data).hexdigest(),"rasters":names})
                          last_error=None
                          break
                      except Exception as exc:
                          last_error=f"{source_name}: {exc}"
                          if attempt<4: time.sleep(5*2**(attempt-1))
                  if any(y["product"]==x["product"] and y["tile"]==x["tile"] for y in captured):
                      break
              if last_error and not any(y["product"]==x["product"] and y["tile"]==x["tile"] for y in captured):
                  failed.append({**x,"error":last_error})

          # The EA catalogue can expose valid LiDAR coverage metadata before the
          # corresponding tile-download endpoint is available. Preserve that
          # acquisition state instead of turning the common course builder into a
          # hard failure. A later resolver can retry the recorded URLs.
          status = "captured" if not failed and {x["product"] for x in captured} == wanted else "partially_available" if captured else "unavailable"
          (root/"manifest.json").write_text(json.dumps({
              "schema":"uido.course.ea-lidar-acquisition.v0.1",
              "course_id":os.environ["COURSE_ID"], "course":os.environ["COURSE_NAME"],
              "status":status,"resolution_m":best_res,"year":best_year,
              "tiles":captured,"failed_tiles":failed
          },indent=2)+"\n")
          print(json.dumps({"status":status,"captured":captured,"failed_tiles":failed},indent=2))
          print(json.dumps(captured,indent=2))
          PY

      - name: Write acquisition manifest and summary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path("build") / os.environ["COURSE_ID"]
          source = json.loads(pathlib.Path(os.environ["SOURCE_MANIFEST"]).read_text())
          manifest = {
              "schema":"uido.course.acquisition.v0.2",
              "course_id":os.environ["COURSE_ID"],
              "course":os.environ["COURSE_NAME"],
              "target":source["target_course"],
              "registry":"course-models/COURSE_REGISTRY.json",
              "source_manifest":os.environ["SOURCE_MANIFEST"],
              "inputs":{
                  "osm":"osm/manifest.json",
                  "ea_aerial":"ea-aerial/manifest.json",
                  "ea_lidar":"ea-lidar/manifest.json"
              },
              "scope":"provider-neutral source acquisition only; course-specific model generation remains a separate stage"
          }
          (root/"acquisition-manifest.json").write_text(json.dumps(manifest,indent=2)+"\n")
          print(json.dumps(manifest,indent=2))
          PY
          find "build/$COURSE_ID" -maxdepth 4 -type f | sort
          du -sh "build/$COURSE_ID"

      - name: Upload course acquisition dataset
        uses: actions/upload-artifact@v4
        with:
          name: uido-course-acquisition-${{ inputs.course || 'northampton' }}
          path: build/${{ inputs.course || 'northampton' }}/
          retention-days: 14
