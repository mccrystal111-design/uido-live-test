name: AGNOSTIC45 Coordinate Grid Visual QA

on:
  workflow_dispatch:
    inputs:
      holes:
        description: "Comma-separated holes to capture"
        required: true
        default: "9"
      viewports:
        description: "Comma-separated width x height viewports"
        required: true
        default: "390x844,360x640,768x1024,1440x900"

jobs:
  visual-qa:
    name: Render coordinate-grid review screenshots
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
      options: --user 1001

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Playwright package
        run: npm install --no-save playwright@1.55.0

      - name: Start local server
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/uido-http.log 2>&1 &
          echo $! >/tmp/uido-http.pid

      - name: Capture coordinate-grid review
        env:
          HOLES: ${{ inputs.holes }}
          VIEWPORTS: ${{ inputs.viewports }}
        run: |
          mkdir -p visual-qa/coordinate-grid
          cat > /tmp/capture-agnostic45.mjs <<'EOF'
          import fs from 'node:fs';
          const { chromium } = await import(`${process.cwd()}/node_modules/playwright/index.mjs`);

          const holes = (process.env.HOLES || '9')
            .split(',')
            .map(value => Number(value.trim()))
            .filter(value => Number.isInteger(value) && value >= 1 && value <= 18);
          const viewports = (process.env.VIEWPORTS || '390x844,360x640,768x1024,1440x900')
            .split(',')
            .map(value => {
              const match = value.trim().match(/^(\d+)x(\d+)$/);
              return match ? { label: value.trim(), width: Number(match[1]), height: Number(match[2]) } : null;
            })
            .filter(value => value && value.width >= 240 && value.height >= 320);

          if (!holes.length || !viewports.length) {
            throw new Error('No valid holes or viewports supplied.');
          }

          const browser = await chromium.launch({ headless: true });
          const diagnostics = [];

          for (const viewport of viewports) {
            const context = await browser.newContext({
              viewport: { width: viewport.width, height: viewport.height },
              deviceScaleFactor: 1
            });

            for (const hole of holes) {
              const page = await context.newPage();
              const consoleMessages = [];
              const pageErrors = [];
              page.on('console', message => {
                if (message.type() === 'error' || message.type() === 'warning') {
                  consoleMessages.push({ type: message.type(), text: message.text() });
                }
              });
              page.on('pageerror', error => pageErrors.push(String(error)));

              const url = `http://127.0.0.1:8080/overstone/ag45v1-phone-bars-review.html?hole=${hole}`;
              const response = await page.goto(url, { waitUntil: 'networkidle' });
              await page.locator('#courseSvg').waitFor({ state: 'visible' });
              await page.waitForTimeout(250);

              const state = await page.evaluate(() => {
                const rect = selector => {
                  const element = document.querySelector(selector);
                  if (!element) return null;
                  const r = element.getBoundingClientRect();
                  return { x:r.x, y:r.y, width:r.width, height:r.height,
                    right:r.right, bottom:r.bottom };
                };
                const screen = rect('#screen');
                const svg = document.querySelector('#courseSvg');
                const grid = document.querySelector('.grid');
                const labels = document.querySelector('.axisLabels');
                const gridStyle = grid ? getComputedStyle(grid) : null;
                const labelStyle = labels ? getComputedStyle(labels) : null;
                const xLabelElements = [...document.querySelectorAll('.xAxis span')];
                const yLabelElements = [...document.querySelectorAll('.yAxis span')];
                const xLabels = xLabelElements.map(el => el.textContent.trim());
                const yLabels = yLabelElements.map(el => el.textContent.trim());
                const xLabelRects = xLabelElements.map(el => {
                  const r = el.getBoundingClientRect();
                  return {left:r.left,right:r.right,top:r.top,bottom:r.bottom};
                });
                const xLabelsFitScreen = !!screen && xLabelRects.every(r =>
                  r.left >= screen.x - 0.5 && r.right <= screen.right + 0.5
                );
                const xLabelsDoNotOverlap = xLabelRects.every((r,i) =>
                  i === 0 || r.left >= xLabelRects[i-1].right - 0.5
                );
                const expectedRatio = 9/16;
                const actualRatio = screen ? screen.width/screen.height : 0;
                const tolerance = 0.006;
                return {
                  title: document.title, screen,
                  svgViewBox: svg?.getAttribute('viewBox'),
                  svgPreserveAspectRatio: svg?.getAttribute('preserveAspectRatio'),
                  renderedGeometryPaths: document.querySelectorAll('#renderedGeometry path').length,
                  playline: Boolean(document.querySelector('#courseSvg .playline')),
                  clip: Boolean(document.querySelector('#holeViewClip')),
                  grid: grid ? { rect:rect('.grid'), backgroundImage:gridStyle.backgroundImage,
                    backgroundSize:gridStyle.backgroundSize, zIndex:gridStyle.zIndex } : null,
                  labels: labels ? { zIndex:labelStyle.zIndex, xLabels, yLabels } : null,
                  checks: {
                    screenNineBySixteen: !!screen && Math.abs(actualRatio-expectedRatio) <= tolerance,
                    expectedSvgViewBox: svg?.getAttribute('viewBox') === '0 0 100 177.7777777778',
                    svgPreserveAspectRatioNone: svg?.getAttribute('preserveAspectRatio') === 'none',
                    gridPresent: !!grid && !!gridStyle.backgroundImage && gridStyle.backgroundImage !== 'none',
                    gridAboveCourseGeometry: !!gridStyle && Number(gridStyle.zIndex) > 2,
                    labelsAboveGrid: !!labelStyle && Number(labelStyle.zIndex) > Number(gridStyle?.zIndex || 0),
                    xAxisHasElevenPercentLabels: xLabels.length === 11 && xLabels[0] === '0%' && xLabels[10] === '100%',
                    yAxisHasElevenPercentLabels: yLabels.length === 11 && yLabels[0] === '0%' && yLabels[10] === '100%',
                    xAxisLabelsFitInsideScreen: xLabelsFitScreen,
                    xAxisLabelsDoNotOverlap: xLabelsDoNotOverlap,
                    noHorizontalPageOverflow: document.documentElement.scrollWidth <= window.innerWidth,
                    noVerticalPageOverflow: document.documentElement.scrollHeight <= window.innerHeight
                  }
                };
              });

              const safeViewport = viewport.label.replace('x', '-');
              const imagePath = `visual-qa/coordinate-grid/hole-${hole}-${safeViewport}.png`;
              await page.screenshot({ path: imagePath, fullPage: false, animations: 'disabled' });

              diagnostics.push({
                hole, viewport, url, httpStatus: response?.status() ?? null,
                state, consoleMessages, pageErrors,
                allGridAndScaleChecksPassed: Object.values(state.checks).every(Boolean)
              });
              await page.close();
            }
            await context.close();
          }

          await browser.close();
          fs.writeFileSync('visual-qa/coordinate-grid/diagnostics.json', JSON.stringify(diagnostics, null, 2));
          const failures = diagnostics.filter(item =>
            item.httpStatus !== 200 || item.pageErrors.length ||
            !item.allGridAndScaleChecksPassed || item.state.renderedGeometryPaths === 0 ||
            !item.state.playline || !item.state.clip || !item.state.grid
          );
          console.log(`Captured ${diagnostics.length} hole/viewport combinations; ${failures.length} diagnostic failures.`);
          if (failures.length) {
            console.error(JSON.stringify(failures, null, 2));
            process.exitCode = 1;
          }
          EOF

          node /tmp/capture-agnostic45.mjs

      - name: Upload screenshots and diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: ag45v1-coordinate-grid-visual-qa
          path: visual-qa/coordinate-grid/
          retention-days: 7
          if-no-files-found: error
