name: UiDo wind UI update
on:
  push:
    paths:
      - '.github/workflows/wind-ui-v08.yml'
permissions:
  contents: write
jobs:
  update-wind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update wind interface
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('UiDo Live Test v0.7','UiDo Live Test v0.8')
          old='<div class="windcircle" id="windWheel"><div class="windring"></div><div class="windsector s1"></div><div class="windsector s2"></div><div class="windarrow" id="windArrow"></div><div class="windlabel wtop">HEAD</div><div class="windlabel wright">RIGHT</div><div class="windlabel wbottom">TAIL</div><div class="windlabel wleft">LEFT</div><div class="windcore" id="windCore">Into Left<br><span>2 clubs</span></div></div>'
          new='<div class="windcircle" id="windWheel"><div class="windring"></div><div class="windsector s1"></div><div class="windsector s2"></div><div class="windarrow" id="windArrow"></div><div class="windcore" id="windCore">Into<br><span>from in front</span></div></div>'
          s=s.replace(old,new)
          old2='<div class="windbuttons"><button class="windpick active" data-g="windStrength" data-v="2 clubs">2 clubs</button><button class="windpick" data-g="windStrength" data-v="1 club">1 club</button><button class="windpick" data-g="windStrength" data-v="½ club">½ club</button><button class="windpick" data-g="windStrength" data-v="Calm">Calm</button><button class="windpick" data-g="windStrength" data-v="Tail 1">Tail 1</button><button class="windpick" data-g="windStrength" data-v="Tail 2">Tail 2</button></div>'
          new2='<div class="windhint" id="windHint">Wind is coming from in front (into you)<br><span>Tap or drag around the circle to set direction</span></div><div class="windbuttons"><button class="windpick active" data-g="windStrength" data-v="2 clubs">2 clubs</button><button class="windpick" data-g="windStrength" data-v="1 club">1 club</button><button class="windpick" data-g="windStrength" data-v="½ club">½ club</button><button class="windpick" data-g="windStrength" data-v="Calm">Calm</button></div>'
          s=s.replace(old2,new2)
          s=s.replace('.windcircle:after{content:"TAP AROUND THE WHEEL";', '.windcircle:after{content:"";')
          s=s.replace('const S={screen:0,hole:1,shot:1,wind:"Into Left · 2 clubs",windStrength:"2 clubs",windAngle:225,', 'const S={screen:0,hole:1,shot:1,wind:"Into · 2 clubs",windStrength:"2 clubs",windAngle:0,')
          start=s.index('function windLabel(')
          end=s.index('document.querySelectorAll(\'.choice\')', start)
          replacement='''function windLabel(angle){const dirs=["Into","Into Right","Right","Helping Right","Helping","Helping Left","Left","Into Left"];return dirs[Math.round(((angle%360)+360)%360/45)%8]}\nfunction updateWind(){const label=windLabel(S.windAngle),strength=S.windStrength;S.wind=label+" · "+strength;document.getElementById("windCore").innerHTML=label+"<br><span>"+(label.startsWith("Into")?"from in front":"from behind")+"</span>";document.getElementById("windArrow").style.transform="rotate("+S.windAngle+"deg)";document.getElementById("windHint").innerHTML="Wind is coming from "+(label.startsWith("Into")?"in front":"behind")+(label.includes("Right")?" and right":label.includes("Left")?" and left":"")+(label.startsWith("Into")?" (into you)":" (helping)")+"<br><span>Tap or drag around the circle to set direction</span>";}\nfunction setWindFromPointer(e){const r=document.getElementById("windWheel").getBoundingClientRect();const cx=r.left+r.width/2,cy=r.top+r.height/2;const x=(e.clientX??e.touches?.[0]?.clientX)-cx,y=(e.clientY??e.touches?.[0]?.clientY)-cy;if(Math.hypot(x,y)<45)return;S.windAngle=(Math.atan2(x,-y)*180/Math.PI+360)%360;updateWind();}\nconst wheel=document.getElementById("windWheel");wheel.addEventListener("pointerdown",e=>{wheel.setPointerCapture?.(e.pointerId);setWindFromPointer(e)});wheel.addEventListener("pointermove",e=>{if(e.buttons)setWindFromPointer(e)});document.querySelectorAll(".windpick").forEach(b=>b.onclick=()=>{document.querySelectorAll(".windpick").forEach(x=>x.classList.remove("active"));b.classList.add("active");S.windStrength=b.dataset.v;updateWind()});updateWind();\n'''
          s=s[:start]+replacement+s[end:]
          marker='</style>'
          css='.windhint{background:#eef6f1;border:1px solid #dce9e2;border-radius:12px;text-align:center;padding:10px 8px;margin-top:6px;font-size:14px;font-weight:800;color:var(--ink)}.windhint span{font-size:11px;color:var(--muted);font-weight:500}.windbuttons{grid-template-columns:repeat(4,1fr)}.windpick{min-height:48px}'
          s=s.replace(marker,css+'</style>')
          p.write_text(s)
          PY
          git config user.name 'UiDo Bot'
          git config user.email 'uido@example.com'
          git add index.html
          git commit -m 'Fix wind direction language and controls' || true
          git push
      - name: Remove workflow
        if: always()
        run: |
          git rm .github/workflows/wind-ui-v08.yml || true
          git commit -m 'Remove one-shot wind update workflow' || true
          git push || true
