name: Add front middle back GPS distances
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch green distance comparison
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json
          p=Path('index.html'); s=p.read_text()
          points={"1":{"front":[-0.8151979,52.2776675],"middle":[-0.8150508742,52.2777593548],"back":[-0.8149234,52.2778714]},"2":{"front":[-0.8166103,52.2762446],"middle":[-0.8166885565,52.2761187565],"back":[-0.8167443,52.2759866]},"3":{"front":[-0.8090129,52.2778812],"middle":[-0.8087891217,52.2778988565],"back":[-0.8085902,52.2779135]},"4":{"front":[-0.8087878,52.2772533],"middle":[-0.8087677038,52.2771159346],"back":[-0.8087173,52.2769427]},"5":{"front":[-0.8078104,52.2776584],"middle":[-0.8077740714,52.277808219],"back":[-0.8077361,52.2779524]},"6":{"front":[-0.8122362,52.2781104],"middle":[-0.812469884,52.27808518],"back":[-0.8126753,52.2780397]},"7":{"front":[-0.8088696,52.2794216],"middle":[-0.8087506273,52.2795195045],"back":[-0.8085806,52.2796419]},"8":{"front":[-0.813574,52.2786921],"middle":[-0.8137855971,52.2786696441],"back":[-0.8139867,52.2786162]},"9":{"front":[-0.8196546,52.2769114],"middle":[-0.8197574241,52.2768185621],"back":[-0.819892,52.2767091]},"10":{"front":[-0.8150479,52.278392],"middle":[-0.81486075,52.278398615],"back":[-0.8146675,52.2784586]},"11":{"front":[-0.8217361,52.2796879],"middle":[-0.821899464,52.279755232],"back":[-0.8220921,52.2798081]},"12":{"front":[-0.8176194,52.2794821],"middle":[-0.8174479594,52.2793910406],"back":[-0.8173131,52.2792755]},"13":{"front":[-0.8178728,52.2807912],"middle":[-0.818040525,52.2808534417],"back":[-0.8181271,52.2809468]},"14":{"front":[-0.8220366,52.2803959],"middle":[-0.8221441346,52.2802766038],"back":[-0.8222846,52.2801546]},"15":{"front":[-0.8191666,52.2778876],"middle":[-0.8190806174,52.2777620348],"back":[-0.8190402,52.2776311]},"16":{"front":[-0.8226127,52.2790903],"middle":[-0.8228008455,52.2791599318],"back":[-0.8229746,52.2792116]},"17":{"front":[-0.8250631,52.2794846],"middle":[-0.8252090294,52.2794704294],"back":[-0.8253495,52.2794893]},"18":{"front":[-0.8200444,52.2765729],"middle":[-0.8199714121,52.276436597],"back":[-0.8198744,52.2762961]}}
          js=json.dumps(points,separators=(',',':'))
          marker='function setHole(h){'
          assert marker in s, 'setHole not found'
          injection='''const GREEN_POINTS='''+js+''';
          const COURSE_CENTER={lat:52.27789,lon:-0.81722};
          const COURSE_RADIUS_M=1400;
          let COURSE_DETECTED=false;
          function updateGreenDistances(){
            const tabs=document.querySelectorAll('.tabs .tab');
            if(!S.gps||!GREEN_POINTS[String(S.hole)]){tabs.forEach((t,i)=>t.innerHTML=['Front<br>— yd','Middle<br>— yd','Back<br>— yd'][i]);return;}
            const g=GREEN_POINTS[String(S.hole)];
            const d=Object.fromEntries(['front','middle','back'].map(k=>[k,yd(hav(S.gps.lat,S.gps.lon,g[k][1],g[k][0]))]));
            tabs[0].innerHTML=`Front<br>${d.front} yd`;tabs[1].innerHTML=`Middle<br>${d.middle} yd`;tabs[2].innerHTML=`Back<br>${d.back} yd`;
            const md=hav(S.gps.lat,S.gps.lon,COURSE_CENTER.lat,COURSE_CENTER.lon);
            COURSE_DETECTED=md<=COURSE_RADIUS_M+Math.max(0,S.gps.accuracy||0);
            S.course=COURSE_DETECTED?'Overstone Park':'Course not recognised';
            $('courseName').textContent=S.course;
            if(COURSE_DETECTED){
              const p=$('courseStatus');p.innerHTML=`<strong class="recognised">Overstone Park recognised</strong><span>GPS is ${Math.round(md)} m from the course centre.</span>`;
              $('flag').textContent=d.middle+' yd';$('liveFlag').textContent=d.middle+' yd';
            }else{$('flag').textContent='— yd';$('liveFlag').textContent='— yd';}
          }
          '''
          s=s.replace(marker,injection+marker,1)
          # Make every hole change refresh F/M/B.
          s=s.replace("$('holeSelect').onchange=e=>setHole(Number(e.target.value));", "$('holeSelect').onchange=e=>{setHole(Number(e.target.value));updateGreenDistances()};",1)
          # Refresh after GPS fix, and prevent the old placeholder pin from being the final value.
          pat=r"\$\('dot'\)\.style\.background='var\(--good\)';if\(holes\[S\.hole\]\)\{[^}]*\}"
          repl="$('dot').style.background='var(--good)';updateGreenDistances();persistRound();"
          ns,n=re.subn(pat,repl,s,count=1)
          assert n==1, 'GPS distance block not found'
          s=ns
          p.write_text(s)
          print('Green distances patched')
          PY
      - name: Validate
        run: |
          grep -q 'GREEN_POINTS' index.html
          grep -q 'updateGreenDistances' index.html
          echo 'Validation OK'
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/add-green-distances.yml
          git commit -m 'Add front middle back GPS distances'
          git rm .github/workflows/add-green-distances.yml
          git commit -m 'Remove one-time green distance workflow'
          git push
