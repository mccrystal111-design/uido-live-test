name: Deploy UiDo exact Home website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-exact-home
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Home from approved reference
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          home='''<section id="home" class="screen active">
            <div class="home-exact-bg"></div>
            <div class="home-exact-shade"></div>
            <div class="home-exact-top">
              <div class="home-exact-brand">UiDo</div>
              <div class="home-exact-course">OVERSTONE PARK</div>
              <div class="home-exact-hole">Hole 1 · Par 4</div>
              <div class="home-exact-actions"><button>⚙</button><button>☷</button></div>
            </div>
            <div class="home-exact-content">
              <div class="home-exact-logo">UiDo</div>
              <div class="home-exact-tag">PLAY SMARTER</div>
              <div class="home-exact-line"></div>
              <div class="home-exact-copy">Better decisions.<br>Lower scores.</div>
              <button class="home-exact-new" onclick="show('course')"><span>▶</span><b>New Round</b><i>›</i></button>
              <div class="home-exact-nav"><button><span>▥</span>Past Rounds</button><button><span>♙</span>Courses</button><button><span>⚙</span>Settings</button></div>
            </div>
          </section>'''
          s=re.sub(r'<section id="home" class="screen active">.*?</section>', home, s, count=1, flags=re.S)
          css='''
/* 🔒 EXACT HOME REFERENCE — website preview */
.home-exact-bg{position:absolute;inset:0;background:#062219 center/cover no-repeat;z-index:0}
.home-exact-shade{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,transparent 0%,transparent 55%,#001b1240 70%,#001b12a8 100%);pointer-events:none}
.home-exact-top{position:absolute;top:22px;left:22px;right:22px;z-index:3;color:#fff;text-shadow:0 1px 4px #0008}
.home-exact-brand{font-size:40px;line-height:1;font-weight:800;letter-spacing:-1.8px}
.home-exact-course{font-size:15px;line-height:1;margin-top:25px;font-weight:400}
.home-exact-hole{font-size:31px;line-height:1.05;margin-top:5px;font-weight:750;letter-spacing:-1px}
.home-exact-actions{position:absolute;top:2px;right:0;display:flex;gap:8px}
.home-exact-actions button{width:66px;height:66px;border:1px solid #fff;border-radius:16px;background:#075b3d9e;color:#fff;font-size:29px;display:grid;place-items:center}
.home-exact-content{position:absolute;left:24px;right:24px;bottom:30px;z-index:3;color:#fff;text-align:center}
.home-exact-logo{font-size:82px;line-height:.82;font-weight:900;letter-spacing:-5px;text-shadow:0 2px 6px #0007}
.home-exact-tag{font-size:13px;line-height:1;letter-spacing:6px;margin-top:12px;font-weight:500;text-shadow:0 1px 4px #0008}
.home-exact-line{width:46px;height:2px;background:#0bb77f;margin:10px auto 14px}
.home-exact-copy{font-size:20px;line-height:1.15;font-weight:400;text-shadow:0 1px 5px #0008;margin-bottom:24px}
.home-exact-new{width:100%;height:65px;border:1px solid #8de3c7;border-radius:14px;background:#075b3dd0;color:#fff;font-size:21px;display:flex;align-items:center;justify-content:center;gap:12px}
.home-exact-new span{font-size:27px}.home-exact-new b{font-weight:650}.home-exact-new i{font-style:normal;font-size:29px;margin-left:12px}
.home-exact-nav{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.home-exact-nav button{height:68px;border:1px solid #82b9aa;border-radius:14px;background:#0a3e3070;color:#fff;font-size:13px;line-height:1.15;text-shadow:0 1px 3px #0007}
.home-exact-nav button span{display:block;font-size:22px;line-height:1;margin-bottom:7px}
'''
          s=s.replace('</style>',css+'</style>',1)
          marker="<script src=\"https://unpkg.com/leaflet@1.9.4/dist/leaflet.js\"></script>"
          loader="""<script>fetch('approved-screens/home-background.b64').then(r=>r.text()).then(b=>{const u='data:image/jpeg;base64,'+b.trim();document.querySelector('.home-exact-bg').style.backgroundImage=`url(${u})`}).catch(()=>{});</script>"""
          s=s.replace(marker,loader+marker,1)
          p.write_text(s,encoding='utf-8')
      - name: Prepare Pages site
        run: |
          rm -rf _site
          mkdir _site
          cp index.html _site/index.html
          cp approved-screens/home-background.b64 _site/home-background.b64
          cp scorecard.js _site/scorecard.js 2>/dev/null || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
