name: UiDo Register Course

on:
  workflow_dispatch:
    inputs:
      provider_id:
        description: "GolfCourseAPI course ID from the discovery workflow"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: uido-course-registry
  cancel-in-progress: false

jobs:
  register:
    name: Register GolfCourseAPI course
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Register course
        env:
          GOLFCOURSEAPI_API_KEY: ${{ secrets.GOLFCOURSEAPI_API_KEY }}
        run: |
          set -euo pipefail
          python3 tools/course-discovery/register_course.py "${{ inputs.provider_id }}" | tee registration-result.json

      - name: Validate registry
        run: python3 tools/course-discovery/validate_registry.py

      - name: Commit registry update
        run: |
          set -euo pipefail
          if git diff --quiet -- course-models/COURSE_REGISTRY.json course-models/provider-data/golfcourseapi; then
            echo "No registry change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add course-models/COURSE_REGISTRY.json course-models/provider-data/golfcourseapi
          git commit -m "Register GolfCourseAPI course ${{ inputs.provider_id }}"
          git push

      - name: Publish registration result
        run: |
          {
            echo "## UiDo course registration"
            echo
            cat registration-result.json
          } >> "$GITHUB_STEP_SUMMARY"
