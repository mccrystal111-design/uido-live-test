name: UiDo Register Course

on:
  workflow_dispatch:
    inputs:
      provider_id:
        description: "GolfCourseAPI course ID from the discovery workflow"
        required: true
        type: string
      refresh_provider:
        description: "Force a fresh GolfCourseAPI detail pull (uses another API call)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: uido-course-registry
  cancel-in-progress: false

jobs:
  register:
    name: Register GolfCourseAPI course
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Register course
        env:
          GOLFCOURSEAPI_API_KEY: ${{ secrets.GOLFCOURSEAPI_API_KEY }}
        run: |
          set -euo pipefail
          refresh_args=()
          if [[ "${{ inputs.refresh_provider }}" == "true" ]]; then
            refresh_args+=(--refresh)
          fi
          python3 tools/course-discovery/register_course.py "${{ inputs.provider_id }}" "${refresh_args[@]}" | tee registration-result.json

      - name: Build canonical scorecard packet
        run: |
          set -euo pipefail
          python3 tools/course-discovery/build_scorecard_packet.py \
            "course-models/provider-data/golfcourseapi/${{ inputs.provider_id }}.json" \
            "course-models/scorecards/${{ inputs.provider_id }}.json"

      - name: Validate registry
        run: python3 tools/course-discovery/validate_registry.py

      - name: Commit registry update
        run: |
          set -euo pipefail
          git add course-models/COURSE_REGISTRY.json course-models/provider-data/golfcourseapi course-models/scorecards
          if git diff --cached --quiet; then
            echo "No registry/provider/scorecard change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Register GolfCourseAPI course ${{ inputs.provider_id }}"
          git push

      - name: Publish registration result
        run: |
          {
            echo "## UiDo course registration"
            echo
            cat registration-result.json
          } >> "$GITHUB_STEP_SUMMARY"
