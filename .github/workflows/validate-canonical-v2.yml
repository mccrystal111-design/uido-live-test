name: Validate Canonical Course v2

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Acquire Overstone OSM source
        run: |
          set -euo pipefail
          mkdir -p build/osm
          QUERY='[out:json][timeout:120];(nwr["golf"~"^(hole|pin|tee|green|bunker|rough|fairway|water_hazard|cartpath|path|wood|woodland|driving_range)$"](52.2755460,-0.8266019,52.2862605,-0.8076190););convert item ::=::,::geom=geom(),_osm_type=type();out geom;'
          curl -fsSL --retry 3 --data-urlencode "data=$QUERY" https://overpass-api.de/api/interpreter -o build/osm/overstone-golf.geojson
          python3 - <<'PY'
          import json
          d = json.load(open("build/osm/overstone-golf.geojson"))
          assert d.get("elements"), "Overpass returned no OSM golf elements"
          print(f"OSM source elements: {len(d['elements'])}")
          PY

      - name: Build provider-neutral source model
        run: |
          set -euo pipefail
          python3 tools/course-model/build_overstone_model.py --osm build/osm/overstone-golf.geojson --greens course_green_data.json --out build/overstone-course-model.json
          test -s build/overstone-course-model.json
          python3 - <<'PY'
          import json
          c = json.load(open("build/overstone-course-model.json"))
          assert c["schema_version"] == "uido.course.v0.2"
          assert len(c["holes"]) == 18
          assert all(h.get("routing") for h in c["holes"])
          assert all(h.get("tees") for h in c["holes"])
          assert all(h.get("fairways") for h in c["holes"])
          print("PROVIDER-NEUTRAL SOURCE MODEL: PASS")
          PY

      - name: Build canonical v2
        run: |
          set -euo pipefail
          mkdir -p build/canonical
          python3 tools/course-model/build_canonical_course.py --model build/overstone-course-model.json --out build/canonical/course.json
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("build/canonical/course.json")
          c = json.loads(p.read_text())
          assert c["schema"] == "uido.course.canonical.v2"
          assert c["geometry"]["scope"] == "course"
          assert len(c["holes"]) == 18
          ids = [str(f["id"]) for f in c["geometry"]["features"]]
          assert ids, "Canonical course contains no physical geometry"
          assert len(ids) == len(set(ids)), "Duplicate physical geometry identity detected"
          for hole in c["holes"]:
              assert set(hole) == {"hole_number", "par", "routing", "truth"}
              assert "features" not in hole
          for feature in c["geometry"]["features"]:
              assert "geometry" in feature
              assert "id" in feature
          print("CANONICAL V2 CONTRACT: PASS")
          print(json.dumps(c["validation"], indent=2))
          PY

      - name: Upload canonical v2 packet
        uses: actions/upload-artifact@v4
        with:
          name: uido-canonical-v2-${{ github.run_id }}
          path: build/canonical/course.json
          retention-days: 14
