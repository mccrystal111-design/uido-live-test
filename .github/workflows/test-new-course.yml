name: UiDo New Course End-to-End Test

# One deliberate GolfCourseAPI discovery call + one detail pull, then all
# downstream work uses the captured snapshot and OSM/EA physical sources.
on:
  workflow_dispatch:
    inputs:
      query:
        description: "Raw venue or course search term; do not add Golf, Club, Course, etc."
        required: true
        default: "Woburn"
        type: string
      country:
        description: "Country filter"
        required: true
        default: "United Kingdom"
        type: string

permissions:
  contents: write

jobs:
  discovery:
    name: 1. Discover venue and all courses
    runs-on: ubuntu-latest
    outputs:
      provider_ids: ${{ steps.select.outputs.provider_ids }}
      source: ${{ steps.select.outputs.source }}
    steps:
      - uses: actions/checkout@v4
      - name: Search GolfCourseAPI once
        env:
          GOLFCOURSEAPI_API_KEY: ${{ secrets.GOLFCOURSEAPI_API_KEY }}
          UIDO_DISCOVERY_QUERY: ${{ inputs.query }}
        run: |
          set -euo pipefail
          python3 tools/course-discovery/search_golfcourseapi.py "${{ inputs.query }}" --country "${{ inputs.country }}" --limit 10 > discovery-results.json
          cat discovery-results.json
      - name: Select venue and collect all courses
        id: select
        env:
          EXPECTED_NAME: ${{ inputs.query }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re

          data=json.load(open("discovery-results.json"))
          courses=data.get("courses",[])

          if not courses:
              print("GolfCourseAPI: no match. Falling back to OpenStreetMap evidence.")
              raise SystemExit(
                  "Venue-first multi-course discovery requires provider venue evidence; "
                  "OSM fallback is not yet wired to enumerate a venue's courses."
              )

          def tokens(value):
              return set(re.sub(r"[^a-z0-9]+"," ",value.casefold()).split())

          wanted=tokens(os.environ["EXPECTED_NAME"])

          def overlap(a, b):
              return len(a & b) / max(1, len(a | b))

          def venue_score(course):
              name=tokens(str(course.get("name") or ""))
              club=tokens(str(course.get("club_name") or ""))
              return max(overlap(wanted, name), overlap(wanted, club))

          # A venue search such as "Woburn" should resolve the venue first.
          # Once the venue is identified, retain every course returned for
          # that same venue instead of selecting one course arbitrarily.
          ranked=sorted(courses, key=venue_score, reverse=True)
          venue=ranked[0].get("club_name") or ranked[0].get("name") or ""
          if not venue:
              raise SystemExit("Discovery returned no usable venue name.")

          venue_courses=[
              course for course in courses
              if str(course.get("club_name") or "").casefold() == venue.casefold()
          ]

          if not venue_courses:
              raise SystemExit(f"No courses found for discovered venue: {venue}")

          provider_ids=[
              str(course["provider_id"])
              for course in venue_courses
              if course.get("provider_id")
          ]
          if len(provider_ids) != len(venue_courses):
              raise SystemExit("Every discovered course must have a provider_id.")

          print(json.dumps({
              "search_term": os.environ["EXPECTED_NAME"],
              "venue": venue,
              "courses": venue_courses,
              "provider_ids": provider_ids,
              "course_count": len(provider_ids),
              "source": "golfcourseapi",
          }, indent=2))

          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("provider_ids=" + ",".join(provider_ids) + "\n")
              f.write("source=golfcourseapi\n")
          PY

  registration:
    name: 2. Register all discovered courses
    needs: discovery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Register every discovered course without refresh
        env:
          GOLFCOURSEAPI_API_KEY: ${{ secrets.GOLFCOURSEAPI_API_KEY }}
          UIDO_DISCOVERY_QUERY: ${{ inputs.query }}
          PROVIDER_IDS: ${{ needs.discovery.outputs.provider_ids }}
        run: |
          set -euo pipefail
          IFS=',' read -ra IDS <<< "$PROVIDER_IDS"
          for provider_id in "${IDS[@]}"; do
            echo "Registering course: $provider_id"
            python3 tools/course-discovery/register_course.py "$provider_id" --expected-country "${{ inputs.country }}"
          done
      - name: Validate registry
        run: python3 tools/course-discovery/validate_registry.py
      - name: Commit registrations
        run: |
          set -euo pipefail
          git add course-models/COURSE_REGISTRY.json course-models/*_SOURCE_MANIFEST.json course-models/provider-data/golfcourseapi course-models/scorecards
          if git diff --cached --quiet; then
            echo "No registration changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Register venue courses for ${{ inputs.query }}"
          git push

  pipeline:
    name: 3. Physical acquisition → QA → wireframe
    needs: registration
    uses: ./.github/workflows/build-course.yml
    with:
      course: ""
      ref: main
    secrets: inherit
