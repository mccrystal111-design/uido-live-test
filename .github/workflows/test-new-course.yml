name: UiDo New Course End-to-End Test

# One deliberate GolfCourseAPI discovery call, then one detail pull per
# discovered course. Downstream work uses the captured provider snapshots and
# OSM/EA physical sources.
on:
  workflow_dispatch:
    inputs:
      query:
        description: "Raw venue or course search term; do not add Golf, Club, Course, etc."
        required: true
        default: "Woburn"
        type: string
      country:
        description: "Country filter"
        required: true
        default: "United Kingdom"
        type: string
      venue_selection:
        description: "Identity resolution: exact venue name selected after UiDo presents candidates; leave blank to auto-resolve."
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  discovery:
    name: 1. Discover venue and all courses
    runs-on: ubuntu-latest
    outputs:
      provider_ids: ${{ steps.select.outputs.provider_ids }}
      source: ${{ steps.select.outputs.source }}
    steps:
      - uses: actions/checkout@v4
      - name: Search GolfCourseAPI once
        env:
          GOLFCOURSEAPI_API_KEY: ${{ secrets.GOLFCOURSEAPI_API_KEY }}
          UIDO_DISCOVERY_QUERY: ${{ inputs.query }}
        run: |
          set -euo pipefail
          python3 tools/course-discovery/search_golfcourseapi.py "${{ inputs.query }}" --country "${{ inputs.country }}" --limit 10 > discovery-results.json
          cat discovery-results.json
      - name: Select venue and collect all courses
        id: select
        env:
          EXPECTED_NAME: ${{ inputs.query }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re

          data=json.load(open("discovery-results.json"))
          courses=data.get("courses",[])

          if not courses:
              raise SystemExit(
                  "No provider courses found for the search term. "
                  "Venue-first OSM enumeration is the next fallback slice."
              )

          def tokens(value):
              return set(re.sub(r"[^a-z0-9]+"," ",value.casefold()).split())

          wanted=tokens(os.environ["EXPECTED_NAME"])

          def overlap(a, b):
              return len(a & b) / max(1, len(a | b))

          def venue_score(course):
              name=tokens(str(course.get("name") or ""))
              club=tokens(str(course.get("club_name") or ""))
              return max(overlap(wanted, name), overlap(wanted, club))

          # Resolve the venue first. A venue search must retain every course
          # belonging to that venue rather than selecting one course.
          ranked=sorted(courses, key=venue_score, reverse=True)
          venue=ranked[0].get("club_name") or ""
          if not venue:
              raise SystemExit("Discovery returned no usable venue name.")

          venue_courses=[
              course for course in courses
              if str(course.get("club_name") or "").casefold() == venue.casefold()
          ]

          if not venue_courses:
              raise SystemExit(f"No courses found for discovered venue: {venue}")

          provider_ids=[
              str(course["provider_id"])
              for course in venue_courses
              if course.get("provider_id")
          ]
          if len(provider_ids) != len(venue_courses):
              raise SystemExit("Every discovered course must have a provider_id.")

          print(json.dumps({
              "search_term": os.environ["EXPECTED_NAME"],
              "venue": venue,
              "courses": venue_courses,
              "provider_ids": provider_ids,
              "course_count": len(provider_ids),
              "source": "golfcourseapi",
          }, indent=2))

          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("provider_ids=" + ",".join(provider_ids) + "\n")
              f.write("source=golfcourseapi\n")
          PY

  registration:
    name: 2. Register all discovered courses
    needs: discovery
    runs-on: ubuntu-latest
    outputs:
      course_ids: ${{ steps.result.outputs.course_ids }}
      source_ref: ${{ steps.commit.outputs.source_ref }}
    steps:
      - uses: actions/checkout@v4
      - name: Register every discovered course
        env:
          GOLFCOURSEAPI_API_KEY: ${{ secrets.GOLFCOURSEAPI_API_KEY }}
          UIDO_DISCOVERY_QUERY: ${{ inputs.query }}
          PROVIDER_IDS: ${{ needs.discovery.outputs.provider_ids }}
        run: |
          set -euo pipefail
          IFS=',' read -ra IDS <<< "$PROVIDER_IDS"
          for provider_id in "${IDS[@]}"; do
            echo "Registering course: $provider_id"
            python3 tools/course-discovery/register_course.py "$provider_id" --expected-country "${{ inputs.country }}"
            python3 tools/course-discovery/build_scorecard_packet.py               "course-models/provider-data/golfcourseapi/$provider_id.json"               "course-models/scorecards/$provider_id.json"
          done
      - name: Validate registry and scorecards
        run: |
          set -euo pipefail
          python3 tools/course-discovery/validate_registry.py
          IFS=',' read -ra IDS <<< "${{ needs.discovery.outputs.provider_ids }}"
          for provider_id in "${IDS[@]}"; do
            python3 tools/course-discovery/validate_scorecard_packet.py "course-models/scorecards/$provider_id.json"
          done
      - name: Capture registered course ids
        id: result
        env:
          PROVIDER_IDS: ${{ needs.discovery.outputs.provider_ids }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          registry=json.load(open("course-models/COURSE_REGISTRY.json"))
          providers={p for p in os.environ["PROVIDER_IDS"].split(",") if p}
          matches=[]
          for course_id, course in registry.get("courses", {}).items():
              if str((course.get("identity") or {}).get("provider_id")) in providers:
                  matches.append(course_id)
          if len(matches) != len(providers):
              raise SystemExit(
                  f"Expected {len(providers)} registered courses, found {len(matches)}: {matches}"
              )
          print("course_ids=" + json.dumps(sorted(matches)))
          PY
      - name: Commit registrations
        id: commit
        run: |
          set -euo pipefail
          git add course-models/COURSE_REGISTRY.json course-models/*_SOURCE_MANIFEST.json course-models/provider-data/golfcourseapi course-models/scorecards
          if git diff --cached --quiet; then
            echo "No registration changes required."
            echo "source_ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Register venue courses for ${{ inputs.query }}"
          git push
          echo "source_ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  pipeline:
    name: 3. Physical acquisition → QA → wireframe
    needs: registration
    strategy:
      fail-fast: false
      matrix:
        course: ${{ fromJSON(needs.registration.outputs.course_ids) }}
    uses: ./.github/workflows/build-course.yml
    with:
      course: ${{ matrix.course }}
      ref: ${{ needs.registration.outputs.source_ref }}
      venue_selection: ${{ inputs.venue_selection }}
    secrets: inherit
