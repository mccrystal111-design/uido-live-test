name: UiDo switch to fresh PWA manifest
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('manifest.webmanifest?v=2','manifest-v3.webmanifest',1)
          p.write_text(s)
          PY
          grep -q 'manifest-v3.webmanifest' index.html
      - name: Commit and clean up
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Use fresh UiDo PWA manifest'
          git push
          rm .github/workflows/switch-to-v3-manifest.yml
          git add .github/workflows/switch-to-v3-manifest.yml
          git commit -m 'Remove one-time manifest workflow'
          git push
