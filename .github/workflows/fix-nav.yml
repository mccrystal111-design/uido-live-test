name: UiDo fix navigation
on:
  push:
    paths:
      - '.github/workflows/fix-nav.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore visible navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<div class="dataTools"><button class="btn light" id="exportRound">Export Round Data</button><button class="btn secondary" id="newRound">New Round</button></div>','')
          p.write_text(s)
          PY
      - name: Validate and commit
        run: |
          grep -q 'class="nav"' index.html
          grep -q 'class="btn next"' index.html
          grep -q 'id="headExport"' index.html
          grep -q 'id="headNewRound"' index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/fix-nav.yml
          git commit -m 'Restore visible next navigation'
          git push
