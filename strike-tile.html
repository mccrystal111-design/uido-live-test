<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>UiDo · Strike</title>
<link rel="stylesheet" href="strike-tile.css">
</head>
<body>
<main class="tile" data-tile="strike">
  <header><div class="eyebrow">SHOT INPUT</div><h1>Strike</h1><p>Choose the contact point across both rows, then confirm.</p></header>
  <section class="axis" aria-label="Vertical contact">
    <div class="axis-label">VERTICAL</div>
    <div class="options">
      <button class="option" type="button" data-axis="vertical" data-value="High" aria-pressed="false">High</button>
      <button class="option" type="button" data-axis="vertical" data-value="Centre" aria-pressed="false">Centre</button>
      <button class="option" type="button" data-axis="vertical" data-value="Low" aria-pressed="false">Low</button>
    </div>
  </section>
  <section class="axis" aria-label="Horizontal contact">
    <div class="axis-label">HORIZONTAL</div>
    <div class="options">
      <button class="option" type="button" data-axis="horizontal" data-value="Toe" aria-pressed="false">Toe</button>
      <button class="option" type="button" data-axis="horizontal" data-value="Centre" aria-pressed="false">Centre</button>
      <button class="option" type="button" data-axis="horizontal" data-value="Heel" aria-pressed="false">Heel</button>
    </div>
  </section>
  <footer><span id="selectionStatus" aria-live="polite">Choose both contact points</span><button id="confirm" class="confirm" type="button" disabled aria-label="Confirm strike">✓</button></footer>
</main>
<script src="strike-tile.js"></script>
</body>
</html>
