<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>UiDo — Club Tile</title><style>@import url('https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600&display=swap');:root{--yellow:#ffd600}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#183b27}body{font-family:Oxanium,sans-serif;color:#fff}.stage{width:100vw;height:100dvh;display:grid;place-items:center;padding:22px;background:linear-gradient(rgba(18,28,24,.56),rgba(18,28,24,.56)),url('assets/home-exact.jpg') center/cover no-repeat}.tile{position:relative;width:min(88vw,520px);aspect-ratio:1;border:1px solid rgba(255,255,255,.24);border-radius:28px;background:rgba(18,31,27,.62);backdrop-filter:blur(10px) saturate(110%);-webkit-backdrop-filter:blur(10px) saturate(110%);overflow:hidden}.help{position:absolute;right:5.5%;top:5.5%;width:10%;aspect-ratio:1;border:1.5px solid rgba(255,214,0,.78);border-radius:50%;background:rgba(18,31,27,.38);cursor:pointer;z-index:8;display:grid;place-items:center;padding:0}.help img{width:62%;height:62%;object-fit:contain}.club-circle{position:absolute;left:50%;top:50%;width:96%;height:96%;transform:translate(-50%,-50%);border-radius:50%;overflow:hidden;background:rgba(18,31,27,.34);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}.headers{position:absolute;left:10%;right:10%;top:15%;display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center;align-items:center;font-size:clamp(12px,3vw,17px);letter-spacing:.09em;color:rgba(255,255,255,.62);z-index:5}.roller{position:absolute;left:8%;right:8%;top:calc(50% - 82.5px);height:165px;overflow:hidden;touch-action:none;cursor:ns-resize;z-index:4;border-radius:20px;background:rgba(18,31,27,.78)}.roller:before,.roller:after{content:"";position:absolute;left:0;right:0;height:24px;z-index:3;pointer-events:none}.roller:before{top:0;background:linear-gradient(rgba(18,31,27,.82),rgba(18,31,27,0))}.roller:after{bottom:0;background:linear-gradient(rgba(18,31,27,0),rgba(18,31,27,.82))}.selection-frame{position:absolute;left:0;right:0;top:50%;width:100%;height:55px;transform:translateY(-50%);z-index:6;pointer-events:none;object-fit:fill}.rows{position:absolute;left:0;right:0;top:50%;height:auto;transform:translateY(-27.5px)}.club-row{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;text-align:center;height:55px;margin:0;border:0;border-radius:12px;font-size:clamp(16px,4.2vw,23px);color:rgba(255,255,255,.48);transition:color .12s,font-weight .12s,background .12s}.club-row.selected{background:rgba(18,31,27,.78);color:#fff;font-weight:600}.club-row.selected .club,.club-row.selected .carry,.club-row.selected .total{font-weight:600}.check{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);width:12%;min-width:50px;max-width:62px;aspect-ratio:1;border:1.5px solid rgba(255,214,0,.88);border-radius:50%;background:rgba(18,31,27,.94);display:grid;place-items:center;padding:0;cursor:pointer;z-index:7}.check img{width:62%;height:62%;object-fit:contain}.check:active{transform:translateX(-50%) scale(.96);filter:brightness(1.18)}.countdown{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(8,16,13,.72);backdrop-filter:blur(3px);z-index:12}.countdown.show{display:flex}.count-number{font:600 110px/1 Oxanium}.next-advice{margin-top:20px;text-align:center}.next-label{font-size:14px;color:rgba(255,255,255,.58);letter-spacing:.12em;margin-bottom:7px}.next-value{font-size:clamp(18px,4.8vw,28px)}.next-value strong{color:var(--yellow);font-weight:600}.result{position:absolute;inset:0;background:rgba(8,16,13,.94);z-index:11;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center}.result.show{display:flex}.result-main{font-size:clamp(28px,7vw,46px);font-weight:600}.result-sub{margin-top:12px;font-size:15px;color:rgba(255,255,255,.62)}.modal{position:absolute;inset:0;background:rgba(8,16,13,.72);backdrop-filter:blur(4px);display:none;place-items:center;padding:9%;z-index:15}.modal.show{display:grid}.modal-card{width:100%;max-width:360px;border:1px solid rgba(255,255,255,.24);border-radius:20px;background:rgba(25,39,34,.94);padding:24px;text-align:center}.modal-card h2{margin:0 0 12px;font-size:24px;font-weight:500}.modal-card p{margin:0 0 20px;font:400 15px/1.45 Arial,sans-serif;color:rgba(255,255,255,.8)}.close{border:1px solid rgba(255,255,255,.24);border-radius:15px;background:rgba(255,255,255,.1);color:#fff;padding:12px 22px;font:500 16px Oxanium}@media(max-width:420px){.tile{width:91vw;border-radius:24px}.headers{font-size:12px;top:16%}.roller{left:7%;right:7%;top:calc(50% - 82.5px);height:165px;border-radius:18px}.club-row{height:55px}.check{width:14%;min-width:50px}}</style></head><body><main class="stage"><section class="tile" aria-label="UiDo Club Tile"><div class="club-circle"><div class="headers"><div>CLUB</div><div>CARRY</div><div>TOTAL</div></div><div class="roller" id="roller"><img class="selection-frame" src="assets/uido-club-selection-frame.svg" alt=""><div class="rows" id="rows"></div></div></div><button class="help" id="help"><img src="assets/uido-question-mark-white.svg?v=1" alt="Help"></button><button class="check" id="confirm" aria-label="Confirm club"><img src="assets/uido-check-white.svg" alt="Confirm"></button><div class="countdown" id="countdown"><div class="count-number" id="countNumber">3</div><div class="next-advice"><div class="next-label">NEXT</div><div class="next-value"><strong>CLUB</strong> · RECOMMENDATION</div></div></div><div class="result" id="result"><div class="result-main">START LINE</div><div class="result-sub" id="resultSub">Club confirmed.</div></div><div class="modal" id="modal"><div class="modal-card"><h2>Club</h2><p>UiDo recommends a club using the available shot and course information. Scroll the roller to change it, then tap the tick to confirm.</p><button class="close" id="close">Got it</button></div></div></section></main><script>const clubs=[['4i','178','190'],['5i','167','178'],['6i','156','167'],['7i','145','155'],['8i','134','144'],['9i','123','133'],['PW','112','122'],['GW','100','110'],['SW','88','98'],['LW','76','86']];let selected=3;const rows=document.getElementById('rows'),roller=document.getElementById('roller'),countdown=document.getElementById('countdown'),countNumber=document.getElementById('countNumber'),result=document.getElementById('result'),resultSub=document.getElementById('resultSub'),modal=document.getElementById('modal');function render(){rows.innerHTML=clubs.map((c,i)=>`<div class="club-row ${i===selected?'selected':''}"><div class="club">${c[0]}</div><div class="carry">${c[1]}</div><div class="total">${c[2]}</div></div>`).join('');rows.style.transform=`translateY(${-selected*55-27.5}px)`}function move(dir){selected=Math.max(0,Math.min(clubs.length-1,selected+dir));render()}let sy=0,drag=false;roller.addEventListener('touchstart',e=>{sy=e.touches[0].clientY;drag=true},{passive:true});roller.addEventListener('touchmove',e=>{if(!drag)return;const dy=e.touches[0].clientY-sy;if(Math.abs(dy)>30){move(dy<0?1:-1);sy=e.touches[0].clientY}},{passive:true});roller.addEventListener('touchend',()=>drag=false);roller.addEventListener('wheel',e=>{e.preventDefault();move(e.deltaY>0?1:-1)},{passive:false});document.getElementById('confirm').onclick=()=>{resultSub.textContent=`${clubs[selected][0]} confirmed · ${clubs[selected][1]} carry · ${clubs[selected][2]} total`;result.classList.add('show')};document.getElementById('help').onclick=()=>modal.classList.add('show');document.getElementById('close').onclick=()=>modal.classList.remove('show');function showCountdown(){let n=3;countNumber.textContent=n;countdown.classList.add('show');const t=setInterval(()=>{n--;if(n>0)countNumber.textContent=n;else{clearInterval(t);countdown.classList.remove('show')}},1000)}render();showCountdown();</script></body></html>
