<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 100 100">
  <g fill="none" vector-effect="non-scaling-stroke">
    <!-- Outer boundary -->
    <circle cx="50" cy="50" r="49" stroke="rgba(255,255,255,0.20)" stroke-width="1.1" fill="rgba(255,255,255,0.018)"/>
    <!-- Decorative rings -->
    <circle cx="50" cy="50" r="44" stroke="rgba(255,255,255,0.11)" stroke-width="0.8"/>
    <circle cx="50" cy="50" r="36" stroke="rgba(255,255,255,0.11)" stroke-width="0.8"/>
    <!-- Eight radial dividers -->
    <g stroke="rgba(255,255,255,0.15)" stroke-width="1.05" stroke-linecap="round">
      <line x1="50" y1="1" x2="50" y2="99"/>
      <line x1="1" y1="50" x2="99" y2="50"/>
      <line x1="15.35" y1="15.35" x2="84.65" y2="84.65"/>
      <line x1="84.65" y1="15.35" x2="15.35" y2="84.65"/>
    </g>
  </g>
</svg>
