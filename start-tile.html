<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>UiDo — Start Tile</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600&display=swap');
:root{--yellow:#ffd600}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#183b27}body{font-family:Oxanium,sans-serif;color:#fff}.stage{width:100vw;height:100dvh;display:grid;place-items:center;padding:22px;background:linear-gradient(rgba(18,28,24,.56),rgba(18,28,24,.56)),url('assets/home-exact.jpg') center/cover no-repeat}.tile{position:relative;width:min(88vw,520px);aspect-ratio:1;border:1px solid rgba(255,255,255,.24);border-radius:28px;background:rgba(18,31,27,.62);backdrop-filter:blur(10px) saturate(110%);-webkit-backdrop-filter:blur(10px) saturate(110%);overflow:hidden}.circle{position:absolute;left:50%;top:50%;width:96%;height:96%;transform:translate(-50%,-50%);border-radius:50%;overflow:hidden;background:rgba(18,31,27,.34);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}.header{position:absolute;left:0;right:0;top:15%;text-align:center;font-size:clamp(12px,3vw,17px);letter-spacing:.09em;color:rgba(255,255,255,.62)}.swipe-area{position:absolute;left:8%;right:8%;top:24%;bottom:18%;touch-action:pan-y;display:flex;align-items:center;justify-content:center;z-index:4}.options{width:100%;display:flex;align-items:center;justify-content:space-around}.option{width:30%;display:flex;flex-direction:column;align-items:center;gap:12px;color:rgba(255,255,255,.38);transition:color .18s,transform .18s}.option.active{color:#fff;transform:scale(1.06)}.label{font-size:clamp(11px,3vw,15px);font-weight:500;letter-spacing:.09em}.arrow{width:82px;height:124px;object-fit:contain;display:block;transition:opacity .18s}.arrow.pull{transform:rotate(-45deg)}.arrow.straight{transform:rotate(0deg)}.arrow.push{transform:rotate(45deg)}.option:not(.active) .arrow{opacity:.55}.hint{position:absolute;left:0;right:0;bottom:9%;text-align:center;font-size:10px;letter-spacing:.1em;color:rgba(255,255,255,.3)}.check{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);width:12%;min-width:50px;max-width:62px;aspect-ratio:1;border:1.5px solid rgba(255,214,0,.88);border-radius:50%;background:rgba(18,31,27,.94);display:grid;place-items:center;padding:0;cursor:pointer;z-index:7}.check img{width:62%;height:62%;object-fit:contain}.check:active{transform:translateX(-50%) scale(.96)}.result{position:absolute;inset:0;background:rgba(8,16,13,.94);z-index:11;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center}.result.show{display:flex}.result-main{font-size:clamp(28px,7vw,46px);font-weight:600}.result-sub{margin-top:12px;font-size:15px;color:rgba(255,255,255,.62)}@media(max-width:420px){.tile{width:91vw;border-radius:24px}.header{top:16%;font-size:12px}.swipe-area{left:7%;right:7%}.arrow{width:70px;height:108px}.check{width:14%;min-width:50px}}
</style>
</head>
<body><main class="stage"><section class="tile" aria-label="UiDo Start Tile"><div class="circle"><div class="header">SHOT START</div><div class="swipe-area" id="swipe"><div class="options"><div class="option"><img class="arrow pull" src="assets/uido-arrow-white.svg" alt="Pull"><div class="label">PULL</div></div><div class="option active"><img class="arrow straight" src="assets/uido-arrow-white.svg" alt="Straight"><div class="label">STRAIGHT</div></div><div class="option"><img class="arrow push" src="assets/uido-arrow-white.svg" alt="Push"><div class="label">PUSH</div></div></div><div class="hint">SWIPE</div></div></div><button class="check" id="confirm" aria-label="Confirm shot start"><img src="assets/uido-check-white.svg" alt="Confirm"></button><div class="result" id="result"><div class="result-main" id="resultMain">STRAIGHT</div><div class="result-sub">Shot start confirmed.</div></div></section></main><script>const options=['PULL','STRAIGHT','PUSH'];let selected=1;const swipe=document.getElementById('swipe'),result=document.getElementById('result'),resultMain=document.getElementById('resultMain');function render(){document.querySelectorAll('.option').forEach((el,i)=>el.classList.toggle('active',i===selected))}function choose(dir){selected=Math.max(0,Math.min(2,selected+dir));render()}let sx=0,sy=0,drag=false;swipe.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;sx=e.touches[0].clientX;sy=e.touches[0].clientY;drag=true},{passive:true});swipe.addEventListener('touchend',e=>{if(!drag)return;drag=false;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>35&&Math.abs(dx)>Math.abs(dy))choose(dx<0?1:-1)});swipe.addEventListener('wheel',e=>{e.preventDefault();choose(e.deltaY>0?1:-1)},{passive:false});document.getElementById('confirm').onclick=()=>{resultMain.textContent=options[selected];result.classList.add('show')};render();</script></body></html>
