<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>UiDo — Home Preview</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--green:#075b3d;--green2:#006b4f;--white:#fff}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#062219;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.app{width:min(430px,100vw);height:100dvh;margin:auto;position:relative;overflow:hidden;background:#062219}
#map{position:absolute;inset:0;z-index:0}
.shade{position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,#00000018 0%,transparent 32%,#001b1238 55%,#001b12d8 100%)}
.home{position:absolute;inset:0;z-index:2;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 28px 34px;text-align:center}
.logo{font-weight:900;font-size:72px;line-height:.82;letter-spacing:-5px;text-shadow:0 2px 6px #0007;margin-bottom:18px}
.tag{font-size:13px;line-height:1;letter-spacing:6px;font-weight:500;text-shadow:0 1px 4px #0008;margin-bottom:13px}
.line{width:43px;height:2px;background:#0bb77f;margin-bottom:16px;box-shadow:0 1px 4px #0006}
.copy{font-size:18px;line-height:1.18;font-weight:400;text-shadow:0 1px 5px #0008;margin-bottom:25px}
.new{width:100%;height:58px;border:1px solid #7fd6bc;border-radius:14px;background:#075b3dd9;color:#fff;font-size:19px;font-weight:650;display:flex;align-items:center;justify-content:center;gap:15px;box-shadow:0 2px 8px #0004}
.new .play{font-size:25px;line-height:1}
.new .chev{font-size:29px;font-weight:300;margin-left:3px}
.nav{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px}
.nav button{height:61px;border:1px solid #82b9aa;border-radius:14px;background:#0a3e3070;color:#fff;font-size:12px;line-height:1.15;font-weight:400;text-shadow:0 1px 3px #0007}
.nav .ico{display:block;font-size:20px;line-height:1;margin-bottom:7px}
.leaflet-control-container{display:none}
</style>
</head>
<body>
<div class="app">
  <div id="map"></div>
  <div class="shade"></div>
  <main class="home">
    <div class="logo">UiDo</div>
    <div class="tag">PLAY SMARTER</div>
    <div class="line"></div>
    <div class="copy">Better decisions.<br>Lower scores.</div>
    <button class="new"><span class="play">▶</span><span>New Round</span><span class="chev">›</span></button>
    <div class="nav">
      <button><span class="ico">▥</span>Past Rounds</button>
      <button><span class="ico">♙</span>Courses</button>
      <button><span class="ico">⚙</span>Settings</button>
    </div>
  </main>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map',{zoomControl:false,attributionControl:false,dragging:false,scrollWheelZoom:false,doubleClickZoom:false,boxZoom:false,keyboard:false,touchZoom:false}).setView([52.27789,-0.81722],17);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19}).addTo(map);
</script>
</body>
</html>
