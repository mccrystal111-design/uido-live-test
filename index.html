<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>UiDo</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17392d;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#fff}
.app{position:relative;width:100vw;height:100dvh;overflow:hidden;background:#17392d}
#map{position:absolute;inset:0;z-index:0}
.leaflet-control-attribution{font-size:7px;opacity:.55}
.shade{position:absolute;inset:0;z-index:1;background:linear-gradient(to bottom,rgba(0,0,0,.20) 0%,rgba(0,0,0,.02) 42%,rgba(0,0,0,.26) 100%);pointer-events:none}
.top{position:absolute;z-index:3;top:3.2%;left:3.2%;right:3.2%;display:flex;justify-content:space-between;align-items:flex-start}
.identity{text-shadow:0 2px 8px rgba(0,0,0,.42)}
.brand{font-size:clamp(29px,5.9vw,41px);line-height:.9;font-weight:800;letter-spacing:-1.9px}
.course{margin-top:20px;font-size:clamp(11px,2.2vw,15px);font-weight:600;letter-spacing:.1px}
.hole{margin-top:3px;font-size:clamp(21px,4.5vw,31px);font-weight:720;letter-spacing:-.4px}
.actions{display:flex;gap:10px}
.actions button{width:clamp(52px,9.55vw,66px);height:clamp(52px,9.55vw,66px);border:0;border-radius:15px;background:rgba(16,48,37,.72);color:#fff;font-size:clamp(23px,4.2vw,29px);display:grid;place-items:center;box-shadow:0 3px 12px rgba(0,0,0,.22);backdrop-filter:blur(3px)}
.home{position:absolute;z-index:3;left:5%;right:5%;bottom:3.8%;display:flex;flex-direction:column;align-items:center;text-align:center;text-shadow:0 2px 8px rgba(0,0,0,.48)}
.logo{font-size:clamp(51px,10.4vw,72px);font-weight:850;letter-spacing:-4.7px;line-height:.85}
.tag{margin-top:9px;font-size:clamp(9px,1.9vw,13px);font-weight:600;letter-spacing:clamp(4px,1vw,6px)}
.line{width:43px;height:2px;background:#55b56e;margin:13px 0 14px}
.copy{font-size:clamp(14px,2.6vw,18px);font-weight:500;line-height:1.18;margin-bottom:23px}
.new{width:100%;height:58px;border:2px solid #5fca78;border-radius:14px;background:rgba(8,52,35,.62);color:#fff;font-size:clamp(16px,2.75vw,19px);font-weight:650;display:flex;align-items:center;justify-content:space-between;padding:0 18px;box-shadow:0 4px 15px rgba(0,0,0,.24);backdrop-filter:blur(3px)}
.new .play{font-size:18px;margin-right:5px}.new .chev{font-size:27px;font-weight:300;line-height:0}
.nav{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px;text-shadow:none}
.nav button{height:61px;border:1px solid rgba(255,255,255,.32);border-radius:14px;background:rgba(11,53,38,.72);color:#fff;font-size:clamp(10px,1.8vw,12px);font-weight:650;box-shadow:0 3px 12px rgba(0,0,0,.2);backdrop-filter:blur(3px)}
@media(max-height:700px){.home{bottom:2%}.copy{margin-bottom:12px}.line{margin:8px 0 9px}.nav button{height:52px}}
</style>
</head>
<body>
<div class="app">
  <div id="map"></div><div class="shade"></div>
  <div class="top">
    <div class="identity"><div class="brand">UiDo</div><div class="course">OVERSTONE PARK</div><div class="hole">Hole 1 · Par 4</div></div>
    <div class="actions"><button aria-label="Settings">⚙</button><button aria-label="Menu">☰</button></div>
  </div>
  <main class="home">
    <div class="logo">UiDo</div>
    <div class="tag">PLAY SMARTER</div>
    <div class="line"></div>
    <div class="copy">Better decisions. Lower scores.</div>
    <button class="new" onclick="location.href='?round=new'"><span class="play">▶</span><span>New Round</span><span class="chev">›</span></button>
    <div class="nav"><button>Past Rounds</button><button>Courses</button><button>Settings</button></div>
  </main>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const C=[52.27789,-0.81722];
const map=L.map('map',{zoomControl:false,attributionControl:true,dragging:false,scrollWheelZoom:false,doubleClickZoom:false,boxZoom:false,touchZoom:false,keyboard:false}).setView(C,18);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:20,attribution:'Tiles © Esri'}).addTo(map);
</script>
</body>
</html>
