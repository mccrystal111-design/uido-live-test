<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>UiDo</title><style>
@import url('https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600&display=swap');
@font-face{font-family:'Space Grotesk';src:url('assets/fonts/SpaceGrotesk-Regular.woff2') format('woff2');font-weight:400}@font-face{font-family:'Space Grotesk';src:url('assets/fonts/SpaceGrotesk-Medium.woff2') format('woff2');font-weight:500}@font-face{font-family:'Space Grotesk';src:url('assets/fonts/SpaceGrotesk-SemiBold.woff2') format('woff2');font-weight:600}
:root{--yellow:#ffd600}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#183b27}body{font-family:'Space Grotesk',sans-serif}.app{position:relative;width:100vw;height:100dvh;overflow:hidden}.home-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.screen{position:absolute;inset:0;visibility:hidden;opacity:0;pointer-events:none;transition:opacity .45s ease}.screen.active{visibility:visible;opacity:1;pointer-events:auto}.screen-glass{position:absolute;inset:0;background:rgba(18,28,24,.56);backdrop-filter:blur(3px) saturate(112%);-webkit-backdrop-filter:blur(3px) saturate(112%)}
.brand-stack{position:absolute;left:20px;right:20px;top:22%;display:flex;flex-direction:column;align-items:center}.logo-text{display:flex;align-items:center;color:#fff;font:600 92px/0.9 Oxanium,sans-serif;letter-spacing:.015em;text-shadow:0 1px 8px rgba(0,0,0,.24)}.aim-icon{height:64px;width:auto;margin:0 1px;transform:translateY(-5px)}.tagline{margin-top:18px;color:#fff;font:500 27px/1 Oxanium,sans-serif}.start-wrap{position:absolute;left:20px;right:20px;bottom:8vh;display:flex;justify-content:center}.start,.hub-button,.primary-button{position:relative;width:min(320px,100%);height:64px;border:1px solid rgba(255,255,255,.24);border-radius:15px;background:rgba(255,255,255,.28);color:#fff;font:500 31px/1 Oxanium,sans-serif;cursor:pointer;box-shadow:none}.start:after,.hub-start:after,.primary-button:after{content:'';position:absolute;inset:-7px;border:1.5px solid rgba(255,214,0,.42);border-radius:22px;animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.7;box-shadow:0 0 24px rgba(255,214,0,.25)}}
.secondary-header{position:absolute;top:28px;left:0;right:0;display:flex;flex-direction:column;align-items:center;color:#fff;z-index:2}.secondary-logo{display:flex;align-items:center;font:600 50px/1 Oxanium,sans-serif}.secondary-logo .aim-icon{height:35px;transform:translateY(-3px)}.secondary-tagline{margin-top:5px;font:500 15px/1 Oxanium,sans-serif}.settings{position:absolute;top:28px;right:20px;width:48px;height:48px;border:0;background:none;color:var(--yellow);font-size:28px;z-index:3}.hub-actions{position:absolute;left:20px;right:20px;top:50%;transform:translateY(-42%);display:flex;flex-direction:column;align-items:center;gap:18px;z-index:2}.hub-button{height:60px;font-size:27px}.hub-button.secondary{height:56px;font-size:25px;background:rgba(255,255,255,.1)}.hub-button.stats{height:52px;font-size:23px;background:rgba(255,255,255,.1)}
.round-shell{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;padding:24px 20px 18px;color:#fff}.round-header{display:flex;justify-content:center;position:relative;height:68px}.round-header .secondary-header{top:4px}.round-back{position:absolute;left:0;top:0;width:44px;height:44px;border:0;border-radius:22px;background:rgba(255,255,255,.12);color:#fff;font-size:26px;z-index:3}.round-scroll{width:100%;max-width:520px;margin:20px auto 0;overflow-y:auto;padding-bottom:96px}.round-section{margin-top:18px}.course-card{padding:16px 17px;border:1px solid rgba(255,255,255,.2);border-radius:20px;background:rgba(12,20,17,.5);backdrop-filter:blur(14px)}.course-name{font:600 21px/1.15 Space Grotesk,sans-serif}.course-status{margin-top:5px;color:rgba(255,255,255,.68);font-size:12px}.choice-row{display:flex;gap:10px}.choice{flex:1;min-height:50px;border:1px solid rgba(255,255,255,.24);border-radius:15px;background:rgba(255,255,255,.1);color:#fff;font:600 14px Space Grotesk,sans-serif}.choice.selected{border-color:rgba(255,214,0,.85);background:rgba(255,214,0,.18)}.tee-list{display:flex;flex-direction:column;gap:9px}.tee-button{width:100%;min-height:64px;padding:10px 15px;border:1px solid rgba(255,255,255,.24);border-radius:17px;color:#fff;display:flex;align-items:center;justify-content:space-between;text-align:left;background:rgba(255,255,255,.1)}.tee-button[data-colour=white]{background:rgba(255,255,255,.1)}.tee-button[data-colour=yellow]{background:rgba(255,214,0,.1)}.tee-button[data-colour=red]{background:rgba(225,62,62,.1)}.tee-button.selected{border-color:rgba(255,214,0,.92);box-shadow:0 0 18px rgba(255,214,0,.1)}.tee-main{display:flex;flex-direction:column;gap:4px}.tee-name{font:600 16px Space Grotesk,sans-serif}.tee-meta{font:400 11px Space Grotesk,sans-serif;color:rgba(255,255,255,.72);white-space:nowrap}.tee-check{width:20px;height:20px;border-radius:50%;border:1px solid rgba(255,255,255,.35);display:grid;place-items:center;color:transparent}.tee-button.selected .tee-check{background:var(--yellow);border-color:var(--yellow);color:#142016}.leaderboard{display:flex;width:100%;min-height:58px;border:1px solid rgba(255,255,255,.28);border-radius:17px;overflow:hidden;background:rgba(255,255,255,.1)}.leader-button{flex:1;border:0;background:transparent;color:#fff;padding:9px 12px;display:flex;align-items:center;justify-content:center;gap:8px;font:600 13px/1.15 Space Grotesk,sans-serif}.leader-button+.leader-button{border-left:1px solid rgba(255,255,255,.25)}.leader-button.active{background:rgba(255,214,0,.14);box-shadow:inset 0 -2px var(--yellow)}.qr-icon{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}.round-footer{position:absolute;left:20px;right:20px;bottom:18px;display:flex;justify-content:center;z-index:4}.primary-button{height:60px;font-size:27px}.qr-notice{position:absolute;left:20px;right:20px;bottom:88px;z-index:5;display:none;padding:12px;border-radius:16px;background:rgba(10,17,14,.8);color:#fff;text-align:center;font-size:13px}.qr-notice.show{display:block}
</style></head><body><main class="app"><img class="home-bg" src="assets/home-exact.jpg" alt="">
<div id="welcome" class="screen active"><div class="brand-stack"><div class="logo-text"><span>U</span><img class="aim-icon" src="assets/smartaim-i-tight.png" alt=""><span>Do</span></div><div class="tagline">Every Shot Counts</div></div><div class="start-wrap"><button id="enterButton" class="start">Enter</button></div></div>
<div id="hub" class="screen"><div class="screen-glass"></div><div class="secondary-header"><div class="secondary-logo"><span>U</span><img class="aim-icon" src="assets/smartaim-i-tight.png" alt=""><span>Do</span></div><div class="secondary-tagline">Every Shot Counts</div></div><button class="settings">⚙</button><div class="hub-actions"><button id="startRoundButton" class="hub-button hub-start">Start Round</button><button class="hub-button secondary">Profile</button><button class="hub-button secondary">Scorecards</button><button class="hub-button stats">Stats</button></div></div>
<div id="round" class="screen"><div class="screen-glass"></div><div class="round-shell"><div class="round-header"><button id="roundBack" class="round-back">‹</button><div class="secondary-header"><div class="secondary-logo"><span>U</span><img class="aim-icon" src="assets/smartaim-i-tight.png" alt=""><span>Do</span></div><div class="secondary-tagline">Every Shot Counts</div></div></div><div class="round-scroll">
<div><div class="course-card"><div class="course-name">Overstone Park Golf Club</div><div class="course-status">Location found · 18 holes · Par 72</div></div></div>
<section class="round-section"><div class="leaderboard"><button id="joinLeaderboard" class="leader-button"><span>Join Live Leaderboard</span><svg class="qr-icon" viewBox="0 0 24 24"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h3v3h-3zM18 18h3v3h-3zM17 14h1M14 18h1M18 14h3M14 21h1"/></svg></button><button id="createLeaderboard" class="leader-button"><span>Create Live Leaderboard</span><svg class="qr-icon" viewBox="0 0 24 24"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7zM17.5 14v3.5M14 17.5h3.5"/></svg></button></div></section>
<section class="round-section"><div class="choice-row" id="formatChoices"><button class="choice selected">Stroke Play</button><button class="choice">Stableford</button></div></section>
<section class="round-section"><div class="tee-list" id="teeList"></div></section>
</div></div><div id="qrNotice" class="qr-notice"></div><div class="round-footer"><button id="beginRound" class="primary-button">Start Round</button></div></div>
</main><script>
const welcome=document.getElementById('welcome'),hub=document.getElementById('hub'),round=document.getElementById('round');
document.getElementById('enterButton').onclick=()=>{welcome.classList.remove('active');hub.classList.add('active')};
document.getElementById('startRoundButton').onclick=()=>{hub.classList.remove('active');round.classList.add('active')};
document.getElementById('roundBack').onclick=()=>{round.classList.remove('active');hub.classList.add('active');document.getElementById('qrNotice').classList.remove('show')};
const tees=[['White','white','6,461 yd','71.5','125'],['Yellow','yellow','6,102 yd','69.6','122'],['Red','red','5,618 yd','72.9','125']];const list=document.getElementById('teeList');tees.forEach((t,i)=>{const b=document.createElement('button');b.className='tee-button'+(i===1?' selected':'');b.dataset.colour=t[1];b.innerHTML=`<span class="tee-main"><span class="tee-name">${t[0]}</span><span class="tee-meta">${t[2]} · Rating ${t[3]} · Slope ${t[4]}</span></span><span class="tee-check">✓</span>`;b.onclick=()=>{document.querySelectorAll('.tee-button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};list.appendChild(b)});
document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{document.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});
const notice=document.getElementById('qrNotice');document.getElementById('joinLeaderboard').onclick=()=>{notice.textContent='QR scanner ready — scan the organiser’s leaderboard code.';notice.classList.add('show')};document.getElementById('createLeaderboard').onclick=()=>{notice.textContent='Leaderboard created — QR sharing will appear here.';notice.classList.add('show')};
</script></body></html>
