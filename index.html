<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>UiDo Home Preview</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#183b27;overflow:hidden}
body{display:grid;place-items:center}
.home{width:100vw;height:100dvh;display:block;object-fit:cover}
</style>
</head>
<body>
<svg class="home" viewBox="0 0 430 874" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="UiDo clean aerial golf course Home background">
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#b9d5a7"/><stop offset=".45" stop-color="#79a56c"/><stop offset="1" stop-color="#315f39"/></linearGradient>
 <linearGradient id="fairway" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8fbe73"/><stop offset=".5" stop-color="#5f9954"/><stop offset="1" stop-color="#3f763f"/></linearGradient>
 <linearGradient id="green" x2="0" y2="1"><stop stop-color="#7db765"/><stop offset="1" stop-color="#4f914f"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="7"/></filter>
 <filter id="shadow"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<rect width="430" height="874" fill="url(#sky)"/>
<!-- wooded aerial surroundings -->
<g opacity=".92" filter="url(#blur)" fill="#234b2c">
 <circle cx="25" cy="80" r="58"/><circle cx="90" cy="45" r="70"/><circle cx="180" cy="30" r="55"/><circle cx="315" cy="55" r="78"/><circle cx="405" cy="125" r="62"/>
 <circle cx="30" cy="350" r="75"/><circle cx="100" cy="420" r="55"/><circle cx="360" cy="355" r="85"/><circle cx="420" cy="520" r="65"/>
 <circle cx="30" cy="720" r="85"/><circle cx="150" cy="800" r="75"/><circle cx="330" cy="790" r="95"/><circle cx="420" cy="700" r="70"/>
</g>
<!-- fairway -->
<path d="M215 -30 C145 90 160 190 220 275 C285 365 300 445 242 535 C184 625 150 735 210 910 L330 910 C278 750 318 640 355 545 C395 445 350 350 290 265 C230 180 250 85 285 -30Z" fill="url(#fairway)"/>
<!-- mowing stripes -->
<path d="M225 0 C190 130 210 220 260 300 C305 375 320 445 272 535 C222 630 205 730 248 874 L286 874 C255 730 274 630 319 540 C365 450 338 365 286 290 C235 215 242 120 270 0Z" fill="#78aa62" opacity=".65"/>
<path d="M190 0 C160 125 175 210 225 290 C275 370 285 445 235 535 C185 625 160 735 205 874 L230 874 C194 735 220 630 267 540 C317 445 298 370 245 290 C195 210 205 120 225 0Z" fill="#4f894b" opacity=".42"/>
<!-- green and approach -->
<ellipse cx="258" cy="245" rx="73" ry="43" transform="rotate(-18 258 245)" fill="#3f713d" opacity=".55" filter="url(#shadow)"/>
<ellipse cx="258" cy="238" rx="70" ry="39" transform="rotate(-18 258 238)" fill="url(#green)"/>
<ellipse cx="255" cy="236" rx="48" ry="26" transform="rotate(-18 255 236)" fill="#76ad60" opacity=".7"/>
<!-- bunkers -->
<ellipse cx="202" cy="210" rx="27" ry="10" transform="rotate(-12 202 210)" fill="#d9c99d"/>
<ellipse cx="319" cy="272" rx="28" ry="11" transform="rotate(12 319 272)" fill="#ded0a7"/>
<ellipse cx="174" cy="300" rx="20" ry="8" transform="rotate(-8 174 300)" fill="#d5c493"/>
<!-- flag -->
<path d="M258 235V190" stroke="#eee" stroke-width="2"/><path d="M258 191 L282 199 L258 207Z" fill="#f4f4f4"/>
<!-- trees and shadows -->
<g fill="#183e27" opacity=".75"><circle cx="74" cy="570" r="32"/><circle cx="115" cy="625" r="28"/><circle cx="365" cy="610" r="34"/><circle cx="395" cy="670" r="28"/><circle cx="78" cy="155" r="30"/><circle cx="360" cy="165" r="32"/></g>
<rect y="560" width="430" height="314" fill="url(#fade)" opacity="0"/>
<defs><linearGradient id="fade" x2="0" y2="1"><stop stop-color="#002c1d" stop-opacity="0"/><stop offset="1" stop-color="#002c1d" stop-opacity=".6"/></linearGradient></defs>
</svg>
</body>
</html>
