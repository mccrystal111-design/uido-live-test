<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>UiDo — Yardage & Bunkers</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600&display=swap');
:root{--ivory:#F4F1E6;--ink:#101110;--yellow:#E9C928;--sage:#3F4B3B;--ring:rgba(63,75,59,.42)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:var(--ivory);color:var(--ink);font-family:Oxanium,sans-serif}
body{overflow-x:hidden}
.stage{width:100%;min-height:100dvh;display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 16px max(22px,env(safe-area-inset-bottom));background:var(--ivory)}
.tile{position:relative;flex:0 0 auto;width:min(91vw,520px);aspect-ratio:1;border:1px solid rgba(16,17,16,.25);border-radius:24px;background:var(--ivory);overflow:hidden}
.circle{position:absolute;inset:2%;border:1.5px solid var(--ring);border-radius:50%;background:var(--ivory)}
.yardage-meta{position:absolute;top:8%;left:0;right:0;text-align:center;font-size:clamp(12px,3.2vw,19px);font-weight:600;line-height:1.1;letter-spacing:.025em;white-space:nowrap}
.yardage-values{position:absolute;left:50%;top:51%;transform:translate(-50%,-50%);width:38%;display:flex;flex-direction:column;align-items:stretch;text-align:center;font-variant-numeric:tabular-nums}
.value{font-size:clamp(42px,12vw,62px);font-weight:600;line-height:1.12;color:var(--ink)}
.value.middle{color:var(--yellow)}
.rule{height:1px;width:100%;margin:5px 0;background:rgba(16,17,16,.68)}
.bunker-circle{color:var(--ink)}
.zone-heading{position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:clamp(8px,3vw,18px);height:9%;color:var(--sage);font-size:clamp(13px,3.5vw,19px);font-weight:600;letter-spacing:.07em;line-height:1}
.zone-heading.greenside{top:6.5%}
.zone-heading.fairway{top:51%}
.zone-title{white-space:nowrap}
.arrow{display:grid;place-items:center;border:0;background:transparent;color:var(--sage);font:400 27px/1 Oxanium,sans-serif;padding:3px 0;width:20px;min-height:32px;cursor:pointer;touch-action:manipulation}
.arrow:disabled{opacity:.18;cursor:default}
.bunker-half{position:absolute;left:7%;right:7%;height:23%;display:grid;grid-template-columns:1fr 1fr;align-items:center}
.bunker-half.greenside{top:19%;border-bottom:1px solid var(--ring)}
.bunker-half.fairway{top:66%}
.bunker-pair{min-width:0;display:grid;grid-template-columns:1fr 1fr;align-items:center;text-align:center}
.bunker-pair:first-child{border-right:1px solid var(--ring)}
.distance{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.distance-label{font-size:clamp(10px,2.7vw,14px);font-weight:600;letter-spacing:.05em;color:var(--sage)}
.distance strong{font-size:clamp(22px,6vw,35px);line-height:1;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.wind-entry{position:absolute;right:11%;bottom:11%;width:11%;max-width:46px;min-width:36px;aspect-ratio:1;border:1.5px solid var(--yellow);border-radius:50%;background:var(--ivory);padding:5px;display:grid;place-items:center;z-index:4;cursor:pointer;touch-action:manipulation}
.wind-entry img{width:100%;height:100%;object-fit:contain;display:block}
.wind-view{position:absolute;inset:0;z-index:5;background:var(--ivory)}
.wind-view[hidden]{display:none}
.wind-view iframe{width:100%;height:100%;border:0;display:block}
@media(max-width:420px){.stage{padding:16px}.tile{width:91vw}.yardage-values{width:38%}.value{font-size:clamp(42px,12vw,58px)}.bunker-half{left:7%;right:7%}.distance strong{font-size:clamp(21px,5.9vw,29px)}.wind-entry{right:11%;bottom:11%;width:11%;min-width:36px}}
.embedded-tile .stage{min-height:0;height:100dvh;padding:0;display:grid;place-items:center}
.embedded-tile .tile{width:100vw;max-width:none;border:0;border-radius:0}
.embedded-tile .yardage-tile{display:none}
</style>
</head>
<body>
<iframe id="courseData" title="Course data" src="overstone/index.html" aria-hidden="true" tabindex="-1" style="position:fixed;left:-12000px;top:0;width:390px;height:844px;opacity:0;pointer-events:none;border:0"></iframe>
<main class="stage">
<section class="tile yardage-tile" aria-label="Live yardages">
 <div class="circle">
  <div class="yardage-meta" id="yardageMeta">HOLE 1 · PAR 4</div>
  <div class="yardage-values" aria-label="Front, middle and back yardages">
   <div class="value" id="yardageFront">—</div><div class="rule"></div>
   <div class="value middle" id="yardageMiddle">—</div><div class="rule"></div>
   <div class="value" id="yardageBack">—</div>
  </div>
 </div>
</section>
<section class="tile bunker-tile" id="bunkerTile" aria-label="Bunker distances">
 <div class="circle bunker-circle" id="bunkerCircle">
  <div class="zone-heading greenside"><button class="arrow" data-zone="greenside" data-step="-1" aria-label="Previous greenside bunker">‹</button><span class="zone-title">GREENSIDE</span><button class="arrow" data-zone="greenside" data-step="1" aria-label="Next greenside bunker">›</button></div>
  <div class="bunker-half greenside">
   <div class="bunker-pair"><div class="distance"><span class="distance-label">FR</span><strong id="gsLeftFr">—</strong></div><div class="distance"><span class="distance-label">CR</span><strong id="gsLeftCr">—</strong></div></div>
   <div class="bunker-pair"><div class="distance"><span class="distance-label">FR</span><strong id="gsRightFr">—</strong></div><div class="distance"><span class="distance-label">CR</span><strong id="gsRightCr">—</strong></div></div>
  </div>
  <div class="zone-heading fairway"><button class="arrow" data-zone="fairway" data-step="-1" aria-label="Previous fairway bunker">‹</button><span class="zone-title">FAIRWAY</span><button class="arrow" data-zone="fairway" data-step="1" aria-label="Next fairway bunker">›</button></div>
  <div class="bunker-half fairway">
   <div class="bunker-pair"><div class="distance"><span class="distance-label">FR</span><strong id="fwLeftFr">—</strong></div><div class="distance"><span class="distance-label">CR</span><strong id="fwLeftCr">—</strong></div></div>
   <div class="bunker-pair"><div class="distance"><span class="distance-label">FR</span><strong id="fwRightFr">—</strong></div><div class="distance"><span class="distance-label">CR</span><strong id="fwRightCr">—</strong></div></div>
  </div>
 </div>
 <button class="wind-entry" id="windEntry" type="button" aria-label="Open wind tile"><img src="assets/uido-golf-ball.svg" alt=""></button>
 <div class="wind-view" id="windView" hidden><iframe title="Wind tile" src="wind-tile.html?embedded=1"></iframe></div>
</section>
</main>
<script>
(function(){
 const $=id=>document.getElementById(id),frame=$('courseData');
 const fields={
  greenside:{left:['gsLeftFr','gsLeftCr'],right:['gsRightFr','gsRightCr']},
  fairway:{left:['fwLeftFr','fwLeftCr'],right:['fwRightFr','fwRightCr']}
 };
 let position=null,activeHole=1,watchId=null,records={greenside:{left:[],right:[]},fairway:{left:[],right:[]}},indexes={greenside:0,fairway:0},lastCourse=null;
 const rad=Math.PI/180;
 function metres(a,b){if(!a||!b)return NaN;const R=6371008.8,p1=a[0]*rad,p2=b[0]*rad,dp=(b[0]-a[0])*rad,dl=(b[1]-a[1])*rad;const h=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.min(1,Math.sqrt(h)))}
 function yards(m){return Number.isFinite(m)&&m>=0?String(Math.round(m*1.093613298)):'—'}
 function holeData(){try{return frame.contentWindow.UIDO_OVERSTONE_SOURCE_HOLES[String(activeHole)]||null}catch(e){return null}}
 function teePosition(d){const p=d&&d.line_of_play&&d.line_of_play[0];return p?[p[1],p[0]]:null}
 function playerPosition(d){const tee=teePosition(d);if(position&&tee&&metres(position,tee)<2500)return position;return tee}
 function setYardages(d,pos){if(!d||!d.green_fmb||!pos)return;$('yardageFront').textContent=yards(metres(pos,d.green_fmb.front));$('yardageMiddle').textContent=yards(metres(pos,d.green_fmb.middle));$('yardageBack').textContent=yards(metres(pos,d.green_fmb.back));$('yardageMeta').textContent='HOLE '+activeHole+' · PAR '+d.par}
 function bunkerGroup(d,pos){
  const green=d.green_fmb&&d.green_fmb.middle;if(!green)return;
  const all=(d.bunkers||[]).filter(b=>b.front_gps&&b.back_gps).map(b=>({...b,greenDistance:metres(b.anchor_gps||b.front_gps,green)}));
  const next={greenside:{left:[],right:[]},fairway:{left:[],right:[]}};
  all.forEach(b=>{const zone=b.greenDistance<=60*0.9144?'greenside':'fairway';const side=b.side==='left'?'left':'right';next[zone][side].push(b)});
  Object.keys(next).forEach(zone=>Object.keys(next[zone]).forEach(side=>next[zone][side].sort((a,b)=>metres(pos,a.front_gps)-metres(pos,b.front_gps))));
  records=next;
  ['greenside','fairway'].forEach(zone=>{
   const allZone=[...next[zone].left,...next[zone].right];indexes[zone]=allZone.length?indexes[zone]%allZone.length:0;
   document.querySelectorAll('.arrow[data-zone="'+zone+'"]').forEach(btn=>btn.disabled=allZone.length<2);
   ['left','right'].forEach(side=>{
    const list=next[zone][side],chosen=list.length?list[indexes[zone]%list.length]:null,els=fields[zone][side];
    $(els[0]).textContent=chosen?yards(metres(pos,chosen.front_gps)):'—';
    $(els[1]).textContent=chosen?yards(metres(pos,chosen.back_gps)):'—';
   });
  });
 }
 function sync(){
  const d=holeData();if(!d)return;
  const pos=playerPosition(d);if(!pos)return;
  setYardages(d,pos);bunkerGroup(d,pos);
 }
 document.querySelectorAll('.arrow').forEach(btn=>btn.addEventListener('click',()=>{
  const z=btn.dataset.zone,list=[...records[z].left,...records[z].right];if(list.length<2)return;
  indexes[z]=(indexes[z]+Number(btn.dataset.step)+list.length)%list.length;sync();
 }));
 frame.addEventListener('load',()=>{
  sync();
  try{
   const w=frame.contentWindow,doc=frame.contentDocument;
   const header=doc.getElementById('holeHeaderMeta');
   if(header)new MutationObserver(()=>{const m=header.textContent.match(/Hole\s+(\d+)/i);if(m)activeHole=Number(m[1]);sync()}).observe(header,{childList:true,subtree:true,characterData:true});
  }catch(e){}
  if(navigator.geolocation&&watchId===null)watchId=navigator.geolocation.watchPosition(p=>{position=[p.coords.latitude,p.coords.longitude];sync()},()=>{}, {enableHighAccuracy:true,maximumAge:3000,timeout:12000});
 });
 setInterval(sync,2000);
 $('windEntry').addEventListener('click',()=>{$('bunkerCircle').hidden=true;$('windView').hidden=false});
})();
</script>
</body></html>
