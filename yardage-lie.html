<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>UiDo — Yardage + Lie</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600&display=swap');
:root{--yellow:#E9C928}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;overflow-x:hidden;overflow-y:auto;background:#F4F1E6}
body{font-family:Oxanium,sans-serif;color:#F4F1E6}
.stage{width:100%;min-height:100dvh;height:auto;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:8px;padding:22px 16px max(22px,env(safe-area-inset-bottom));background:var(--uido-ivory)}
.tile{position:relative;flex:0 0 auto;width:min(88vw,520px);aspect-ratio:1;border:1px solid rgba(244,241,230,.24);border-radius:28px;background:rgba(16,17,16,.94);backdrop-filter:blur(10px) saturate(110%);-webkit-backdrop-filter:blur(10px) saturate(110%);overflow:hidden}
.help{position:absolute;right:5.5%;top:5.5%;width:10%;aspect-ratio:1;border:1.5px solid rgba(233,201,40,.78);border-radius:50%;background:rgba(16,17,16,.92);color:#fff;cursor:pointer;z-index:8;display:grid;place-items:center;padding:0}
.help img{width:62%;height:62%;display:block;object-fit:contain}
.lie-circle{position:absolute;left:50%;top:50%;width:96%;height:96%;transform:translate(-50%,-50%);border-radius:50%;overflow:hidden;z-index:1;background:#34463d;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.lie-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 65%;display:block}
.photo-shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(8,15,12,.04) 0%,rgba(8,15,12,.01) 48%,rgba(8,15,12,.10) 68%,rgba(8,15,12,.20) 100%)}
.lie-label{position:absolute;left:50%;top:20%;transform:translate(-50%,-50%);font-size:clamp(25px,6.5vw,42px);font-weight:600;letter-spacing:.04em;text-shadow:0 2px 10px rgba(0,0,0,.55);white-space:nowrap;z-index:3}
.swipe-hint{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font:500 clamp(13px,3.2vw,18px)/1 Oxanium;color:rgba(255,255,255,.84);letter-spacing:.09em;text-shadow:0 2px 8px rgba(0,0,0,.8);white-space:nowrap;z-index:3;pointer-events:none}
.answer-row{position:absolute;left:0;right:0;bottom:3.5%;height:auto;display:flex;justify-content:center;align-items:center;z-index:4}
.answer{width:13%;min-width:50px;max-width:62px;aspect-ratio:1;border:1.5px solid rgba(233,201,40,.88);border-radius:50%;background:rgba(16,17,16,.96);color:#fff;cursor:pointer;touch-action:manipulation;display:grid;place-items:center;padding:0;overflow:hidden}
.answer img{width:62%;height:62%;display:block;object-fit:contain}
.answer:active{filter:brightness(1.18);transform:scale(.96)}
.countdown{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(16,17,16,.78);backdrop-filter:blur(3px);z-index:12}
.countdown.show{display:flex}
.count-number{font:600 110px/1 Oxanium;color:#fff;text-shadow:0 0 28px rgba(255,214,0,.32)}
.next-advice{margin-top:20px;text-align:center}.next-label{font:500 14px/1 Oxanium;color:rgba(244,241,230,.58);letter-spacing:.12em;margin-bottom:7px}.next-value{font:500 clamp(18px,4.8vw,28px)/1.1 Oxanium;color:#fff}.next-value strong{color:var(--yellow);font-weight:600}
.modal{position:absolute;inset:0;background:rgba(8,16,13,.72);backdrop-filter:blur(4px);display:none;place-items:center;padding:9%;z-index:15}.modal.show{display:grid}.modal-card{width:100%;max-width:360px;border:1px solid rgba(255,255,255,.24);border-radius:20px;background:rgba(16,17,16,.97);padding:24px;color:#fff;text-align:center}.modal-card h2{margin:0 0 12px;font-size:24px;font-weight:500}.modal-card p{margin:0 0 20px;font:400 15px/1.45 Arial,sans-serif;color:rgba(244,241,230,.80)}.close{border:1px solid rgba(255,255,255,.24);border-radius:15px;background:rgba(244,241,230,.10);color:#fff;padding:12px 22px;font:500 16px Oxanium;cursor:pointer}
.result{position:absolute;inset:0;background:rgba(16,17,16,.96);z-index:11;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12%}.result.show{display:flex}.result-main{font-size:clamp(28px,7vw,46px);font-weight:600;margin-bottom:12px}.result-sub{font-size:15px;color:rgba(244,241,230,.62);line-height:1.45}
@media(max-width:420px){.tile{width:91vw;border-radius:24px}.answer{width:14%;min-width:50px}.swipe-hint{top:42%;font-size:13px}}
.embedded-tile, .embedded-tile body{background:transparent!important}.embedded-tile body{overflow:hidden}.embedded-tile .stage{width:100%;height:100%;min-height:0;padding:0;background:transparent!important}.embedded-tile .tile{width:100%;height:100%;max-width:none;aspect-ratio:1;border:0!important;border-radius:22px!important;background:transparent!important;box-shadow:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;overflow:hidden}.embedded-tile .lie-circle{width:96%;height:auto;aspect-ratio:1;max-width:none;}.embedded-tile .help{display:none!important}.embedded-tile .modal-card{padding:14px}.embedded-tile .modal-card h2{font-size:18px}.embedded-tile .modal-card p{font-size:12px}.embedded-tile .close{padding:8px 14px;font-size:13px}
/* Yardage tile: same framed-square and circular-photo language as the existing Lie tile. */
.yardage-tile{position:relative;isolation:isolate;display:block;background:var(--uido-ivory)!important}
.yardage-circle{position:absolute;left:50%;top:50%;width:96%;height:96%;transform:translate(-50%,-50%);border:1.5px solid rgba(63,75,59,.42);border-radius:50%;overflow:hidden;background:var(--uido-ivory)}
.blank-tile{position:relative!important;background:var(--uido-ivory)!important}.blank-circle{position:absolute;left:50%;top:50%;width:96%;height:96%;transform:translate(-50%,-50%);border:1.5px solid rgba(63,75,59,.42);border-radius:50%;background:var(--uido-ivory)}
.yardage-photo{display:none!important}
.yardage-shade{display:none!important}
.yardage-meta{position:absolute;left:0;right:0;top:8%;z-index:2;text-align:center;color:#101110;font:600 clamp(12px,3.2vw,19px)/1.1 Oxanium,sans-serif;letter-spacing:.025em;text-shadow:none;white-space:nowrap}
.yardage-values{position:absolute;left:50%;top:51%;transform:translate(-50%,-50%);z-index:2;width:34%;min-width:130px;display:flex;flex-direction:column;align-items:stretch;text-align:center;color:#101110;text-shadow:none}
.yardage-value{font:600 clamp(43px,11vw,70px)/1.12 Oxanium,sans-serif;color:#101110;text-shadow:none}
.yardage-value.middle{color:#E9C928;text-shadow:none}
.yardage-rule{height:1px;background:rgba(16,17,16,.68);width:100%;margin:5px 0}
@media(max-width:420px){.yardage-values{width:38%;min-width:0}.yardage-value{font-size:clamp(42px,12vw,58px)}.yardage-meta{font-size:clamp(11px,3.2vw,14px)}}
.embedded-tile .stage{display:grid;place-items:center;padding:0}
.embedded-tile .yardage-tile{display:none!important}
/* UiDo unified field-test skin */
:root{--uido-green:#F4F1E6;--uido-panel:#101110;--uido-panel-2:#101110;--uido-border:rgba(244,241,230,.24);--uido-ivory:#F4F1E6;--uido-yellow:#E9C928}
html,body{background:var(--uido-ivory);color:var(--uido-ivory)}
.stage{background:var(--uido-green)!important;padding:16px!important}
.tile{border:1px solid rgba(16,17,16,.25)!important;border-radius:24px!important;background:var(--uido-ivory)!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;box-shadow:none!important}
.help{border:1px solid rgba(233,201,40,.75)!important;background:#101110!important}
/* Keep radial controls and rollers intact; standardise their surrounding surface only. */
button,.btn,.option-button,.choice,.action{font-family:inherit}
</style>
</head>
<body><script>if(new URLSearchParams(location.search).get('embedded')==='1')document.documentElement.classList.add('embedded-tile');</script>
<iframe id="courseData" title="Course yardage data" src="overstone/index.html" aria-hidden="true" tabindex="-1" style="position:fixed;left:-12000px;top:0;width:390px;height:844px;opacity:0;pointer-events:none;border:0"></iframe>
<main class="stage">
<section class="tile yardage-tile" aria-label="Yardage Tile">
  <div class="yardage-circle">
    <img class="yardage-photo" src="assets/golf_hole_1.jpg" alt="">
    <div class="yardage-shade"></div>
    <div class="yardage-meta" id="yardageMeta">HOLE 1 · PAR 4</div>
    <div class="yardage-values" aria-label="Front, middle and back yardages">
      <div class="yardage-value" id="yardageFront">—</div>
      <div class="yardage-rule"></div>
      <div class="yardage-value middle" id="yardageMiddle">—</div>
      <div class="yardage-rule"></div>
      <div class="yardage-value" id="yardageBack">—</div>
    </div>
  </div>
</section>
<section class="tile blank-tile" aria-label="Blank UiDo Tile">
  <div class="blank-circle" aria-hidden="true"></div>
</section></main>
<script>
(function(){
 const frame=document.getElementById('courseData');
 const meta=document.getElementById('yardageMeta');
 const front=document.getElementById('yardageFront');
 const middle=document.getElementById('yardageMiddle');
 const back=document.getElementById('yardageBack');
 function syncCourse(){
  try{
   const d=frame.contentDocument;
   if(!d)return;
   const header=d.getElementById('holeHeaderMeta');
   const info=d.getElementById('greenInfo');
   if(header){
    const holeMeta=header.textContent.replace('Hole ','HOLE ').replace(' · Par ',' · PAR ');
    meta.textContent=holeMeta;
   }
   if(info){
    info.querySelectorAll('.metric').forEach(function(el){
     const key=(el.querySelector('label')?.textContent||'').trim().toUpperCase();
     const value=(el.querySelector('strong')?.textContent||'—').trim();
     if(key==='F')front.textContent=value;
     if(key==='M')middle.textContent=value;
     if(key==='B')back.textContent=value;
    });
    if(!info.querySelector('.metric')){front.textContent=middle.textContent=back.textContent='—'}
   }
  }catch(e){front.textContent=middle.textContent=back.textContent='—'}
 }
 frame.addEventListener('load',function(){
  syncCourse();
  try{
   const d=frame.contentDocument,info=d.getElementById('greenInfo'),header=d.getElementById('holeHeaderMeta');
   if(info)new MutationObserver(syncCourse).observe(info,{childList:true,subtree:true,characterData:true});
   if(header)new MutationObserver(syncCourse).observe(header,{childList:true,subtree:true,characterData:true});
  }catch(e){}
 });
 setInterval(syncCourse,700);
})();
</script>
</body></html>
