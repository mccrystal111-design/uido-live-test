<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>UiDo · Trajectory</title>
<link rel="stylesheet" href="trajectory-tile.css">
</head>
<body>
<main class="tile" data-tile="trajectory">
<header><div class="eyebrow">SHOT INPUT</div><h1>Trajectory</h1><p>Tap the flight height.</p></header>
<section class="options" aria-label="Shot trajectory">
<button class="option" type="button" data-value="Low">Low</button>
<button class="option" type="button" data-value="Normal">Normal</button>
<button class="option wide" type="button" data-value="High">High</button>
</section>
</main>
<script src="trajectory-tile.js"></script>
</body>
</html>
