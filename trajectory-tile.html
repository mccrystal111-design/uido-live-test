<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>UiDo · Trajectory</title>
<link rel="stylesheet" href="trajectory-tile.css">
</head>
<body>
<main class="tile" data-tile="trajectory">
  <header><div class="eyebrow">SHOT INPUT</div><h1>Trajectory</h1><p>Select the flight height, then confirm.</p></header>
  <section class="options" aria-label="Shot trajectory">
    <button class="option" type="button" data-value="Low" aria-pressed="false">Low</button>
    <button class="option" type="button" data-value="Normal" aria-pressed="false">Normal</button>
    <button class="option wide" type="button" data-value="High" aria-pressed="false">High</button>
  </section>
  <footer><span id="selectionStatus" aria-live="polite">Choose one option</span><button id="confirm" class="confirm" type="button" disabled aria-label="Confirm trajectory">✓</button></footer>
</main>
<script src="trajectory-tile.js"></script>
</body>
</html>
