<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UiDo · Hole 1 F/M/B Satellite Baseline</title><style>html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#10251B;color:#F5F1E8}body{display:flex;align-items:center;justify-content:center}.app{width:min(1400px,97vw)}h1{font-size:24px;margin:0 0 5px}.sub{opacity:.75;margin-bottom:12px}.panel{background:#F5F1E8;color:#173F2A;border-radius:18px;padding:14px}.map{position:relative;height:min(72vh,700px);min-height:450px;border-radius:13px;overflow:hidden;background:#d9d0bd}.map img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.overlay{position:absolute;inset:0}.point{position:absolute;transform:translate(-50%,-50%);border-radius:50%;width:12px;height:12px;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:bold;color:#F5F1E8;border:1px solid #F5F1E8;box-shadow:0 0 0 1px #173F2A}.front{background:#A88A5A}.middle{background:#173F2A}.back{background:#7C5A32}.info{margin-top:10px;padding:10px;background:#e9e2d5;border-radius:10px;font-size:13px;line-height:1.5}.coords{font-family:monospace;font-size:11px;opacity:.75}</style></head><body><div class="app"><h1>UiDo · Hole 1</h1><div class="sub">Overstone Park · Satellite baseline · F / M / B GPS only</div><div class="panel"><div class="map"><img src="https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/export?bbox=-0.821,52.274,-0.812,52.280&bboxSR=4326&size=1600,900&imageSR=4326&format=jpg&f=image" alt="Satellite view of Overstone Park Hole 1"><div class="overlay"><div id="front" class="point front">F</div><div id="middle" class="point middle">M</div><div id="back" class="point back">B</div></div></div><div class="info"><b>Source-of-truth test:</b> satellite imagery with the supplied green GPS positions only. No tee inference, circles, cone, corridor, fairway reconstruction or other derived geometry.</div><div class="coords" id="coords"></div></div></div><script>const bbox={west:-0.821,east:-0.812,south:52.274,north:52.280};const pts={F:[52.2776675,-0.8151979],M:[52.2777593548,-0.8150508742],B:[52.2778714,-0.8149234]};function p(lat,lon){return{x:(lon-bbox.west)/(bbox.east-bbox.west)*100,y:(bbox.north-lat)/(bbox.north-bbox.south)*100}};for(const k of Object.keys(pts)){const q=p(...pts[k]);const e=document.getElementById(k==='F'?'front':k==='M'?'middle':'back');e.style.left=q.x+'%';e.style.top=q.y+'%'}document.getElementById('coords').textContent='F '+pts.F.join(', ')+'   ·   M '+pts.M.join(', ')+'   ·   B '+pts.B.join(', ');</script></body></html>
