<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>UiDo — Shape Tile V2</title><style>
@import url('https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600&display=swap');:root{--yellow:#ffd600;--green:#183b27;--panel:rgba(18,31,27,.62)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--green)}body{font-family:Oxanium,sans-serif;color:#fff}.stage{width:100vw;height:100dvh;display:grid;place-items:center;padding:22px;background:linear-gradient(rgba(18,28,24,.56),rgba(18,28,24,.56)),url('assets/home-exact.jpg') center/cover no-repeat}.tile{position:relative;width:min(88vw,520px);aspect-ratio:1;border:1px solid rgba(255,255,255,.24);border-radius:28px;background:var(--panel);backdrop-filter:blur(10px) saturate(110%);-webkit-backdrop-filter:blur(10px) saturate(110%);overflow:hidden}.circle{position:absolute;inset:2%;border-radius:50%;overflow:hidden;background:rgba(18,31,27,.34);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}.help{position:absolute;right:7%;top:7%;width:30px;height:30px;padding:0;border:0;background:transparent;color:#fff;display:grid;place-items:center;cursor:pointer;z-index:40}.help img{width:24px;height:24px;object-fit:contain;display:block}.help-fallback{position:absolute;inset:0;display:grid;place-items:center;font-size:21px;font-weight:600;line-height:1;color:#fff;pointer-events:none}.roller{position:absolute;left:11%;right:11%;top:29%;height:38%;touch-action:none;user-select:none;overflow:hidden;z-index:10;cursor:grab}.track{position:absolute;left:0;top:50%;height:100%;display:flex;align-items:center;gap:8px;will-change:transform;transform-origin:center center}.shape{flex:0 0 clamp(82px,22vw,118px);height:92%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:rgba(255,255,255,.28);cursor:pointer;user-select:none;transition:color .12s ease}.shape.active{color:#fff}.shape-arrow{width:100%;height:calc(100% - 20px);object-fit:contain;display:block;pointer-events:none;transition:opacity .12s ease,filter .12s ease}.shape-arrow.straight{transform:rotate(-90deg)}.shape-arrow.draw{transform:scaleX(-1) rotate(-85deg)}.shape-arrow.hook{transform:scaleX(-1) rotate(-96deg)}.shape-arrow.fade{transform:rotate(265deg)}.shape-arrow.slice{transform:rotate(276deg)}.shape:not(.active) .shape-arrow{opacity:.28}.shape.active .shape-arrow{opacity:1;filter:brightness(1.22)}.shape-label{font-size:clamp(10px,2.7vw,14px);font-weight:500;white-space:nowrap;transition:font-weight .12s ease,color .12s ease}.shape.active .shape-label{font-weight:600;color:#fff}.marker{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);width:30px;height:3px;border-radius:3px;background:rgba(255,255,255,.22);z-index:18;pointer-events:none}.check{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);width:12%;min-width:50px;max-width:62px;aspect-ratio:1;border:1.5px solid rgba(255,214,0,.88);border-radius:50%;background:rgba(18,31,27,.94);display:grid;place-items:center;padding:0;cursor:pointer;z-index:20}.check img{width:62%;height:62%;object-fit:contain}.check:active{transform:translateX(-50%) scale(.96)}.result{position:absolute;inset:0;background:rgba(8,16,13,.94);z-index:30;display:none;align-items:center;justify-content:center}.result.show{display:flex}.result-main{font-size:clamp(28px,7vw,46px);font-weight:600}@media(max-width:420px){.tile{width:91vw;border-radius:24px}.help{right:7%;top:7%;width:28px;height:28px}.help img{width:22px;height:22px}.help-fallback{font-size:20px}.roller{left:9%;right:9%;top:30%;height:36%}.shape{flex-basis:clamp(76px,21vw,104px)}}
</style></head><body><main class="stage"><section class="tile" aria-label="UiDo Shape Tile V2"><div class="circle"><button class="help" id="help" aria-label="Help"><img src="assets/uido-question-mark-white.svg" alt="?" onerror="this.style.display='none'"><span class="help-fallback">?</span></button><div class="roller" id="roller"><div class="track" id="track"><div class="shape"><img class="shape-arrow hook" src="assets/uido-curved-arrow-white-hook.svg" alt="Hook"><div class="shape-label">Hook</div></div><div class="shape"><img class="shape-arrow draw" src="assets/uido-curved-arrow-white-draw.svg" alt="Draw"><div class="shape-label">Draw</div></div><div class="shape active"><img class="shape-arrow straight" src="assets/uido-straight-arrow-white.svg" alt="Straight"><div class="shape-label">Straight</div></div><div class="shape"><img class="shape-arrow fade" src="assets/uido-curved-arrow-white-draw.svg" alt="Fade"><div class="shape-label">Fade</div></div><div class="shape"><img class="shape-arrow slice" src="assets/uido-curved-arrow-white-hook.svg" alt="Slice"><div class="shape-label">Slice</div></div></div></div><div class="marker" aria-hidden="true"></div><button class="check" id="confirm" aria-label="Confirm"><img src="assets/uido-check-white.svg" alt="Confirm"></button><div class="result" id="result"><div class="result-main" id="resultMain">Straight</div></div></div></section></main><script>
const roller=document.getElementById('roller'),track=document.getElementById('track'),shapes=[...document.querySelectorAll('.shape')],names=['Hook','Draw','Straight','Fade','Slice'];let selected=2,dragging=false,pointerId=null,startX=0,startOffset=0,moved=false,currentOffset=0;function clamp(i){return Math.max(0,Math.min(shapes.length-1,i))}function baseLeft(){return roller.clientWidth/2-track.offsetWidth/2}function readOffset(){const rr=roller.getBoundingClientRect(),tr=track.getBoundingClientRect();return tr.left-rr.left-baseLeft()}function setOffset(x){currentOffset=x;track.style.transform=`translate3d(${x}px,-50%,0)`}function itemCenter(i){return shapes[i].offsetLeft+shapes[i].offsetWidth/2}function targetOffset(i){return roller.clientWidth/2-itemCenter(i)-track.offsetLeft}function limits(){return{min:targetOffset(shapes.length-1),max:targetOffset(0)}}function bounded(x){const l=limits();return Math.max(l.min,Math.min(l.max,x))}function nearest(){let best=0,bestDist=Infinity,center=roller.clientWidth/2;shapes.forEach((s,i)=>{const c=s.offsetLeft+s.offsetWidth/2+currentOffset,d=Math.abs(c-center);if(d<bestDist){bestDist=d;best=i}});return best}function active(){shapes.forEach((s,i)=>s.classList.toggle('active',i===selected))}function select(i,animate=true){selected=clamp(i);active();track.style.transition=animate?'transform .20s cubic-bezier(.22,.75,.2,1)':'none';setOffset(targetOffset(selected))}function begin(e){if(e.pointerType==='mouse'&&e.button!==0)return;track.style.transition='none';currentOffset=readOffset();setOffset(currentOffset);dragging=true;moved=false;pointerId=e.pointerId;startX=e.clientX;startOffset=currentOffset;roller.setPointerCapture?.(e.pointerId);roller.style.cursor='grabbing'}function move(e){if(!dragging||e.pointerId!==pointerId)return;const dx=e.clientX-startX;if(Math.abs(dx)>6)moved=true;setOffset(bounded(startOffset+dx));const n=nearest();if(n!==selected){selected=n;active()}}function end(e){if(!dragging||e.pointerId!==pointerId)return;dragging=false;roller.style.cursor='grab';roller.releasePointerCapture?.(e.pointerId);if(moved)select(nearest(),true);else{const hit=e.target.closest?.('.shape');if(hit){const i=shapes.indexOf(hit);if(i>=0)select(i,true)}else select(selected,true)}pointerId=null}roller.addEventListener('pointerdown',begin);roller.addEventListener('pointermove',move);roller.addEventListener('pointerup',end);roller.addEventListener('pointercancel',e=>{if(!dragging||e.pointerId!==pointerId)return;dragging=false;roller.style.cursor='grab';roller.releasePointerCapture?.(e.pointerId);pointerId=null;select(selected,true)});roller.addEventListener('wheel',e=>{e.preventDefault();const d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;select(selected+(d>0?1:-1),true)},{passive:false});window.addEventListener('resize',()=>select(selected,false));document.getElementById('confirm').onclick=()=>{document.getElementById('resultMain').textContent=names[selected];document.getElementById('result').classList.add('show')};document.getElementById('help').onclick=()=>{};requestAnimationFrame(()=>select(2,false));
</script></body></html>
