<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>UiDo — Shape Tile</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600&display=swap');
:root{--yellow:#ffd600}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#183b27}body{font-family:Oxanium,sans-serif;color:#fff}.stage{width:100vw;height:100dvh;display:grid;place-items:center;padding:22px;background:linear-gradient(rgba(18,28,24,.56),rgba(18,28,24,.56)),url('assets/home-exact.jpg') center/cover no-repeat}.tile{position:relative;width:min(88vw,520px);aspect-ratio:1;border:1px solid rgba(255,255,255,.24);border-radius:28px;background:rgba(18,31,27,.62);backdrop-filter:blur(10px) saturate(110%);-webkit-backdrop-filter:blur(10px) saturate(110%);overflow:hidden}.circle{position:absolute;left:50%;top:50%;width:96%;height:96%;transform:translate(-50%,-50%);border-radius:50%;overflow:hidden;background:rgba(18,31,27,.34);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}.header{position:absolute;left:0;right:0;top:15%;text-align:center;font-size:clamp(12px,3vw,17px);letter-spacing:.09em;color:rgba(255,255,255,.62)}.prompt{position:absolute;left:8%;right:8%;top:21%;text-align:center;font-size:clamp(11px,3vw,15px);color:rgba(255,255,255,.7)}.roller{position:absolute;left:4%;right:4%;top:30%;height:46%;overflow:hidden;touch-action:none;cursor:grab;z-index:4}.roller:before,.roller:after{content:"";position:absolute;top:0;bottom:0;width:17%;z-index:6;pointer-events:none}.roller:before{left:0;background:linear-gradient(90deg,rgba(18,31,27,.98),rgba(18,31,27,0))}.roller:after{right:0;background:linear-gradient(270deg,rgba(18,31,27,.98),rgba(18,31,27,0))}.track{position:absolute;left:50%;top:50%;height:100%;display:flex;align-items:center;gap:8px;transform:translate3d(-50%,-50%,0);transition:transform .22s ease;will-change:transform}.shape{position:relative;flex:0 0 clamp(92px,24vw,132px);height:88%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;color:rgba(255,255,255,.38);transition:color .18s ease,transform .18s ease;user-select:none}.shape.active{color:#fff;transform:scale(1.03)}.shape-arrow{width:100%;height:calc(100% - 24px);object-fit:contain;display:block;position:relative;z-index:2}.shape-arrow.straight{transform:rotate(-90deg)}.shape-arrow.draw{transform:scaleX(-1) rotate(-85deg)}.shape-arrow.fade{transform:rotate(265deg)}.shape-arrow.hook{transform:scaleX(-1) rotate(-96deg)}.shape-arrow.slice{transform:rotate(276deg)}.shape-label{font-size:clamp(10px,2.7vw,14px);font-weight:500;letter-spacing:.01em;text-align:center;white-space:nowrap;position:relative;z-index:2}.shape:not(.active) .shape-arrow{opacity:.52}.selection{display:none;position:absolute;inset:0;z-index:1}.shape.active .selection{display:block}.selection-img{position:absolute!important;inset:0;width:100%!important;height:100%!important;object-fit:fill!important}.roller-mark{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);width:28px;height:3px;border-radius:3px;background:rgba(255,255,255,.22);z-index:7}.check{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);width:12%;min-width:50px;max-width:62px;aspect-ratio:1;border:1.5px solid rgba(255,214,0,.88);border-radius:50%;background:rgba(18,31,27,.94);display:grid;place-items:center;padding:0;cursor:pointer;z-index:7}.check img{width:62%;height:62%;object-fit:contain}.check:active{transform:translateX(-50%) scale(.96);filter:brightness(1.18)}.result{position:absolute;inset:0;background:rgba(8,16,13,.94);z-index:11;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center}.result.show{display:flex}.result-main{font-size:clamp(28px,7vw,46px);font-weight:600}.result-sub{margin-top:12px;font-size:15px;color:rgba(255,255,255,.62)}@media(max-width:420px){.tile{width:91vw;border-radius:24px}.header{top:16%;font-size:12px}.prompt{left:7%;right:7%;top:21%;font-size:12px}.roller{left:2%;right:2%;top:30%;height:46%}.shape{flex-basis:clamp(88px,25vw,118px)}.check{width:14%;min-width:50px}}
</style>
</head>
<body><main class="stage"><section class="tile" aria-label="UiDo Shape Tile"><div class="circle"><div class="header">SHOT SHAPE</div><div class="prompt">What shape did the ball take?</div><div class="roller" id="roller"><div class="track" id="track">
<div class="shape"><div class="selection"><img class="selection-img" src="assets/uido-selection-box.svg" alt=""></div><img class="shape-arrow hook" src="assets/uido-curved-arrow-white-hook.svg" alt="Hook"><div class="shape-label">Hook</div></div>
<div class="shape"><div class="selection"><img class="selection-img" src="assets/uido-selection-box.svg" alt=""></div><img class="shape-arrow draw" src="assets/uido-curved-arrow-white-draw.svg" alt="Draw"><div class="shape-label">Draw</div></div>
<div class="shape active"><div class="selection"><img class="selection-img" src="assets/uido-selection-box.svg" alt=""></div><img class="shape-arrow straight" src="assets/uido-straight-arrow-white.svg" alt="Straight"><div class="shape-label">Straight</div></div>
<div class="shape"><div class="selection"><img class="selection-img" src="assets/uido-selection-box.svg" alt=""></div><img class="shape-arrow fade" src="assets/uido-curved-arrow-white-draw.svg" alt="Fade"><div class="shape-label">Fade</div></div>
<div class="shape"><div class="selection"><img class="selection-img" src="assets/uido-selection-box.svg" alt=""></div><img class="shape-arrow slice" src="assets/uido-curved-arrow-white-hook.svg" alt="Slice"><div class="shape-label">Slice</div></div>
</div><div class="roller-mark"></div></div></div><button class="check" id="confirm" aria-label="Confirm shot shape"><img src="assets/uido-check-white.svg" alt="Confirm"></button><div class="result" id="result"><div class="result-main" id="resultMain">Straight</div><div class="result-sub">Shot shape confirmed.</div></div></section></main><script>
const shapes=['Hook','Draw','Straight','Fade','Slice'];let selected=2;
const track=document.getElementById('track'),roller=document.getElementById('roller'),result=document.getElementById('result'),resultMain=document.getElementById('resultMain');
function stepSize(){const item=track.querySelector('.shape');return item.getBoundingClientRect().width+(parseFloat(getComputedStyle(track).gap)||8)}
function render(animate=true,dragX=0){const step=stepSize();track.style.transition=animate?'transform .22s ease':'none';track.style.transform=`translate3d(calc(-50% - ${selected*step}px + ${dragX}px),-50%,0)`;document.querySelectorAll('.shape').forEach((el,i)=>el.classList.toggle('active',i===selected))}
function selectIndex(i){selected=Math.max(0,Math.min(shapes.length-1,i));render(true)}
function choose(dir){selectIndex(selected+dir)}
let startX=0,startY=0,dragging=false,moved=false,pointerTarget=null;
roller.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;startX=e.clientX;startY=e.clientY;moved=false;pointerTarget=e.target.closest('.shape');dragging=true;roller.setPointerCapture?.(e.pointerId);roller.style.cursor='grabbing';track.style.transition='none'});
roller.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-startX;if(Math.abs(dx)>4)moved=true;if(Math.abs(dx)>2)render(false,dx)});
roller.addEventListener('pointerup',e=>{if(!dragging)return;const dx=e.clientX-startX,dy=e.clientY-startY;dragging=false;roller.style.cursor='grab';roller.releasePointerCapture?.(e.pointerId);if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)){const delta=dx<0?1:-1;selectIndex(selected+delta)}else if(pointerTarget&&!moved){const i=[...document.querySelectorAll('.shape')].indexOf(pointerTarget);if(i>=0)selectIndex(i)}else render(true)});
roller.addEventListener('pointercancel',e=>{dragging=false;roller.style.cursor='grab';roller.releasePointerCapture?.(e.pointerId);render(true)});
roller.addEventListener('wheel',e=>{e.preventDefault();choose((Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY)>0?1:-1)},{passive:false});
window.addEventListener('resize',()=>render(false));
document.getElementById('confirm').onclick=()=>{resultMain.textContent=shapes[selected];result.classList.add('show')};render(false);
</script></body></html>
