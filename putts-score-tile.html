<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>UiDo — Putts & Score Tile</title><style>@import url('https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600&display=swap');:root{--yellow:#ffd600}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#183b27}body{font-family:Oxanium,sans-serif;color:#fff}.stage{width:100vw;height:100dvh;display:grid;place-items:center;padding:22px;background:linear-gradient(rgba(18,28,24,.56),rgba(18,28,24,.56)),url('assets/home-exact.jpg') center/cover no-repeat}.tile{position:relative;width:min(88vw,520px);aspect-ratio:1;border:1px solid rgba(255,255,255,.24);border-radius:28px;background:rgba(18,31,27,.62);backdrop-filter:blur(10px) saturate(110%);-webkit-backdrop-filter:blur(10px) saturate(110%);overflow:hidden}.circle{position:absolute;left:50%;top:50%;width:96%;height:96%;transform:translate(-50%,-50%);border-radius:50%;overflow:hidden;background:rgba(18,31,27,.34);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}.help{position:absolute;right:5.5%;top:5.5%;width:10%;aspect-ratio:1;border:1.5px solid rgba(255,214,0,.78);border-radius:50%;background:rgba(18,31,27,.38);cursor:pointer;z-index:50;display:grid;place-items:center;padding:0;color:#fff;font:600 22px/1 Oxanium,sans-serif}.section{position:absolute;left:8%;right:8%;height:31%;display:flex;flex-direction:column;align-items:center}.putts-section{top:10%}.score-section{top:43%}.section-label{font-size:clamp(13px,3.2vw,18px);letter-spacing:.1em;color:rgba(255,255,255,.68);margin-bottom:8px}.roller{position:relative;width:100%;height:125px;overflow:hidden;touch-action:none;cursor:ns-resize;border-radius:20px;background:rgba(18,31,27,.78)}.roller:before,.roller:after{content:"";position:absolute;left:0;right:0;height:24px;z-index:3;pointer-events:none}.roller:before{top:0;background:linear-gradient(rgba(18,31,27,.82),rgba(18,31,27,0))}.roller:after{bottom:0;background:linear-gradient(rgba(18,31,27,0),rgba(18,31,27,.82))}.selection-frame{position:absolute;left:0;right:0;top:50%;height:55px;transform:translateY(-50%);z-index:6;pointer-events:none;object-fit:fill}.rows{position:absolute;left:0;right:0;top:50%;transform:translateY(-27.5px)}.row{height:55px;display:grid;place-items:center;font-size:clamp(18px,4.8vw,27px);color:rgba(255,255,255,.48);border-radius:12px;transition:color .12s,font-weight .12s,background .12s}.row.selected{background:rgba(18,31,27,.78);color:#fff;font-weight:600}.check{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);width:12%;min-width:50px;max-width:62px;aspect-ratio:1;border:1.5px solid rgba(255,214,0,.88);border-radius:50%;background:rgba(18,31,27,.94);display:grid;place-items:center;padding:0;cursor:pointer;z-index:20}.check img{width:62%;height:62%;object-fit:contain}.check:active{transform:translateX(-50%) scale(.96);filter:brightness(1.18)}.result{position:absolute;inset:0;background:rgba(8,16,13,.94);z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10%}.result.show{display:flex}.result-main{font-size:clamp(28px,7vw,46px);font-weight:600;margin-bottom:28px}.result-actions{display:flex;flex-direction:column;gap:14px;width:min(75%,280px)}.result-actions button{border:1px solid rgba(255,255,255,.24);border-radius:15px;background:rgba(255,255,255,.1);color:#fff;padding:14px 18px;font:500 16px Oxanium;cursor:pointer}.result-actions button.primary{border-color:rgba(255,214,0,.9)}.jump-panel{position:absolute;inset:0;background:rgba(8,16,13,.96);z-index:65;display:none;flex-direction:column;align-items:center;justify-content:center;padding:9%;text-align:center}.jump-panel.show{display:flex}.jump-title{font-size:24px;font-weight:500;margin-bottom:22px}.holes{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;width:100%;max-width:340px}.hole{aspect-ratio:1;border:1px solid rgba(255,255,255,.2);border-radius:12px;background:rgba(255,255,255,.06);color:rgba(255,255,255,.7);font:500 15px Oxanium}.hole.selected{border-color:var(--yellow);color:#fff;background:rgba(18,31,27,.9);font-weight:600}.jump-actions{display:flex;gap:10px;margin-top:22px}.jump-actions button{border:1px solid rgba(255,255,255,.24);border-radius:15px;background:rgba(255,255,255,.1);color:#fff;padding:12px 22px;font:500 15px Oxanium}.jump-actions .go{border-color:rgba(255,214,0,.9)}.help-panel{position:absolute;inset:0;background:rgba(8,16,13,.72);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;place-items:center;padding:9%;z-index:70}.help-panel.show{display:grid}.help-card{width:100%;max-width:360px;border:1px solid rgba(255,255,255,.24);border-radius:20px;background:rgba(25,39,34,.94);padding:24px;color:#fff;text-align:center}.help-card h2{margin:0 0 12px;font-size:24px;font-weight:500}.help-card p{margin:0 0 20px;font:400 15px/1.45 Arial,sans-serif;color:rgba(255,255,255,.8)}.help-close{border:1px solid rgba(255,255,255,.24);border-radius:15px;background:rgba(255,255,255,.1);color:#fff;padding:12px 22px;font:500 16px Oxanium;cursor:pointer}@media(max-width:420px){.tile{width:91vw;border-radius:24px}.section{left:7%;right:7%}.roller{height:118px}.section-label{font-size:12px}.check{width:14%;min-width:50px}} </style></head><body><main class="stage"><section class="tile" aria-label="UiDo Putts and Score Tile"><div class="circle"><div class="section putts-section"><div class="section-label">PUTTS</div><div class="roller" id="puttsRoller"><img class="selection-frame" src="assets/uido-club-selection-frame.svg" alt=""><div class="rows" id="puttsRows"></div></div></div><div class="section score-section"><div class="section-label">SCORE</div><div class="roller" id="scoreRoller"><img class="selection-frame" src="assets/uido-club-selection-frame.svg" alt=""><div class="rows" id="scoreRows"></div></div></div></div><button class="help" id="help" aria-label="Help">?</button><button class="check" id="confirm" aria-label="Confirm"><img src="assets/uido-check-white.svg" alt="Confirm"></button><div class="result" id="result"><div class="result-main">HOLE RECORDED</div><div class="result-actions"><button class="primary" id="nextHole">NEXT HOLE</button><button id="jumpHole">JUMP TO HOLE</button></div></div><div class="jump-panel" id="jumpPanel"><div class="jump-title">JUMP TO HOLE</div><div class="holes" id="holes"></div><div class="jump-actions"><button id="cancelJump">CANCEL</button><button class="go" id="goHole">GO</button></div></div><div class="help-panel" id="helpPanel" role="dialog" aria-modal="true" aria-label="Putts and score help"><div class="help-card"><h2>Putts &amp; Score</h2><p>Use the two rollers to record your putts and score for the hole. Adjust either roller if needed, then tap the tick to confirm.</p><button class="help-close" id="helpClose">Got it</button></div></div></section></main><script>function makeRoller(rollerId,rowsId,values,start){const roller=document.getElementById(rollerId),rows=document.getElementById(rowsId);let selected=start,sy=0,drag=false;function render(){rows.innerHTML=values.map((v,i)=>`<div class="row ${i===selected?'selected':''}">${v}</div>`).join('');rows.style.transform=`translateY(${-selected*55-27.5}px)`}function move(dir){selected=Math.max(0,Math.min(values.length-1,selected+dir));render()}roller.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;sy=e.touches[0].clientY;drag=true},{passive:true});roller.addEventListener('touchmove',e=>{if(!drag)return;const dy=e.touches[0].clientY-sy;if(Math.abs(dy)>30){move(dy<0?1:-1);sy=e.touches[0].clientY}},{passive:true});roller.addEventListener('touchend',()=>drag=false);roller.addEventListener('wheel',e=>{e.preventDefault();move(e.deltaY>0?1:-1)},{passive:false});return{get:()=>values[selected]}}const putts=makeRoller('puttsRoller','puttsRows',['0','1','2','3','4','5'],2);const score=makeRoller('scoreRoller','scoreRows',['1','2','3','4','5','6','7','8','9'],3);const result=document.getElementById('result'),jumpPanel=document.getElementById('jumpPanel'),helpPanel=document.getElementById('helpPanel');document.getElementById('confirm').onclick=()=>result.classList.add('show');document.getElementById('nextHole').onclick=()=>{result.classList.remove('show')};document.getElementById('jumpHole').onclick=()=>{result.classList.remove('show');jumpPanel.classList.add('show')};document.getElementById('cancelJump').onclick=()=>jumpPanel.classList.remove('show');const holes=document.getElementById('holes');let hole=1;holes.innerHTML=Array.from({length:18},(_,i)=>`<button class="hole ${i===0?'selected':''}" data-hole="${i+1}">${i+1}</button>`).join('');holes.onclick=e=>{const b=e.target.closest('.hole');if(!b)return;hole=Number(b.dataset.hole);holes.querySelectorAll('.hole').forEach(x=>x.classList.toggle('selected',x===b))};document.getElementById('goHole').onclick=()=>jumpPanel.classList.remove('show');document.getElementById('help').onclick=()=>helpPanel.classList.add('show');document.getElementById('helpClose').onclick=()=>helpPanel.classList.remove('show');helpPanel.addEventListener('click',e=>{if(e.target===helpPanel)helpPanel.classList.remove('show')});</script></body></html>
