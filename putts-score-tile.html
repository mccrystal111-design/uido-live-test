<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>UiDo — Putts, Score & Penalties</title><style>@import url('https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600&display=swap');:root{--y:#ffd600}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Oxanium,sans-serif;color:#fff;background:#183b27}.stage{width:100vw;height:100dvh;display:grid;place-items:center;padding:22px;background:linear-gradient(rgba(18,28,24,.56),rgba(18,28,24,.56)),url('assets/home-exact.jpg') center/cover no-repeat}.tile{position:relative;width:min(88vw,520px);aspect-ratio:1;border:1px solid rgba(255,255,255,.24);border-radius:28px;background:rgba(18,31,27,.62);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);overflow:hidden}.circle{position:absolute;left:50%;top:50%;width:96%;height:96%;transform:translate(-50%,-50%);border-radius:50%;overflow:hidden;background:rgba(18,31,27,.34);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}.help{position:absolute;right:5.5%;top:5.5%;width:10%;aspect-ratio:1;border:1.5px solid rgba(255,214,0,.78);border-radius:50%;background:rgba(18,31,27,.38);cursor:pointer;z-index:50;display:grid;place-items:center;padding:0;color:#fff;font:600 22px/1 Oxanium}.ctx{position:absolute;top:calc(50% - 145px);left:0;right:0;text-align:center;font-size:clamp(12px,3.2vw,18px)}.sec{position:absolute;top:0;width:29%;height:100%}.p{left:4%}.s{left:35.5%}.n{right:4%}.lab{position:absolute;top:calc(50% - 88px);left:6%;right:6%;text-align:center;color:rgba(255,255,255,.62);font-size:clamp(10px,2.7vw,16px);font-weight:500;white-space:nowrap}.roll{position:absolute;left:9%;right:9%;top:50%;height:135px;transform:translateY(-50%);overflow:hidden;border-radius:17px;background:rgba(18,31,27,.78);touch-action:none;user-select:none;-webkit-user-select:none}.frame{position:absolute;left:0;right:0;top:50%;height:45px;transform:translateY(-50%);border:2.5px solid var(--y);border-radius:9px;z-index:3;pointer-events:none}.rows{position:absolute;inset:0;will-change:transform}.row{height:45px;display:grid;place-items:center;color:rgba(255,255,255,.28);font-size:17px}.row.sel{color:#fff;font-weight:600;font-size:27px;background:rgba(18,31,27,.78)}.check{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);width:12%;min-width:50px;max-width:62px;aspect-ratio:1;border:1.5px solid rgba(255,214,0,.9);border-radius:50%;background:rgba(18,31,27,.94);display:grid;place-items:center;padding:0;z-index:20;cursor:pointer}.check img{width:62%;height:62%;object-fit:contain;display:block}.check:active{transform:translateX(-50%) scale(.96)}.panel{position:absolute;inset:0;background:rgba(8,16,13,.94);display:none;z-index:60;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:7%}.show{display:flex}.main{font-size:clamp(25px,6.5vw,42px);font-weight:600}.sub{margin:15px 0 20px;color:rgba(255,255,255,.72)}.actions{display:flex;flex-direction:column;gap:9px;width:72%;max-width:270px}.actions button{height:44px;border:1px solid rgba(255,255,255,.28);border-radius:11px;background:rgba(18,31,27,.88);color:#fff;padding:0 12px;font:500 14px Oxanium;letter-spacing:.2px}.actions button:active,.jump-actions button:active,.hole:active{transform:scale(.98)}.actions .primary{border-color:var(--y);box-shadow:inset 0 0 0 1px rgba(255,214,0,.15)}.score-panel{justify-content:flex-start;padding:13% 7% 7%}.close{position:absolute;left:50%;bottom:4%;top:auto;transform:translateX(-50%);width:12%;min-width:50px;max-width:62px;aspect-ratio:1;border:1.5px solid rgba(255,214,0,.9);border-radius:50%;background:rgba(18,31,27,.94);display:grid;place-items:center;padding:0;z-index:20;cursor:pointer}.close img{width:62%;height:62%;object-fit:contain;display:block}.close:active{transform:translateX(-50%) scale(.96)}.scroll{width:100%;height:190px;overflow:auto;border:1px solid rgba(255,255,255,.14);border-radius:12px;margin-top:16px;scrollbar-width:none;-ms-overflow-style:none}.scroll::-webkit-scrollbar{display:none;width:0;height:0}.table{width:100%;table-layout:fixed;border-collapse:collapse;font-size:17px}.table th,.table td{width:20%;padding:10px 3px;border-bottom:1px solid rgba(255,255,255,.12);text-align:center}.table th{position:sticky;top:0;background:rgba(18,31,27,.96);color:rgba(255,255,255,.78);font-size:15px}.click{cursor:pointer;font-weight:600}.hc-dot{font-size:18px;color:#fff}.total td{font-weight:600;border-top:1px solid rgba(255,255,255,.25);font-size:15px}.jump{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;width:100%;max-width:310px;margin:18px 0 20px}.hole{aspect-ratio:1!important;padding:0!important;border:1px solid rgba(255,255,255,.22)!important;border-radius:10px!important;background:rgba(18,31,27,.78)!important;color:rgba(255,255,255,.82)!important;font:500 15px Oxanium!important;cursor:pointer}.hole.selected{border-color:var(--y)!important;box-shadow:inset 0 0 0 1px rgba(255,214,0,.2)}.jump-actions{display:flex;gap:8px;width:100%;max-width:310px}.jump-actions button{flex:1;height:42px;border:1px solid rgba(255,255,255,.25);border-radius:11px;background:rgba(18,31,27,.9);color:#fff;font:500 13px Oxanium;padding:0 8px}.jump-actions .primary{border-color:var(--y);box-shadow:inset 0 0 0 1px rgba(255,214,0,.15)}.help-panel{background:rgba(8,16,13,.72);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:70}.help-card{width:100%;max-width:360px;border:1px solid rgba(255,255,255,.24);border-radius:20px;background:rgba(25,39,34,.94);padding:24px;color:#fff;text-align:center}.help-card h2{margin:0 0 12px;font-size:24px;font-weight:500}.help-card p{margin:0 0 20px;font:400 15px/1.45 Arial,sans-serif;color:rgba(255,255,255,.8)}.help-close{border:1px solid rgba(255,255,255,.24);border-radius:15px;background:rgba(255,255,255,.1);color:#fff;padding:12px 22px;font:500 16px Oxanium;cursor:pointer}@media(max-width:420px){.tile{width:91vw}.roll{height:135px;border-radius:17px}.row{height:45px;font-size:17px}.frame{height:45px}.row.sel{font-size:27px}.scroll{height:180px}.table{font-size:17px}.table th{font-size:14px}.table th,.table td{padding:9px 3px}}</style></head><body><main class="stage"><section class="tile"><div class="circle"><div class="ctx" id="ctx">Hole 1 - Par 4 (4)</div><div class="sec p"><div class="lab">PUTTS</div><div class="roll" id="r0"><div class="frame"></div><div class="rows"></div></div></div><div class="sec s"><div class="lab">SCORE</div><div class="roll" id="r1"><div class="frame"></div><div class="rows"></div></div></div><div class="sec n"><div class="lab">PENALTIES</div><div class="roll" id="r2"><div class="frame"></div><div class="rows"></div></div></div></div><button class="check" id="confirm" aria-label="Confirm"><img src="assets/uido-check-white.svg" alt=""></button><div class="panel" id="result"><div class="sub" id="resultCtx">Hole 1 - Par 4 (4)</div><div class="main">HOLE RECORDED</div><div class="sub" id="summary"></div><div class="actions"><button class="primary" id="next">NEXT HOLE</button><button id="sc">SCORECARD</button><button id="jumpBtn">JUMP TO HOLE / END ROUND</button></div></div><div class="panel score-panel" id="scorePanel"><button class="close" id="scoreClose" aria-label="Close"><img src="assets/uido-check-white.svg" alt="Close"></button><div class="scroll"><table class="table"><thead><tr><th>HOLE</th><th>PAR</th><th>HC</th><th>SCORE</th><th>NETT</th></tr></thead><tbody id="body"></tbody></table></div></div><div class="panel" id="jumpPanel"><div class="main" style="font-size:21px">JUMP TO HOLE</div><div class="jump" id="holes"></div><div class="jump-actions"><button id="cancel">CANCEL</button><button class="primary" id="go">GO</button><button id="end">END ROUND</button></div></div><div class="panel" id="helpPanel"><div class="help-card"><h2>Putts, Score &amp; Penalties</h2><p>Use the three rollers to record your putts, score and penalties for the hole. Tap the tick to confirm.</p><button class="help-close" id="helpClose">Got it</button></div></div><button class="help" id="help" aria-label="Help">?</button></section></main><script>function makeRoller(id,vals,start){const r=document.getElementById(id),box=r.querySelector('.rows');let sel=start,offset=0,drag=false,startY=0,startOffset=0,moved=false;const h=()=>r.clientHeight<=150?45:55;const target=i=>r.clientHeight/2-h()/2-i*h();const clamp=x=>Math.max(target(vals.length-1),Math.min(target(0),x));box.innerHTML=vals.map((v,i)=>`<div class="row ${i===sel?'sel':''}">${v}</div>`).join('');function apply(x){offset=clamp(x);box.style.transform=`translateY(${offset}px)`}function highlight(i){sel=Math.max(0,Math.min(vals.length-1,i));box.querySelectorAll('.row').forEach((e,n)=>e.classList.toggle('sel',n===sel))}function nearest(){let best=0,d=Infinity;vals.forEach((_,i)=>{const q=i*h()+h()/2+offset,dd=Math.abs(q-r.clientHeight/2);if(dd<d){d=dd;best=i}});return best}function snap(i){highlight(i);box.style.transition='transform 180ms cubic-bezier(.2,.75,.2,1)';apply(target(i));setTimeout(()=>box.style.transition='none',200)}function setValue(v){const i=Math.max(0,Math.min(vals.length-1,+v));snap(i)}apply(target(sel));r.addEventListener('pointerdown',e=>{drag=true;startY=e.clientY;startOffset=offset;moved=false;r.setPointerCapture(e.pointerId);e.preventDefault()});r.addEventListener('pointermove',e=>{if(!drag)return;const d=e.clientY-startY;if(Math.abs(d)>5)moved=true;apply(startOffset+d);highlight(nearest())});r.addEventListener('pointerup',e=>{if(!drag)return;drag=false;const n=nearest();if(moved)snap(n);else{const row=e.target.closest('.row');if(row)snap([...box.children].indexOf(row));else snap(n)}});r.addEventListener('pointercancel',()=>{if(drag){drag=false;snap(nearest())}});return{get:()=>+vals[sel],set:setValue}}const getP=makeRoller('r0',['0','1','2','3','4','5'],2),getS=makeRoller('r1',Array.from({length:16},(_,i)=>''+(i+1)),3),getN=makeRoller('r2',Array.from({length:17},(_,i)=>''+i),0);const result=document.getElementById('result'),scorePanel=document.getElementById('scorePanel'),jumpPanel=document.getElementById('jumpPanel'),helpPanel=document.getElementById('helpPanel'),ctx=document.getElementById('ctx'),resultCtx=document.getElementById('resultCtx');let data=Array(18).fill(null),currentHole=0;const handicap=4;const pars=[4,3,5,3,4,4,4,4,5,4,5,4,3,4,4,4,3,5];const si=[10,14,4,8,18,12,2,6,16,7,1,13,15,9,3,17,5,11];function holeLabel(h){const netPar=pars[h]-shotsForHole(h);return `Hole ${h+1} - Par ${pars[h]} (${netPar})`}function updateContext(){ctx.textContent=holeLabel(currentHole);resultCtx.textContent=holeLabel(currentHole)}function shotsForHole(h){let shots=0;for(let s=1;s<=handicap;s++)if(si[h]<=s)shots++;return shots}function nettForHole(h){if(!data[h])return '—';return data[h].s-shotsForHole(h)}function sumGross(a,b){const x=data.slice(a,b).reduce((t,d)=>t+(d?d.s:0),0);return x||'—'}function sumNett(a,b){const x=data.slice(a,b).reduce((t,d,i)=>t+(d?d.s-shotsForHole(a+i):0),0);return x||'—'}function render(){const rows=[];for(let i=0;i<9;i++){const d=data[i],shots=shotsForHole(i);rows.push(`<tr><td>${i+1}</td><td>${pars[i]}</td><td class="hc-dot">${shots?'•':''}</td><td class="click" data-h="${i}">${d?d.s:'—'}</td><td>${nettForHole(i)}</td></tr>`)}rows.push(`<tr class="total"><td>OUT</td><td>36</td><td></td><td>${sumGross(0,9)}</td><td>${sumNett(0,9)}</td></tr>`);for(let i=9;i<18;i++){const d=data[i],shots=shotsForHole(i);rows.push(`<tr><td>${i+1}</td><td>${pars[i]}</td><td class="hc-dot">${shots?'•':''}</td><td class="click" data-h="${i}">${d?d.s:'—'}</td><td>${nettForHole(i)}</td></tr>`)}rows.push(`<tr class="total"><td>IN</td><td>36</td><td></td><td>${sumGross(9,18)}</td><td>${sumNett(9,18)}</td></tr><tr class="total"><td>TOT</td><td>72</td><td></td><td>${sumGross(0,18)}</td><td>${sumNett(0,18)}</td></tr>`);document.getElementById('body').innerHTML=rows.join('')}function loadHole(h){currentHole=h;const d=data[h]||{p:2,s:pars[h],n:0};getP.set(d.p);getS.set(d.s);getN.set(d.n);updateContext();scorePanel.classList.remove('show');result.classList.remove('show')}document.getElementById('confirm').onclick=()=>{const p=getP.get(),s=getS.get(),n=getN.get();data[currentHole]={p,s,n};updateContext();document.getElementById('summary').textContent=`${p} putts · score ${s} · ${n} penalties`;result.classList.add('show')};document.getElementById('next').onclick=()=>{if(currentHole<17)loadHole(currentHole+1);else result.classList.remove('show')};document.getElementById('sc').onclick=()=>{render();result.classList.remove('show');scorePanel.classList.add('show')};document.getElementById('scoreClose').onclick=()=>{scorePanel.classList.remove('show');loadHole(currentHole)};document.getElementById('body').onclick=e=>{const c=e.target.closest('.click');if(c)loadHole(+c.dataset.h)};document.getElementById('jumpBtn').onclick=()=>{result.classList.remove('show');jumpPanel.classList.add('show')};document.getElementById('cancel').onclick=()=>jumpPanel.classList.remove('show');document.getElementById('go').onclick=()=>{const b=holes.querySelector('.selected');if(b)loadHole(+b.dataset.h);jumpPanel.classList.remove('show')};document.getElementById('end').onclick=()=>{jumpPanel.classList.remove('show')};holes.innerHTML=Array.from({length:18},(_,i)=>`<button class="hole ${i?'':'selected'}" data-h="${i}">${i+1}</button>`).join('');holes.onclick=e=>{const b=e.target.closest('.hole');if(b)holes.querySelectorAll('.hole').forEach(x=>x.classList.toggle('selected',x===b))};document.getElementById('help').onclick=()=>{helpPanel.classList.add('show');document.getElementById('helpClose').focus()};document.getElementById('helpClose').onclick=()=>{helpPanel.classList.remove('show');document.getElementById('help').focus()};helpPanel.onclick=e=>{if(e.target===helpPanel)helpPanel.classList.remove('show')};document.addEventListener('keydown',e=>{if(e.key==='Escape')helpPanel.classList.remove('show')});</script></body></html>
