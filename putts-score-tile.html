<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>UiDo — Putts, Score & Penalties</title><style>@import url('https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600&display=swap');:root{--yellow:#ffd600}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#183b27}body{font-family:Oxanium,sans-serif;color:#fff}.stage{width:100vw;height:100dvh;display:grid;place-items:center;padding:22px;background:linear-gradient(rgba(18,28,24,.56),rgba(18,28,24,.56)),url('assets/home-exact.jpg') center/cover no-repeat}.tile{position:relative;width:min(88vw,520px);aspect-ratio:1;border:1px solid rgba(255,255,255,.24);border-radius:28px;background:rgba(18,31,27,.62);backdrop-filter:blur(10px) saturate(110%);-webkit-backdrop-filter:blur(10px) saturate(110%);overflow:hidden}.circle{position:absolute;left:50%;top:50%;width:96%;height:96%;transform:translate(-50%,-50%);border-radius:50%;overflow:hidden;background:rgba(18,31,27,.34);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}.help{position:absolute;right:5.5%;top:5.5%;width:10%;aspect-ratio:1;border:1.5px solid rgba(255,214,0,.78);border-radius:50%;background:rgba(18,31,27,.38);cursor:pointer;z-index:50;display:grid;place-items:center;padding:0;color:#fff;font:600 22px/1 Oxanium,sans-serif}.section{position:absolute;top:0;height:100%;width:30%;display:block}.putts-section{left:3%}.score-section{left:34.6%}.penalties-section{right:3.4%}.section-label{position:absolute;left:0;right:0;top:calc(50% - 104px);height:24px;display:flex;align-items:center;justify-content:center;font-size:clamp(10px,2.7vw,16px);letter-spacing:.07em;color:rgba(255,255,255,.62);white-space:nowrap}.roller{position:absolute;left:11%;right:11%;top:50%;transform:translateY(-50%);height:165px;overflow:hidden;touch-action:none;cursor:ns-resize;border-radius:20px;background:rgba(18,31,27,.78);z-index:4}.roller:before,.roller:after{content:"";position:absolute;left:0;right:0;height:24px;z-index:3;pointer-events:none}.roller:before{top:0;background:linear-gradient(rgba(18,31,27,.82),rgba(18,31,27,0))}.roller:after{bottom:0;background:linear-gradient(rgba(18,31,27,0),rgba(18,31,27,.82))}.selection-frame{position:absolute;left:0;top:50%;width:100%;height:55px;transform:translateY(-50%);z-index:8;pointer-events:none;border:2.5px solid var(--yellow);border-radius:9px;background:transparent}.rows{position:absolute;left:0;right:0;top:0;height:auto;will-change:transform;z-index:5}.row{height:55px;display:grid;place-items:center;text-align:center;font-size:clamp(15px,3.6vw,21px);color:rgba(255,255,255,.36);border:0;border-radius:12px;transition:color .12s,font-weight .12s}.row.selected{background:rgba(18,31,27,.78);color:#fff;font-weight:600;font-size:clamp(23px,6vw,33px)}.check{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);width:12%;min-width:50px;max-width:62px;aspect-ratio:1;border:1.5px solid rgba(255,214,0,.88);border-radius:50%;background:rgba(18,31,27,.94);display:grid;place-items:center;padding:0;cursor:pointer;z-index:20}.check img{width:62%;height:62%;object-fit:contain}.check:active{transform:translateX(-50%) scale(.96);filter:brightness(1.18)}.result{position:absolute;inset:0;background:rgba(8,16,13,.94);z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10%}.result.show{display:flex}.result-main{font-size:clamp(28px,7vw,46px);font-weight:600;margin-bottom:28px}.result-sub{font-size:15px;color:rgba(255,255,255,.62);margin-bottom:26px}.result-actions{display:flex;flex-direction:column;gap:14px;width:min(75%,280px)}.result-actions button,.jump-actions button{border:1px solid rgba(255,255,255,.24);border-radius:15px;background:rgba(255,255,255,.1);color:#fff;padding:14px 18px;font:500 16px Oxanium;cursor:pointer}.result-actions .primary,.jump-actions .go{border-color:rgba(255,214,0,.9)}.jump-panel{position:absolute;inset:0;background:rgba(8,16,13,.96);z-index:65;display:none;flex-direction:column;align-items:center;justify-content:center;padding:9%;text-align:center}.jump-panel.show{display:flex}.jump-title{font-size:24px;font-weight:500;margin-bottom:22px}.holes{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;width:100%;max-width:340px}.hole{aspect-ratio:1;border:1px solid rgba(255,255,255,.2);border-radius:12px;background:rgba(255,255,255,.06);color:rgba(255,255,255,.7);font:500 15px Oxanium}.hole.selected{border-color:var(--yellow);color:#fff;background:rgba(18,31,27,.9);font-weight:600}.jump-actions{display:flex;gap:10px;margin-top:22px}.help-panel{position:absolute;inset:0;background:rgba(8,16,13,.72);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;place-items:center;padding:9%;z-index:70}.help-panel.show{display:grid}.help-card{width:100%;max-width:360px;border:1px solid rgba(255,255,255,.24);border-radius:20px;background:rgba(25,39,34,.94);padding:24px;color:#fff;text-align:center}.help-card h2{margin:0 0 12px;font-size:24px;font-weight:500}.help-card p{margin:0 0 20px;font:400 15px/1.45 Arial,sans-serif;color:rgba(255,255,255,.8)}.help-close{border:1px solid rgba(255,255,255,.24);border-radius:15px;background:rgba(255,255,255,.1);color:#fff;padding:12px 22px;font:500 16px Oxanium;cursor:pointer}@media(max-width:420px){.tile{width:91vw;border-radius:24px}.section{width:30%}.putts-section{left:3%}.score-section{left:34.6%}.penalties-section{right:3.4%}.roller{left:11%;right:11%;height:150px}.row{height:50px}.section-label{top:calc(50% - 96px);font-size:10px;height:22px}.selection-frame{height:50px}.check{width:14%;min-width:50px}} </style></head><body><main class="stage"><section class="tile" aria-label="UiDo Putts, Score and Penalties Tile"><div class="circle"><div class="section putts-section"><div class="section-label">PUTTS</div><div class="roller" id="puttsRoller"><div class="selection-frame"></div><div class="rows" id="puttsRows"></div></div></div><div class="section score-section"><div class="section-label">SCORE</div><div class="roller" id="scoreRoller"><div class="selection-frame"></div><div class="rows" id="scoreRows"></div></div></div><div class="section penalties-section"><div class="section-label">PENALTIES</div><div class="roller" id="penaltiesRoller"><div class="selection-frame"></div><div class="rows" id="penaltiesRows"></div></div></div></div><button class="help" id="help" aria-label="Help">?</button><button class="check" id="confirm" aria-label="Confirm"><img src="assets/uido-check-white.svg" alt="Confirm"></button><div class="result" id="result"><div class="result-main">HOLE RECORDED</div><div class="result-sub" id="resultSub"></div><div class="result-actions"><button class="primary" id="nextHole">NEXT HOLE</button><button id="jumpHole">JUMP TO HOLE</button></div></div><div class="jump-panel" id="jumpPanel"><div class="jump-title">JUMP TO HOLE</div><div class="holes" id="holes"></div><div class="jump-actions"><button id="cancelJump">CANCEL</button><button class="go" id="goHole">GO</button></div></div><div class="help-panel" id="helpPanel" role="dialog" aria-modal="true" aria-label="Putts score and penalties help"><div class="help-card"><h2>Putts, Score &amp; Penalties</h2><p>Use the three rollers to record your putts, score and penalties for the hole. Adjust the rollers if needed, then tap the tick to confirm.</p><button class="help-close" id="helpClose">Got it</button></div></div></section></main><script>function makeRoller(rollerId,rowsId,values,start){const roller=document.getElementById(rollerId),rows=document.getElementById(rowsId);let selected=start,drag=false,pid=null,startY=0,startOffset=0,offset=0,moved=false;function metrics(){const h=roller.clientHeight;return{rowH:h<=150?50:55,center:h/2}}function target(i){const m=metrics();return m.center-m.rowH/2-i*m.rowH}function clamp(x){const min=target(values.length-1),max=target(0);return Math.max(min,Math.min(max,x))}function apply(x){offset=clamp(x);rows.style.transform=`translate3d(0,${offset}px,0)`}function highlight(i){selected=Math.max(0,Math.min(values.length-1,i));rows.querySelectorAll('.row').forEach((r,n)=>r.classList.toggle('selected',n===selected))}function nearest(){const m=metrics(),c=m.center;let best=0,d=Infinity;values.forEach((_,i)=>{const y=i*m.rowH+m.rowH/2+offset,dd=Math.abs(y-c);if(dd<d){d=dd;best=i}});return best}function render(){rows.innerHTML=values.map((v,i)=>`<div class="row ${i===selected?'selected':''}">${v}</div>`).join('');apply(target(selected))}function down(e){if(e.pointerType==='mouse'&&e.button!==0)return;rows.style.transition='none';drag=true;pid=e.pointerId;startY=e.clientY;startOffset=offset;moved=false;roller.setPointerCapture(e.pointerId);e.preventDefault()}function move(e){if(!drag||e.pointerId!==pid)return;const dy=e.clientY-startY;if(Math.abs(dy)>5)moved=true;apply(startOffset+dy);highlight(nearest());e.preventDefault()}function up(e){if(!drag||e.pointerId!==pid)return;drag=false;if(roller.hasPointerCapture(e.pointerId))roller.releasePointerCapture(e.pointerId);const n=nearest();rows.style.transition='transform 220ms cubic-bezier(.22,.72,.2,1)';highlight(n);apply(target(n));setTimeout(()=>rows.style.transition='none',230);pid=null}roller.addEventListener('pointerdown',down);roller.addEventListener('pointermove',move);roller.addEventListener('pointerup',up);roller.addEventListener('pointercancel',up);roller.addEventListener('click',e=>{if(moved){moved=false;return}const row=e.target.closest('.row');if(!row)return;const i=[...rows.querySelectorAll('.row')].indexOf(row);if(i<0)return;rows.style.transition='transform 220ms cubic-bezier(.22,.72,.2,1)';highlight(i);apply(target(i));setTimeout(()=>rows.style.transition='none',230)});window.addEventListener('resize',()=>{rows.style.transition='none';apply(target(selected))});render();return{get:()=>values[selected]}}const putts=makeRoller('puttsRoller','puttsRows',['0','1','2','3','4','5'],2);const score=makeRoller('scoreRoller','scoreRows',Array.from({length:16},(_,i)=>String(i+1)),3);const penalties=makeRoller('penaltiesRoller','penaltiesRows',Array.from({length:17},(_,i)=>String(i)),0);const result=document.getElementById('result'),jumpPanel=document.getElementById('jumpPanel'),helpPanel=document.getElementById('helpPanel'),resultSub=document.getElementById('resultSub');document.getElementById('confirm').onclick=()=>{const s=Number(score.get()),p=Number(penalties.get()),par=4,nett=s-p;let desc='';if(nett<par-2)desc='(albatross)';else if(nett===par-2)desc='(eagle)';else if(nett===par-1)desc='(birdie)';else if(nett===par)desc='(par)';else if(nett===par+1)desc='(bogey)';else if(nett===par+2)desc='(double bogey)';else if(nett>par+2)desc='(triple bogey+)';resultSub.innerHTML=`${putts.get()} putts - score ${s} - nett ${nett} ${desc}<br>0 penalties`.replace(/0 penalties$/,`${p} penalties`);result.classList.add('show')};document.getElementById('nextHole').onclick=()=>result.classList.remove('show');document.getElementById('jumpHole').onclick=()=>{result.classList.remove('show');jumpPanel.classList.add('show')};document.getElementById('cancelJump').onclick=()=>jumpPanel.classList.remove('show');const holes=document.getElementById('holes');let hole=1;holes.innerHTML=Array.from({length:18},(_,i)=>`<button class="hole ${i===0?'selected':''}" data-hole="${i+1}">${i+1}</button>`).join('');holes.onclick=e=>{const b=e.target.closest('.hole');if(!b)return;hole=Number(b.dataset.hole);holes.querySelectorAll('.hole').forEach(x=>x.classList.toggle('selected',x===b))};document.getElementById('goHole').onclick=()=>jumpPanel.classList.remove('show');document.getElementById('help').onclick=()=>helpPanel.classList.add('show');document.getElementById('helpClose').onclick=()=>helpPanel.classList.remove('show');helpPanel.addEventListener('click',e=>{if(e.target===helpPanel)helpPanel.classList.remove('show')});</script></body></html>
